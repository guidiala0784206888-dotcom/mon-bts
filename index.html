{id:"m02",num:"02",bloc:"Les maths d'abord",titre:"Manipuler une formule",duree:"25 min",
 resume:"Isoler une inconnue, résoudre une équation, croiser deux relations. C'est 80 % des calculs du métier.",
 steps:[
 {k:"l",t:"Le geste fondamental",h:`
  <p>Une égalité est une balance. Tout ce que tu fais d'un côté, tu dois le faire de l'autre. C'est la seule règle, et elle suffit.</p>
  <div class="formule">ce qui MULTIPLIE d'un côté DIVISE de l'autre
ce qui ADDITIONNE d'un côté SOUSTRAIT de l'autre
ce qui est au CARRÉ passe en RACINE<span class="note">La formule ne change pas de sens, seulement d'écriture.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — isoler I dans P = U · I · cos φ</span>
   <ol>
    <li>On veut I seul. Aujourd'hui, il est multiplié par U et par cos φ.<span class="op">P = U · I · cos φ</span></li>
    <li>On divise les DEUX côtés par U.<span class="op">P / U = I · cos φ</span></li>
    <li>On divise les deux côtés par cos φ.<span class="op">P / (U · cos φ) = I</span></li>
   </ol>
   <div class="final">I = P / (U · cos φ)</div></div>
  <div class="encart e-cle"><span class="chapo">La vérification par les unités</span><p>Une transposition juste donne des unités justes. Ici : des watts divisés par des volts donnent des ampères — <span class="mono">W / V = A</span>. Si tu obtiens autre chose, la formule est fausse, sans même regarder les nombres.</p></div>`},
 {k:"l",t:"Résoudre une équation du premier degré",h:`
  <p>Le même geste, appliqué à un nombre inconnu plutôt qu'à une lettre.</p>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Un chauffage de résistance R est alimenté sous 230 V et consomme 2000 W. Quelle est R ?</p>
   <ol>
    <li>On part de la relation qui contient les trois grandeurs connues.<span class="op">P = U² / R</span></li>
    <li>R est au dénominateur : on multiplie les deux côtés par R.<span class="op">P · R = U²</span></li>
    <li>On divise les deux côtés par P.<span class="op">R = U² / P = 230² / 2000 = 52 900 / 2000</span></li>
   </ol>
   <div class="final">R = 26,45 Ω</div></div>
  <h3>Quand l'inconnue est au carré</h3>
  <div class="formule">P = R · I²   ⟹   I² = P / R   ⟹   I = √(P / R)<span class="note">La racine s'applique à TOUT le rapport, pas seulement au numérateur.</span></div>
  <div class="encart e-piege"><span class="chapo">L'erreur la plus fréquente</span><p><span class="mono">√(P/R)</span> n'est pas <span class="mono">√P / R</span>. Sur la calculatrice, calcule d'abord le rapport entre parenthèses, PUIS la racine. C'est la même erreur qui fait rater les calculs d'impédance en régime alternatif.</p></div>`},
 {k:"l",t:"Deux équations, deux inconnues",h:`
  <p>Cela arrive dès qu'un circuit a deux mailles ou qu'on cherche à répartir un courant. Deux méthodes existent ; retiens celle par addition, elle est plus rapide.</p>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Deux récepteurs en parallèle absorbent ensemble 24 A. Le premier consomme 6 A de plus que le second. Combien chacun ?</p>
   <ol>
    <li>On traduit l'énoncé en deux lignes.<span class="op">I₁ + I₂ = 24
I₁ − I₂ = 6</span></li>
    <li>On additionne les deux lignes membre à membre : I₂ s'élimine.<span class="op">2·I₁ = 30</span></li>
    <li>On divise.<span class="op">I₁ = 15 A</span></li>
    <li>On revient à la première ligne pour l'autre inconnue.<span class="op">I₂ = 24 − 15 = 9 A</span></li>
   </ol>
   <div class="final">I₁ = 15 A et I₂ = 9 A — contrôle : 15 + 9 = 24 ✓ et 15 − 9 = 6 ✓</div></div>
  <div class="encart e-math"><span class="chapo">Le réflexe du contrôle</span><p>Une fois les deux valeurs trouvées, remets-les dans les DEUX équations de départ. Si une seule tombe juste, tu as une erreur. Ce contrôle prend dix secondes et rattrape la moitié des étourderies d'examen.</p></div>`},
 {k:"a",t:"Atelier — transposer et résoudre",gen:["transpose","equation1","proportion","systeme2"],but:4,h:`
  <p>Quatre bonnes réponses de suite. Ce sont exactement les gestes que tu répéteras dans tous les modules suivants.</p>`},
 {k:"c",t:"Contrôle",gen:["transpose","equation1","proportion","systeme2","prefixe"],n:8}
]},

{id:"m03",num:"03",bloc:"Les maths d'abord",titre:"Carrés, racines et proportions",duree:"20 min",
 resume:"Pourquoi doubler le courant quadruple la chaleur : la loi la plus rentable du métier.",
 steps:[
 {k:"l",t:"Le carré change tout",h:`
  <p>Beaucoup de relations en électrotechnique sont proportionnelles : double la longueur du câble, double sa résistance. Simple. Mais trois relations majeures sont <strong>quadratiques</strong>, et elles se comportent tout autrement.</p>
  <div class="tabl"><table>
   <tr><th>Relation</th><th>Si on double…</th><th>Alors…</th></tr>
   <tr><td class="mono">P = R · I²</td><td>le courant</td><td>la puissance dissipée est ×4</td></tr>
   <tr><td class="mono">W = ½ · C · U²</td><td>la tension</td><td>l'énergie stockée est ×4</td></tr>
   <tr><td class="mono">T ∝ U²</td><td>la tension moteur</td><td>le couple est ×4</td></tr>
   <tr><td class="mono">Q = C · U² · ω</td><td>la tension</td><td>le réactif produit est ×4</td></tr>
  </table></div>
  <div class="formule">si x devient k · x   alors   x² devient k² · x²<span class="note">×2 donne ×4 · ×3 donne ×9 · ×0,9 donne ×0,81 (soit −19 %)</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — le cas qui explique la haute tension</span>
   <p>On transporte 100 kW. En doublant la tension, que deviennent les pertes en ligne ?</p>
   <ol>
    <li>À puissance constante, si U est multipliée par 2, alors I est divisé par 2.<span class="op">P = U · I  ⟹  I = P / U</span></li>
    <li>Les pertes suivent le carré du courant.<span class="op">pertes = R · I²</span></li>
    <li>I divisé par 2 donne des pertes divisées par 2² = 4.<span class="op">pertes ÷ 4</span></li>
   </ol>
   <div class="final">Tension ×2 ⟹ pertes ÷4. C'est toute la raison d'être des lignes à 400 000 V.</div></div>`},
 {k:"l",t:"Racines et pourcentages",h:`
  <p>La racine carrée est simplement l'opération inverse du carré. Elle apparaît partout où l'on remonte d'une puissance vers un courant, ou d'une somme de carrés vers une longueur.</p>
  <div class="formule">√(a²) = a          (√a)² = a          √(a · b) = √a · √b<span class="note">Mais attention : √(a + b) ≠ √a + √b. Jamais.</span></div>
  <h3>Deux racines à connaître par cœur</h3>
  <div class="formule">√2 ≈ 1,414   →   le lien entre valeur crête et valeur efficace
√3 ≈ 1,732   →   le lien entre tension simple et tension composée en triphasé</div>
  <h3>Les pourcentages, dans les deux sens</h3>
  <div class="formule">pourcentage = partie / total × 100
partie = total × pourcentage / 100<span class="note">Une chute de 3 % sur 400 V, c'est 400 × 3 / 100 = 12 V.</span></div>
  <div class="encart e-piege"><span class="chapo">Piège des pourcentages successifs</span><p>Une baisse de 10 % suivie d'une hausse de 10 % ne ramène PAS au point de départ : 100 → 90 → 99. En rendement, cela compte : deux machines en cascade à 90 % ne donnent pas 90 % mais 0,90 × 0,90 = 81 %.</p></div>`},
 {k:"a",t:"Atelier — carrés, racines, proportions",gen:["carre","pythagore","proportion","pourcent"],but:4,h:`
  <p>Tu vas retrouver Pythagore ici. Ce n'est pas de la géométrie décorative : c'est exactement le calcul d'une impédance et d'une puissance apparente, que tu verras au bloc alternatif.</p>`},
 {k:"c",t:"Contrôle",gen:["carre","pythagore","proportion","pourcent","scientifique"],n:8}
]},

{id:"m04",num:"04",bloc:"Les maths d'abord",titre:"Trigonométrie utile",duree:"28 min",
 resume:"Sinus, cosinus, tangente : trois rapports dans un triangle, et tout le régime alternatif en découle.",
 steps:[
 {k:"l",t:"Trois rapports, rien de plus",h:`
  <p>Dans un triangle rectangle, on nomme les côtés par rapport à l'angle qu'on regarde. Les trois fonctions trigonométriques ne sont que des rapports entre ces côtés.</p>
  <div class="formule">cos φ = adjacent / hypoténuse
sin φ = opposé / hypoténuse
tan φ = opposé / adjacent = sin φ / cos φ</div>
  <figure data-anim="cercle-trigo"></figure>
  <p>Fais tourner l'angle ci-dessus. Le cosinus est la <strong>projection horizontale</strong>, le sinus la <strong>projection verticale</strong>. Retiens cette image plutôt que la définition : c'est elle que tu utiliseras en électrotechnique.</p>
  <div class="encart e-cle"><span class="chapo">Les valeurs à connaître sans calculatrice</span>
   <p><span class="mono">cos 0° = 1 · cos 30° = 0,866 · cos 45° = 0,707 · cos 60° = 0,5 · cos 90° = 0</span></p>
   <p>Le 0,707, c'est <span class="mono">1/√2</span> : tu le retrouveras dans la valeur efficace. Le 0,866, c'est <span class="mono">√3/2</span> : tu le retrouveras dans le triphasé.</p></div>`},
 {k:"l",t:"Retrouver un angle, retrouver un côté",h:`
  <p>Deux situations, deux gestes inverses.</p>
  <h3>On connaît l'angle, on cherche un côté</h3>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Une puissance apparente de 100 kVA avec un déphasage de 25°. Quelle puissance active ?</p>
   <ol>
    <li>La puissance active est la projection horizontale de S : c'est donc le cosinus qui intervient.<span class="op">P = S · cos φ</span></li>
    <li>On calcule le cosinus.<span class="op">cos 25° = 0,906</span></li>
    <li>On multiplie.<span class="op">P = 100 × 0,906 = 90,6 kW</span></li>
   </ol>
   <div class="final">P = 90,6 kW — et au passage Q = 100 × sin 25° = 42,3 kvar</div></div>
  <h3>On connaît deux côtés, on cherche l'angle</h3>
  <p>Il faut alors la fonction inverse : <span class="mono">arccos</span>, <span class="mono">arcsin</span> ou <span class="mono">arctan</span>, notées <span class="mono">cos⁻¹</span>, <span class="mono">sin⁻¹</span>, <span class="mono">tan⁻¹</span> sur la calculatrice (souvent en seconde fonction).</p>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Une installation absorbe 80 kW pour 100 kVA. Quel est l'angle φ ?</p>
   <ol>
    <li>Le rapport P/S est par définition le cosinus de φ.<span class="op">cos φ = 80 / 100 = 0,80</span></li>
    <li>On applique la fonction inverse.<span class="op">φ = arccos(0,80)</span></li>
   </ol>
   <div class="final">φ = 36,9° — et tan φ = 0,75, ce qui donnera directement Q = 80 × 0,75 = 60 kvar</div></div>
  <div class="encart e-piege"><span class="chapo">Mode DEG, toujours</span><p>Une calculatrice en mode RAD donnera <span class="mono">cos 25 = 0,991</span> au lieu de 0,906. Le résultat reste plausible, donc l'erreur passe inaperçue et fausse tout le devoir. Vérifie le mode avant de commencer : <span class="mono">cos 60</span> doit donner exactement 0,5.</p></div>`},
 {k:"a",t:"Atelier — trigonométrie",gen:["trigo-cote","trigo-angle","radian","pythagore"],but:4,h:`
  <p>Ces quatre gestes reviendront à chaque calcul de puissance et d'impédance. Autant les rendre automatiques maintenant.</p>`},
 {k:"c",t:"Contrôle",gen:["trigo-cote","trigo-angle","radian","pythagore","carre"],n:8}
]},

{id:"m05",num:"05",bloc:"Les maths d'abord",titre:"Vecteurs et nombres complexes",duree:"26 min",
 resume:"Additionner deux grandeurs déphasées. L'outil qui rend le régime alternatif calculable.",
 steps:[
 {k:"l",t:"Pourquoi les vecteurs",h:`
  <p>En courant continu, 60 V plus 80 V font 140 V. En alternatif, si les deux tensions ne sont pas en phase, ce résultat est faux — parfois de 40 %.</p>
  <p>Une grandeur alternative sinusoïdale porte deux informations : une <strong>amplitude</strong> et une <strong>phase</strong>. Un simple nombre n'en porte qu'une. Il faut donc un objet à deux composantes : le vecteur.</p>
  <div class="formule">longueur du vecteur = valeur efficace
angle du vecteur = phase<span class="note">On l'appelle un phaseur, ou vecteur de Fresnel.</span></div>
  <h3>Additionner deux vecteurs perpendiculaires</h3>
  <div class="formule">résultante = √(a² + b²)          angle = arctan(b / a)<span class="note">C'est Pythagore et la trigonométrie du module précédent, appliqués tels quels.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Une résistance de 60 V en série avec une bobine de 80 V (déphasage 90°). Tension totale ?</p>
   <ol>
    <li>Les deux tensions sont perpendiculaires dans le plan de Fresnel.<span class="op">U = √(60² + 80²)</span></li>
    <li>On calcule.<span class="op">U = √(3600 + 6400) = √10 000</span></li>
    <li>Et l'angle du vecteur résultant.<span class="op">φ = arctan(80 / 60) = 53,1°</span></li>
   </ol>
   <div class="final">U = 100 V à 53,1° — l'addition naïve aurait donné 140 V, soit 40 % de trop.</div></div>`},
 {k:"l",t:"Le nombre complexe : le même vecteur, écrit autrement",h:`
  <p>Un nombre complexe n'est rien d'autre qu'un vecteur écrit en une seule ligne. En électrotechnique on note <span class="mono">j</span> l'unité imaginaire (et non <span class="mono">i</span>, déjà pris par le courant).</p>
  <div class="formule">Z = R + j·X<span class="note">R : partie réelle, sur l'axe horizontal — X : partie imaginaire, sur l'axe vertical</span></div>
  <div class="tabl"><table>
   <tr><th>Forme</th><th>Écriture</th><th>Utile pour</th></tr>
   <tr><td>Algébrique</td><td class="mono">Z = R + jX</td><td>additionner deux impédances en série</td></tr>
   <tr><td>Polaire</td><td class="mono">Z = |Z| ∠ φ</td><td>multiplier, diviser, lire un déphasage</td></tr>
  </table></div>
  <div class="formule">|Z| = √(R² + X²)          φ = arctan(X / R)
R = |Z| · cos φ           X = |Z| · sin φ<span class="note">Passer d'une forme à l'autre, c'est exactement le module précédent.</span></div>
  <div class="encart e-cle"><span class="chapo">Le sens physique, à retenir</span>
   <p>La partie <strong>réelle</strong> est ce qui <strong>consomme</strong> : la résistance, la puissance active.</p>
   <p>La partie <strong>imaginaire</strong> est ce qui <strong>échange sans consommer</strong> : la réactance, la puissance réactive.</p>
   <p>C'est pour cela que la même figure sert au triangle des impédances et au triangle des puissances : ce sont deux vecteurs de même angle φ.</p></div>`},
 {k:"a",t:"Atelier — vecteurs et complexes",gen:["vecteur-somme","complexe-module","trigo-angle","pythagore"],but:4,h:`
  <p>Ce module est le pivot du parcours : tout le bloc « régime alternatif » repose dessus. Prends le temps qu'il faut ici, tu le regagneras trois fois plus loin.</p>`},
 {k:"c",t:"Contrôle",gen:["vecteur-somme","complexe-module","trigo-angle","trigo-cote"],n:8}
]},

{id:"m06",num:"06",bloc:"Les maths d'abord",titre:"Ce qui varie dans le temps",duree:"24 min",
 resume:"Fréquence, période, pulsation, exponentielle : lire une grandeur qui bouge.",
 steps:[
 {k:"l",t:"Période, fréquence, pulsation",h:`
  <p>Trois façons de dire la même chose. Elles servent toutes les trois, dans des formules différentes.</p>
  <div class="formule">T = 1 / f          f = 1 / T          ω = 2 · π · f<span class="note">T en secondes · f en hertz · ω en radians par seconde</span></div>
  <div class="tabl"><table>
   <tr><th>Grandeur</th><th>À 50 Hz</th><th>Où elle sert</th></tr>
   <tr><td>Période T</td><td class="mono">20 ms</td><td>lire un oscillogramme, régler une base de temps</td></tr>
   <tr><td>Fréquence f</td><td class="mono">50 Hz</td><td>plaques signalétiques, vitesse de synchronisme</td></tr>
   <tr><td>Pulsation ω</td><td class="mono">314 rad/s</td><td>X_L = L·ω, X_C = 1/(C·ω)</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">Trois nombres à mémoriser</span><p><span class="mono">50 Hz → 20 ms → 314 rad/s</span>. Avec ces trois-là, tu lis n'importe quel oscillogramme du réseau et tu calcules n'importe quelle réactance de tête.</p></div>`},
 {k:"l",t:"L'exponentielle, ou comment les choses s'installent",h:`
  <p>Quand un condensateur se charge, quand un moteur monte en vitesse, quand une bobine s'établit, rien ne se fait instantanément. Le passage suit toujours la même forme mathématique.</p>
  <figure data-anim="rc-charge"></figure>
  <div class="formule">croissance : u(t) = U · (1 − e<sup>−t/τ</sup>)
décroissance : u(t) = U · e<sup>−t/τ</sup><span class="note">τ (tau) est la constante de temps : elle dit à quelle vitesse ça se passe.</span></div>
  <div class="tabl"><table>
   <tr><th>Temps écoulé</th><th>Croissance atteinte</th><th>Décroissance restante</th></tr>
   <tr><td class="mono">1 τ</td><td class="mono">63 %</td><td class="mono">37 %</td></tr>
   <tr><td class="mono">2 τ</td><td class="mono">86 %</td><td class="mono">14 %</td></tr>
   <tr><td class="mono">3 τ</td><td class="mono">95 %</td><td class="mono">5 %</td></tr>
   <tr><td class="mono">5 τ</td><td class="mono">99 %</td><td class="mono">1 %</td></tr>
  </table></div>
  <p>Ces quatre lignes remplacent la plupart des calculs : on ne demande presque jamais une valeur intermédiaire, on demande « au bout de combien de temps est-ce terminé ». La réponse est <strong>5 τ</strong>.</p>
  <div class="encart e-terrain"><span class="chapo">Ce que ça veut dire sur le terrain</span><p>L'étiquette d'un variateur indique un temps d'attente avant ouverture — typiquement 5 à 15 minutes. Ce n'est pas une précaution administrative : c'est le 5τ de la décharge du bus continu à travers ses résistances de décharge. Avant ce délai, le condensateur reste mortel.</p></div>`},
 {k:"l",t:"Dérivée : la notion, sans le formalisme",h:`
  <p>Deux formules du métier contiennent une dérivée. Tu n'as pas besoin de savoir dériver pour les comprendre — il faut juste lire <span class="mono">d/dt</span> comme « à quelle vitesse ça change ».</p>
  <div class="formule">i = C · du/dt<span class="note">Le courant dans un condensateur est proportionnel à la VITESSE de variation de sa tension. Tension constante ⟹ courant nul : il bloque le continu.</span></div>
  <div class="formule">u = L · di/dt<span class="note">La tension aux bornes d'une bobine est proportionnelle à la VITESSE de variation du courant. Courant constant ⟹ tension nulle : elle laisse passer le continu.</span></div>
  <div class="encart e-piege"><span class="chapo">La conséquence dangereuse</span><p>Si on coupe brutalement le courant d'une bobine, <span class="mono">di/dt</span> devient énorme, donc <span class="mono">u</span> aussi. Une bobine de contacteur alimentée en 24 V peut ainsi produire plusieurs centaines de volts à l'ouverture. C'est ce qui détruit les contacts et les sorties d'automate — et c'est la raison d'être de la diode de roue libre, que tu verras au module 10.</p></div>`},
 {k:"a",t:"Atelier — temps et exponentielle",gen:["periode","expo-tau","rc-tau","radian"],but:4,h:`<p>Dernier atelier du bloc mathématique. Après lui, on entre dans l'électricité — avec tous les outils en main.</p>`},
 {k:"c",t:"Contrôle du bloc mathématique",gen:["periode","expo-tau","rc-tau","transpose","carre","vecteur-somme","trigo-angle","prefixe"],n:10}
]},

/* ═══════════════ BLOC 2 — LE SOCLE ÉLECTRIQUE ═══════════════ */
{id:"m07",num:"07",bloc:"Socle électrique",titre:"Grandeurs et loi d'Ohm",duree:"26 min",
 resume:"Tension, courant, résistance, puissance : ce qu'elles sont vraiment, et la relation qui les lie.",
 steps:[
 {k:"l",t:"Les quatre grandeurs, expliquées",h:`
  <p>Une image vaut ici tous les discours : un circuit électrique se comporte comme un circuit d'eau.</p>
  <div class="tabl"><table>
   <tr><th>Grandeur</th><th>Unité</th><th>Analogie hydraulique</th><th>Ce qu'elle fait</th></tr>
   <tr><td>Tension U</td><td class="mono">volt (V)</td><td>la pression</td><td>elle POUSSE les charges</td></tr>
   <tr><td>Intensité I</td><td class="mono">ampère (A)</td><td>le débit</td><td>elle CHAUFFE le conducteur</td></tr>
   <tr><td>Résistance R</td><td class="mono">ohm (Ω)</td><td>l'étranglement du tuyau</td><td>elle FREINE le passage</td></tr>
   <tr><td>Puissance P</td><td class="mono">watt (W)</td><td>pression × débit</td><td>elle TRAVAILLE ou chauffe</td></tr>
  </table></div>
  <p>L'analogie a ses limites, mais elle porte trois vérités importantes : une tension existe entre <strong>deux</strong> points (comme une différence de pression), un courant <strong>traverse</strong> un composant, et il faut un circuit <strong>fermé</strong> pour que quoi que ce soit circule.</p>
  <div class="encart e-cle"><span class="chapo">La conséquence qui sauve la vie</span><p>Un oiseau sur une ligne haute tension ne prend rien : ses deux pattes sont au même potentiel, donc U = 0 entre elles, donc I = 0. Le danger n'est jamais « la tension », c'est la <strong>différence</strong> de potentiel que ton corps met en contact.</p></div>`},
 {k:"l",t:"La loi d'Ohm, vue de l'intérieur",h:`
  <figure data-anim="ohm-flux"></figure>
  <p>Manipule les deux réglages ci-dessus avant de lire la suite. Tu verras deux choses : le débit suit la tension, et la chaleur s'emballe bien plus vite que le courant.</p>
  <div class="formule">U = R · I          I = U / R          R = U / I<span class="note">Une seule loi, trois écritures. La transposition du module 02 suffit à passer de l'une à l'autre.</span></div>
  <h3>La puissance, sous trois formes</h3>
  <div class="formule">P = U · I          P = R · I²          P = U² / R<span class="note">Elles découlent l'une de l'autre en remplaçant U par R·I. On prend celle qui colle aux données.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — pas à pas</span>
   <p>Un radiateur de 2000 W est branché sur 230 V. Quel courant, et quelle est sa résistance ?</p>
   <ol>
    <li>On cherche d'abord le courant : on connaît P et U.<span class="op">I = P / U = 2000 / 230</span></li>
    <li>Calcul.<span class="op">I = 8,70 A</span></li>
    <li>Maintenant la résistance, avec la loi d'Ohm.<span class="op">R = U / I = 230 / 8,70</span></li>
    <li>Calcul.<span class="op">R = 26,4 Ω</span></li>
   </ol>
   <div class="final">I = 8,7 A et R = 26,4 Ω — vérification : P = U²/R = 52 900 / 26,4 = 2004 W ✓</div></div>
  <div class="encart e-piege"><span class="chapo">L'erreur d'inattention type</span><p>« Une résistance de 100 Ω traversée par 2 A dissipe 200 W » — faux. 100 est une résistance, pas une tension : <span class="mono">P = R·I² = 100 × 4 = 400 W</span>. Avant de multiplier deux nombres, vérifie ce que chacun représente.</p></div>`},
 {k:"a",t:"Atelier — Ohm et puissance",gen:["ohm","puissance-dc","joule"],but:4,h:`
  <p>Quatre bonnes réponses d'affilée. Si tu bloques, l'indice te redonne la formule, et la correction détaille chaque ligne du calcul.</p>`},
 {k:"s",t:"Banc d'essai",sim:"ohm",h:`
  <p>Le banc ci-dessous trace la courbe <span class="mono">P = R·I²</span> et y place ton point de fonctionnement. Fais varier la tension et regarde le point remonter la parabole : c'est cette courbure qui explique pourquoi un câble sous-dimensionné ne chauffe pas « un peu plus », mais beaucoup plus.</p>`},
 {k:"c",t:"Contrôle",gen:["ohm","puissance-dc","joule","transpose","carre"],n:8}
]},

{id:"m08",num:"08",bloc:"Socle électrique",titre:"Associer, répartir, calculer un réseau",duree:"28 min",
 resume:"Série, parallèle, lois de Kirchhoff, ponts diviseurs : réduire un circuit jusqu'à savoir le résoudre.",
 steps:[
 {k:"l",t:"Série et parallèle : ce qui est commun",h:`
  <figure data-anim="serie-parallele"></figure>
  <p>Toute la différence tient en une question : <strong>qu'est-ce qui est commun aux composants ?</strong></p>
  <div class="tabl"><table>
   <tr><th></th><th>En série</th><th>En parallèle</th></tr>
   <tr><td>Ce qui est commun</td><td class="mono">le courant I</td><td class="mono">la tension U</td></tr>
   <tr><td>Ce qui s'ajoute</td><td class="mono">les tensions</td><td class="mono">les courants</td></tr>
   <tr><td>Résistance équivalente</td><td class="mono">R₁ + R₂</td><td class="mono">R₁·R₂ / (R₁+R₂)</td></tr>
   <tr><td>Résultat</td><td>plus grand que chacune</td><td>plus petit que la plus petite</td></tr>
   <tr><td>Exemple d'installation</td><td>guirlande, circuit de commande</td><td>tous les récepteurs d'un logement</td></tr>
  </table></div>
  <div class="resolu"><span class="chapo">Exemple résolu — réduire un circuit mixte</span>
   <p>R₁ = 10 Ω en série avec l'association parallèle de R₂ = 30 Ω et R₃ = 60 Ω, sous 24 V. Courant total ?</p>
   <ol>
    <li>On réduit d'abord le parallèle, car il est « à l'intérieur ».<span class="op">R₂₃ = (30 × 60) / (30 + 60) = 1800 / 90 = 20 Ω</span></li>
    <li>Contrôle immédiat : 20 Ω est bien plus petit que 30 Ω. ✓</li>
    <li>Le circuit devient deux résistances en série.<span class="op">R_éq = 10 + 20 = 30 Ω</span></li>
    <li>Loi d'Ohm sur l'ensemble.<span class="op">I = 24 / 30 = 0,80 A</span></li>
   </ol>
   <div class="final">I total = 0,80 A. Et la tension aux bornes du groupe parallèle vaut 0,8 × 20 = 16 V.</div></div>`},
 {k:"l",t:"Les deux lois de Kirchhoff",h:`
  <h3>Loi des nœuds — rien ne s'accumule</h3>
  <div class="formule">Σ I entrants = Σ I sortants<span class="note">Ce qui arrive en un point en repart. Toujours.</span></div>
  <h3>Loi des mailles — on revient au même potentiel</h3>
  <div class="formule">Σ U = 0 sur tout parcours fermé<span class="note">Faire le tour d'une boucle et revenir au départ, c'est retrouver le potentiel de départ.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — dimensionner un circuit de logement</span>
   <p>Sur un même circuit 230 V : un four de 2500 W, un lave-vaisselle de 2200 W, un éclairage de 300 W. Le disjoncteur 16 A tient-il ?</p>
   <ol>
    <li>Chaque appareil appelle son propre courant.<span class="op">I = P / U</span></li>
    <li>Four.<span class="op">2500 / 230 = 10,9 A</span></li>
    <li>Lave-vaisselle.<span class="op">2200 / 230 = 9,6 A</span></li>
    <li>Éclairage.<span class="op">300 / 230 = 1,3 A</span></li>
    <li>Ils sont en parallèle : loi des nœuds, les courants s'ajoutent.<span class="op">I total = 10,9 + 9,6 + 1,3 = 21,8 A</span></li>
   </ol>
   <div class="final">21,8 A sur un 16 A : le disjoncteur déclenchera. Il faut séparer les circuits — ce que la norme impose d'ailleurs pour les gros appareils.</div></div>
  <h3>Le pont diviseur, pour aller plus vite</h3>
  <div class="formule">tension : U₁ = U · R₁ / (R₁ + R₂)
courant : I₁ = I · R₂ / (R₁ + R₂)<span class="note">Pour le courant, c'est la résistance de l'AUTRE branche au numérateur : le courant préfère le chemin facile.</span></div>
  <div class="encart e-terrain"><span class="chapo">Où tu vas le rencontrer</span><p>Tout capteur résistif est un pont diviseur : sonde Pt100, thermistance CTN, potentiomètre de consigne 0-10 V d'un variateur. Tu en câbleras beaucoup plus que tu n'en calculeras — mais savoir le calculer, c'est savoir diagnostiquer quand la mesure dérive.</p></div>`},
 {k:"a",t:"Atelier — réseaux",gen:["serie-par","diviseur","systeme2","ohm"],but:4,h:`<p>Quatre d'affilée. La difficulté n'est pas dans le calcul mais dans l'ordre : réduire d'abord ce qui est le plus « intérieur ».</p>`},
 {k:"c",t:"Contrôle",gen:["serie-par","diviseur","ohm","puissance-dc","systeme2"],n:8}
]},

{id:"m09",num:"09",bloc:"Socle électrique",titre:"Conducteurs, résistivité et échauffement",duree:"22 min",
 resume:"Pourquoi une section de câble se calcule, et pourquoi une borne mal serrée finit par brûler.",
 steps:[
 {k:"l",t:"La résistance d'un câble",h:`
  <div class="formule">R = ρ · L / S<span class="note">ρ en Ω·mm²/m — L en mètres — S en mm²</span></div>
  <div class="tabl"><table>
   <tr><th>Matière</th><th>ρ à 20 °C</th><th>ρ conventionnel à chaud</th><th>Emploi</th></tr>
   <tr><td>Cuivre</td><td class="mono">0,0178</td><td class="mono">0,023</td><td>référence en installation</td></tr>
   <tr><td>Aluminium</td><td class="mono">0,0286</td><td class="mono">0,037</td><td>grosses sections, liaisons TGBT</td></tr>
  </table></div>
  <p>Les calculs normatifs utilisent la valeur <strong>à chaud</strong> : un câble en service n'est pas à 20 °C. À section égale, l'aluminium est environ 1,6 fois plus résistif que le cuivre — il faut donc une section plus grande pour la même performance, mais il est plus léger et moins cher.</p>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Une liaison de 120 m en cuivre, section 16 mm², parcourue par 40 A. Résistance, chute de tension et pertes ?</p>
   <ol>
    <li>Résistance d'un conducteur.<span class="op">R = 0,023 × 120 / 16 = 2,76 / 16 = 0,1725 Ω</span></li>
    <li>Chute de tension dans un aller simple.<span class="op">U = R · I = 0,1725 × 40 = 6,9 V</span></li>
    <li>Pertes Joule dans ce conducteur.<span class="op">P = R · I² = 0,1725 × 1600 = 276 W</span></li>
   </ol>
   <div class="final">276 W dissipés dans un seul conducteur — l'équivalent de trois ampoules à filament, en chaleur pure dans un chemin de câbles.</div></div>`},
 {k:"l",t:"L'effet Joule, en bien et en mal",h:`
  <div class="formule">P = R · I²          W = R · I² · t<span class="note">La puissance en watts, l'énergie en joules si t est en secondes.</span></div>
  <p>C'est le même phénomène qui fait fonctionner un radiateur et qui détruit une installation. La seule différence est de savoir s'il est <strong>voulu</strong> et <strong>évacué</strong>.</p>
  <div class="encart e-terrain"><span class="chapo">Le cas de la borne mal serrée</span>
   <p>Un contact desserré ajoute une résistance parasite — disons 0,05 Ω. Sur un départ à 32 A :</p>
   <p><span class="mono">P = 0,05 × 32² = 51 W</span> concentrés sur un centimètre carré de laiton. La température monte, le métal s'oxyde, la résistance augmente encore, donc la puissance augmente encore. C'est un emballement, et il finit en incendie.</p>
   <p>C'est exactement ce que détecte une caméra thermique : un point chaud de +10 °C par rapport aux deux autres phases signale un serrage à reprendre ; au-delà de +30 °C, c'est urgent.</p></div>
  <h3>Le courant admissible d'un câble</h3>
  <p>Un câble ne « supporte » pas une intensité dans l'absolu : il supporte une <strong>température</strong>. Le courant admissible dépend donc de tout ce qui gêne l'évacuation de la chaleur, et se corrige par des coefficients.</p>
  <div class="tabl"><table>
   <tr><th>Facteur</th><th>Effet</th></tr>
   <tr><td>Mode de pose</td><td>encastré dans l'isolant : très défavorable · sur chemin de câbles perforé : favorable</td></tr>
   <tr><td>Température ambiante</td><td>au-delà de 30 °C, le courant admissible chute</td></tr>
   <tr><td>Groupement de circuits</td><td>plusieurs câbles jointifs se chauffent mutuellement</td></tr>
   <tr><td>Harmoniques de rang 3</td><td>surcharge du neutre : le câble doit être déclassé</td></tr>
  </table></div>`},
 {k:"a",t:"Atelier — conducteurs",gen:["resistivite","joule","puissance-dc","proportion"],but:4,h:`<p>Ces calculs sont ceux que tu referas devant un chemin de câbles ou une note de calcul.</p>`},
 {k:"c",t:"Contrôle",gen:["resistivite","joule","carre","ohm","serie-par"],n:8}
]},

{id:"m10",num:"10",bloc:"Socle électrique",titre:"Condensateur et bobine",duree:"28 min",
 resume:"Les deux composants qui refusent le changement — et les dangers qui vont avec.",
 steps:[
 {k:"l",t:"Le condensateur s'oppose aux variations de TENSION",h:`
  <figure data-anim="rc-charge"></figure>
  <div class="formule">Q = C · U          i = C · du/dt          W = ½ · C · U²
τ = R · C<span class="note">C en farads — mais en pratique en µF ou nF</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Un condensateur de 470 µF est chargé sous 560 V (bus continu de variateur). Énergie stockée, et temps de décharge dans une résistance de 22 kΩ ?</p>
   <ol>
    <li>Énergie stockée.<span class="op">W = 0,5 × 470·10⁻⁶ × 560² = 0,5 × 470·10⁻⁶ × 313 600</span></li>
    <li>Calcul.<span class="op">W = 73,7 J</span></li>
    <li>Constante de temps de la décharge.<span class="op">τ = R · C = 22 000 × 470·10⁻⁶ = 10,3 s</span></li>
    <li>Décharge considérée terminée à 5τ.<span class="op">5 × 10,3 = 52 s</span></li>
   </ol>
   <div class="final">73,7 J : largement mortel. Et il faut près d'une minute avant que ce soit sûr — d'où le délai affiché sur l'étiquette.</div></div>
  <div class="encart e-piege"><span class="chapo">Règle absolue</span><p>Un condensateur de puissance reste chargé après coupure. On respecte le temps de décharge indiqué <strong>et</strong> on vérifie à l'appareil. La VAT n'est pas une formalité administrative : c'est la seule preuve.</p></div>`},
 {k:"l",t:"La bobine s'oppose aux variations de COURANT",h:`
  <div class="formule">u = L · di/dt          W = ½ · L · I²          τ = L / R<span class="note">Le comportement exactement dual du condensateur.</span></div>
  <figure data-anim="roue-libre"></figure>
  <p>Bascule le réglage « diode de roue libre » ci-dessus. Sans elle, l'ouverture du contact provoque un pic de tension et un arc ; avec elle, le courant trouve un chemin et décroît tranquillement.</p>
  <div class="tabl"><table>
   <tr><th>Alimentation</th><th>Protection à poser</th><th>Remarque</th></tr>
   <tr><td>Continu</td><td>Diode de roue libre</td><td>en inverse aux bornes de la bobine</td></tr>
   <tr><td>Alternatif</td><td>Circuit RC ou varistance</td><td>une diode serait court-circuitée une alternance sur deux</td></tr>
   <tr><td>Sortie automate</td><td>Souvent intégrée</td><td>à vérifier : sinon la sortie se dégrade en quelques milliers de manœuvres</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">La dualité à retenir</span>
   <p>Le <strong>condensateur</strong> maintient la <strong>tension</strong> : il bloque le continu, laisse passer le variable.</p>
   <p>La <strong>bobine</strong> maintient le <strong>courant</strong> : elle laisse passer le continu, freine le variable.</p>
   <p>Cette seule phrase explique les filtres, les selfs de lissage, les filtres CEM et la moitié du régime alternatif que tu abordes au module suivant.</p></div>`},
 {k:"a",t:"Atelier — transitoires",gen:["rc-tau","expo-tau","energie-condo","prefixe"],but:4,h:`<p>Attention aux unités ici : c'est le module où les µF et les mH font le plus de dégâts. Le module 01 était fait pour ça.</p>`},
 {k:"c",t:"Contrôle du socle électrique",gen:["rc-tau","expo-tau","energie-condo","ohm","serie-par","resistivite","puissance-dc","diviseur"],n:10}
]},

/* ═══════════════ BLOC 3 — LE RÉGIME ALTERNATIF ═══════════════ */
{id:"m11",num:"11",bloc:"Régime alternatif",titre:"La sinusoïde",duree:"26 min",
 resume:"D'où vient la sinusoïde, ce qu'est vraiment une valeur efficace, et pourquoi 230 V font 325 V de crête.",
 steps:[
 {k:"l",t:"Un vecteur qui tourne, et rien d'autre",h:`
  <p>La sinusoïde n'est pas une courbe décorative : c'est la <strong>projection d'un vecteur en rotation</strong>. Un alternateur tourne, et la tension qu'il produit est littéralement l'ombre de ce mouvement.</p>
  <figure data-anim="phaseur"></figure>
  <p>Regarde la figure : à gauche le vecteur tourne, à droite sa projection verticale dessine la courbe. Ce sont deux vues du même objet. Toute la suite du parcours utilise l'une ou l'autre selon ce qui est le plus commode.</p>
  <div class="formule">u(t) = U<sub>max</sub> · sin(ω·t + φ)<span class="note">U max : longueur du vecteur — ω : vitesse de rotation — φ : position de départ</span></div>`},
 {k:"l",t:"La valeur efficace, et pourquoi elle existe",h:`
  <p>Une tension alternative vaut zéro en moyenne : elle passe autant de temps au-dessus qu'au-dessous. Pourtant elle chauffe un radiateur. La valeur moyenne ne décrit donc rien d'utile.</p>
  <p>On définit alors la <strong>valeur efficace</strong> : la valeur d'une tension continue qui produirait <strong>le même échauffement</strong>. C'est une définition physique, pas mathématique.</p>
  <div class="formule">U<sub>eff</sub> = U<sub>max</sub> / √2 ≈ 0,707 · U<sub>max</sub>
U<sub>max</sub> = U<sub>eff</sub> · √2 ≈ 1,414 · U<sub>eff</sub><span class="note">Valable uniquement pour une sinusoïde PURE.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Le réseau domestique est à 230 V. Que voit-on à l'oscilloscope, et que doit tenir l'isolation ?</p>
   <ol>
    <li>La plaque et le multimètre affichent toujours la valeur EFFICACE.<span class="op">U eff = 230 V</span></li>
    <li>La crête est √2 fois plus grande.<span class="op">U max = 230 × 1,414 = 325 V</span></li>
    <li>Et de crête à crête, sur l'écran.<span class="op">U cc = 2 × 325 = 650 V</span></li>
   </ol>
   <div class="final">325 V de crête : c'est cette valeur que l'isolant doit supporter, pas 230.</div></div>
  <div class="encart e-piege"><span class="chapo">TRMS ou pas TRMS</span><p>Un multimètre bon marché mesure une valeur moyenne redressée et la multiplie par 1,11 en supposant une sinusoïde parfaite. Face au courant découpé d'un variateur ou d'une alimentation à découpage, il se trompe de 20 à 40 %. En présence de charges non linéaires, seul un appareil marqué <strong>TRMS</strong> donne une valeur exploitable.</p></div>`},
 {k:"s",t:"Banc d'essai — l'oscillogramme",sim:"sinus",h:`<p>Fais varier l'amplitude, la fréquence et le déphasage. Observe que le déphasage déplace la courbe sans changer la valeur efficace : ce sont deux informations indépendantes.</p>`},
 {k:"a",t:"Atelier — lire une sinusoïde",gen:["eff-max","periode","radian","trigo-cote"],but:4,h:`<p>Ces conversions sont demandées dans presque tous les sujets d'examen, souvent en première question.</p>`},
 {k:"c",t:"Contrôle",gen:["eff-max","periode","radian","trigo-cote","pourcent"],n:8}
]},

{id:"m12",num:"12",bloc:"Régime alternatif",titre:"Impédances et déphasage",duree:"30 min",
 resume:"Résistance, bobine, condensateur en alternatif : trois comportements, un seul outil pour les combiner.",
 steps:[
 {k:"l",t:"Ce que chaque composant fait au courant",h:`
  <figure data-anim="dephasage"></figure>
  <p>Change de récepteur dans la figure. Trois comportements, et ils se déduisent du module 10.</p>
  <div class="tabl"><table>
   <tr><th>Composant</th><th>Déphasage du courant</th><th>Pourquoi</th></tr>
   <tr><td>Résistance</td><td class="mono">0° — en phase</td><td>elle ne stocke rien</td></tr>
   <tr><td>Bobine</td><td class="mono">−90° — en retard</td><td>elle s'oppose à la variation de courant : il traîne</td></tr>
   <tr><td>Condensateur</td><td class="mono">+90° — en avance</td><td>le courant y est maximal quand la tension varie le plus vite</td></tr>
   <tr><td>Moteur</td><td class="mono">−25° à −40°</td><td>mélange de résistance et d'inductance</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">Moyen mnémotechnique</span><p><strong>L</strong> comme <em>late</em> : dans une bobine (L), le courant est en retard. Le condensateur fait l'inverse.</p></div>`},
 {k:"l",t:"Les réactances dépendent de la fréquence",h:`
  <div class="formule">X<sub>L</sub> = L · ω = 2 · π · f · L
X<sub>C</sub> = 1 / (C · ω) = 1 / (2 · π · f · C)<span class="note">Toutes deux en ohms, comme une résistance — mais dépendantes de la fréquence.</span></div>
  <p>Cette dépendance est le levier de toute l'électronique de puissance et de la CEM :</p>
  <ul>
   <li>La bobine <strong>freine d'autant plus que la fréquence est haute</strong> : c'est le rôle d'une self de ligne devant un variateur, d'une self de lissage, d'un filtre CEM.</li>
   <li>Le condensateur <strong>laisse passer d'autant mieux que la fréquence est haute</strong> : c'est le rôle d'un condensateur de découplage, et la raison pour laquelle les batteries de compensation attirent les harmoniques.</li>
  </ul>
  <div class="resolu"><span class="chapo">Exemple résolu — la même bobine à deux fréquences</span>
   <p>Une bobine de 100 mH, à 50 Hz puis à 350 Hz (harmonique de rang 7).</p>
   <ol>
    <li>À 50 Hz.<span class="op">X_L = 2π × 50 × 0,1 = 31,4 Ω</span></li>
    <li>À 350 Hz.<span class="op">X_L = 2π × 350 × 0,1 = 220 Ω</span></li>
   </ol>
   <div class="final">Sept fois plus d'opposition à l'harmonique 7 qu'au fondamental : la bobine trie les fréquences toute seule.</div></div>`},
 {k:"l",t:"Composer R et X : l'impédance",h:`
  <p>R et X ne s'additionnent pas : ils sont perpendiculaires dans le plan de Fresnel — R sur l'axe horizontal, X sur l'axe vertical. On les compose donc comme au module 05.</p>
  <div class="formule">Z = √(R² + X²)          tan φ = X / R          cos φ = R / Z</div>
  <div class="resolu"><span class="chapo">Exemple résolu — un enroulement de moteur</span>
   <p>R = 12 Ω, L = 95 mH, sous 230 V à 50 Hz. Impédance, courant, déphasage ?</p>
   <ol>
    <li>Réactance.<span class="op">X_L = 2π × 50 × 0,095 = 29,8 Ω</span></li>
    <li>Impédance, par Pythagore.<span class="op">Z = √(12² + 29,8²) = √(144 + 888) = √1032 = 32,1 Ω</span></li>
    <li>Courant, par la loi d'Ohm généralisée.<span class="op">I = U / Z = 230 / 32,1 = 7,17 A</span></li>
    <li>Déphasage.<span class="op">φ = arctan(29,8 / 12) = 68,1°  ⟹  cos φ = 0,373</span></li>
   </ol>
   <div class="final">Z = 32,1 Ω, I = 7,17 A, cos φ = 0,37 — un cos φ très mauvais, typique d'un enroulement seul, sans charge mécanique.</div></div>
  <h3>Et quand X_L annule X_C : la résonance</h3>
  <figure data-anim="resonance"></figure>
  <p>À la fréquence où les deux réactances sont égales, elles s'annulent : le circuit devient purement résistif, le courant passe par un maximum, et la tension aux bornes de L et de C peut atteindre plusieurs fois la tension d'alimentation. C'est ce qui détruit les batteries de condensateurs mal accordées.</p>
  <div class="encart e-piege"><span class="chapo">L'addition interdite</span><p>Écrire <span class="mono">Z = R + X = 12 + 29,8 = 41,8 Ω</span> donne un courant de 5,5 A au lieu de 7,17 A : 23 % d'erreur, et une protection mal dimensionnée. La racine de la somme des carrés n'est pas une coquetterie de professeur.</p></div>`},
 {k:"s",t:"Banc d'essai — Fresnel",sim:"impedance",h:`<p>Le triangle se redessine à chaque mouvement. Fais monter la fréquence : regarde le vecteur X grandir et l'angle φ se rapprocher de 90°.</p>`},
 {k:"a",t:"Atelier — impédances",gen:["reactance","impedance-rl","complexe-module","vecteur-somme"],but:4,h:`<p>Quatre d'affilée. Vérifie systématiquement que Z est plus grand que R et que X, mais plus petit que leur somme.</p>`},
 {k:"c",t:"Contrôle",gen:["reactance","impedance-rl","complexe-module","eff-max","periode"],n:9}
]},

{id:"m13",num:"13",bloc:"Régime alternatif",titre:"Puissances et facteur de puissance",duree:"30 min",
 resume:"P, Q, S : ce qui travaille, ce qui circule pour rien, et ce qu'il faut dimensionner.",
 steps:[
 {k:"l",t:"Trois puissances, un seul triangle",h:`
  <div class="tabl"><table>
   <tr><th></th><th>Nom</th><th>Unité</th><th>Ce que c'est</th></tr>
   <tr><td class="mono">P</td><td>Active</td><td class="mono">W</td><td>ce qui devient travail ou chaleur — ce qu'on paie au compteur</td></tr>
   <tr><td class="mono">Q</td><td>Réactive</td><td class="mono">var</td><td>ce qui fait l'aller-retour pour magnétiser — ni consommé, ni utile</td></tr>
   <tr><td class="mono">S</td><td>Apparente</td><td class="mono">VA</td><td>ce que doivent supporter câbles, transfo et protections</td></tr>
  </table></div>
  <div class="formule">S = U · I          P = S · cos φ          Q = S · sin φ
S² = P² + Q²          cos φ = P / S          tan φ = Q / P<span class="note">C'est le triangle rectangle du module 04, avec des unités électriques.</span></div>
  <figure data-anim="triangle-puissances"></figure>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Un atelier absorbe 80 kW avec un cos φ de 0,80. Quelles sont S et Q ?</p>
   <ol>
    <li>La puissance apparente vient du cos φ.<span class="op">S = P / cos φ = 80 / 0,80 = 100 kVA</span></li>
    <li>Le réactif par Pythagore.<span class="op">Q = √(100² − 80²) = √(10 000 − 6400) = √3600 = 60 kvar</span></li>
    <li>Vérification par la tangente.<span class="op">tan φ = 60 / 80 = 0,75 ✓ (φ = 36,9°)</span></li>
   </ol>
   <div class="final">S = 100 kVA et Q = 60 kvar. Le transformateur doit être dimensionné sur 100 kVA, pas sur 80 kW.</div></div>`},
 {k:"l",t:"Ce que coûte un mauvais cos φ",h:`
  <p>La puissance réactive ne fait pas tourner le compteur d'énergie active. Mais elle circule, et tout ce qu'elle traverse doit être dimensionné pour elle.</p>
  <div class="resolu"><span class="chapo">Exemple résolu — deux ateliers, le même travail</span>
   <p>Deux ateliers absorbent chacun 100 kW sous 400 V triphasé. L'un a un cos φ de 0,95, l'autre de 0,70.</p>
   <ol>
    <li>Atelier A.<span class="op">S = 100 / 0,95 = 105 kVA  ⟹  I = 105 000 / (√3 × 400) = 152 A</span></li>
    <li>Atelier B.<span class="op">S = 100 / 0,70 = 143 kVA  ⟹  I = 143 000 / (√3 × 400) = 206 A</span></li>
    <li>Les pertes en ligne suivent le carré du courant.<span class="op">(206 / 152)² = 1,84</span></li>
   </ol>
   <div class="final">Même travail produit, 36 % de courant en plus et 84 % de pertes en plus. Sans compter le transformateur et les câbles à surdimensionner.</div></div>
  <p>Le gestionnaire de réseau facture donc le réactif au-delà d'un seuil contractuel — historiquement une tan φ de référence de 0,4, soit cos φ ≈ 0,93, pendant les heures pleines d'hiver. Le seuil exact dépend du tarif d'acheminement en vigueur : c'est le contrat qu'il faut lire, pas une valeur apprise par cœur.</p>
  <div class="encart e-piege"><span class="chapo">Facteur de puissance ≠ cos φ</span><p>En présence d'harmoniques, les deux diffèrent. Le <strong>facteur de puissance</strong> vaut P/S toutes fréquences confondues ; le <strong>cos φ</strong> ne concerne que le fondamental. Un variateur peut afficher cos φ = 0,98 et un facteur de puissance réel de 0,7 : compenser avec des condensateurs n'y changerait rien, et aggraverait même la situation.</p></div>`},
 {k:"l",t:"Compenser : le calcul complet",h:`
  <p>Compenser, c'est produire le réactif sur place au lieu de le faire venir du réseau. Le condensateur fournit ce que le moteur consomme.</p>
  <div class="formule">Q<sub>c</sub> = P · (tan φ₁ − tan φ₂)<span class="note">φ₁ : avant compensation — φ₂ : objectif visé</span></div>
  <p>Puis on convertit ces vars en microfarads. Et là, le couplage change tout :</p>
  <div class="formule">étoile :   C = Q<sub>c</sub> / (U² · ω)
triangle : C = Q<sub>c</sub> / (3 · U² · ω)<span class="note">U : tension composée — ω = 2πf. Le triangle demande trois fois moins de capacité.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — de bout en bout</span>
   <p>150 kW à cos φ 0,75, à remonter à 0,95, en 400 V / 50 Hz, couplage triangle.</p>
   <ol>
    <li>Les deux tangentes.<span class="op">tan(arccos 0,75) = 0,882    tan(arccos 0,95) = 0,329</span></li>
    <li>Réactif à fournir.<span class="op">Qc = 150 × (0,882 − 0,329) = 150 × 0,553 = 83 kvar</span></li>
    <li>Capacité par phase en triangle.<span class="op">C = 83 000 / (3 × 400² × 314) = 83 000 / 150 720 000</span></li>
    <li>Résultat.<span class="op">C = 5,5 × 10⁻⁴ F = 550 µF par phase</span></li>
   </ol>
   <div class="final">83 kvar, soit 550 µF par phase en triangle — contre 1650 µF si on couplait en étoile.</div></div>
  <div class="encart e-terrain"><span class="chapo">Trois règles de mise en œuvre</span>
   <p><strong>Jamais en aval d'un variateur</strong> ou d'un démarreur électronique : les condensateurs voient le découpage et se détruisent.</p>
   <p><strong>Jamais de surcompensation</strong> : l'installation bascule en capacitif, la tension monte à vide, et le distributeur facture aussi.</p>
   <p><strong>Batterie anti-harmonique</strong> (selfs de désaccordage, ~189 Hz) dès que les charges non linéaires dépassent environ 20 % de S, sinon résonance et destruction.</p></div>`},
 {k:"s",t:"Banc d'essai — compensation",sim:"puissances",h:`<p>Le banc fait le calcul complet et trace le triangle avant/après. Compare les courants de ligne : c'est là que se voit le gain réel.</p>`},
 {k:"a",t:"Atelier — puissances",gen:["triangle-pqs","puis-mono","compensation","capacite-comp"],but:4,h:`<p>Le calcul de compensation tombe à presque tous les examens. Ici tu peux le refaire autant de fois qu'il faut, avec des chiffres différents à chaque tirage.</p>`},
 {k:"c",t:"Contrôle",gen:["triangle-pqs","puis-mono","compensation","capacite-comp","trigo-angle"],n:9}
]},

{id:"m14",num:"14",bloc:"Régime alternatif",titre:"Le triphasé",duree:"34 min",
 resume:"Trois tensions à 120°, le champ tournant, les couplages, et le rôle du neutre.",
 steps:[
 {k:"l",t:"Pourquoi trois phases",h:`
  <p>Trois tensions de même valeur, décalées d'un tiers de tour. De ce simple décalage découlent trois propriétés qui ont façonné tout le réseau mondial.</p>
  <figure data-anim="champ-tournant"></figure>
  <ul>
   <li><strong>Un champ tournant apparaît sans aucune pièce mobile.</strong> Trois bobines fixes, trois courants décalés : le champ résultant tourne. C'est le moteur asynchrone, et c'est ce que montre la figure ci-dessus.</li>
   <li><strong>La puissance instantanée est constante</strong>, alors qu'en monophasé elle pulse à 100 Hz. Un moteur triphasé ne vibre pas au rythme du réseau.</li>
   <li><strong>La somme des trois courants est nulle</strong> en régime équilibré : le neutre ne transporte rien et peut être réduit.</li>
  </ul>
  <div class="formule">v₁ = V√2·sin(ωt)     v₂ = V√2·sin(ωt − 120°)     v₃ = V√2·sin(ωt + 120°)</div>`},
 {k:"l",t:"V et U : les deux tensions",h:`
  <div class="tabl"><table>
   <tr><th>Nom</th><th>Entre quoi</th><th>Symbole</th><th>En France</th></tr>
   <tr><td>Tension simple</td><td>une phase et le neutre</td><td class="mono">V</td><td class="mono">230 V</td></tr>
   <tr><td>Tension composée</td><td>deux phases</td><td class="mono">U</td><td class="mono">400 V</td></tr>
  </table></div>
  <div class="formule">U = √3 · V<span class="note">400 = 1,732 × 230. Ce n'est pas le double : c'est une différence VECTORIELLE de deux tensions à 120°.</span></div>
  <h3>Les deux couplages</h3>
  <figure data-anim="couplage"></figure>
  <div class="tabl"><table>
   <tr><th>Couplage</th><th>Tension vue par l'enroulement</th><th>Courant de ligne</th></tr>
   <tr><td>Étoile (Y)</td><td class="mono">V = U / √3</td><td class="mono">= courant d'enroulement</td></tr>
   <tr><td>Triangle (Δ)</td><td class="mono">U (pleine tension composée)</td><td class="mono">= √3 × courant d'enroulement</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">La règle qui décide du couplage d'un moteur</span>
   <p>La plaque indique par exemple <strong>230 V / 400 V</strong>. Le PREMIER nombre est la tension que doit voir <strong>un enroulement</strong>.</p>
   <p>Sur un réseau 400 V : l'enroulement doit voir 230 V, donc <strong>étoile</strong>.<br>Sur un réseau 230 V : il doit voir 230 V directement, donc <strong>triangle</strong>.</p>
   <p>Coupler en triangle sur 400 V, c'est appliquer √3 fois trop de tension. Le moteur brûle en quelques secondes.</p></div>`},
 {k:"l",t:"Les puissances en triphasé",h:`
  <div class="formule">P = √3 · U · I · cos φ
Q = √3 · U · I · sin φ
S = √3 · U · I<span class="note">U : tension COMPOSÉE — I : courant de LIGNE. Valable quel que soit le couplage.</span></div>
  <p>La forme la plus utilisée du métier est la forme inverse, celle qui sert à dimensionner :</p>
  <div class="formule">I = P / (√3 · U · cos φ · η)<span class="note">η : rendement, si P est la puissance utile sur l'arbre.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — dimensionner un départ moteur</span>
   <p>Moteur 15 kW utiles, 400 V, cos φ 0,85, rendement 0,90.</p>
   <ol>
    <li>Puissance réellement absorbée au réseau.<span class="op">P absorbée = 15 / 0,90 = 16,67 kW</span></li>
    <li>Courant de ligne.<span class="op">I = 16 670 / (1,732 × 400 × 0,85) = 16 670 / 588,9</span></li>
    <li>Résultat.<span class="op">I = 28,3 A</span></li>
   </ol>
   <div class="final">28,3 A. Repère de tête : en 400 V, un moteur consomme environ 2 A par kW — un 15 kW, environ 30 A. Ça permet de vérifier n'importe quel calcul.</div></div>
  <div class="encart e-piege"><span class="chapo">Le √3 oublié</span><p>Sans lui, ce moteur donnerait 16,3 A au lieu de 28,3 A : on choisirait un câble et une protection deux tailles trop petits. C'est l'erreur la plus coûteuse du métier.</p></div>`},
 {k:"l",t:"Déséquilibre, neutre et rang 3",h:`
  <figure data-anim="triphase-somme"></figure>
  <p>Déplace les trois curseurs. Tant que les courants sont égaux, la somme reste plate : le neutre ne transporte rien. Dès qu'ils diffèrent, un courant apparaît.</p>
  <div class="encart e-piege"><span class="chapo">Danger — la coupure du neutre</span><p>Sur une distribution étoile déséquilibrée, si le neutre se coupe, le point neutre dérive et les phases les moins chargées voient leur tension monter vers 400 V. C'est le scénario qui grille tout un étage d'appareils. On ne coupe jamais le neutre seul, et on ne le sectionne pas sans couper les phases.</p></div>
  <div class="encart e-terrain"><span class="chapo">Les harmoniques de rang 3</span><p>Les charges monophasées non linéaires (LED, informatique, chargeurs) créent un harmonique à 150 Hz qui, dans les trois phases, est <strong>en phase avec lui-même</strong> : au lieu de s'annuler dans le neutre, il s'y <strong>additionne</strong>. Dans un immeuble de bureaux, on mesure couramment un courant de neutre supérieur au courant de phase. Un neutre chaud sans phase chaude est la signature du problème.</p></div>`},
 {k:"s",t:"Banc d'essai — réseau triphasé",sim:"triphase",h:`<p>Le banc calcule le courant de neutre par composition vectorielle et affiche le taux de déséquilibre.</p>`},
 {k:"a",t:"Atelier — triphasé",gen:["tri-uv","puis-tri","courant-moteur","couplage","neutre"],but:5,h:`<p>Cinq bonnes réponses d'affilée pour ce module : c'est le plus important du parcours, et le plus présent en examen.</p>`},
 {k:"c",t:"Contrôle du bloc alternatif",gen:["tri-uv","puis-tri","courant-moteur","couplage","triangle-pqs","compensation","impedance-rl","eff-max","neutre","capacite-comp"],n:10}
]},

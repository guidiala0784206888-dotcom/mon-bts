      c.strokeStyle=verifie?(ok?C2():C3()):C1();
      c.lineWidth=3;c.lineCap="round";
      c.beginPath();c.moveTo(X(a.x),Y(a.y));
      const mx=(X(a.x)+X(b.x))/2;
      c.bezierCurveTo(mx,Y(a.y),mx,Y(b.y),X(b.x),Y(b.y));c.stroke();
      if(sousTension&&ok){
        const f=(performance.now()/1400)%1;
        const t=f,u=1-t;
        const px=u*u*u*X(a.x)+3*u*u*t*mx+3*u*t*t*mx+t*t*t*X(b.x);
        const py=u*u*u*Y(a.y)+3*u*u*t*Y(a.y)+3*u*t*t*Y(b.y)+t*t*t*Y(b.y);
        c.fillStyle=C2();c.beginPath();c.arc(px,py,4,0,TAU);c.fill();
      }
    });
    /* les bornes */
    for(const id in ex.bornes){
      const b=ex.bornes[id],x=X(b.x),y=Y(b.y);
      const pris=liens.some(l=>l[0]===id||l[1]===id);
      c.fillStyle=id===sel?C1():pris?CS():CS();
      c.strokeStyle=id===sel?C1():pris?C1():CB();c.lineWidth=id===sel?3:2;
      c.beginPath();c.arc(x,y,6,0,TAU);c.fill();c.stroke();
      const d=8;
      const px=b.cote==="gauche"?x-d:b.cote==="droite"?x+d:x;
      const py=b.cote==="haut"?y-d-4:b.cote==="bas"?y+d+4:y-11;
      txt(c,b.lab,px,py,10.5,id===sel?C1():CM(),
        b.cote==="gauche"?"right":b.cote==="droite"?"left":"center",id===sel);
    }
    if(sel)txt(c,"clique une seconde borne pour poser le fil",w/2,h-8,11,C1(),"center",true);
  });

  const cv=zone.querySelector("canvas");
  cv.classList.add("manip");
  cv.addEventListener("pointerdown",e=>{
    const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    /* d'abord : cliquer un fil pour l'enlever */
    for(let i=0;i<liens.length;i++){
      const a=ex.bornes[liens[i][0]],b=ex.bornes[liens[i][1]];
      const cx=(a.x+b.x)/2*r.width,cy=(a.y+b.y)/2*r.height;
      if(Math.hypot(mx-cx,my-cy)<11){liens.splice(i,1);verifie=false;sousTension=false;maj();return;}
    }
    let best=null,d=1e9;
    for(const id in ex.bornes){const b=ex.bornes[id];
      const dd=Math.hypot(mx-b.x*r.width,my-b.y*r.height);
      if(dd<d){d=dd;best=id;}}
    if(d>18){sel=null;rendu();return;}
    if(!sel){sel=best;}
    else if(sel===best){sel=null;}
    else{
      const k=cle(sel,best);
      if(!liens.some(l=>cle(l[0],l[1])===k))liens.push([sel,best]);
      sel=null;verifie=false;sousTension=false;maj();return;
    }
    rendu();
  });

  const maj=()=>{
    $("#cab-compte").textContent=faits()+" / "+attendus.length+" liaisons";
    rendu();
  };
  const bouton=(cl,lab,fn)=>{const b=document.createElement("button");
    b.className="btn "+cl;b.textContent=lab;b.addEventListener("click",fn);outils.appendChild(b);return b;};

  const bv=bouton("btn-principal","Vérifier",()=>{
    verifie=true;
    const bons=faits(),faux=liens.length-bons,manque=attendus.length-bons;
    if(manque===0&&faux===0){
      msg.dataset.e="ok";
      msg.innerHTML="<b>Câblage correct.</b> "+ex.verdict+
        "<span class='cab-suite'>Mets sous tension pour voir le courant circuler.</span>";
      bt.disabled=false;if(mi>=0)marquer(mi,pi);
    }else{
      msg.dataset.e="ko";
      msg.innerHTML="<b>Pas encore.</b> "+
        (faux?"<span class='cab-rouge'>"+faux+" fil"+(faux>1?"s":"")+" en trop ou mal placé"+(faux>1?"s":"")+"</span> (en rouge). ":"")+
        (manque?manque+" liaison"+(manque>1?"s":"")+" manquante"+(manque>1?"s":"")+".":"")+
        "<span class='cab-suite'>Enlève un fil en cliquant dessus.</span>";
    }
    maj();
  });
  bouton("btn-secondaire btn-fin","Indice",()=>{
    msg.dataset.e="aide";
    msg.innerHTML="<b>Piste "+(indice+1)+" sur "+ex.ordre.length+"</b> "+ex.ordre[indice];
    indice=Math.min(ex.ordre.length-1,indice+1);
  });
  bouton("btn-secondaire btn-fin","Tout effacer",()=>{
    liens=[];sel=null;verifie=false;sousTension=false;msg.dataset.e="";msg.innerHTML="";
    bt.disabled=true;maj();});
  const bt=bouton("btn-positif","Mettre sous tension",()=>{
    sousTension=!sousTension;bt.textContent=sousTension?"Couper":"Mettre sous tension";});
  bt.disabled=true;
  anims.push({t:0,jouer:true,rendu:()=>{if(sousTension)rendu();}});
  maj();
}

/* ---- Les défis du simulateur : monter un circuit et atteindre une cible ---- */
const DEFIS={
 "ohm":{t:"Ton premier circuit",
  c:"Monte une source continue de 12 V et une résistance de 100 Ω, relie-les, et fais circuler le courant.",
  ind:["Pose la source, pose la résistance, puis passe en mode Fil et relie les deux bornes du haut, puis celles du bas.",
       "Un circuit doit être FERMÉ : deux fils, pas un seul."],
  ok:(r,ci)=>{const R=ci.comps.find(p=>p.type==="r");
    return R&&r.res[R.id]&&Math.abs(r.res[R.id].I-0.12)<0.01;},
  reussi:"12 V sur 100 Ω donnent 0,12 A. Change la résistance et regarde le courant suivre — c'est la loi d'Ohm, en direct."},
 "serie":{t:"Deux résistances en série",
  c:"Monte deux résistances de 100 Ω en série sous 12 V. Le courant doit tomber à 0,06 A.",
  ind:["En série, le courant traverse les deux l'une après l'autre : une seule boucle.",
       "Relie la sortie de la première à l'entrée de la seconde, puis boucle sur la source."],
  ok:(r,ci)=>{const R=ci.comps.filter(p=>p.type==="r");
    return R.length>=2&&R.every(p=>r.res[p.id]&&Math.abs(r.res[p.id].I-0.06)<0.008);},
  reussi:"Le courant est COMMUN aux deux, et la tension s'est partagée : 6 V chacune. C'est la définition du montage série."},
 "parallele":{t:"Deux résistances en parallèle",
  c:"Monte deux résistances de 100 Ω en parallèle sous 12 V. Chacune doit voir 12 V, et la source débiter 0,24 A.",
  ind:["En parallèle, les deux entrées sont reliées ensemble, et les deux sorties aussi.",
       "La tension est COMMUNE, ce sont les courants qui s'ajoutent."],
  ok:(r,ci)=>{const R=ci.comps.filter(p=>p.type==="r"),S=ci.comps.find(p=>p.type==="srcdc");
    return R.length>=2&&S&&Math.abs(r.res[S.id].I-0.24)<0.02&&R.every(p=>Math.abs(r.res[p.id].U-12)<0.5);},
  reussi:"Deux fois 0,12 A qui s'ajoutent : 0,24 A. Et l'ensemble se comporte comme une seule résistance de 50 Ω — plus petite que chacune."},
 "rl":{t:"Le déphasage, mesuré",
  c:"En alternatif 230 V / 50 Hz, monte une résistance de 30 Ω en série avec une bobine de 100 mH. Relève le courant.",
  ind:["Utilise la source ALTERNATIVE, pas la continue.",
       "L'impédance n'est pas 30 + 31,4 mais √(30² + 31,4²) ≈ 43,4 Ω."],
  ok:(r,ci)=>{const R=ci.comps.find(p=>p.type==="r"),L=ci.comps.find(p=>p.type==="l");
    return R&&L&&r.res[R.id]&&Math.abs(r.res[R.id].I-5.3)<0.4;},
  reussi:"5,3 A, et non 230/61,4 = 3,7 A. Regarde le déphasage φ affiché : la bobine met le courant en retard."},
 "diviseur":{t:"Mesurer sans perturber",
  c:"Monte 1 kΩ et 3 kΩ en série sous 12 V, puis place un voltmètre aux bornes de la 3 kΩ. Il doit lire 9 V.",
  ind:["Le voltmètre se branche EN PARALLÈLE, aux deux bornes du composant à mesurer.",
       "9 V, c'est 12 × 3000/(1000+3000) : le pont diviseur du module 08."],
  ok:(r,ci)=>{const V=ci.comps.find(p=>p.type==="volt");
    return V&&r.res[V.id]&&Math.abs(r.res[V.id].U-9)<0.4;},
  reussi:"Le voltmètre a une résistance énorme : il mesure sans se servir. Un ampèremètre, lui, se met EN SÉRIE — le brancher en parallèle serait un court-circuit."}
};

/* ---- Le banc de simulation ---- */
function rendreSimu(hote,mi,pi,pas){
  const defi=pas.defi?DEFIS[pas.defi]:null;
  const ci={comps:[],fils:[]};
  const COL=17,LIG=9;
  let seq=0,mode="curseur",aPoser=null,sel=null,filDe=null,res=null,marche=true,indice=0,gagne=false;

  const box=document.createElement("div");box.className="verre simu";hote.appendChild(box);
  box.innerHTML='<div class="cab-tete"><span class="t">'+(defi?defi.t:"Banc de simulation")+'</span>'+
    '<span class="cab-compte" id="simu-etat">circuit vide</span></div>'+
    '<p class="cab-consigne">'+(defi?defi.c:
      "Pose des composants, relie-les : le circuit est résolu en direct — tensions, courants, puissances, déphasages.")+"</p>";
  const pal=document.createElement("div");pal.className="simu-palette";box.appendChild(pal);
  const zone=document.createElement("div");zone.className="cab-zone";box.appendChild(zone);
  const reglage=document.createElement("div");reglage.className="simu-reglage";box.appendChild(reglage);
  const tabl=document.createElement("div");tabl.className="simu-mesures";box.appendChild(tabl);
  const outils=document.createElement("div");outils.className="outils cab-outils";box.appendChild(outils);
  const msg=document.createElement("div");msg.className="cab-msg";box.appendChild(msg);

  /* ---------- palette ---------- */
  const boutons=[];
  const btnPal=(k,lab)=>{const b=document.createElement("button");b.className="simu-piece";b.dataset.k=k;
    b.textContent=lab;pal.appendChild(b);boutons.push(b);
    b.addEventListener("click",()=>{
      if(k==="fil"){mode=mode==="fil"?"curseur":"fil";aPoser=null;filDe=null;}
      else if(k==="poubelle"){
        if(sel){const bs=bornesDe(sel);
          ci.fils=ci.fils.filter(f=>!f.some(e=>bs.some(b2=>b2[0]===e[0]&&b2[1]===e[1])));
          ci.comps=ci.comps.filter(p=>p!==sel);sel=null;calcul();}
        mode="curseur";}
      else if(k==="rotation"){if(sel){const bs=bornesDe(sel);
          ci.fils=ci.fils.filter(f=>!f.some(e=>bs.some(b2=>b2[0]===e[0]&&b2[1]===e[1])));
          sel.rot=(sel.rot+1)%2;calcul();}}
      else{mode="poser";aPoser=k;filDe=null;}
      majPal();majReglage();rendu();});};
  for(const k in PIECES)btnPal(k,PIECES[k].n);
  btnPal("fil","↔ Fil");btnPal("rotation","⟳ Pivoter");btnPal("poubelle","✕ Supprimer");
  const majPal=()=>boutons.forEach(b=>b.setAttribute("aria-pressed",
    ((mode==="poser"&&b.dataset.k===aPoser)||(mode==="fil"&&b.dataset.k==="fil"))?"true":"false"));

  /* ---------- calcul + affichages ---------- */
  function calcul(){
    res=ci.comps.length?simuler(ci):null;
    const e=$("#simu-etat");
    if(e)e.textContent=!ci.comps.length?"circuit vide"
      :(res&&res.ok?ci.comps.length+" composants · "+(res.ac?nb(res.f,0)+" Hz":"continu"):"circuit incomplet");
    majMesures();majReglage();verifDefi();rendu();
  }
  function majMesures(){
    if(!res||!res.ok||!ci.comps.length){tabl.innerHTML="";return;}
    tabl.innerHTML='<div class="tabl"><table class="carnet"><tr><th>Composant</th><th>U</th><th>I</th><th>P</th>'+
      (res.ac?"<th>φ</th>":"")+"</tr>"+
      ci.comps.map(p=>{const r=res.res[p.id];if(!r)return"";
        return "<tr><td class='libre'>"+PIECES[p.type].n+"</td>"+
         "<td class='n'>"+nb(r.U,2)+" V</td><td class='n'>"+nb(r.I,3)+" A</td>"+
         "<td class='n'>"+nb(Math.abs(r.P),2)+" W</td>"+
         (res.ac?"<td class='n'>"+nb(((r.phi+540)%360)-180,1)+"°</td>":"")+"</tr>";}).join("")+
      "</table></div>";
  }
  function majReglage(){
    reglage.innerHTML="";
    if(!sel){reglage.innerHTML='<p class="simu-vide">Clique un composant pour régler sa valeur.</p>';return;}
    const P=PIECES[sel.type];
    const t=document.createElement("div");t.className="regl";
    t.innerHTML='<label><span class="lg">Composant<b>'+P.n+"</b></span></label>"+
      P.par.map(g=>g.choix
        ? '<label><span class="lg">'+g.lib+'<b>&nbsp;</b></span><div class="segm" data-k="'+g.k+'">'+
          g.choix.map((o,i)=>'<button type="button" data-v="'+i+'" aria-pressed="'+(i===sel.par[g.k])+'">'+o+"</button>").join("")+"</div></label>"
        : curs("sp-"+g.k,g.lib,g.min,g.max,g.pas,sel.par[g.k],g.u||"")).join("");
    reglage.appendChild(t);
    t.querySelectorAll("input[type=range]").forEach(i=>i.addEventListener("input",()=>{
      const k=i.id.slice(3);sel.par[k]=+i.value;
      const v=$("#v-"+i.id);if(v)v.textContent=String(i.value).replace(".",",");calcul();}));
    t.querySelectorAll(".segm").forEach(sg=>sg.addEventListener("click",ev=>{
      const b=ev.target.closest("button");if(!b)return;
      sg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
      sel.par[sg.dataset.k]=+b.dataset.v;calcul();}));
  }
  function verifDefi(){
    if(!defi||gagne||!res||!res.ok)return;
    let bon=false;try{bon=defi.ok(res,ci);}catch(e){}
    if(bon){gagne=true;msg.dataset.e="ok";
      msg.innerHTML="<b>C'est ça.</b> "+defi.reussi;
      if(mi>=0)marquer(mi,pi);}
  }

  /* ---------- dessin ---------- */
  const rendu=toile(zone,COL/LIG*0.95,(c,w,h)=>{
    const px=w/COL,py=h/LIG,X=i=>(i+0.5)*px,Y=j=>(j+0.5)*py;
    c.fillStyle=CB();
    for(let i=0;i<COL;i++)for(let j=0;j<LIG;j++){c.beginPath();c.arc(X(i),Y(j),1.1,0,TAU);c.fill();}
    ci.fils.forEach(f=>{c.strokeStyle=CM();c.lineWidth=2.4;c.lineCap="round";
      c.beginPath();c.moveTo(X(f[0][0]),Y(f[0][1]));c.lineTo(X(f[1][0]),Y(f[1][1]));c.stroke();});
    ci.comps.forEach(p=>{
      const bs=bornesDe(p),x=X(p.x),y=Y(p.y),L=Math.min(px,py)*0.95;
      const r=res&&res.ok&&res.res[p.id];
      const actif=marche&&r&&r.I>1e-5;
      c.save();c.translate(x,y);if(p.rot%2)c.rotate(Math.PI/2);
      c.strokeStyle=p===sel?C1():actif?C2():CI();c.lineWidth=p===sel?2.8:2;
      c.beginPath();c.moveTo(-px,0);c.lineTo(-L*0.5,0);c.moveTo(L*0.5,0);c.lineTo(px,0);c.stroke();
      const S=PIECES[p.type].sym;
      if(S==="r"||S==="lampe"){
        if(S==="lampe"&&r){const e=Math.min(1,Math.abs(r.P)/40);
          c.fillStyle=C2();c.globalAlpha=.10+.65*e;c.beginPath();c.arc(0,0,L*0.45,0,TAU);c.fill();c.globalAlpha=1;}
        if(S==="lampe"){c.beginPath();c.arc(0,0,L*0.4,0,TAU);c.stroke();
          c.beginPath();c.moveTo(-L*0.28,-L*0.28);c.lineTo(L*0.28,L*0.28);
          c.moveTo(L*0.28,-L*0.28);c.lineTo(-L*0.28,L*0.28);c.stroke();}
        else{c.beginPath();c.rect(-L*0.5,-L*0.26,L,L*0.52);c.stroke();}}
      else if(S==="pile"){c.beginPath();c.moveTo(-L*0.18,-L*0.42);c.lineTo(-L*0.18,L*0.42);
        c.moveTo(L*0.06,-L*0.2);c.lineTo(L*0.06,L*0.2);c.stroke();
        c.lineWidth=3.2;c.beginPath();c.moveTo(-L*0.18,-L*0.42);c.lineTo(-L*0.18,L*0.42);c.stroke();}
      else if(S==="ac"){c.beginPath();c.arc(0,0,L*0.42,0,TAU);c.stroke();
        c.beginPath();for(let i=-12;i<=12;i++){const t=i/12,xx=t*L*0.28,yy=-Math.sin(t*Math.PI)*L*0.18;
          i===-12?c.moveTo(xx,yy):c.lineTo(xx,yy);}c.stroke();}
      else if(S==="l"){c.beginPath();for(let i=0;i<3;i++)c.arc(-L*0.32+i*L*0.32,0,L*0.16,Math.PI,0);c.stroke();}
      else if(S==="c"){c.beginPath();c.moveTo(-L*0.1,-L*0.38);c.lineTo(-L*0.1,L*0.38);
        c.moveTo(L*0.1,-L*0.38);c.lineTo(L*0.1,L*0.38);c.stroke();}
      else if(S==="sw"){c.fillStyle=c.strokeStyle;
        c.beginPath();c.arc(-L*0.4,0,2.8,0,TAU);c.fill();c.beginPath();c.arc(L*0.4,0,2.8,0,TAU);c.fill();
        c.beginPath();c.moveTo(-L*0.4,0);c.lineTo(L*0.4,p.par.on?0:-L*0.4);c.stroke();}
      else if(S==="amp"||S==="volt"){c.beginPath();c.arc(0,0,L*0.42,0,TAU);c.stroke();
        c.save();if(p.rot%2)c.rotate(-Math.PI/2);
        c.font='700 14px Rubik, sans-serif';c.textAlign="center";c.textBaseline="middle";
        c.fillStyle=p===sel?C1():CI();c.fillText(S==="amp"?"A":"V",0,0);c.restore();}
      c.restore();
      /* les étiquettes se placent sur le côté quand la pièce est verticale,
         sinon elles chevauchent les fils qui montent et descendent */
      const vert=p.rot%2===1;
      if(r){const t=p.type==="volt"?nb(r.U,1)+" V":p.type==="amp"?nb(r.I,2)+" A"
          :nb(r.U,1)+" V · "+nb(r.I,2)+" A";
        if(vert)txt(c,t,x+px*0.62,y+py*0.16,10,actif?C2():CM(),"left",true);
        else txt(c,t,x,y+py*0.68,10,actif?C2():CM(),"center",true);}
      const g=PIECES[p.type].par[0];
      if(g&&!g.choix){const v=nb(p.par[g.k],g.pas<1?1:0)+" "+(g.u||"");
        if(vert)txt(c,v,x+px*0.62,y-py*0.16,10,CM(),"left");
        else txt(c,v,x,y-py*0.66,10,CM(),"center");}
      bs.forEach(bb=>{const pris=filDe&&filDe[0]===bb[0]&&filDe[1]===bb[1];
        c.fillStyle=pris?C1():CB();c.beginPath();c.arc(X(bb[0]),Y(bb[1]),pris?5.5:4,0,TAU);c.fill();});
    });
    if(marche&&res&&res.ok){
      const ph=performance.now()/900;
      ci.fils.forEach(f=>{
        const p1=ci.comps.find(p=>bornesDe(p).some(b=>b[0]===f[0][0]&&b[1]===f[0][1]));
        const r=p1&&res.res[p1.id];if(!r||r.I<1e-4)return;
        const t=(ph*Math.min(3,0.35+r.I*1.6))%1;
        c.fillStyle=C2();c.beginPath();
        c.arc(X(f[0][0])+(X(f[1][0])-X(f[0][0]))*t,Y(f[0][1])+(Y(f[1][1])-Y(f[0][1]))*t,3.4,0,TAU);c.fill();});
    }
    const aide=mode==="poser"?"clique une case pour poser « "+PIECES[aPoser].n+" »"
      :mode==="fil"?(filDe?"clique la seconde borne":"clique une borne pour tirer un fil"):"";
    if(aide)txt(c,aide,w/2,h-9,11,C1(),"center",true);
  });

  /* ---------- gestes ---------- */
  const cv=zone.querySelector("canvas");cv.classList.add("manip");
  cv.addEventListener("pointerdown",e=>{
    const r=cv.getBoundingClientRect(),px=r.width/COL,py=r.height/LIG;
    const gx=Math.floor((e.clientX-r.left)/px),gy=Math.floor((e.clientY-r.top)/py);
    if(gx<0||gy<0||gx>=COL||gy>=LIG)return;
    if(mode==="poser"){
      if(gx<1||gx>COL-2){msg.dataset.e="aide";msg.innerHTML="<b>Trop près du bord.</b> Un composant occupe trois cases : pose-le plus au centre.";return;}
      const P=PIECES[aPoser],par={};P.par.forEach(g=>par[g.k]=g.val);
      const p={id:"p"+(++seq),type:aPoser,x:gx,y:gy,rot:0,par:par};
      ci.comps.push(p);sel=p;mode="curseur";aPoser=null;majPal();calcul();return;}
    if(mode==="fil"){
      let best=null,d=1e9;
      ci.comps.forEach(p=>bornesDe(p).forEach(b=>{
        const dd=Math.hypot((b[0]+0.5)*px-(e.clientX-r.left),(b[1]+0.5)*py-(e.clientY-r.top));
        if(dd<d){d=dd;best=b;}}));
      if(d>Math.min(px,py)*0.7){filDe=null;rendu();return;}
      if(!filDe){filDe=best;}
      else if(filDe[0]===best[0]&&filDe[1]===best[1]){filDe=null;}
      else{const k=[filDe,best];
        if(!ci.fils.some(f=>(f[0][0]===k[0][0]&&f[0][1]===k[0][1]&&f[1][0]===k[1][0]&&f[1][1]===k[1][1])||
                            (f[0][0]===k[1][0]&&f[0][1]===k[1][1]&&f[1][0]===k[0][0]&&f[1][1]===k[0][1])))
          ci.fils.push(k);
        filDe=null;calcul();return;}
      rendu();return;}
    /* mode curseur : sélectionner, ou retirer un fil */
    for(let i=0;i<ci.fils.length;i++){const f=ci.fils[i];
      const mx=(f[0][0]+f[1][0])/2+0.5,my=(f[0][1]+f[1][1])/2+0.5;
      if(Math.hypot(mx*px-(e.clientX-r.left),my*py-(e.clientY-r.top))<Math.min(px,py)*0.35){
        ci.fils.splice(i,1);calcul();return;}}
    const p=ci.comps.find(p=>p.x===gx&&p.y===gy);
    sel=p||null;majReglage();rendu();
  });

  /* ---------- boutons ---------- */
  const bt=(cl,lab,fn)=>{const b=document.createElement("button");b.className="btn "+cl;
    b.textContent=lab;b.addEventListener("click",fn);outils.appendChild(b);return b;};
  const bm=bt("btn-positif","Couper le courant",()=>{marche=!marche;
    bm.textContent=marche?"Couper le courant":"Remettre en marche";rendu();});
  if(defi)bt("btn-secondaire btn-fin","Indice",()=>{msg.dataset.e="aide";
    msg.innerHTML="<b>Piste "+(indice+1)+" sur "+defi.ind.length+"</b> "+defi.ind[indice];
    indice=Math.min(defi.ind.length-1,indice+1);});
  bt("btn-secondaire btn-fin","Tout effacer",()=>{ci.comps.length=0;ci.fils.length=0;
    sel=null;filDe=null;gagne=false;msg.dataset.e="";msg.innerHTML="";calcul();});
  if(mi>=0&&defi)bt("btn-secondaire btn-fin","Passer",()=>{marquer(mi,pi);avancer();});
  anims.push({t:0,jouer:true,rendu:()=>{if(marche&&res&&res.ok)rendu();}});
  majPal();calcul();
}

/* =========================================================================
   LA CHAÎNE FONCTIONNELLE
   Deux chaînes qui se répondent : l'information décide, l'énergie agit.
   Savoir ranger un composant dans la bonne case, c'est savoir lire une
   machine — et c'est la première question de tout dossier de 2ᵉ année.
   ========================================================================= */
const CHAINES={
 "portail":{t:"Un portail coulissant",
  c:"Range chaque élément dans sa fonction. Deux chaînes : celle qui informe, celle qui agit.",
  cases:[
   {k:"acq",ch:"info",lib:"ACQUÉRIR",aide:"ce qui renseigne l'automate sur l'état du système"},
   {k:"tra",ch:"info",lib:"TRAITER",aide:"ce qui décide"},
   {k:"com",ch:"info",lib:"COMMUNIQUER",aide:"ce qui informe l'utilisateur"},
   {k:"ali",ch:"ener",lib:"ALIMENTER",aide:"ce qui apporte et protège l'énergie"},
   {k:"dis",ch:"ener",lib:"DISTRIBUER",aide:"le préactionneur : il aiguille l'énergie"},
   {k:"con",ch:"ener",lib:"CONVERTIR",aide:"l'actionneur : il transforme l'énergie en mouvement"},
   {k:"tsm",ch:"ener",lib:"TRANSMETTRE",aide:"ce qui adapte le mouvement"},
   {k:"agi",ch:"ener",lib:"AGIR",aide:"l'effecteur : ce qui fait le travail attendu"}],
  pieces:[
   {n:"Cellule photoélectrique",k:"acq"},{n:"Fin de course portail ouvert",k:"acq"},
   {n:"Automate programmable",k:"tra"},{n:"Feu orange clignotant",k:"com"},
   {n:"Disjoncteur et alimentation 24 V",k:"ali"},{n:"Variateur de vitesse",k:"dis"},
   {n:"Moteur asynchrone",k:"con"},{n:"Réducteur et pignon",k:"tsm"},
   {n:"Vantail du portail",k:"agi"}]},
 "convoyeur":{t:"Un convoyeur de tri",
  c:"Même exercice sur une machine de production.",
  cases:[
   {k:"acq",ch:"info",lib:"ACQUÉRIR",aide:"ce qui renseigne l'automate"},
   {k:"tra",ch:"info",lib:"TRAITER",aide:"ce qui décide"},
   {k:"com",ch:"info",lib:"COMMUNIQUER",aide:"ce qui informe l'opérateur"},
   {k:"ali",ch:"ener",lib:"ALIMENTER",aide:"apporter et protéger l'énergie"},
   {k:"dis",ch:"ener",lib:"DISTRIBUER",aide:"le préactionneur"},
   {k:"con",ch:"ener",lib:"CONVERTIR",aide:"l'actionneur"},
   {k:"tsm",ch:"ener",lib:"TRANSMETTRE",aide:"adapter le mouvement"},
   {k:"agi",ch:"ener",lib:"AGIR",aide:"l'effecteur"}],
  pieces:[
   {n:"Détecteur inductif de présence",k:"acq"},{n:"Codeur incrémental",k:"acq"},
   {n:"Automate et son programme",k:"tra"},{n:"Pupitre tactile",k:"com"},
   {n:"Sectionneur porte-fusibles",k:"ali"},{n:"Distributeur pneumatique 5/2",k:"dis"},
   {n:"Vérin double effet",k:"con"},{n:"Guidage et tige",k:"tsm"},
   {n:"Poussoir d'éjection",k:"agi"}]}
};

function rendreChaine(hote,mi,pi,pas){
  const ex=CHAINES[pas.chaine];if(!ex)return;
  let place={},sel=null,verifie=false;
  const box=document.createElement("div");box.className="verre chaine";hote.appendChild(box);
  const dessine=()=>{
    const restant=ex.pieces.filter(p=>!Object.values(place).flat().includes(p.n));
    box.innerHTML='<div class="cab-tete"><span class="t">'+ex.t+'</span>'+
      '<span class="cab-compte">'+(ex.pieces.length-restant.length)+" / "+ex.pieces.length+" placés</span></div>"+
      '<p class="cab-consigne">'+ex.c+"</p>"+
      '<div class="ch-pieces">'+restant.map(p=>'<button type="button" class="ch-piece'+(sel===p.n?" sel":"")+'" data-n="'+p.n+'">'+p.n+"</button>").join("")+
      (restant.length?"":'<span class="ch-vide">Tout est placé — vérifie.</span>')+"</div>"+
      ["info","ener"].map(ch=>'<div class="ch-bloc"><span class="ch-titre">'+
        (ch==="info"?"Chaîne d'information — elle décide":"Chaîne d'énergie — elle agit")+"</span>"+
        '<div class="ch-cases">'+ex.cases.filter(c=>c.ch===ch).map(c=>{
          const dedans=place[c.k]||[];
          return '<div class="ch-case'+(verifie?(dedans.length&&dedans.every(n=>ex.pieces.find(p=>p.n===n).k===c.k)&&dedans.length===ex.pieces.filter(p=>p.k===c.k).length?" ok":" ko"):"")+
            '" data-k="'+c.k+'"><span class="ch-lib">'+c.lib+"</span>"+
            '<span class="ch-aide">'+c.aide+"</span>"+
            dedans.map(n=>'<button type="button" class="ch-mis'+
              (verifie?(ex.pieces.find(p=>p.n===n).k===c.k?" bon":" faux"):"")+'" data-r="'+n+'">'+n+"</button>").join("")+
            "</div>";}).join("")+"</div></div>").join("")+
      '<div class="outils cab-outils"></div><div class="cab-msg" data-e="'+(msgE||"")+'">'+(msgH||"")+"</div>";
    box.querySelectorAll(".ch-piece").forEach(b=>b.addEventListener("click",()=>{
      sel=sel===b.dataset.n?null:b.dataset.n;dessine();}));
    box.querySelectorAll(".ch-case").forEach(d=>d.addEventListener("click",e=>{
      if(e.target.closest(".ch-mis"))return;
      if(!sel)return;
      (place[d.dataset.k]=place[d.dataset.k]||[]).push(sel);sel=null;verifie=false;msgE="";msgH="";dessine();}));
    box.querySelectorAll(".ch-mis").forEach(b=>b.addEventListener("click",()=>{
      for(const k in place)place[k]=place[k].filter(n=>n!==b.dataset.r);
      verifie=false;msgE="";msgH="";dessine();}));
    const o=box.querySelector(".cab-outils");
    const bt=(cl,l,f)=>{const b=document.createElement("button");b.className="btn "+cl;b.textContent=l;
      b.addEventListener("click",f);o.appendChild(b);};
    bt("btn-principal","Vérifier",()=>{
      verifie=true;
      const faux=[],manque=[];
      ex.cases.forEach(c=>{
        const att=ex.pieces.filter(p=>p.k===c.k).map(p=>p.n).sort().join("|");
        const eff=(place[c.k]||[]).slice().sort().join("|");
        if(att!==eff){if((place[c.k]||[]).some(n=>ex.pieces.find(p=>p.n===n).k!==c.k))faux.push(c.lib);
          else manque.push(c.lib);}});
      if(!faux.length&&!manque.length){msgE="ok";
        msgH="<b>Chaîne complète.</b> Retiens l'ordre : la chaîne d'information ACQUIERT, TRAITE, COMMUNIQUE ; la chaîne d'énergie ALIMENTE, DISTRIBUE, CONVERTIT, TRANSMET, AGIT. Le préactionneur distribue, l'actionneur convertit — c'est la confusion la plus fréquente.";
        if(mi>=0)marquer(mi,pi);}
      else{msgE="ko";
        msgH="<b>Pas encore.</b> "+(faux.length?"Mal rangé dans : <span class='cab-rouge'>"+faux.join(", ")+"</span>. ":"")+
          (manque.length?"Incomplet dans : "+manque.join(", ")+".":"");}
      dessine();});
    bt("btn-secondaire btn-fin","Indice",()=>{msgE="aide";
      msgH="<b>Repère</b> Le <b>préactionneur</b> (contacteur, distributeur, variateur) DISTRIBUE l'énergie sur ordre de l'automate. L'<b>actionneur</b> (moteur, vérin) la CONVERTIT en mouvement. L'<b>effecteur</b> est la pièce qui touche le produit.";
      dessine();});
    bt("btn-secondaire btn-fin","Tout retirer",()=>{place={};sel=null;verifie=false;msgE="";msgH="";dessine();});
  };
  let msgE="",msgH="";
  dessine();
}

/* =========================================================================
   L'AUTOMATE QUI TOURNE
   Le GRAFCET n'est pas un dessin : c'est un programme. Ici il pilote une
   vraie machine, dont les capteurs de fin de course renvoient l'information
   à l'automate. La boucle est fermée — c'est exactement ce qu'on met en
   service en deuxième année.
   ========================================================================= */
const AUTOMATES={
 "percage":{
  t:"Poste de perçage",
  c:"Appuie sur Départ cycle. Le vérin de serrage sort, la broche descend, perce, remonte, puis le serrage se relâche. Chaque étape attend SON capteur.",
  etapes:[{lib:"Attente",act:[]},{lib:"Serrer la pièce",act:["A+"]},
    {lib:"Percer",act:["B+","broche"]},{lib:"Remonter",act:["B−","broche"]},
    {lib:"Desserrer",act:["A−"]}],
  trans:[
   {rec:"dcy · a0 · b0",f:e=>e.dcy&&e.a0&&e.b0,
    faux:["dcy seul","a1 · b1"],expl:"On ne démarre que si la machine est au repos : vérin rentré ET broche en haut. Sinon le cycle part sur une position inconnue."},
   {rec:"a1",f:e=>e.a1,faux:["a0","dcy"],
    expl:"On ne perce pas tant que la pièce n'est pas serrée : on attend le capteur de fin de course SORTIE du vérin A."},
   {rec:"b1",f:e=>e.b1,faux:["b0","a1"],
    expl:"La broche doit être arrivée en bas — perçage terminé — avant de remonter."},
   {rec:"b0",f:e=>e.b0,faux:["b1","a0"],
    expl:"On ne desserre qu'une fois la broche remontée. Desserrer avec l'outil dans la pièce casserait le foret."},
   {rec:"a0",f:e=>e.a0,faux:["a1","dcy"],
    expl:"Le cycle ne se referme que lorsque le vérin est complètement rentré : la machine est de nouveau au repos."}],
  init:{A:0,B:0}}
};

function rendreAutomate(hote,mi,pi,pas){
  const ex=AUTOMATES[pas.auto];if(!ex)return;
  const quiz=!!pas.quiz;
  let etape=0,A=0,B=0,dcy=false,marche=true,vitesse=1,choix=ex.trans.map(()=>quiz?-1:0),valide=!quiz;
  const box=document.createElement("div");box.className="verre automate";hote.appendChild(box);
  box.innerHTML='<div class="cab-tete"><span class="t">'+ex.t+'</span>'+
    '<span class="cab-compte" id="au-etat">étape 0</span></div>'+
    '<p class="cab-consigne">'+(quiz?"Complète d'abord les réceptivités : chaque transition attend le bon capteur. Le cycle ne tournera qu'une fois toutes justes.":ex.c)+"</p>";
  const zone=document.createElement("div");zone.className="cab-zone";box.appendChild(zone);
  const qz=document.createElement("div");qz.className="au-quiz";box.appendChild(qz);
  const outils=document.createElement("div");outils.className="outils cab-outils";box.appendChild(outils);
  const msg=document.createElement("div");msg.className="cab-msg";box.appendChild(msg);

  const capteurs=()=>({dcy:dcy,a0:A<=0.02,a1:A>=0.98,b0:B<=0.02,b1:B>=0.98});

  const rendu=toile(zone,1.85,(c,w,h)=>{
    const gx=w*0.22,y0=h*0.10,dy=(h*0.80)/ex.etapes.length;
    /* le GRAFCET */
    ex.etapes.forEach((e,i)=>{
      const y=y0+i*dy,on=i===etape,sz=Math.min(30,dy*0.42);
      c.strokeStyle=on?C1():CB();c.lineWidth=on?2.8:1.6;
      c.beginPath();c.rect(gx-sz/2,y-sz/2,sz,sz);c.stroke();
      if(i===0){c.beginPath();c.rect(gx-sz/2-4,y-sz/2-4,sz+8,sz+8);c.stroke();}
      mono(c,String(i),gx,y,12.5,on?C1():CM(),"center");
      if(on){c.fillStyle=C1();c.beginPath();c.arc(gx,y,5,0,TAU);c.fill();}
      c.strokeStyle=on?C1():CB();c.lineWidth=1.6;
      c.beginPath();c.moveTo(gx+sz/2,y);c.lineTo(gx+sz/2+18,y);c.stroke();
      c.beginPath();c.rect(gx+sz/2+18,y-12,w*0.19,24);c.stroke();
      txt(c,e.lib,gx+sz/2+26,y,11.5,on?CI():CM(),"left",on);
      if(e.act.length)txt(c,e.act.join(" · "),gx+sz/2+18+w*0.19+7,y,10.5,on?C2():CM(),"left");
      /* la transition vers la suivante */
      const t=ex.trans[i];if(!t)return;
      const my=y+dy/2, franchissable=on&&(!quiz||valide)&&t.f(capteurs());
      c.strokeStyle=CB();c.lineWidth=1.6;
      c.beginPath();c.moveTo(gx,y+sz/2);c.lineTo(gx,my+dy/2-sz/2>h?y+sz/2:y0+((i+1)%ex.etapes.length)*dy-sz/2);c.stroke();
      c.strokeStyle=franchissable?C2():CM();c.lineWidth=franchissable?3:2;
      c.beginPath();c.moveTo(gx-12,my);c.lineTo(gx+12,my);c.stroke();
      const lib=quiz&&choix[i]<0?"?":(quiz?[t.rec].concat(t.faux)[choix[i]]:t.rec);
      txt(c,lib,gx+17,my,11,franchissable?C2():CM(),"left",franchissable);
    });
    /* la boucle de retour */
    c.strokeStyle=CB();c.lineWidth=1.6;
    const yl=y0+(ex.etapes.length-1)*dy+16;
    c.beginPath();c.moveTo(gx,yl);c.lineTo(gx,yl+14);c.lineTo(gx-w*0.11,yl+14);
    c.lineTo(gx-w*0.11,y0);c.lineTo(gx-16,y0);c.stroke();

    /* la machine */
    const mx=w*0.72,my0=h*0.14,mw=w*0.24,mh=h*0.72;
    c.strokeStyle=CB();c.lineWidth=1.5;
    c.beginPath();c.roundRect(mx-mw/2,my0,mw,mh,10);c.stroke();
    txt(c,"la machine",mx,my0-10,11,CM(),"center",true);
    const solY=my0+mh*0.78;
    c.strokeStyle=CM();c.lineWidth=2.5;
    c.beginPath();c.moveTo(mx-mw*0.42,solY);c.lineTo(mx+mw*0.42,solY);c.stroke();
    /* la pièce */
    c.fillStyle=CB();c.beginPath();c.rect(mx-mw*0.16,solY-26,mw*0.32,26);c.fill();
    /* le mors de serrage, piloté par A */
    const morsX=mx-mw*0.42+A*(mw*0.24);
    c.fillStyle=C1();c.beginPath();c.rect(morsX,solY-30,mw*0.06,30);c.fill();
    txt(c,"vérin A",mx-mw*0.30,solY+16,10,C1(),"center");
    mono(c,A>=0.98?"a1":A<=0.02?"a0":"—",mx-mw*0.30,solY+30,11,A>=0.98||A<=0.02?C2():CM(),"center");
    /* la broche, pilotée par B */
    const brY=my0+mh*0.10+B*(mh*0.52);
    c.strokeStyle=CI();c.lineWidth=6;
    c.beginPath();c.moveTo(mx+mw*0.16,my0+mh*0.06);c.lineTo(mx+mw*0.16,brY);c.stroke();
    c.fillStyle=ex.etapes[etape].act.indexOf("broche")>=0?C2():CM();
    c.beginPath();c.moveTo(mx+mw*0.16-7,brY);c.lineTo(mx+mw*0.16+7,brY);c.lineTo(mx+mw*0.16,brY+16);c.closePath();c.fill();
    if(ex.etapes[etape].act.indexOf("broche")>=0){
      const a=performance.now()/60;
      c.strokeStyle=C2();c.lineWidth=1.6;
      for(let k=0;k<3;k++){c.beginPath();
        c.arc(mx+mw*0.16,brY+8,10,a+k*2.1,a+k*2.1+0.9);c.stroke();}}
    txt(c,"broche",mx+mw*0.16,solY+16,10,CI(),"center");
    mono(c,B>=0.98?"b1":B<=0.02?"b0":"—",mx+mw*0.16,solY+30,11,B>=0.98||B<=0.02?C2():CM(),"center");
  });

  /* le questionnaire des réceptivités */
  const majQuiz=()=>{
    if(!quiz){qz.innerHTML="";return;}
    qz.innerHTML=ex.trans.map((t,i)=>{
      const opts=[t.rec].concat(t.faux);
      const ordre=opts.map((o,k)=>[o,k]);
      return '<div class="au-tr"><span class="au-num">'+i+" → "+((i+1)%ex.etapes.length)+"</span>"+
        '<div class="au-opts" data-i="'+i+'">'+ordre.map(([o,k])=>
          '<button type="button" data-k="'+k+'" class="'+(choix[i]===k?(k===0?"bon":"faux"):"")+'">'+o+"</button>").join("")+
        "</div></div>";}).join("")+
      '<p class="au-aide">Une réceptivité est la condition à remplir pour franchir la transition. Ici, ce sont les capteurs de la machine.</p>';
    qz.querySelectorAll(".au-opts").forEach(d=>d.addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      const i=+d.dataset.i;choix[i]=+b.dataset.k;
      valide=choix.every(c=>c===0);
      if(valide){msg.dataset.e="ok";
        msg.innerHTML="<b>Toutes les réceptivités sont justes.</b> Le cycle peut tourner : appuie sur Départ cycle.";
        if(mi>=0)marquer(mi,pi);}
      else if(b.dataset.k!=="0"){msg.dataset.e="ko";
        msg.innerHTML="<b>Non.</b> "+ex.trans[i].expl;}
      majQuiz();rendu();}));
  };

  /* l'évolution du GRAFCET, deux fois par image */
  const pas2=()=>{
    if(!marche)return;
    const v=0.012*vitesse;
    const act=ex.etapes[etape].act;
    if(act.indexOf("A+")>=0)A=Math.min(1,A+v);
    if(act.indexOf("A−")>=0)A=Math.max(0,A-v);
    if(act.indexOf("B+")>=0)B=Math.min(1,B+v*0.8);
    if(act.indexOf("B−")>=0)B=Math.max(0,B-v*1.4);
    if(valide){
      const t=ex.trans[etape];
      if(t&&t.f(capteurs())){etape=(etape+1)%ex.etapes.length;dcy=false;
        const e=$("#au-etat");if(e)e.textContent="étape "+etape+" · "+ex.etapes[etape].lib;}
    }
  };
  anims.push({t:0,jouer:true,rendu:()=>{pas2();rendu();}});

  const bt=(cl,l,f)=>{const b=document.createElement("button");b.className="btn "+cl;b.textContent=l;
    b.addEventListener("click",f);outils.appendChild(b);return b;};
  bt("btn-principal","Départ cycle",()=>{dcy=true;setTimeout(()=>{dcy=false;},900);});
  const bm=bt("btn-secondaire btn-fin","Pause",()=>{marche=!marche;bm.textContent=marche?"Pause":"Reprendre";});
  bt("btn-secondaire btn-fin","Ralentir",()=>{vitesse=vitesse>0.5?0.4:1;});
  bt("btn-secondaire btn-fin","Remettre au repos",()=>{etape=0;A=0;B=0;dcy=false;});
  majQuiz();
}

/* =========================================================================
   GRAFCET → LADDER
   Traduire un GRAFCET en langage à contacts n'est pas une recette à
   apprendre : c'est l'auto-maintien du module 23, appliqué une fois par
   étape. Activation par l'amont, maintien par soi-même, désactivation par
   l'aval. Ici les deux langages tournent EN MÊME TEMPS sur la même machine.
   ========================================================================= */
function barreaux(a){
  const n=a.etapes.length,r=[];
  for(let i=0;i<n;i++){
    const av=(i+n-1)%n, ap=(i+1)%n;
    r.push({bobine:"X"+i,
      act:[["X"+av,0]].concat(a.trans[av].rec.split("·").map(s=>[s.trim(),0])),
      maintien:"X"+i, stop:"X"+ap, init:i===0});
  }
  const sorties={};
  a.etapes.forEach((e,i)=>e.act.forEach(s=>{(sorties[s]=sorties[s]||[]).push("X"+i);}));
  const so=Object.keys(sorties).map(s=>({bobine:s,ou:sorties[s]}));
  return {etapes:r,sorties:so};
}

function rendreLadder(hote,mi,pi,pas){
  const a=AUTOMATES[pas.auto];if(!a)return;
  const B=barreaux(a),quiz=!!pas.quiz;
  let etape=0,A=0,Bp=0,dcy=false,marche=true,choix=B.etapes.map(()=>quiz?-1:0),valide=!quiz;
  const box=document.createElement("div");box.className="verre automate";hote.appendChild(box);
  box.innerHTML='<div class="cab-tete"><span class="t">Le même cycle, en langage à contacts</span>'+
    '<span class="cab-compte" id="ld-etat">étape 0</span></div>'+
    '<p class="cab-consigne">'+(quiz
      ?"Pour chaque étape, choisis la condition qui l'ACTIVE. La règle est toujours la même : l'étape amont ET la réceptivité qui la suit."
      :"À gauche les étapes, à droite les sorties. Un barreau vert est passant. Appuie sur Départ cycle et regarde les bits d'étape se transmettre le relais.")+"</p>";
  const zone=document.createElement("div");zone.className="cab-zone";box.appendChild(zone);
  const qz=document.createElement("div");qz.className="au-quiz";box.appendChild(qz);
  const outils=document.createElement("div");outils.className="outils cab-outils";box.appendChild(outils);
  const msg=document.createElement("div");msg.className="cab-msg";box.appendChild(msg);

  const cap=()=>({dcy:dcy,a0:A<=0.02,a1:A>=0.98,b0:Bp<=0.02,b1:Bp>=0.98});
  const bitX=i=>i===etape;
  const etatContact=(nom)=>{
    if(nom.charAt(0)==="X")return bitX(+nom.slice(1));
    const c=cap();return !!c[nom];
  };

  const rendu=toile(zone,1.42,(c,w,h)=>{
    const col=[w*0.03,w*0.53],larg=w*0.44;
    const dessineBarreau=(x,y,ha,r,i,type)=>{
      const xa=x+8,xb=x+larg-8;
      c.strokeStyle=CB();c.lineWidth=2;
      c.beginPath();c.moveTo(xa,y-ha/2);c.lineTo(xa,y+ha/2);c.moveTo(xb,y-ha/2);c.lineTo(xb,y+ha/2);c.stroke();
      const contacts=type==="e"?r.act:r.ou.map(o=>[o,0]);
      const nStop=type==="e"?1:0;
      const zoneC=(xb-xa)*0.60, x0=xa+14;
      const pas1=zoneC/Math.max(contacts.length,1);
      /* la ligne principale */
      let passant=true;
      c.lineWidth=2.4;
      contacts.forEach((ct,k)=>{
        const cx=x0+k*pas1+pas1/2, on=etatContact(ct[0]);
        if(type==="e")passant=passant&&on;
        c.strokeStyle=(type==="e"?(passant?C2():CM()):(on?C2():CM()));
        c.beginPath();c.moveTo(cx-pas1/2+2,y);c.lineTo(cx-7,y);c.moveTo(cx+7,y);c.lineTo(cx+pas1/2-2,y);c.stroke();
        c.strokeStyle=on?C2():CI();
        c.beginPath();c.moveTo(cx-7,y-7);c.lineTo(cx-7,y+7);c.moveTo(cx+7,y-7);c.lineTo(cx+7,y+7);c.stroke();
        txt(c,ct[0],cx,y-15,10,on?C2():CM(),"center",on);
      });
      c.strokeStyle=CM();c.lineWidth=2.4;
      c.beginPath();c.moveTo(xa,y);c.lineTo(x0,y);c.stroke();
      let sortieOn;
      if(type==="e"){
        /* branche d'auto-maintien */
        const yb=y+ha*0.32, actif=bitX(i);
        c.strokeStyle=actif?C2():CM();
        c.beginPath();c.moveTo(x0,y);c.lineTo(x0,yb);c.lineTo(x0+zoneC*0.35-7,yb);
        c.moveTo(x0+zoneC*0.35+7,yb);c.lineTo(x0+zoneC,yb);c.lineTo(x0+zoneC,y);c.stroke();
        c.strokeStyle=actif?C2():CI();
        c.beginPath();c.moveTo(x0+zoneC*0.35-7,yb-7);c.lineTo(x0+zoneC*0.35-7,yb+7);
        c.moveTo(x0+zoneC*0.35+7,yb-7);c.lineTo(x0+zoneC*0.35+7,yb+7);c.stroke();
        txt(c,r.maintien,x0+zoneC*0.35,yb+16,9.5,actif?C2():CM(),"center");
        /* contact d'arrêt, à ouverture */
        const sx=x0+zoneC+30, stopOn=etatContact(r.stop);
        const amont=passant||actif;
        c.strokeStyle=amont&&!stopOn?C2():CM();c.lineWidth=2.4;
        c.beginPath();c.moveTo(x0+zoneC,y);c.lineTo(sx-7,y);c.stroke();
        c.strokeStyle=stopOn?C3():CI();
        c.beginPath();c.moveTo(sx-7,y-7);c.lineTo(sx-7,y+7);c.moveTo(sx+7,y-7);c.lineTo(sx+7,y+7);
        c.moveTo(sx-9,y+8);c.lineTo(sx+9,y-8);c.stroke();
        txt(c,r.stop,sx,y-15,10,stopOn?C3():CM(),"center");
        sortieOn=amont&&!stopOn;
        c.strokeStyle=sortieOn?C2():CM();c.lineWidth=2.4;
        c.beginPath();c.moveTo(sx+7,y);c.lineTo(xb-24,y);c.stroke();
      }else{
        sortieOn=contacts.some(ct=>etatContact(ct[0]));
        c.strokeStyle=sortieOn?C2():CM();c.lineWidth=2.4;
        c.beginPath();c.moveTo(x0+contacts.length*pas1,y);c.lineTo(xb-24,y);c.stroke();
      }
      /* la bobine */
      c.strokeStyle=sortieOn?C2():CI();c.lineWidth=2.4;
      c.beginPath();c.arc(xb-16,y,9,Math.PI*0.55,Math.PI*1.45);c.stroke();
      c.beginPath();c.arc(xb-16,y,9,Math.PI*1.55,Math.PI*0.45);c.stroke();
      txt(c,r.bobine,xb-16,y-19,10.5,sortieOn?C2():CM(),"center",sortieOn);
    };
    txt(c,"Les étapes",col[0]+8,h*0.045,12,C1(),"left",true);
    txt(c,"Les sorties",col[1]+8,h*0.045,12,C1(),"left",true);
    const y0=h*0.13,dy=(h*0.84)/Math.max(B.etapes.length,B.sorties.length);
    B.etapes.forEach((r,i)=>dessineBarreau(col[0],y0+i*dy+dy*0.35,dy*0.62,r,i,"e"));
    B.sorties.forEach((r,i)=>dessineBarreau(col[1],y0+i*dy+dy*0.35,dy*0.62,r,i,"s"));
  });

  const majQuiz=()=>{
    if(!quiz){qz.innerHTML="";return;}
    qz.innerHTML=B.etapes.map((r,i)=>{
      const n=B.etapes.length,av=(i+n-1)%n;
      const bon="X"+av+" · "+a.trans[av].rec;
      const opts=[bon,"X"+i+" · "+a.trans[i].rec,"X"+((i+1)%n)+" · "+a.trans[av].rec];
      return '<div class="au-tr"><span class="au-num">X'+i+" =</span>"+
        '<div class="au-opts" data-i="'+i+'">'+opts.map((o,k)=>
          '<button type="button" data-k="'+k+'" class="'+(choix[i]===k?(k===0?"bon":"faux"):"")+'">'+o+"</button>").join("")+
        "</div></div>";}).join("")+
      '<p class="au-aide">Chaque étape s\'active par l\'étape AMONT et la réceptivité qui les sépare, se maintient par elle-même, et se coupe par l\'étape AVAL.</p>';
    qz.querySelectorAll(".au-opts").forEach(d=>d.addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      const i=+d.dataset.i;choix[i]=+b.dataset.k;valide=choix.every(x=>x===0);
      if(valide){msg.dataset.e="ok";
        msg.innerHTML="<b>Les cinq équations sont justes.</b> Tu viens d'écrire un programme d'automate : cinq auto-maintiens qui se passent le relais. C'est exactement le circuit de commande du module 23, mais en mémoire au lieu d'être en fil.";
        if(mi>=0)marquer(mi,pi);}
      else if(b.dataset.k!=="0"){msg.dataset.e="ko";
        msg.innerHTML=b.dataset.k==="1"
          ?"<b>Non.</b> Ce serait l'étape ELLE-MÊME et sa propre réceptivité : elle se réactiverait en boucle sans jamais avancer."
          :"<b>Non.</b> Ce serait l'étape AVAL : on ne s'active pas depuis celle qui vient après, on s'en fait désactiver.";}
      majQuiz();rendu();}));
  };

  const pas2=()=>{
    if(!marche)return;const v=0.012;
    const act=a.etapes[etape].act;
    if(act.indexOf("A+")>=0)A=Math.min(1,A+v);
    if(act.indexOf("A−")>=0)A=Math.max(0,A-v);
    if(act.indexOf("B+")>=0)Bp=Math.min(1,Bp+v*0.8);
    if(act.indexOf("B−")>=0)Bp=Math.max(0,Bp-v*1.4);
    if(valide){const t=a.trans[etape];
      if(t&&t.f(cap())){etape=(etape+1)%a.etapes.length;dcy=false;
        const e=$("#ld-etat");if(e)e.textContent="étape "+etape+" · "+a.etapes[etape].lib;}}
  };
  anims.push({t:0,jouer:true,rendu:()=>{pas2();rendu();}});
  const bt=(cl,l,f)=>{const b=document.createElement("button");b.className="btn "+cl;b.textContent=l;
    b.addEventListener("click",f);outils.appendChild(b);return b;};
  bt("btn-principal","Départ cycle",()=>{dcy=true;setTimeout(()=>{dcy=false;},900);});
  const bm=bt("btn-secondaire btn-fin","Pause",()=>{marche=!marche;bm.textContent=marche?"Pause":"Reprendre";});
  bt("btn-secondaire btn-fin","Remettre au repos",()=>{etape=0;A=0;Bp=0;dcy=false;});
  majQuiz();
}

/* =========================================================================
   9. CONTRÔLE NOTÉ — et la boucle de remédiation
   ========================================================================= */
function rendreControle(hote,mi,pi,pas){
  const box=document.createElement("div");box.className="verre copie";hote.appendChild(box);
  const n=pas.n||8;
  const tirage=[];for(let i=0;i<n;i++){const id=pas.gen[i%pas.gen.length];tirage.push(id);}
  tirage.sort(()=>Math.random()-0.5);
  let i=0,justes=0,g=null,p=null;const resultats=[];
  const jauge=()=>'<div class="jauge-q">'+tirage.map((_,k)=>
    '<i data-e="'+(k<i?(resultats[k]?"ok":"ko"):k===i?"cours":"")+'"></i>').join("")+"</div>";
  const question=()=>{
    g=GEN[tirage[i]];p=g.tirer();
    box.innerHTML=jauge()+'<span class="qn">Question '+(i+1)+" sur "+n+" · "+g.t+'</span>'+
      '<div class="qt">'+g.enonce(p)+"</div>";
    if(g.qcm){
      const opts=g.opts(p),ordre=opts.map((o,k)=>[o,k]).sort(()=>Math.random()-0.5);
      const d=document.createElement("div");d.className="choix";
      ordre.forEach(([o,k],j)=>{const b=document.createElement("button");b.type="button";
        b.innerHTML='<span class="lt">'+"ABCD"[j]+'</span><span>'+o+"</span>";
        b.addEventListener("click",()=>valider(k===0,d,b,ordre));d.appendChild(b);});
      box.appendChild(d);
    }else{
      const d=document.createElement("div");d.className="saisie";
      d.innerHTML='<div class="champ"><input type="text" inputmode="decimal" autocomplete="off" placeholder="ta réponse">'+
        (g.u?'<span class="unite">'+g.u+"</span>":"")+'</div><button class="btn btn-principal">Valider</button>';
      box.appendChild(d);
      const inp=d.querySelector("input");
      const v=()=>valider(juste(lireNombre(inp.value),g.rep(p),g.tol),d,inp);
      d.querySelector("button").addEventListener("click",v);
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")v();});
      setTimeout(()=>inp.focus(),40);
    }
  };
  const valider=(ok,cont,cible,ordre)=>{
    resultats[i]=ok;if(ok)justes++;
    noter(tirage[i],ok);
    box.querySelectorAll("button,input").forEach(x=>{x.disabled=true;});
    if(ordre&&cont){[...cont.children].forEach((b,k)=>{
      if(ordre[k][1]===0)b.dataset.r="bon";else if(b===cible&&!ok)b.dataset.r="mauvais";});}
    if(cible&&cible.tagName==="INPUT")cible.dataset.e=ok?"ok":"ko";
    const att=g.qcm?g.opts(p)[0]:nb(g.rep(p),g.rep(p)<1?4:2)+(g.u?" "+g.u:"");
    const r=document.createElement("div");r.className="retour";r.dataset.e=ok?"ok":"ko";
    r.innerHTML='<div class="bandeau">'+(ok?"Juste.":"Non — la réponse était "+att)+"</div>"+
      '<div class="detail">'+blocCorrection(g,p)+"</div>";
    box.appendChild(r);
    if(!ok)poserAutrement(r.querySelector(".detail"),tirage[i]);
    const pied=document.createElement("div");pied.className="outils";pied.style.marginTop="16px";
    const b=document.createElement("button");b.className="btn btn-principal";
    b.textContent=i<n-1?"Question suivante":"Voir la note";
    b.addEventListener("click",()=>{if(i<n-1){i++;question();}else bilan();});
    pied.appendChild(b);poserCalculatrice(pied,box);box.appendChild(pied);b.focus();
  };
  const bilan=()=>{
    const note=justes/n*20, mod=MODULES[mi];
    const ess=(etat.essais[mod.id]||0)+1;etat.essais[mod.id]=ess;
    const anc=etat.notes[mod.id];
    if(!anc||note>anc.note)etat.notes[mod.id]={note:note,sur:20,justes:justes,total:n,essais:ess,date:new Date().toISOString().slice(0,10)};
    else etat.notes[mod.id].essais=ess;
    const acquis=note>=12;
    if(acquis)marquer(mi,pi);
    sauver();majGlobal();majRail();
    box.innerHTML='<span class="qn">Résultat du contrôle</span>'+
      '<div class="qt">'+(acquis?(mod.examen?"Palier franchi.":"Module validé."):(mod.examen?"Le palier n'est pas encore franchi.":"On ne s'arrête pas là."))+"</div>"+
      '<div class="bulletin">'+
       '<div><span class="k">Note</span><span class="v" data-ton="'+(acquis?"ok":"ko")+'">'+nb(note,1)+'<u> / 20</u></span></div>'+
       '<div><span class="k">Bonnes réponses</span><span class="v">'+justes+'<u> / '+n+'</u></span></div>'+
       '<div><span class="k">Tentative</span><span class="v" data-ton="ac">'+ess+"</span></div></div>"+
      "<p style='color:var(--muted);max-width:62ch'>"+
      (acquis?(mod.examen?"Le palier suivant est ouvert. Tu peux repasser cet examen quand tu veux : les valeurs changent à chaque tirage."
        :"Tu peux passer au module suivant. Tu pourras revenir refaire ce contrôle quand tu veux : les valeurs changent à chaque tirage.")
       :"En dessous de 12 sur 20, on reprend. Retourne à l'atelier du module : les exercices seront tirés avec de nouveaux nombres, et la correction détaille chaque ligne. On recommence autant de fois qu'il faut.")+"</p>";
    const pied=document.createElement("div");pied.className="outils";pied.style.marginTop="18px";
    const at=mod.steps.findIndex(s=>s.k==="a");
    if(!acquis&&at>=0){
      const b=document.createElement("button");b.className="btn btn-principal";
      b.textContent="Reprendre l'atelier du module";
      b.addEventListener("click",()=>voir(mi,at));pied.appendChild(b);}
    const re=document.createElement("button");re.className=acquis?"btn btn-secondaire":"btn btn-secondaire";
    re.textContent="Refaire le contrôle";
    re.addEventListener("click",()=>{i=0;justes=0;resultats.length=0;
      tirage.sort(()=>Math.random()-0.5);question();});
    pied.appendChild(re);
    if(acquis){
      const nx=document.createElement("button");nx.className="btn btn-principal";
      nx.textContent=mi<MODULES.length-1?"Module "+MODULES[mi+1].num+" →":"Voir le bilan du parcours";
      nx.addEventListener("click",()=>mi<MODULES.length-1?voir(mi+1,0):carnet());
      pied.insertBefore(nx,pied.firstChild);}
    box.appendChild(pied);
  };
  question();
}

/* =========================================================================
   10. RENDU D'UN PAS, CARNET DE NOTES, NAVIGATION
   ========================================================================= */
function voir(m,p,silencieux){
  etat.pos={m:m,p:p};etat.vue="module";if(!silencieux)sauver();
  redessins=[];anims=[];
  const mod=MODULES[m],pas=mod.steps[p],sc=$("#scene");sc.innerHTML="";

  const tete=document.createElement("header");tete.className="verre entete monte";
  const nt=noteDe(m);
  tete.innerHTML='<div class="sur"><i></i>Module '+mod.num+" · "+mod.bloc+"</div>"+
    "<h1>"+mod.titre+"</h1><p>"+mod.resume+"</p>"+
    '<div class="infos"><span class="tag">'+mod.duree+'</span>'+
    '<span class="tag">Pas <b>'+(p+1)+" / "+mod.steps.length+'</b></span>'+
    '<span class="tag">Validés <b>'+faitsDuModule(m)+"</b></span>"+
    (nt?'<span class="tag">Note <b>'+nb(nt.note,1)+" / 20</b></span>":"")+"</div>";
  sc.appendChild(tete);

  const frise=document.createElement("div");frise.className="frise";
  mod.steps.forEach((s,k)=>{
    const b=document.createElement("button");b.type="button";
    b.title=(k+1)+". "+(s.t||"Contrôle");
    if(estFait(m,k))b.dataset.etat="fait";
    if(k===p)b.setAttribute("aria-current","true");
    b.addEventListener("click",()=>voir(m,k));frise.appendChild(b);});
  sc.appendChild(frise);

  if(estVerrouille(m)){
    const e=examenAvant(m),ex=MODULES[e],n=etat.notes[ex.id];
    const v=document.createElement("section");v.className="verre feuille monte";
    v.innerHTML='<span class="etiquette">Palier fermé</span><h2>Il reste l\'examen à passer</h2>'+
      "<p>Ce module appartient au palier suivant. Avant d'y entrer, il faut franchir <strong>"+ex.titre+
      "</strong> avec au moins <strong>12 sur 20</strong>."+
      (n?" Ta meilleure note pour l'instant : <strong>"+nb(n.note,1)+" / 20</strong>.":" Tu ne l'as pas encore passé.")+"</p>"+
      "<p class='sourdine'>Ce n'est pas une punition : les modules suivants s'appuient sur ces notions. Les aborder sans elles fait perdre plus de temps qu'on n'en gagne.</p>";
    const o=document.createElement("div");o.className="outils";o.style.marginTop="6px";
    const ba=document.createElement("button");ba.className="btn btn-principal";
    ba.textContent="Passer l'examen "+ex.num;
    ba.addEventListener("click",()=>voir(e,0));
    const bf=document.createElement("button");bf.className="btn btn-secondaire btn-fin";
    bf.textContent="Entrer quand même";
    bf.addEventListener("click",()=>{etat.forcer[ex.id]=1;sauver();voir(m,p);});
    o.appendChild(ba);o.appendChild(bf);v.appendChild(o);
    sc.appendChild(v);majRail();majGlobal();window.scrollTo({top:0});return;
  }
  const et=pas.k==="c"?(mod.examen?"Examen de palier":"Contrôle noté"):pas.k==="a"?"Atelier d'exercices":pas.k==="s"?"Banc d'essai":pas.k==="w"?"Câblage à faire":pas.k==="z"?"Simulateur":pas.k==="f"?"Chaîne fonctionnelle":pas.k==="g"?"Automate":pas.k==="h"?"Ladder":"Leçon";
  const feuille=document.createElement("section");feuille.className="verre feuille monte";
  feuille.innerHTML='<span class="etiquette">'+et+"</span>"+
    (pas.t?"<h2>"+pas.t+"</h2>":"<h2>Contrôle du module</h2>")+(pas.h||"");
  sc.appendChild(feuille);
  feuille.querySelectorAll("[data-anim]").forEach(f=>monterFigure(f,f.dataset.anim));
  if(pas.k==="s"&&SIMS[pas.sim])SIMS[pas.sim](feuille);
  if(pas.k==="a")rendreAtelier(sc,m,p,pas);
  if(pas.k==="w")rendreCablage(sc,m,p,pas);
  if(pas.k==="z")rendreSimu(sc,m,p,pas);
  if(pas.k==="f")rendreChaine(sc,m,p,pas);
  if(pas.k==="g")rendreAutomate(sc,m,p,pas);
  if(pas.k==="h")rendreLadder(sc,m,p,pas);
  if(pas.k==="c")rendreControle(sc,m,p,pas);

  if(pas.k==="l"||pas.k==="s"||pas.k==="w"||pas.k==="z"||pas.k==="f"||pas.k==="g"||pas.k==="h"){
    const pied=document.createElement("nav");pied.className="verre pied";
    const prec=document.createElement("button");prec.className="btn btn-secondaire";prec.textContent="← Précédent";
    prec.disabled=(m===0&&p===0);prec.addEventListener("click",reculer);
    const suiv=document.createElement("button");suiv.className="btn btn-principal";
    suiv.textContent=(p===mod.steps.length-1?"Terminer le module":"Continuer")+" →";
    suiv.addEventListener("click",avancer);
    const as=document.createElement("span");as.className="astuce";
    as.innerHTML="<kbd>←</kbd> <kbd>→</kbd> pour naviguer";
    pied.appendChild(prec);pied.appendChild(suiv);pied.appendChild(as);
    sc.appendChild(pied);
  }
  majRail();majGlobal();window.scrollTo({top:0});
}
function avancer(){
  const {m,p}=etat.pos;const k=MODULES[m].steps[p].k;
  if(k==="l"||k==="s")marquer(m,p);
  if(p<MODULES[m].steps.length-1)voir(m,p+1);
  else if(m<MODULES.length-1)voir(m+1,0);
  else carnet();
}
function reculer(){
  const {m,p}=etat.pos;
  if(p>0)voir(m,p-1);else if(m>0)voir(m-1,MODULES[m-1].steps.length-1);
}

function connexion(mode){

    "</div>"+

    '<p class="portail-note">Un compte sert à retrouver ta progression sur un autre appareil. Tu peux aussi commencer tout de suite : tout fonctionne sans compte, la progression reste alors sur cet appareil.</p>'+
    (mode==="creer"?'<p class="portail-note portail-avert">⚠ La récupération de mot de passe par courriel n\'est pas encore en place. Note bien le tien : en cas d\'oubli, il faudra créer un autre compte.</p>':"");
  sc.appendChild(w);
  w.querySelectorAll(".portail-onglets button").forEach(b=>b.addEventListener("click",()=>connexion(b.dataset.m)));
  const act=w.querySelector(".portail-actions"),msg=w.querySelector("#portail-msg");
  const bp=document.createElement("button");bp.className="btn btn-principal";
  bp.textContent=mode==="creer"?"Créer mon compte":"Se connecter";
  const envoyer=async()=>{
    const mail=w.querySelector("#ch-mail").value.trim(),mdp=w.querySelector("#ch-mdp").value;
    if(!mail||!mdp){msg.dataset.e="ko";msg.innerHTML="<b>Il manque quelque chose.</b> Renseigne l'adresse et le mot de passe.";return;}
    bp.disabled=true;bp.textContent="Un instant…";
    const r=mode==="creer"?await inscrire(mail,mdp):await connecter(mail,mdp);
    bp.disabled=false;bp.textContent=mode==="creer"?"Créer mon compte":"Se connecter";
    if(r.ok){majCompte();accueil();}
    else{msg.dataset.e="ko";msg.innerHTML="<b>"+(mode==="creer"?"Inscription impossible.":"Connexion impossible.")+"</b> "+r.msg;}
  };

function accueil(){
  const sc=cadreVue("accueil");
  const w=document.createElement("section");w.className="verre feuille monte portail";
  w.innerHTML='<div class="portail-marque"><span class="sceau"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span>'+
    "<h1>Mon BTS</h1><p>Cherche ton BTS et commence.</p></div>"+
    '<div class="recherche"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'+
    '<input type="search" id="ch-bts" placeholder="Cherche un BTS — électrotechnique, ATI…" autocomplete="off"></div>'+
    '<div class="cartes" id="cartes"></div>'+
    '<p class="portail-note" id="note-cat"></p>';
  sc.appendChild(w);
  const dessine=()=>{
    const q=(w.querySelector("#ch-bts").value||"").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"");
    /* On classe : un mot entier qui correspond passe devant un simple
       fragment. Sans cela « ati » remontait « automatisme ». */
    const plat=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const score=c=>{
      if(!q)return 1;
      const nom=plat(c.nom+" "+c.court), tout=plat(c.nom+" "+c.court+" "+c.sous+" "+c.mots);
      const mots=tout.split(/[^a-z0-9]+/);
      if(mots.indexOf(q)>=0)return 3;
      if(nom.indexOf(q)>=0)return 2;
      if(mots.some(m=>m.startsWith(q)))return 2;
      return tout.indexOf(q)>=0?1:0;};
    const liste=CATALOGUE.map(c=>[c,score(c)]).filter(x=>x[1]>0)
      .sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const g=w.querySelector("#cartes");g.innerHTML="";
    liste.forEach(c=>{
      const n=c.modules().length;
      let av=0;try{const b=JSON.parse(localStorage.getItem(c.id==="electrotechnique"?CLE_BASE:CLE_BASE+":"+c.id)||"{}");
        av=Object.keys(b.faits||{}).length;}catch(e){}
      const b=document.createElement("button");b.className="carte";b.type="button";
      b.innerHTML='<span class="carte-tag" data-e="'+c.etat+'">'+(c.etat==="nouveau"?"Nouveau":"Complet")+"</span>"+
        "<b>"+c.nom+"</b><span class='carte-court'>"+c.court+"</span>"+
        "<span class='carte-sous'>"+c.sous+"</span>"+
        '<span class="carte-pied">'+n+" modules"+(av?" · "+av+" pas déjà validés":"")+"</span>";
      b.addEventListener("click",()=>{choisirBTS(c.id,true);
        if(etat.annee===undefined||etat.annee===null||!Object.keys(etat.faits).length)choixAnnee();
        else{document.querySelector(".page").dataset.rail=innerWidth>1040?"on":"off";
          if(etat.vuGuide)voir(etat.pos.m||0,etat.pos.p||0);else guide();}});
      g.appendChild(b);});
    if(!liste.length)g.innerHTML='<p class="simu-vide">Aucun BTS ne correspond. Pour l\'instant le catalogue en compte '+CATALOGUE.length+".</p>";
    w.querySelector("#note-cat").textContent=
      "Le catalogue s'agrandira : chaque BTS ajouté reprend le même principe — leçons courtes, figures manipulables, exercices tirés au sort et examens de palier.";
  };
  w.querySelector("#ch-bts").addEventListener("input",dessine);
  dessine();
  majRail();majGlobal();window.scrollTo({top:0});
  setTimeout(()=>w.querySelector("#ch-bts").focus(),60);
}

      a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}

/* Le volet du parcours : un interrupteur, et son état est retenu. */
function poserRail(v){
  document.querySelector(".page").dataset.rail=v?"on":"off";
  $("#ouvrir-rail").setAttribute("aria-pressed",v?"true":"false");
  $("#ouvrir-rail").title=v?"Masquer le parcours":"Afficher le parcours";
  requestAnimationFrame(()=>redessins.forEach(f=>f()));
}
$("#ouvrir-rail").addEventListener("click",()=>{
  const v=document.querySelector(".page").dataset.rail!=="on";
  etat.rail=v?"on":"off";sauver();poserRail(v);});
$("#voir-carnet").addEventListener("click",carnet);
$("#voir-guide").addEventListener("click",guide);
$("#accueil").addEventListener("click",accueil);
$("#compte").addEventListener("click",menuCompte);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>redessins.forEach(f=>f()));
addEventListener("scroll",()=>{$("#barre").dataset.defile=scrollY>10?"oui":"non";},{passive:true});
addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(etat.vue!=="module")return;
  const k=MODULES[etat.pos.m].steps[etat.pos.p].k;
  if(k!=="l"&&k!=="s")return;
  if(e.key==="ArrowRight"){e.preventDefault();avancer();}
  if(e.key==="ArrowLeft"){e.preventDefault();reculer();}
});
let tr=null;
addEventListener("resize",()=>{clearTimeout(tr);tr=setTimeout(()=>redessins.forEach(f=>f()),140);});

/* Démarrage : on tente la session, puis on choisit l'écran d'entrée.
   Si le serveur ne répond pas, rien ne bloque : on travaille en local. */
(async function demarrer(){
  poserRail(false);
  let dernier=null;try{dernier=localStorage.getItem(CLE_BASE+"-bts");}catch(e){}
  const connecte=await reprendreSession();
  majCompte();
  if(connecte||SB.ok===false||dernier){
    if(dernier){choisirBTS(dernier,true);
      if(SB.ok!==false&&!connecte&&SB.session===null&&!localStorage.getItem(CLE_SESSION)&&!dernier)connexion();
      else{poserRail(etat.rail?etat.rail==="on":innerWidth>1040);
        if(etat.vuGuide)voir(etat.pos.m||0,etat.pos.p||0,true);else guide();}}
    else accueil();
  }else connexion();
  brancherBase();
})();
</script>

.calc-2nd[data-a="on"]{background:color-mix(in srgb,var(--success) 16%,var(--surface));color:var(--success)}
.calc-ecran{background:var(--surface-2);border-radius:9px;padding:11px 13px;margin-bottom:10px;
  box-shadow:inset 0 0 0 1px var(--border);min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.calc-expr{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--muted);
  word-break:break-all;line-height:1.35;min-height:18px}
.calc-res{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:600;color:var(--primary);
  text-align:right;line-height:1.15}
.calc-err{font-size:12.5px;font-weight:500;color:var(--danger)}
.calc-touches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.calc-t{padding:11px 2px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:13.5px;transition:.12s}
.calc-t:hover{border-color:var(--primary);background:var(--surface-2)}
.calc-t.fn{color:var(--danger);font-size:12.5px}
.calc-t.op{background:var(--surface-2);font-weight:600}
.calc-t.eg4{grid-column:span 4;background:var(--primary);border-color:var(--primary);
  color:var(--on-primary);font-weight:600;font-size:16px}
.calc-note{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.calc-note b{color:var(--primary)}

.autre-corps{border-radius:10px;padding:13px 16px;
  background:color-mix(in srgb,var(--primary) 8%,var(--surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 24%,transparent)}
.autre-corps .chapo{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--primary);margin-bottom:6px}
.autre-corps p{margin:0;font-size:14.6px;line-height:1.6;max-width:66ch}
</style>

</body>
</html>

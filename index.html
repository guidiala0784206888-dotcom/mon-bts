Object.assign(ANIM,{

/* ---- Le circuit de commande, cliquable ---- */
"auto-maintien":{t:"Le circuit à auto-maintien",ratio:1.85,main:true,
 note:"Appuie sur MARCHE : le contacteur colle et se maintient tout seul, même quand tu relâches. Appuie sur ARRÊT ou déclenche le thermique pour voir la chaîne s'ouvrir.",
 regl:[],etat:{km:false,s2:false,s1:false,th:true},
 zones(w,h){return {s2:[w*0.14,h*0.30,w*0.20,h*0.14],s1:[w*0.14,h*0.52,w*0.20,h*0.14],th:[w*0.14,h*0.74,w*0.20,h*0.14]};},
 clic(p,x,y,w,h,e){
  const z=this.zones(w,h);
  for(const k in z){const[a,b,ww,hh]=z[k];
   if(x>=a&&x<=a+ww&&y>=b&&y<=b+hh){
    if(k==="s2"){e.s2=true;if(e.th&&!e.s1)e.km=true;setTimeout(()=>{e.s2=false;},260);}
    if(k==="s1"){e.s1=true;e.km=false;setTimeout(()=>{e.s1=false;},260);}
    if(k==="th"){e.th=!e.th;if(!e.th)e.km=false;}
    return true;}}
  return false;},
 dessin(c,w,h,t,p,e){
  const alim=e.th&&!e.s1, actif=e.km||(e.s2&&alim);
  const z=this.zones(w,h);
  /* rail d'alimentation */
  const xPh=w*0.09,xN=w*0.92,yTop=h*0.14,yBas=h*0.92;
  c.strokeStyle=CM();c.lineWidth=2;
  c.beginPath();c.moveTo(xPh,yTop);c.lineTo(xN,yTop);c.moveTo(xPh,yBas);c.lineTo(xN,yBas);c.stroke();
  txt(c,"Ph",xPh-6,yTop,11,CM(),"right",true);txt(c,"N",xN+6,yBas,11,CM(),"left",true);
  /* boutons cliquables */
  const bouton=(k,lab,sub,on,col)=>{
   const[a,b,ww,hh]=z[k];
   c.fillStyle=on?col:CS();c.globalAlpha=on?.16:1;
   c.beginPath();c.roundRect(a,b,ww,hh,10);c.fill();c.globalAlpha=1;
   c.strokeStyle=on?col:CB();c.lineWidth=on?2:1.4;
   c.beginPath();c.roundRect(a,b,ww,hh,10);c.stroke();
   txt(c,lab,a+ww/2,b+hh/2-6,12,on?col:CI(),"center",true);
   txt(c,sub,a+ww/2,b+hh/2+10,10,CM(),"center");};
  bouton("s2","S2 · marche","contact NO",e.s2,C2());
  bouton("s1","S1 · arrêt","contact NF",e.s1,C3());
  bouton("th","F1 · thermique",e.th?"95-96 fermé":"DÉCLENCHÉ",!e.th,C3());
  /* la chaîne série, dessinée à droite des boutons */
  const xc=w*0.42,ybob=h*0.52;
  const trait=(x1,y1,x2,y2,on)=>{c.strokeStyle=on?C2():CB();c.lineWidth=on?2.8:1.8;
   c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();};
  trait(xPh,yTop,xPh,h*0.81,alim);
  trait(xPh,h*0.81,z.th[0],h*0.81,alim);
  trait(z.th[0]+z.th[2],h*0.81,xc,h*0.81,e.th);
  trait(xc,h*0.81,xc,h*0.59,e.th);
  trait(z.s1[0]+z.s1[2],h*0.59,xc,h*0.59,alim);
  trait(xPh,h*0.59,z.s1[0],h*0.59,e.th);
  /* branche marche + auto-maintien en parallèle */
  trait(xPh,h*0.37,z.s2[0],h*0.37,alim);
  trait(z.s2[0]+z.s2[2],h*0.37,xc,h*0.37,e.s2&&alim);
  const xam=w*0.52;
  c.strokeStyle=e.km?C2():CB();c.lineWidth=e.km?2.8:1.8;
  c.beginPath();c.moveTo(xPh,h*0.22);c.lineTo(xam,h*0.22);c.stroke();
  /* contact d'auto-maintien KM 13-14 */
  c.beginPath();c.arc(xam,h*0.22,3,0,TAU);
  c.fillStyle=e.km?C2():CB();c.fill();
  c.strokeStyle=e.km?C2():CB();c.lineWidth=2.4;
  c.beginPath();c.moveTo(xam,h*0.22);
  if(e.km)c.lineTo(xam+30,h*0.22);else c.lineTo(xam+26,h*0.22-12);
  c.stroke();
  c.fillStyle=e.km?C2():CB();c.beginPath();c.arc(xam+30,h*0.22,3,0,TAU);c.fill();
  txt(c,"KM 13-14",xam+36,h*0.22-13,10.5,e.km?C2():CM());
  txt(c,"auto-maintien",xam+36,h*0.22+13,10,CM());
  trait(xam+30,h*0.22,xc,h*0.22,e.km);
  trait(xc,h*0.22,xc,h*0.37,e.km);
  trait(xc,h*0.37,xc,ybob-22,actif&&alim);
  /* bobine */
  c.strokeStyle=actif&&alim?C2():CB();c.lineWidth=2.4;
  c.beginPath();c.rect(xc-26,ybob-22,52,44);c.stroke();
  if(actif&&alim){c.fillStyle=C2();c.globalAlpha=.14+.10*Math.sin(t*4);
   c.beginPath();c.rect(xc-26,ybob-22,52,44);c.fill();c.globalAlpha=1;}
  txt(c,"KM",xc,ybob-4,13,actif&&alim?C2():CM(),"center",true);
  txt(c,"A1-A2",xc,ybob+12,10,CM(),"center");
  trait(xc,ybob+22,xc,yBas,actif&&alim);
  /* circulation du courant */
  if(actif&&alim){
   const boucle=[[xPh,yTop],[xPh,e.km?h*0.22:h*0.37],[xc,e.km?h*0.22:h*0.37],[xc,ybob-22],[xc,ybob+22],[xc,yBas],[xN,yBas]];
   let tot=0,seg=[];
   for(let i=0;i<boucle.length-1;i++){const d=Math.hypot(boucle[i+1][0]-boucle[i][0],boucle[i+1][1]-boucle[i][1]);seg.push(d);tot+=d;}
   for(let k=0;k<7;k++){let d=(((t*0.55+k/7)%1))*tot,i=0;
    while(i<seg.length&&d>seg[i]){d-=seg[i];i++;}
    if(i>=seg.length)i=seg.length-1;
    const a=boucle[i],b=boucle[i+1],f=seg[i]?d/seg[i]:0;
    c.fillStyle=C2();c.beginPath();c.arc(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,3.4,0,TAU);c.fill();}
  }
  /* état du moteur */
  const mx=w*0.76,my=h*0.50;
  c.strokeStyle=actif&&alim?C2():CB();c.lineWidth=2.4;
  c.beginPath();c.arc(mx,my,h*0.14,0,TAU);c.stroke();
  txt(c,"M",mx,my,17,actif&&alim?C2():CM(),"center",true);
  txt(c,actif&&alim?"moteur en marche":"moteur à l'arrêt",mx,my+h*0.14+18,11,actif&&alim?C2():CM(),"center",true);
  if(!e.th)pastilleTexte(c,"thermique déclenché : la chaîne est ouverte",w*0.5,h*0.05,C3());
 }},

/* ---- Série ou parallèle, à toi de choisir ---- */
"serie-parallele":{t:"Série ou parallèle : le circuit se remonte",ratio:2.1,main:true,
 note:"Change le montage et les valeurs : la résistance équivalente et la répartition suivent. Vérifie la règle — en parallèle, l'équivalent est toujours plus petit que la plus petite.",
 regl:[{id:"m",lib:"Montage",choix:["Série","Parallèle"],val:0},
       {id:"a",lib:"R₁",min:10,max:200,pas:10,val:60,u:"Ω"},
       {id:"b",lib:"R₂",min:10,max:200,pas:10,val:120,u:"Ω"},
       {id:"u",lib:"Tension",min:12,max:400,pas:12,val:120,u:"V"}],
 dessin(c,w,h,t,p){
  const ser=p.m===0;
  const Req=ser?p.a+p.b:p.a*p.b/(p.a+p.b);
  const I=p.u/Req, I1=ser?I:p.u/p.a, I2=ser?I:p.u/p.b;
  const U1=ser?I*p.a:p.u, U2=ser?I*p.b:p.u;
  const x1=w*0.10,x2=w*0.58,yc=h*0.5;
  c.strokeStyle=CM();c.lineWidth=2;
  const boite=(x,y,ww,hh,lab,val,col,on)=>{
   c.strokeStyle=col;c.lineWidth=2.2;
   c.beginPath();c.rect(x,y,ww,hh);c.stroke();
   c.fillStyle=col;c.globalAlpha=.10;c.beginPath();c.rect(x,y,ww,hh);c.fill();c.globalAlpha=1;
   mono(c,val,x+ww/2,y+hh/2,12,CI(),"center");
   txt(c,lab,x+ww/2,y-11,11,col,"center",true);};
  if(ser){
   c.strokeStyle=CM();c.lineWidth=2;
   c.beginPath();c.moveTo(x1,yc);c.lineTo(x1+w*0.08,yc);
   c.moveTo(x1+w*0.20,yc);c.lineTo(x1+w*0.26,yc);
   c.moveTo(x1+w*0.38,yc);c.lineTo(x2,yc);c.stroke();
   boite(x1+w*0.08,yc-14,w*0.12,28,"R₁",p.a+" Ω",C1());
   boite(x1+w*0.26,yc-14,w*0.12,28,"R₂",p.b+" Ω",C2());
   mono(c,F(U1,1)+" V",x1+w*0.14,yc+30,11,C1(),"center");

"resonance":{t:"La résonance série",ratio:2.2,
 note:"À la fréquence où X_L = X_C, les deux réactances s'annulent : le circuit devient purement résistif et le courant explose.",

 dessin(c,w,h,t,p){

  const f0=1/(TAU*Math.sqrt(L*C));

  const Z=f=>{const w0=TAU*f;return Math.hypot(p.r,w0*L-1/(w0*C));};

   const X=x0+lw*(f/fmax),Y=gy-gh*Math.min(I/Imax,1);i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();

  txt(c,"50 Hz",x50,gy+14,10,CM(),"center");

  [["Fréquence propre f₀",F(f0,1)+" Hz",C3()],

   ["Courant à f₀",F(230/p.r,1)+" A",C1()],

   ["Surtension sur L et C",F(230*TAU*f0*L/p.r,0)+" V",C3()]].forEach((l,i)=>{
   txt(c,l[0],px,h*0.14+i*(h*0.17),10.5,CM());
   mono(c,l[1],px,h*0.14+i*(h*0.17)+15,12.5,l[2]);});
 }}

ANIM["cercle-trigo"].glisse=function(p,x,y,w,h){
  const rr=Math.min(h*0.40,w*0.19),cx=rr+46,cy=h/2;
  let a=Math.atan2(cy-y,x-cx)*180/Math.PI;if(a<0)a+=360;
  p.a=Math.round(a/5)*5;p.auto=0;return true;};
ANIM["cercle-trigo"].main=true;
ANIM["harmoniques"].glisse=function(p,x,y,w,h){
  const x0=40,lw=w*0.62,sx=x0+lw+w*0.05,sw=w-sx-16,by=h*0.76,bh=h*0.5;
  if(x<sx)return false;
  const i=Math.floor((x-sx)/(sw/4.4));
  const v=Math.max(0,Math.min(50,Math.round((by-y)/bh*100/5)*5));
  if(i===1)p.h3=v;else if(i===2)p.h5=v;else if(i===3)p.h7=Math.min(40,v);else return false;
  return true;};

ANIM["chute-ligne"].glisse=function(p,x,y,w,h){
  const x0=w*0.10,x1=w*0.86;
  if(y<h*0.20||y>h*0.68)return false;

ANIM["triangle-puissances"].glisse=function(p,x,y,w,h){
  const t1=Math.tan(Math.acos(p.c1)),ox=w*0.09,oy=h*0.86;

  const dx=(ox+p.p*ech)-ox, dy=Math.max(0,oy-y);
  if(dx<=0)return false;
  const tg=dy/(dx);const cs=Math.cos(Math.atan(tg));
  p.c2=Math.max(0.8,Math.min(1,Math.round(cs*100)/100));return true;};

  const rendu=toile(zone,A.ratio||2,(c,w,h)=>{A.dessin(c,w,h,obj.t,params,etat);});
  obj.rendu=rendu;

      params[i.id]=+i.value;const v=$("#v-"+i.id);if(v)v.textContent=String(i.value).replace(".",",");rendu();}));
    r.querySelectorAll(".segm").forEach(s=>s.addEventListener("click",ev=>{

  /* gestes */

      return [(ev.clientX-r.left),(ev.clientY-r.top),r.width,r.height];};
    let presse=false;

      const[x,y,w,h]=pos(ev);presse=true;cv.setPointerCapture(ev.pointerId);

    ["pointerup","pointercancel"].forEach(e=>cv.addEventListener(e,()=>{presse=false;}));
  }

  const bp=hote.querySelector(".fig-play");
  const majBp=()=>{bp.dataset.e=obj.jouer?"pause":"play";bp.setAttribute("aria-label",obj.jouer?"Pause":"Lecture");};

}

function lireNombre(s){

  return Math.abs(rep-att)/Math.abs(att)<=t;

    const r=document.createElement("div");r.className="retour";r.dataset.e=ok?"ok":"ko";
    const att=g.qcm?g.opts(p)[0]:nb(g.rep(p),g.rep(p)<1?4:2)+(g.u?" "+g.u:"");
    r.innerHTML='<div class="bandeau">'+(ok?"Juste.":abandon?"On regarde ensemble.":"Non — la réponse était "+att)+"</div>"+
      '<div class="detail">'+blocCorrection(g,p)+"</div>";
    corps.appendChild(r);
    if(!ok)poserAutrement(r.querySelector(".detail"),id);
    const pied=document.createElement("div");pied.className="outils";pied.style.marginTop="16px";
    if(serie>=but){
      const b=document.createElement("button");b.className="btn btn-positif";
      b.textContent="Notion acquise — continuer";
      b.addEventListener("click",()=>{if(mi>=0){marquer(mi,pi);avancer();}else carnet();});
      pied.appendChild(b);
      const s=document.createElement("span");s.style.color="var(--success)";s.style.fontWeight="500";
      s.textContent=but+" d'affilée. "+justes+" bonnes réponses sur "+total+".";
      pied.appendChild(s);
    }else{
      const b=document.createElement("button");b.className="btn btn-principal";
      b.textContent=ok?"Exercice suivant":"On recommence";
      b.addEventListener("click",dessine);pied.appendChild(b);
      const s=document.createElement("span");s.style.color="var(--muted)";s.style.fontSize="13px";
      s.textContent=ok?"encore "+(but-serie)+" pour valider":"la série repart à zéro — c'est fait exprès";
      pied.appendChild(s);
      if(mi>=0&&estFait(mi,pi)){const p2=document.createElement("button");p2.className="btn btn-secondaire btn-fin";
        p2.textContent="Passer";p2.addEventListener("click",avancer);pied.appendChild(p2);}
    }
    corps.appendChild(pied);
    pied.querySelector("button").focus();
  };
  dessine();
}

/* =========================================================================
   9. CONTRÔLE NOTÉ — et la boucle de remédiation
   ========================================================================= */
function rendreControle(hote,mi,pi,pas){
  const box=document.createElement("div");box.className="verre copie";hote.appendChild(box);
  const n=pas.n||8;
  const tirage=[];for(let i=0;i<n;i++){const id=pas.gen[i%pas.gen.length];tirage.push(id);}
  tirage.sort(()=>Math.random()-0.5);
  let i=0,justes=0,g=null,p=null;const resultats=[];
  const jauge=()=>'<div class="jauge-q">'+tirage.map((_,k)=>
    '<i data-e="'+(k<i?(resultats[k]?"ok":"ko"):k===i?"cours":"")+'"></i>').join("")+"</div>";
  const question=()=>{
    g=GEN[tirage[i]];p=g.tirer();
    box.innerHTML=jauge()+'<span class="qn">Question '+(i+1)+" sur "+n+" · "+g.t+'</span>'+
      '<div class="qt">'+g.enonce(p)+"</div>";
    if(g.qcm){
      const opts=g.opts(p),ordre=opts.map((o,k)=>[o,k]).sort(()=>Math.random()-0.5);
      const d=document.createElement("div");d.className="choix";
      ordre.forEach(([o,k],j)=>{const b=document.createElement("button");b.type="button";
        b.innerHTML='<span class="lt">'+"ABCD"[j]+'</span><span>'+o+"</span>";
        b.addEventListener("click",()=>valider(k===0,d,b,ordre));d.appendChild(b);});
      box.appendChild(d);
    }else{
      const d=document.createElement("div");d.className="saisie";
      d.innerHTML='<div class="champ"><input type="text" inputmode="decimal" autocomplete="off" placeholder="ta réponse">'+
        (g.u?'<span class="unite">'+g.u+"</span>":"")+'</div><button class="btn btn-principal">Valider</button>';
      box.appendChild(d);
      const inp=d.querySelector("input");
      const v=()=>valider(juste(lireNombre(inp.value),g.rep(p),g.tol),d,inp);
      d.querySelector("button").addEventListener("click",v);
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")v();});
      setTimeout(()=>inp.focus(),40);
    }
  };
  const valider=(ok,cont,cible,ordre)=>{
    resultats[i]=ok;if(ok)justes++;
    noter(tirage[i],ok);
    box.querySelectorAll("button,input").forEach(x=>{x.disabled=true;});
    if(ordre&&cont){[...cont.children].forEach((b,k)=>{
      if(ordre[k][1]===0)b.dataset.r="bon";else if(b===cible&&!ok)b.dataset.r="mauvais";});}
    if(cible&&cible.tagName==="INPUT")cible.dataset.e=ok?"ok":"ko";
    const att=g.qcm?g.opts(p)[0]:nb(g.rep(p),g.rep(p)<1?4:2)+(g.u?" "+g.u:"");
    const r=document.createElement("div");r.className="retour";r.dataset.e=ok?"ok":"ko";
    r.innerHTML='<div class="bandeau">'+(ok?"Juste.":"Non — la réponse était "+att)+"</div>"+
      '<div class="detail">'+blocCorrection(g,p)+"</div>";
    box.appendChild(r);
    if(!ok)poserAutrement(r.querySelector(".detail"),tirage[i]);
    const pied=document.createElement("div");pied.className="outils";pied.style.marginTop="16px";
    const b=document.createElement("button");b.className="btn btn-principal";
    b.textContent=i<n-1?"Question suivante":"Voir la note";
    b.addEventListener("click",()=>{if(i<n-1){i++;question();}else bilan();});
    pied.appendChild(b);box.appendChild(pied);b.focus();
  };
  const bilan=()=>{
    const note=justes/n*20, mod=MODULES[mi];
    const ess=(etat.essais[mod.id]||0)+1;etat.essais[mod.id]=ess;
    const anc=etat.notes[mod.id];
    if(!anc||note>anc.note)etat.notes[mod.id]={note:note,sur:20,justes:justes,total:n,essais:ess,date:new Date().toISOString().slice(0,10)};
    else etat.notes[mod.id].essais=ess;
    const acquis=note>=12;
    if(acquis)marquer(mi,pi);
    sauver();majGlobal();majRail();
    box.innerHTML='<span class="qn">Résultat du contrôle</span>'+
      '<div class="qt">'+(acquis?"Module validé.":"On ne s'arrête pas là.")+"</div>"+
      '<div class="bulletin">'+
       '<div><span class="k">Note</span><span class="v" data-ton="'+(acquis?"ok":"ko")+'">'+nb(note,1)+'<u> / 20</u></span></div>'+
       '<div><span class="k">Bonnes réponses</span><span class="v">'+justes+'<u> / '+n+'</u></span></div>'+
       '<div><span class="k">Tentative</span><span class="v" data-ton="ac">'+ess+"</span></div></div>"+
      "<p style='color:var(--muted);max-width:62ch'>"+
      (acquis?"Tu peux passer au module suivant. Tu pourras revenir refaire ce contrôle quand tu veux : les valeurs changent à chaque tirage."
       :"En dessous de 12 sur 20, on reprend. Retourne à l'atelier du module : les exercices seront tirés avec de nouveaux nombres, et la correction détaille chaque ligne. On recommence autant de fois qu'il faut.")+"</p>";
    const pied=document.createElement("div");pied.className="outils";pied.style.marginTop="18px";
    const at=mod.steps.findIndex(s=>s.k==="a");
    if(!acquis&&at>=0){
      const b=document.createElement("button");b.className="btn btn-principal";
      b.textContent="Reprendre l'atelier du module";
      b.addEventListener("click",()=>voir(mi,at));pied.appendChild(b);}
    const re=document.createElement("button");re.className=acquis?"btn btn-secondaire":"btn btn-secondaire";
    re.textContent="Refaire le contrôle";
    re.addEventListener("click",()=>{i=0;justes=0;resultats.length=0;
      tirage.sort(()=>Math.random()-0.5);question();});
    pied.appendChild(re);
    if(acquis){
      const nx=document.createElement("button");nx.className="btn btn-principal";
      nx.textContent=mi<MODULES.length-1?"Module "+MODULES[mi+1].num+" →":"Voir le bilan du parcours";
      nx.addEventListener("click",()=>mi<MODULES.length-1?voir(mi+1,0):carnet());
      pied.insertBefore(nx,pied.firstChild);}
    box.appendChild(pied);
  };
  question();
}

/* =========================================================================
   10. RENDU D'UN PAS, CARNET DE NOTES, NAVIGATION
   ========================================================================= */
function voir(m,p,silencieux){
  etat.pos={m:m,p:p};etat.vue="module";if(!silencieux)sauver();
  redessins=[];anims=[];
  const mod=MODULES[m],pas=mod.steps[p],sc=$("#scene");sc.innerHTML="";

  const tete=document.createElement("header");tete.className="verre entete monte";
  const nt=noteDe(m);
  tete.innerHTML='<div class="sur"><i></i>Module '+mod.num+" · "+mod.bloc+"</div>"+
    "<h1>"+mod.titre+"</h1><p>"+mod.resume+"</p>"+
    '<div class="infos"><span class="tag">'+mod.duree+'</span>'+
    '<span class="tag">Pas <b>'+(p+1)+" / "+mod.steps.length+'</b></span>'+
    '<span class="tag">Validés <b>'+faitsDuModule(m)+"</b></span>"+
    (nt?'<span class="tag">Note <b>'+nb(nt.note,1)+" / 20</b></span>":"")+"</div>";
  sc.appendChild(tete);

  const frise=document.createElement("div");frise.className="frise";
  mod.steps.forEach((s,k)=>{
    const b=document.createElement("button");b.type="button";
    b.title=(k+1)+". "+(s.t||"Contrôle");
    if(estFait(m,k))b.dataset.etat="fait";
    if(k===p)b.setAttribute("aria-current","true");
    b.addEventListener("click",()=>voir(m,k));frise.appendChild(b);});
  sc.appendChild(frise);

  const et=pas.k==="c"?"Contrôle noté":pas.k==="a"?"Atelier d'exercices":pas.k==="s"?"Banc d'essai":"Leçon";
  const feuille=document.createElement("section");feuille.className="verre feuille monte";
  feuille.innerHTML='<span class="etiquette">'+et+"</span>"+
    (pas.t?"<h2>"+pas.t+"</h2>":"<h2>Contrôle du module</h2>")+(pas.h||"");
  sc.appendChild(feuille);
  feuille.querySelectorAll("[data-anim]").forEach(f=>monterFigure(f,f.dataset.anim));
  if(pas.k==="s"&&SIMS[pas.sim])SIMS[pas.sim](feuille);
  if(pas.k==="a")rendreAtelier(sc,m,p,pas);
  if(pas.k==="c")rendreControle(sc,m,p,pas);

  if(pas.k==="l"||pas.k==="s"){
    const pied=document.createElement("nav");pied.className="verre pied";
    const prec=document.createElement("button");prec.className="btn btn-secondaire";prec.textContent="← Précédent";
    prec.disabled=(m===0&&p===0);prec.addEventListener("click",reculer);
    const suiv=document.createElement("button");suiv.className="btn btn-principal";
    suiv.textContent=(p===mod.steps.length-1?"Terminer le module":"Continuer")+" →";
    suiv.addEventListener("click",avancer);
    const as=document.createElement("span");as.className="astuce";
    as.innerHTML="<kbd>←</kbd> <kbd>→</kbd> pour naviguer";
    pied.appendChild(prec);pied.appendChild(suiv);pied.appendChild(as);
    sc.appendChild(pied);
  }
  majRail();majGlobal();window.scrollTo({top:0});
}
function avancer(){
  const {m,p}=etat.pos;const k=MODULES[m].steps[p].k;
  if(k==="l"||k==="s")marquer(m,p);
  if(p<MODULES[m].steps.length-1)voir(m,p+1);
  else if(m<MODULES.length-1)voir(m+1,0);
  else carnet();
}
function reculer(){
  const {m,p}=etat.pos;
  if(p>0)voir(m,p-1);else if(m>0)voir(m-1,MODULES[m-1].steps.length-1);
}

/* Révision ciblée : on ne repasse pas tout le module, on reprend

    "<p>"+(ids.length?"Ces notions t'ont fait trébucher plus d'une fois. On les reprend seules, jusqu'à ce qu'elles passent."
      :"Rien ne résiste pour l'instant : ce tableau se remplit tout seul au fil de tes erreurs.")+"</p>";

  b.addEventListener("click",carnet);pied.appendChild(b);sc.appendChild(pied);

  const exp=document.createElement("button");exp.className="btn btn-secondaire btn-fin";
  exp.textContent="Exporter ma progression";
  exp.addEventListener("click",async()=>{
    const j=JSON.stringify({...etat,exporte:new Date().toISOString()},null,1);
    const nom="fil-conducteur-progression.json";
    try{const dl=await window.claude?.use?.("downloads");
      if(dl){await dl.save({filename:nom,data:j});return;}}catch(e){}
    try{const b=new Blob([j],{type:"application/json"}),u=URL.createObjectURL(b);
      const a=document.createElement("a");a.href=u;a.download=nom;document.body.appendChild(a);a.click();
      a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
    catch(e){navigator.clipboard?.writeText(j);alert("Progression copiée dans le presse-papier.");}
  });
  const imp=document.createElement("button");imp.className="btn btn-secondaire btn-fin";
  imp.textContent="Importer une sauvegarde";
  imp.addEventListener("click",()=>{
    const f=document.createElement("input");f.type="file";f.accept="application/json,.json";
    f.addEventListener("change",()=>{const fi=f.files&&f.files[0];if(!fi)return;
      const r=new FileReader();
      r.onload=()=>{try{const v=JSON.parse(r.result);
        if(!v||typeof v!=="object"||!v.faits)throw new Error("fichier inattendu");
        etat.faits=v.faits||{};etat.notes=v.notes||{};etat.essais=v.essais||{};
        etat.pos=v.pos||etat.pos;etat.vuGuide=1;sauver();carnet();}
        catch(e){alert("Ce fichier n'est pas une sauvegarde du Fil Conducteur.");}};
      r.readAsText(fi);});
    f.click();});
  out.appendChild(exp);out.appendChild(imp);
  const raz=document.createElement("button");raz.className="btn btn-destructif btn-fin";
  raz.textContent="Tout réinitialiser";
  raz.addEventListener("click",()=>{
    if(!confirm("Effacer toute la progression et toutes les notes ?"))return;
    etat={pos:{m:0,p:0},faits:{},notes:{},essais:{},vue:"module"};sauver();voir(0,0);});
  out.appendChild(raz);
  s.appendChild(out);sc.appendChild(s);
  majRail();majGlobal();window.scrollTo({top:0});
}

/* ---- Thème, barre, clavier ---- */
function theme(){
  const r=document.documentElement;
  const sombre=r.dataset.theme?r.dataset.theme==="sombre":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=sombre?"clair":"sombre";
  try{localStorage.setItem(CLE+"-theme",r.dataset.theme);}catch(e){}
  requestAnimationFrame(()=>redessins.forEach(f=>f()));
}
try{const t=localStorage.getItem(CLE+"-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
$("#bascule-theme").addEventListener("click",theme);
/* Le volet du parcours : un interrupteur, et son état est retenu. */
function poserRail(v){
  document.querySelector(".page").dataset.rail=v?"on":"off";
  $("#ouvrir-rail").setAttribute("aria-pressed",v?"true":"false");
  $("#ouvrir-rail").title=v?"Masquer le parcours":"Afficher le parcours";
  requestAnimationFrame(()=>redessins.forEach(f=>f()));
}
$("#ouvrir-rail").addEventListener("click",()=>{
  const v=document.querySelector(".page").dataset.rail!=="on";
  etat.rail=v?"on":"off";sauver();poserRail(v);});
$("#voir-carnet").addEventListener("click",carnet);
$("#voir-guide").addEventListener("click",guide);
$("#accueil").addEventListener("click",guide);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>redessins.forEach(f=>f()));
addEventListener("scroll",()=>{$("#barre").dataset.defile=scrollY>10?"oui":"non";},{passive:true});
addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(etat.vue!=="module")return;
  const k=MODULES[etat.pos.m].steps[etat.pos.p].k;
  if(k!=="l"&&k!=="s")return;
  if(e.key==="ArrowRight"){e.preventDefault();avancer();}
  if(e.key==="ArrowLeft"){e.preventDefault();reculer();}
});
let tr=null;
addEventListener("resize",()=>{clearTimeout(tr);tr=setTimeout(()=>redessins.forEach(f=>f()),140);});

localCharger();
poserRail(etat.rail?etat.rail==="on":innerWidth>1040);
if(etat.vuGuide)voir(etat.pos.m||0,etat.pos.p||0,true);else guide();
brancherBase();
</script>

<style>
/* ---- Figures animées : le cadre autour du dessin ---- */
.fig{margin:0 0 22px;padding:0;border-radius:var(--r-s);background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.fig-tete{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface-2)}
.fig-tete b{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.fig-geste{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--primary);
  background:color-mix(in srgb,var(--primary) 12%,transparent);padding:3px 9px;border-radius:999px}
.fig-play{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;flex:none;position:relative}
.fig-play:hover{border-color:var(--primary)}
.fig-play::before{content:"";position:absolute;inset:0;margin:auto;width:0;height:0}
.fig-play[data-e="play"]::before{border-left:9px solid var(--primary);border-top:6px solid transparent;
  border-bottom:6px solid transparent;left:3px}
.fig-play[data-e="pause"]::before{width:9px;height:11px;border-left:3px solid var(--primary);
  border-right:3px solid var(--primary)}
.fig-zone{padding:14px 14px 0}
.fig canvas{background:transparent;box-shadow:none;border-radius:0}
.fig .regl{padding:14px 16px 4px;margin:0}
.fig-note{margin:0;padding:12px 16px 14px;font-size:13.2px;color:var(--muted);line-height:1.5;max-width:74ch}
canvas.manip{cursor:grab;touch-action:none}
canvas.manip:active{cursor:grabbing}

/* ---- La correction pas à pas : flèches et code couleur ---- */
/* ---- Page de prise en main ---- */
.prise{list-style:none;counter-reset:pr;margin:0;padding:0;max-width:none;display:grid;gap:14px}
.prise li{counter-increment:pr;position:relative;padding:14px 18px 14px 56px;border-radius:12px;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.prise li::before{content:counter(pr);position:absolute;left:16px;top:14px;width:26px;height:26px;border-radius:9px;
  background:var(--primary);color:var(--on-primary);font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;font-weight:600;display:grid;place-items:center}
.prise li b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.prise li span{display:block;font-size:14.4px;color:var(--muted);line-height:1.55}
.prise li span b{display:inline;font-size:inherit;color:var(--text)}
.pied .astuce b{color:var(--primary)}
.corr{display:flex;flex-direction:column;gap:14px}
.corr-cible{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.corr-case{border-radius:12px;padding:11px 14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.corr-case .k{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.corr-cherche{background:color-mix(in srgb,var(--primary) 9%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 26%,transparent)}
.corr-cherche .k{color:var(--primary)}
.corr-case .v{font-size:14.5px;font-weight:500;display:block}
.corr-case .sous{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.corr-case .v .u{font-style:normal;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  padding:4px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px currentColor}
.corr-etapes{list-style:none;margin:0;padding:0;max-width:none}
.corr-etapes>li{margin:0;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.corr-etapes>li>.n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;
  background:color-mix(in srgb,var(--primary) 13%,var(--surface));color:var(--primary);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 28%,transparent)}
.corr-etapes>li>.c{min-width:0;padding-top:3px}
.corr-etapes>li>.c p{margin:0;font-size:14.8px;line-height:1.5;max-width:64ch}
/* la flèche entre deux étapes : elle dit « et maintenant on fait ça » */
.corr-etapes>li.fl{display:block;height:26px;position:relative;margin:2px 0}
.corr-etapes>li.fl .tige{position:absolute;left:14px;top:0;width:2px;height:17px;
  background:color-mix(in srgb,var(--primary) 42%,transparent);border-radius:2px}
.corr-etapes>li.fl .tete{position:absolute;left:9px;top:15px;width:0;height:0;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:8px solid color-mix(in srgb,var(--primary) 55%,transparent)}
.corr .op{display:block;font-family:"IBM Plex Mono",monospace;font-size:14.5px;line-height:1.75;
  background:var(--surface-2);border-radius:9px;padding:9px 13px;margin-top:7px;overflow-x:auto;
  box-shadow:inset 0 0 0 1px var(--border)}
.corr .op-fin{background:color-mix(in srgb,var(--primary) 8%,var(--surface));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--primary) 30%,transparent)}
.corr .q{font-weight:700}
.corr .q-u,.chip.q-u{color:var(--q-u)} .corr .q-i,.chip.q-i{color:var(--q-i)}
.corr .q-r,.chip.q-r{color:var(--q-r)} .corr .q-p,.chip.q-p{color:var(--q-p)}
.corr .q-t,.chip.q-t{color:var(--q-t)} .corr .q-a,.chip.q-a{color:var(--q-a)}
.corr .num{font-style:normal;color:var(--text);font-weight:600}
.corr-final{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;
  background:color-mix(in srgb,var(--success) 12%,var(--surface));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--success) 32%,transparent)}
.corr-final .k{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--success)}
.corr-final b{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;color:var(--text)}
.corr-legende{display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:11.5px;color:var(--muted)}
.corr-legende em{font-style:normal;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.corr-legende em::before{content:"";width:9px;height:9px;border-radius:3px;background:currentColor}
@media(max-width:520px){.corr-etapes>li{grid-template-columns:24px minmax(0,1fr);gap:9px}
  .corr-etapes>li>.n{width:24px;height:24px;font-size:11px}
  .corr-etapes>li.fl .tige{left:11px}.corr-etapes>li.fl .tete{left:6px}}
.atelier{overflow:hidden}
.palier{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px}
.palier[data-e="doux"]{background:color-mix(in srgb,var(--success) 14%,var(--surface));color:var(--success)}
.palier[data-e="normal"]{background:var(--surface-2);color:var(--muted)}
.autrement{margin-top:14px}
.autre-corps{border-radius:10px;padding:13px 16px;
  background:color-mix(in srgb,var(--primary) 8%,var(--surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 24%,transparent)}
.autre-corps .chapo{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--primary);margin-bottom:6px}
.autre-corps p{margin:0;font-size:14.6px;line-height:1.6;max-width:66ch}
</style>

{id:"m25",num:"25",bloc:"Transition énergétique",an:2,titre:"Produire, stocker, recharger, communiquer",duree:"32 min",
 resume:"Photovoltaïque, autoconsommation, stockage, bornes de recharge et réseaux de communication : les sujets que le métier attend aujourd'hui.",
 steps:[
 {k:"l",t:"La chaîne photovoltaïque",h:`
  <p>Une installation solaire mobilise tout ce que tu as vu depuis le module 07 : loi d'Ohm, association série et parallèle, hacheur, onduleur, protections. Rien de nouveau — un assemblage nouveau.</p>
  <figure data-anim="pv-chaine"></figure>
  <div class="tabl"><table>
   <tr><th>Étage</th><th>Rôle</th><th>Ce que tu connais déjà</th></tr>
   <tr><td>Modules en série (chaîne)</td><td>additionner les tensions</td><td>association série, module 08</td></tr>
   <tr><td>Chaînes en parallèle</td><td>additionner les courants</td><td>loi des nœuds, module 08</td></tr>
   <tr><td>MPPT</td><td>chercher en continu le point de puissance maximale</td><td>c'est un hacheur, module 18</td></tr>
   <tr><td>Onduleur</td><td>continu vers alternatif réseau</td><td>MLI, module 19</td></tr>
   <tr><td>Protection de découplage</td><td>couper si le réseau disparaît</td><td>obligatoire : sinon on réalimente une ligne censée être morte</td></tr>
  </table></div>
  <h3>Le calcul qui dimensionne tout : la tension à vide en hiver</h3>
  <p>Un module produit d'autant plus de <strong>tension</strong> qu'il fait <strong>froid</strong>. La contrainte n'est donc pas l'été, c'est le matin d'hiver ensoleillé.</p>
  <div class="formule">U_oc(θ) = U_oc(25 °C) × [ 1 + β · (θ − 25) ]<span class="note">β ≈ −0,28 %/°C : négatif, donc la tension MONTE quand la température descend.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>18 modules en série, U_oc = 41,5 V à 25 °C, β = −0,28 %/°C. Tension maximale à −10 °C ?</p>
   <ol>
    <li>Écart de température par rapport aux conditions d'essai.<span class="op">−10 − 25 = −35 °C</span></li>
    <li>Correction de tension par module.<span class="op">1 + (−0,0028 × −35) = 1 + 0,098 = 1,098</span></li>
    <li>Tension d'un module au froid.<span class="op">41,5 × 1,098 = 45,6 V</span></li>
    <li>Tension de la chaîne entière.<span class="op">18 × 45,6 = 820 V</span></li>
   </ol>
   <div class="final">820 V. Un onduleur limité à 1000 V passe ; à 800 V, il est détruit dès la première gelée ensoleillée.</div></div>
  <div class="encart e-piege"><span class="chapo">Le continu n'est pas l'alternatif</span><p>Un champ éclairé est <strong>toujours sous tension</strong> : on ne le consigne pas côté panneaux, on le sectionne. Et le courant continu ne passe jamais par zéro : l'arc s'entretient. Un appareil de coupure alternatif n'a rien à faire là, il faut du matériel spécifiquement DC.</p></div>`},
 {k:"l",t:"Autoconsommation et stockage",h:`
  <p>Produire ne suffit pas : le soleil donne à midi, le logement consomme le soir. Deux indicateurs, souvent confondus, disent ce qui se passe réellement.</p>
  <div class="formule">taux d'autoconsommation = énergie produite ET consommée sur place / énergie produite
taux d'autoproduction = énergie produite ET consommée sur place / énergie consommée<span class="note">Le premier dit « combien de ma production je garde », le second « quelle part de mes besoins je couvre ».</span></div>
  <figure data-anim="autoconso"></figure>
  <p>Fais varier la batterie ci-dessus : la zone pleine est ce qui est réellement autoconsommé. Sans stockage, le surplus de midi part sur le réseau et le soir se paie au tarif plein.</p>
  <div class="tabl"><table>
   <tr><th>Technologie de stockage</th><th>Points forts</th><th>Limites</th></tr>
   <tr><td>Lithium fer phosphate (LFP)</td><td>durée de vie, sécurité thermique</td><td>densité d'énergie moindre</td></tr>
   <tr><td>Lithium NMC</td><td>compact, forte densité</td><td>plus sensible en température</td></tr>
   <tr><td>Plomb ouvert ou AGM</td><td>coût initial bas</td><td>cyclage limité, décharge profonde interdite</td></tr>
  </table></div>
  <div class="encart e-terrain"><span class="chapo">Le BMS n'est pas un accessoire</span><p>Le <strong>Battery Management System</strong> équilibre les cellules, coupe en cas de surtension, de sous-tension ou de température excessive, et dialogue avec le convertisseur. Une batterie lithium sans BMS actif n'est pas une installation dégradée, c'est un incendie en attente.</p></div>`},
 {k:"l",t:"Les bornes de recharge",h:`
  <p>La recharge de véhicule électrique concentre presque tous les modules du parcours : dimensionnement, régime de neutre, différentiel, communication, gestion de puissance.</p>
  <div class="tabl"><table>
   <tr><th>Mode</th><th>Ce que c'est</th><th>Usage</th></tr>
   <tr><td class="mono">Mode 2</td><td>prise domestique et boîtier de contrôle sur le câble</td><td>dépannage, courant limité</td></tr>
   <tr><td class="mono">Mode 3</td><td>borne dédiée, dialogue véhicule et borne</td><td>la solution normale en alternatif</td></tr>
   <tr><td class="mono">Mode 4</td><td>charge en continu, l'électronique est dans la borne</td><td>recharge rapide</td></tr>
  </table></div>
  <div class="formule">monophasé : I = P / U          triphasé : I = P / (√3 · U)<span class="note">Une borne 7,4 kW monophasée appelle 32 A. Une borne 22 kW triphasée appelle aussi 32 A.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Borne de 11 kW en 400 V triphasé, véhicule à batterie de 60 kWh chargé de 20 à 80 %, rendement 0,90.</p>
   <ol>
    <li>Courant appelé.<span class="op">I = 11 000 / (1,732 × 400) = 15,9 A</span></li>

/* ---- L'échelle des préfixes : une valeur, plusieurs écritures ---- */
Object.assign(ANIM,{
"echelle-prefixes":{t:"La même valeur, écrite autrement",ratio:2.15,main:true,
 note:"Fais glisser le curseur sur l'échelle. La valeur ne change pas : c'est la virgule qui se déplace.",
 regl:[{id:"v",lib:"Valeur de départ",min:1,max:9.9,pas:0.1,val:4.7,u:""},
       {id:"u",lib:"Grandeur",choix:["farad (F)","ohm (Ω)","volt (V)","henry (H)"],val:0}],
 etat:{i:3},
 ECH:[["G",9,"giga"],["M",6,"méga"],["k",3,"kilo"],["",0,"unité"],["m",-3,"milli"],["µ",-6,"micro"],["n",-9,"nano"]],
 zoneX(w,i){return w*0.10+ (w*0.80)*(i/6);},
 clic(p,x,y,w,h,e){return this.glisse(p,x,y,w,h,e);},
 glisse(p,x,y,w,h,e){
  let best=0,d=1e9;
  for(let i=0;i<7;i++){const dd=Math.abs(x-this.zoneX(w,i));if(dd<d){d=dd;best=i;}}
  if(e.i!==best){e.i=best;return true;}return false;},
 dessin(c,w,h,t,p,e){
  const U=["F","Ω","V","H"][p.u], base=p.v*Math.pow(10,-3);   /* on part du milli */
  const y=h*0.40;
  c.strokeStyle=CB();c.lineWidth=2;
  c.beginPath();c.moveTo(w*0.08,y);c.lineTo(w*0.92,y);c.stroke();
  this.ECH.forEach((s,i)=>{
   const x=this.zoneX(w,i), on=i===e.i;
   c.strokeStyle=on?C1():CB();c.lineWidth=on?2.6:1.6;
   c.beginPath();c.moveTo(x,y-9);c.lineTo(x,y+9);c.stroke();
   if(on){c.fillStyle=C1();c.beginPath();c.arc(x,y,7,0,TAU);c.fill();}
   mono(c,s[0]||"—",x,y-24,on?15:13,on?C1():CM(),"center");
   txt(c,s[2],x,y+24,on?11:10,on?CI():CM(),"center",on);
   mono(c,"10"+(s[1]>=0?"":"⁻")+String(Math.abs(s[1])).split("").map(d=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[+d]).join(""),x,y+40,9.5,CM(),"center");
  });
  /* la valeur, écrite avec le préfixe choisi */
  const ex=this.ECH[e.i][1], val=base/Math.pow(10,ex);
  const ecrit=(v)=>{
   if(v>=1e5||(v<1e-3&&v>0))return v.toExponential(3).replace(".",",");
   let s=v.toFixed(Math.max(0,Math.min(9,6-Math.floor(Math.log10(Math.max(v,1e-12))))));
   if(s.indexOf(".")>=0)s=s.replace(/0+$/,"").replace(/\.$/,"");
   return s.replace(".",",");};
  const txtVal=ecrit(val)+" "+this.ECH[e.i][0]+U;
  c.font='600 30px "IBM Plex Mono", monospace';c.textAlign="center";c.textBaseline="middle";
  c.fillStyle=C1();c.fillText(txtVal,w*0.5,h*0.76);
  const ref=e.i===4?null:"c'est exactement la même chose que "+ecrit(base*1000)+" m"+U;
  txt(c,ref||"la valeur de base, sans préfixe",w*0.5,h*0.90,12,CM(),"center");
  txt(c,"une seule valeur physique, sept façons de l'écrire",w*0.5,h*0.10,12,CM(),"center");
 }}

Object.assign(ANIM,{
"transposition":{t:"Isoler une inconnue, sans réfléchir",ratio:2.1,main:true,

 dessin(c,w,h,t,p){

  if(regle)txt(c,regle,cx,h*0.93,11.5,CM(),"center");
  /* le contrôle par les unités */
  const un=[["W","V","A"],["V","Ω","A"],["W","Ω","A"]][p.f];

 }}
});

"autoconso":{t:"Autoconsommation sur une journée",ratio:2.1,

 regl:[{id:"pc",lib:"Puissance installée",min:1,max:9,pas:0.5,val:3,u:"kWc"},
       {id:"bat",lib:"Batterie",min:0,max:15,pas:0.5,val:0,u:"kWh"}],
 dessin(c,w,h,t,p){
  const N=48, prod=[],cons=[];
  for(let i=0;i<N;i++){const hh=i/N*24;
   prod.push(Math.max(0,p.pc*Math.exp(-Math.pow((hh-13)/3.1,2))));
   cons.push(0.25+0.9*Math.exp(-Math.pow((hh-7.5)/1.1,2))+1.5*Math.exp(-Math.pow((hh-19.5)/1.6,2))+0.35*Math.exp(-Math.pow((hh-12.5)/1.2,2)));}
  const dt=24/N;
  let direct=0,surplus=0,manque=0;
  for(let i=0;i<N;i++){const d=Math.min(prod[i],cons[i]);direct+=d*dt;
   surplus+=Math.max(0,prod[i]-cons[i])*dt;manque+=Math.max(0,cons[i]-prod[i])*dt;}
  const stocke=Math.min(p.bat,surplus,manque);
  const Eprod=prod.reduce((a,b)=>a+b,0)*dt, Econs=cons.reduce((a,b)=>a+b,0)*dt;
  const taux=(direct+stocke)/Math.max(Eprod,0.01)*100;
  const x0=44,lw=w*0.62,gy=h*0.80,gh=h*0.62;
  const mx=Math.max(...prod,...cons,1);
  const X=i=>x0+lw*(i/(N-1)), Y=v=>gy-gh*(v/mx);
  c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.moveTo(x0,gy);c.lineTo(x0+lw,gy);
  c.moveTo(x0,gy-gh);c.lineTo(x0,gy);c.stroke();
  [0,6,12,18,24].forEach(hh=>{const x=x0+lw*(hh/24);
   c.strokeStyle=CB();c.globalAlpha=.4;c.beginPath();c.moveTo(x,gy);c.lineTo(x,gy-gh);c.stroke();c.globalAlpha=1;
   txt(c,hh+" h",x,gy+13,10,CM(),"center");});
  /* zone autoconsommée */
  c.fillStyle=C2();c.globalAlpha=.30;c.beginPath();c.moveTo(X(0),gy);
  for(let i=0;i<N;i++)c.lineTo(X(i),Y(Math.min(prod[i],cons[i])));
  c.lineTo(X(N-1),gy);c.closePath();c.fill();c.globalAlpha=1;
  /* surplus */
  c.fillStyle=C1();c.globalAlpha=.16;c.beginPath();let ouvert=false;
  for(let i=0;i<N;i++){if(prod[i]>cons[i]){if(!ouvert){c.moveTo(X(i),Y(cons[i]));ouvert=true;}c.lineTo(X(i),Y(prod[i]));}}
  for(let i=N-1;i>=0;i--){if(prod[i]>cons[i])c.lineTo(X(i),Y(cons[i]));}
  c.closePath();c.fill();c.globalAlpha=1;
  const courbe=(arr,col,ep)=>{c.strokeStyle=col;c.lineWidth=ep;c.beginPath();
   arr.forEach((v,i)=>{i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v));});c.stroke();};
  courbe(prod,C1(),2.6);courbe(cons,C3(),2.4);
  txt(c,"production",x0+lw*0.52,Y(Math.max(...prod))-12,11,C1(),"center",true);
  txt(c,"consommation",x0+6,Y(cons[0])-12,11,C3(),"left",true);

/* =========================================================================
   LES EXAMENS DE PALIER
   Chaque bloc se termine par une épreuve qui puise dans TOUTES ses notions,
   forme composée comprise. 12 sur 20 pour valider et ouvrir le palier
   suivant. On peut passer outre, mais on le fait en connaissance de cause.
   ========================================================================= */
function preparerExamens(MODULES){
  if(MODULES.some(m=>m.examen))return MODULES;
  const blocs=[];
  MODULES.forEach((m,i)=>{
    let b=blocs.find(x=>x.nom===m.bloc);
    if(!b){b={nom:m.bloc,gen:new Set(),fin:i};blocs.push(b);}
    b.fin=i;
    m.steps.forEach(s=>(s.gen||[]).forEach(g=>b.gen.add(g)));
  });
  /* on ajoute la forme composée de chaque notion présente dans le bloc */
  blocs.forEach(b=>{[...b.gen].forEach(g=>{if(DUR[g]&&GEN[DUR[g]])b.gen.add(DUR[g]);});});
  /* insertion en partant de la fin, pour ne pas décaler les index */
  blocs.slice().reverse().forEach((b,r)=>{
    const n=blocs.length-r;
    const gen=[...b.gen].filter(g=>GEN[g]);
    const anBloc=MODULES.filter(m=>m.bloc===b.nom&&!m.examen).map(m=>m.an||0)[0]||0;
    MODULES.splice(b.fin+1,0,{
      id:"ex"+n,num:"E"+n,bloc:b.nom,examen:true,an:anBloc,
      titre:"Examen — "+b.nom,duree:"20 min",
      resume:"L'épreuve qui valide le palier « "+b.nom+" ». Toutes les notions du bloc, sous leur forme composée quand elle existe. 12 sur 20 pour ouvrir la suite.",
      steps:[{k:"c",t:"Examen de palier",gen:gen,n:Math.min(12,Math.max(10,gen.length)),seuil:12}]
    });
  });
  return MODULES;
}

/* Un palier reste fermé tant que l'examen précédent n'est pas franchi. */
function examenAvant(i){
  for(let k=i-1;k>=0;k--)if(MODULES[k].examen)return k;
  return -1;
}
function estVerrouille(i){
  const e=examenAvant(i);if(e<0)return false;
  if(etat.forcer&&etat.forcer[MODULES[e].id])return false;
  const n=etat.notes[MODULES[e].id];
  return !(n&&n.note>=12);
}

"resonance":{t:"La résonance série",ratio:2.2,

   const X=x0+lw*(f/fmax),Y=gy-gh*Math.min(I/Imax,1);i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();
  const xf0=x0+lw*(f0/fmax);

   txt(c,l[0],px,h*0.14+i*(h*0.17),10.5,CM());

 }}

/* Glisser directement dans certaines figures : le geste remplace le curseur. */
ANIM["cercle-trigo"].glisse=function(p,x,y,w,h){
  const rr=Math.min(h*0.40,w*0.19),cx=rr+46,cy=h/2;
  let a=Math.atan2(cy-y,x-cx)*180/Math.PI;if(a<0)a+=360;
  p.a=Math.round(a/5)*5;p.auto=0;return true;};
ANIM["cercle-trigo"].main=true;
ANIM["harmoniques"].glisse=function(p,x,y,w,h){
  const x0=40,lw=w*0.62,sx=x0+lw+w*0.05,sw=w-sx-16,by=h*0.76,bh=h*0.5;
  if(x<sx)return false;
  const i=Math.floor((x-sx)/(sw/4.4));
  const v=Math.max(0,Math.min(50,Math.round((by-y)/bh*100/5)*5));
  if(i===1)p.h3=v;else if(i===2)p.h5=v;else if(i===3)p.h7=Math.min(40,v);else return false;
  return true;};
ANIM["harmoniques"].main=true;
ANIM["chute-ligne"].glisse=function(p,x,y,w,h){
  const x0=w*0.10,x1=w*0.86;
  if(y<h*0.20||y>h*0.68)return false;
  p.l=Math.max(10,Math.min(300,Math.round((x-x0)/(x1-x0)*300/10)*10));return true;};
ANIM["chute-ligne"].main=true;
ANIM["triangle-puissances"].glisse=function(p,x,y,w,h){
  const t1=Math.tan(Math.acos(p.c1)),ox=w*0.09,oy=h*0.86;
  const ech=Math.min((w*0.52)/p.p,(h*0.70)/Math.max(p.p*t1,1));
  const dx=(ox+p.p*ech)-ox, dy=Math.max(0,oy-y);
  if(dx<=0)return false;
  const tg=dy/(dx);const cs=Math.cos(Math.atan(tg));
  p.c2=Math.max(0.8,Math.min(1,Math.round(cs*100)/100));return true;};
ANIM["triangle-puissances"].main=true;
ANIM["defaut-terre"].clic=function(p,x,y,w,h){p.d=p.d?0:1;return true;};
ANIM["defaut-terre"].main=true;

const $=s=>document.querySelector(s);

let redessins=[],anims=[];
function toile(hote,ratio,dessin){
  const cv=document.createElement("canvas");hote.appendChild(cv);
  const rendu=()=>{
    const w=cv.clientWidth||620,h=Math.round(w/ratio),d=Math.min(2,window.devicePixelRatio||1);

}
function creerBanc(titre,note){
  const d=document.createElement("div");d.className="banc";
  d.innerHTML='<div class="banc-tete"><span class="pt"></span><b>'+titre+'</b><span>'+note+'</span></div><div class="banc-corps"></div>';
  return {racine:d,corps:d.querySelector(".banc-corps")};
}
const curs=(id,lib,min,max,pas,val,unite)=>
 '<label><span class="lg">'+lib+'<b><span id="v-'+id+'">'+String(val).replace(".",",")+'</span> '+unite+'</b></span>'+
 '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+pas+'" value="'+val+'"></label>';
const lect=l=>'<div class="lect">'+l.map(x=>'<div><span class="k">'+x[0]+'</span><span class="v" id="r-'+x[1]+'">—</span></div>').join("")+"</div>";
function poser(id,val,unite,ton){
  const e=$("#r-"+id);if(!e)return;
  e.innerHTML=val+(unite?'<u> '+unite+"</u>":"");
  if(ton)e.dataset.ton=ton;else e.removeAttribute("data-ton");
}
function cadre(c,w,h,pad){c.strokeStyle=CB();c.lineWidth=1;
  c.beginPath();c.moveTo(pad.g,h-pad.b);c.lineTo(w-pad.d,h-pad.b);c.stroke();}
function texte(c,s,x,y,taille,coul,align){
  c.fillStyle=coul||CM();c.font=(taille||10)+'px "IBM Plex Mono", monospace';
  c.textAlign=align||"left";c.textBaseline="middle";c.fillText(s,x,y);}

/* ---------- Loi d'Ohm : la puissance suit le CARRÉ du courant ---------- */
ohm(c0){
 const b=creerBanc("Loi d'Ohm et effet Joule","Régime continu");c0.appendChild(b.racine);
 b.corps.innerHTML='<div class="regl">'+curs("o-u","Tension U",5,400,5,230,"V")+curs("o-r","Résistance R",2,300,1,100,"Ω")+"</div>"+
  lect([["Courant I","o-i"],["Puissance P","o-p"],["Énergie sur 1 h","o-w"]]);
 const cv=document.createElement("div");b.corps.appendChild(cv);
 let U=230,R=100;
 const rendu=toile(cv,2.6,(c,w,h)=>{
  const p={g:44,d:14,t:14,b:26};
  const I=U/R,Imax=Math.max(I*1.6,0.5),Pmax=R*Imax*Imax;
  cadre(c,w,h,p);
  c.strokeStyle=CB();c.beginPath();c.moveTo(p.g,p.t);c.lineTo(p.g,h-p.b);c.stroke();
  c.strokeStyle=C1();c.lineWidth=2;c.beginPath();
  for(let i=0;i<=120;i++){const x=Imax*i/120,y=R*x*x;
   const px=p.g+(w-p.g-p.d)*(x/Imax),py=(h-p.b)-(h-p.b-p.t)*(y/Pmax);
   i?c.lineTo(px,py):c.moveTo(px,py);}
  c.stroke();
  const px=p.g+(w-p.g-p.d)*(I/Imax),py=(h-p.b)-(h-p.b-p.t)*(R*I*I/Pmax);
  c.setLineDash([3,3]);c.strokeStyle=CM();c.lineWidth=1;
  c.beginPath();c.moveTo(px,py);c.lineTo(px,h-p.b);c.moveTo(px,py);c.lineTo(p.g,py);c.stroke();c.setLineDash([]);
  c.fillStyle=C1();c.beginPath();c.arc(px,py,4.5,0,7);c.fill();
  texte(c,"P (W)",p.g-4,p.t+4,10,CM(),"right");
  texte(c,"I (A)",w-p.d,h-p.b+13,10,CM(),"right");
  texte(c,nb(R*I*I,0),px+7,py-9,11,C1());
 });
 const maj=()=>{
  U=+$("#o-u").value;R=+$("#o-r").value;$("#v-o-u").textContent=U;$("#v-o-r").textContent=R;
  const I=U/R,P=U*I;
  poser("o-i",nb(I,2),"A");poser("o-p",nb(P,0),"W","ac");poser("o-w",nb(P/1000,2),"kWh");
  rendu();
 };
 b.corps.querySelectorAll("input").forEach(i=>i.addEventListener("input",maj));maj();
},

/* ---------- Le sinus : efficace, période, déphasage ---------- */
sinus(c0){
 const b=creerBanc("Oscillogramme","Régime sinusoïdal");c0.appendChild(b.racine);
 b.corps.innerHTML='<div class="regl">'+curs("s-a","Amplitude U max",50,600,5,325,"V")+curs("s-f","Fréquence f",10,100,1,50,"Hz")+curs("s-p","Déphasage φ",-180,180,5,0,"°")+"</div>"+
  lect([["Valeur efficace","s-e"],["Période T","s-t"],["Pulsation ω","s-w"],["Décalage","s-d"]]);
 const cv=document.createElement("div");b.corps.appendChild(cv);
 let A=325,F=50,P=0;
 const rendu=toile(cv,2.7,(c,w,h)=>{
  const m={g:40,d:12,t:16,b:22},H=h-m.t-m.b,mid=m.t+H/2;
  c.strokeStyle=CB();c.lineWidth=1;
  for(let k=-1;k<=1;k+=0.5){const y=mid-(H/2)*k;c.beginPath();c.moveTo(m.g,y);c.lineTo(w-m.d,y);c.stroke();}
  c.strokeStyle=CB();c.beginPath();c.moveTo(m.g,mid);c.lineTo(w-m.d,mid);c.stroke();
  const eff=A/Math.SQRT2;
  c.setLineDash([4,4]);c.strokeStyle=T("--primary-hover");
  [1,-1].forEach(s=>{const y=mid-(H/2)*(s*eff/A);c.beginPath();c.moveTo(m.g,y);c.lineTo(w-m.d,y);c.stroke();});
  c.setLineDash([]);
  c.strokeStyle=C1();c.lineWidth=2.2;c.beginPath();
  for(let i=0;i<=360;i++){const t=i/360*2,ang=2*Math.PI*t+P*Math.PI/180;
   const x=m.g+(w-m.g-m.d)*(i/360),y=mid-(H/2)*Math.sin(ang);
   i?c.lineTo(x,y):c.moveTo(x,y);}
  c.stroke();
  texte(c,nb(A,0)+" V",m.g-5,m.t+3,10,CM(),"right");
  texte(c,nb(eff,0)+" V eff",m.g-5,mid-(H/2)*(eff/A),10,T("--primary-hover"),"right");
  texte(c,"2 périodes",w-m.d,h-m.b+11,10,CM(),"right");
 });
 const maj=()=>{
  A=+$("#s-a").value;F=+$("#s-f").value;P=+$("#s-p").value;
  $("#v-s-a").textContent=A;$("#v-s-f").textContent=F;$("#v-s-p").textContent=P;
  poser("s-e",nb(A/Math.SQRT2,1),"V","ac");poser("s-t",nb(1000/F,1),"ms");
  poser("s-w",nb(2*Math.PI*F,0),"rad/s");poser("s-d",nb(P/360*1000/F,2),"ms");
  rendu();
 };
 b.corps.querySelectorAll("input").forEach(i=>i.addEventListener("input",maj));maj();
},

 b.corps.innerHTML='<div class="regl">'+curs("z-r","Résistance R",1,150,1,20,"Ω")+curs("z-l","Inductance L",1,500,1,100,"mH")+curs("z-f","Fréquence f",10,500,5,50,"Hz")+"</div>"+

/* ---------- Compensation d'énergie réactive ---------- */
puissances(c0){
 const b=creerBanc("Compensation du facteur de puissance","Triangle des puissances");c0.appendChild(b.racine);
 b.corps.innerHTML='<div class="regl">'+curs("p-p","Puissance active P",5,500,5,120,"kW")+
   curs("p-1","cos φ actuel",0.4,0.95,0.01,0.75,"")+curs("p-2","cos φ visé",0.85,1,0.01,0.95,"")+
   '<label><span class="lg">Réseau<b>&nbsp;</b></span><select id="p-u"><option value="400">400 V triphasé</option><option value="230">230 V monophasé</option></select></label>'+
   '<label><span class="lg">Couplage des condensateurs<b>&nbsp;</b></span><select id="p-k"><option value="3">Triangle</option><option value="1">Étoile</option></select></label></div>'+
  lect([["Q à compenser","p-qc"],["Capacité par phase","p-c"],["S avant","p-s1"],["S après","p-s2"],["I avant","p-i1"],["I après","p-i2"]]);
 const cv=document.createElement("div");b.corps.appendChild(cv);
 let P=120,c1=.75,c2=.95,U=400;
 const rendu=toile(cv,2.6,(c,w,h)=>{
  const t1=Math.tan(Math.acos(c1)),t2=Math.tan(Math.acos(c2));
  const m=26,ox=m,oy=h-m,ech=Math.min((w-2*m)/P,(h-2*m)/(P*t1))*0.9;
  c.strokeStyle=CB();c.lineWidth=2;c.beginPath();c.moveTo(ox,oy);c.lineTo(ox+P*ech,oy);c.stroke();
  c.strokeStyle=C3();c.lineWidth=2;c.beginPath();
  c.moveTo(ox+P*ech,oy);c.lineTo(ox+P*ech,oy-P*t1*ech);c.stroke();
  c.strokeStyle=C2();c.lineWidth=3.5;c.beginPath();
  c.moveTo(ox+P*ech,oy-P*t2*ech);c.lineTo(ox+P*ech,oy-P*t1*ech);c.stroke();
  c.strokeStyle=CM();c.lineWidth=1.5;c.setLineDash([4,3]);c.beginPath();
  c.moveTo(ox,oy);c.lineTo(ox+P*ech,oy-P*t1*ech);c.stroke();c.setLineDash([]);
  c.strokeStyle=C1();c.lineWidth=3;c.beginPath();
  c.moveTo(ox,oy);c.lineTo(ox+P*ech,oy-P*t2*ech);c.stroke();
  texte(c,"P "+nb(P,0)+" kW",ox+P*ech/2,oy+12,10.5,CM(),"center");
  texte(c,"Qc "+nb(P*(t1-t2),0)+" kvar",ox+P*ech-8,oy-P*(t1+t2)/2*ech,10.5,C2(),"right");
  texte(c,"S avant "+nb(P/c1,0),ox+P*ech*0.42,oy-P*t1*ech*0.42-9,10,CM(),"center");

 });
 const maj=()=>{
  P=+$("#p-p").value;c1=+$("#p-1").value;c2=+$("#p-2").value;U=+$("#p-u").value;

  $("#v-p-p").textContent=P;$("#v-p-1").textContent=nb(c1,2);$("#v-p-2").textContent=nb(c2,2);
  const t1=Math.tan(Math.acos(c1)),t2=Math.tan(Math.acos(c2)),Qc=P*(t1-t2);

  const C=tri? Qc*1000/(k*U*U*2*Math.PI*50)*1e6 : Qc*1000/(U*U*2*Math.PI*50)*1e6;

  $("#p-k").disabled=!tri;
  rendu();
 };
 b.corps.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",maj));maj();
},

/* ---------- Triphasé : le courant de neutre naît du déséquilibre ---------- */
triphase(c0){
 const b=creerBanc("Réseau triphasé","Courant de neutre");c0.appendChild(b.racine);
 b.corps.innerHTML='<div class="regl">'+curs("t-v","Tension simple V",200,250,1,230,"V")+
   curs("t-1","Courant phase 1",0,40,1,20,"A")+curs("t-2","Courant phase 2",0,40,1,20,"A")+curs("t-3","Courant phase 3",0,40,1,20,"A")+"</div>"+
  lect([["Tension composée U","t-u"],["Courant de neutre","t-n"],["Puissance totale","t-p"],["Déséquilibre","t-d"]]);
 const cv=document.createElement("div");b.corps.appendChild(cv);
 let V=230,I=[20,20,20];
 const rendu=toile(cv,2.7,(c,w,h)=>{
  const m={g:14,d:12,t:14,b:20},H=h-m.t-m.b,mid=m.t+H/2,mx=Math.max(40,...I);
  c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.moveTo(m.g,mid);c.lineTo(w-m.d,mid);c.stroke();
  const coul=[C1(),T("--primary-hover"),C2()];
  const trace=(amp,dep,col,ep)=>{c.strokeStyle=col;c.lineWidth=ep;c.beginPath();
   for(let i=0;i<=400;i++){const t=i/400*2,y=amp*Math.sin(2*Math.PI*t+dep);
    const x=m.g+(w-m.g-m.d)*(i/400),py=mid-(H/2)*(y/mx);i?c.lineTo(x,py):c.moveTo(x,py);}c.stroke();};
  I.forEach((a,k)=>trace(a,-k*2*Math.PI/3,coul[k],1.8));
  c.setLineDash([5,3]);c.strokeStyle=C3();c.lineWidth=2.4;c.beginPath();
  for(let i=0;i<=400;i++){const t=i/400*2;let y=0;
   I.forEach((a,k)=>{y+=a*Math.sin(2*Math.PI*t-k*2*Math.PI/3);});
   const x=m.g+(w-m.g-m.d)*(i/400),py=mid-(H/2)*(y/mx);i?c.lineTo(x,py):c.moveTo(x,py);}
  c.stroke();c.setLineDash([]);
  texte(c,"L1",m.g+2,m.t+5,10,coul[0]);texte(c,"L2",m.g+26,m.t+5,10,coul[1]);
  texte(c,"L3",m.g+50,m.t+5,10,coul[2]);texte(c,"neutre",m.g+74,m.t+5,10,C3());
 });
 const maj=()=>{
  V=+$("#t-v").value;I=[+$("#t-1").value,+$("#t-2").value,+$("#t-3").value];
  $("#v-t-v").textContent=V;I.forEach((v,k)=>$("#v-t-"+(k+1)).textContent=v);
  const x=I[0]-I[1]/2-I[2]/2,y=Math.sqrt(3)/2*(I[2]-I[1]),In=Math.hypot(x,y);
  const moy=(I[0]+I[1]+I[2])/3,des=moy?Math.max(...I.map(v=>Math.abs(v-moy)))/moy*100:0;
  poser("t-u",nb(V*Math.sqrt(3),0),"V","ac");
  poser("t-n",nb(In,1),"A",In<1?"ok":In>8?"ko":null);
  poser("t-p",nb(V*(I[0]+I[1]+I[2])/1000,1),"kW");
  poser("t-d",nb(des,0),"%",des<10?"ok":des>25?"ko":null);
  rendu();
 };
 b.corps.querySelectorAll("input").forEach(i=>i.addEventListener("input",maj));maj();
},

transfo(c0){

/* ---------- Plaque signalétique moteur ---------- */
moteur(c0){
 const b=creerBanc("Plaque signalétique","Machine asynchrone");c0.appendChild(b.racine);
 b.corps.innerHTML='<div class="regl">'+curs("m-p","Puissance utile",0.37,90,0.01,7.5,"kW")+
   curs("m-n","Vitesse nominale",280,2960,5,1450,"tr/min")+curs("m-c","cos φ",0.6,0.95,0.01,0.85,"")+
   curs("m-e","Rendement",0.7,0.96,0.01,0.9,"")+
   '<label><span class="lg">Réseau<b>&nbsp;</b></span><select id="m-u"><option value="400">400 V — couplage étoile</option><option value="230">230 V — couplage triangle</option></select></label>'+
   '<label><span class="lg">Fréquence<b>&nbsp;</b></span><select id="m-f"><option value="50">50 Hz</option><option value="60">60 Hz</option></select></label></div>'+
  lect([["Synchronisme n<sub>s</sub>","m-ns"],["Pôles","m-po"],["Glissement g","m-g"],["Couple nominal","m-t"],["Courant de ligne","m-i"],["Réglage thermique","m-th"]]);
 const cv=document.createElement("div");b.corps.appendChild(cv);
 let st={ns:1500,n:1450,T:49};
 const rendu=toile(cv,2.6,(c,w,h)=>{
  const m={g:40,d:16,t:16,b:24},L=w-m.g-m.d,H=h-m.t-m.b,Tmax=st.T*3;
  cadre(c,w,h,m);
  c.strokeStyle=CB();c.beginPath();c.moveTo(m.g,m.t);c.lineTo(m.g,h-m.b);c.stroke();
  /* couple approché type Kloss : démarrage 2 Tn, décrochage 2,8 Tn vers 0,8 ns */
  const Tk=2.8*st.T,gk=0.2;
  c.strokeStyle=C1();c.lineWidth=2.4;c.beginPath();
  for(let i=0;i<=200;i++){const n=st.ns*i/200,g=(st.ns-n)/st.ns;
   const T=g<=0?0:2*Tk/(g/gk+gk/g);
   const x=m.g+L*(n/st.ns),y=(h-m.b)-H*Math.min(T/Tmax,1);
   i?c.lineTo(x,y):c.moveTo(x,y);}
  c.stroke();

   Une <figure data-anim="id"> devient un dessin animé, avec ses réglages,
   sa pause, et ses gestes quand la figure en propose.

const REDUIT=matchMedia("(prefers-reduced-motion: reduce)").matches;
function monterFigure(hote,id){
  const A=ANIM[id];if(!A)return;
  hote.className="fig";
  const params={};(A.regl||[]).forEach(r=>{params[r.id]=r.val;});
  const etat=A.etat?JSON.parse(JSON.stringify(A.etat)):{};
  const manip=!!(A.clic||A.glisse);
  hote.innerHTML='<div class="fig-tete"><b>'+A.t+'</b>'+
    (manip?'<span class="fig-geste">'+(A.clic?"cliquable":"à faire glisser")+'</span>':'')+
    '<button class="fig-play" type="button" aria-label="Pause"></button></div>';
  const zone=document.createElement("div");zone.className="fig-zone";hote.appendChild(zone);
  const obj={t:0,jouer:!REDUIT,dessin:null};
  const rendu=toile(zone,A.ratio||2,(c,w,h)=>{A.dessin(c,w,h,obj.t,params,etat);});
  obj.rendu=rendu;
  if(A.regl&&A.regl.length){
    const r=document.createElement("div");r.className="regl";
    r.innerHTML=A.regl.map(g=>g.choix
      ? '<label><span class="lg">'+g.lib+'<b>&nbsp;</b></span><div class="segm" data-id="'+g.id+'">'+
        g.choix.map((o,i)=>'<button type="button" data-v="'+i+'" aria-pressed="'+(i===g.val)+'">'+o+"</button>").join("")+"</div></label>"
      : curs(g.id,g.lib,g.min,g.max,g.pas,g.val,g.u||"")).join("");
    hote.appendChild(r);
    r.querySelectorAll('input[type=range]').forEach(i=>i.addEventListener("input",()=>{
      params[i.id]=+i.value;const v=$("#v-"+i.id);if(v)v.textContent=String(i.value).replace(".",",");rendu();}));
    r.querySelectorAll(".segm").forEach(s=>s.addEventListener("click",ev=>{
      const b=ev.target.closest("button");if(!b)return;
      s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
      params[s.dataset.id]=+b.dataset.v;rendu();}));
  }
  if(A.note){const n=document.createElement("p");n.className="fig-note";n.textContent=A.note;hote.appendChild(n);}
  /* gestes */
  const cv=zone.querySelector("canvas");
  if(manip){
    cv.classList.add("manip");
    const pos=ev=>{const r=cv.getBoundingClientRect();
      return [(ev.clientX-r.left),(ev.clientY-r.top),r.width,r.height];};
    let presse=false;
    cv.addEventListener("pointerdown",ev=>{
      const[x,y,w,h]=pos(ev);presse=true;cv.setPointerCapture(ev.pointerId);
      if(A.clic&&A.clic(params,x,y,w,h,etat))rendu();
      else if(A.glisse&&A.glisse(params,x,y,w,h,etat))rendu();
      ev.preventDefault();});
    cv.addEventListener("pointermove",ev=>{
      if(!presse||!A.glisse)return;const[x,y,w,h]=pos(ev);
      if(A.glisse(params,x,y,w,h,etat))rendu();});
    ["pointerup","pointercancel"].forEach(e=>cv.addEventListener(e,()=>{presse=false;}));
  }
  /* lecture */
  const bp=hote.querySelector(".fig-play");
  const majBp=()=>{bp.dataset.e=obj.jouer?"pause":"play";bp.setAttribute("aria-label",obj.jouer?"Pause":"Lecture");};
  majBp();
  bp.addEventListener("click",()=>{obj.jouer=!obj.jouer;majBp();});
  anims.push(obj);
}

function boucle(ts){
  const dt=Math.min(0.05,(ts-dernier)/1000||0);dernier=ts;
  anims.forEach(a=>{if(a.jouer){a.t+=dt;a.rendu();}});
  requestAnimationFrame(boucle);
}

/* --- le pronostic : une ESTIMATION, dite comme telle --- */
function pronostic(){
  const n=Object.keys(etat.faits||{}).length;
  const couverture=TOTAL?n/TOTAL:0;
  const notes=Object.values(etat.notes||{}).map(x=>x.note);
  const moy=notes.length?notes.reduce((a,b)=>a+b,0)/notes.length:0;
  const heures=(etat.minutes||0)/60;
  const cibleH=90;                          /* ordre de grandeur d'une révision sérieuse */
  const hn=Math.min(1,heures/cibleH);
  const nn=notes.length?Math.min(1,moy/20):0;
  const brut=0.45*couverture+0.40*nn+0.15*hn;
  const p=Math.round(Math.max(0,Math.min(100,brut*100)));
  let mot,conseil;
  if(!notes.length)  {mot="pas encore mesurable";conseil="Passe un premier contrôle : sans note, il n'y a rien à estimer.";}
  else if(p>=75)     {mot="solide";conseil="Tiens le rythme. Ce qui te reste à gagner est surtout de la couverture : avance dans les modules.";}
  else if(p>=50)     {mot="en bonne voie";conseil="Le socle est là. Reprends les notions du carnet marquées « ce qui résiste », c'est le meilleur rendement.";}
  else if(p>=25)     {mot="fragile";conseil="Vise la régularité avant la quantité : trente minutes par jour valent mieux que cinq heures d'un coup.";}
  else               {mot="tout début";conseil="Rien d'inquiétant : c'est simplement le début. Chaque module validé fait monter ce chiffre.";}
  return {p:p,mot:mot,conseil:conseil,couverture:couverture,moyenne:moy,heures:heures,
    detail:[["Couverture du parcours",Math.round(couverture*100)+" %",0.45],
            ["Moyenne aux contrôles",notes.length?nb(moy,1)+" / 20":"—",0.40],
            ["Temps de travail",nb(heures,1)+" h sur "+cibleH+" h",0.15]]};
}

    .map(id=>{const e=etat.erreurs[id],t=e.j+e.f;
      return {id:id,t:t,f:e.f,taux:t?e.f/t:0,titre:GEN[id].t};})
    .filter(x=>x.f>=2&&x.taux>=0.34)
    .sort((a,b)=>b.f*b.taux-a.f*a.taux).slice(0,n||5);}

function sauver(){
  try{localStorage.setItem(CLE,JSON.stringify(etat));}catch(e){}
  if(base){clearTimeout(tSauve);
    tSauve=setTimeout(()=>{base.doc("progres/"+(BTS?BTS.id:"parcours")).set({...etat,maj:new Date().toISOString()}).catch(()=>{});},700);}
  if(SB.session&&BTS){clearTimeout(tDist);
    tDist=setTimeout(()=>{
      sbFetch("/rest/v1/progression",{method:"POST",
        headers:{"Prefer":"resolution=merge-duplicates"},
        body:{user_id:SB.user&&SB.user.id,bts:BTS.id,donnees:etat,
              minutes:Math.round(etat.minutes||0),maj:new Date().toISOString()}});
    },1500);}
}
/* On ne remplace la progression locale que si la distante est PLUS avancée :
   revenir sur un appareil en retard ne doit jamais effacer du travail. */
async function chargerDistant(){
  if(!SB.session||!BTS)return;
  const r=await sbFetch("/rest/v1/progression?select=donnees,minutes&bts=eq."+BTS.id);
  if(!r.ok||!Array.isArray(r.d)||!r.d.length)return;
  const d=r.d[0].donnees||{};
  const ici=Object.keys(etat.faits||{}).length, la=Object.keys(d.faits||{}).length;
  if(la>=ici){
    etat.faits=d.faits||{};etat.notes=d.notes||{};etat.essais=d.essais||{};
    etat.erreurs=d.erreurs||{};etat.acquis=d.acquis||{};etat.forcer=d.forcer||{};
    etat.minutes=Math.max(etat.minutes||0,d.minutes||r.d[0].minutes||0);
    etat.pos=d.pos||etat.pos;etat.vuGuide=d.vuGuide||etat.vuGuide;
    try{localStorage.setItem(CLE,JSON.stringify(etat));}catch(e){}
    if(etat.vue==="module")voir(etat.pos.m,etat.pos.p,true);else majRail(),majGlobal();
  }
}
async function brancherBase(){
  try{const d=await window.claude?.use?.("db");if(!d)return;base=d;
    const s=await d.doc("progres/"+(BTS?BTS.id:"parcours")).get();
    if(s.exists){const v=s.data();
      if(Object.keys(v.faits||{}).length>=Object.keys(etat.faits).length){
        etat.faits=v.faits||{};etat.notes=v.notes||{};etat.essais=v.essais||{};
        etat.pos=v.pos||etat.pos;etat.vuGuide=v.vuGuide||etat.vuGuide;
        if(etat.vue==="module")voir(etat.pos.m,etat.pos.p,true);}}
  }catch(e){}
}
const clef=(m,p)=>MODULES[m].id+"#"+p;
const estFait=(m,p)=>!!etat.faits[clef(m,p)];
function marquer(m,p){if(!estFait(m,p)){etat.faits[clef(m,p)]=1;sauver();majRail();majGlobal();}}
const faitsDuModule=m=>MODULES[m].steps.reduce((s,_,i)=>s+(estFait(m,i)?1:0),0);
const noteDe=m=>etat.notes[MODULES[m].id];
function moyenne(){const v=Object.values(etat.notes).map(x=>x.note);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}

function majGlobal(){
  const n=Object.keys(etat.faits||{}).length,pct=TOTAL?Math.round(n/TOTAL*100):0;
  $("#fil-global").style.width=pct+"%";
  $("#pastille-avance").innerHTML="Parcours <b>"+pct+" %</b>";
  const mo=moyenne();
  $("#pastille-note").innerHTML="Moyenne <b>"+(mo===null?"—":nb(mo,1)+" / 20")+"</b>";
  const hh=$("#pastille-heures");if(hh)hh.innerHTML="Travail <b>"+nb((etat.minutes||0)/60,1)+" h</b>";
  $("#rail-pct").textContent=pct+" %";
}
function anneau(pct){
  const r=8,c=2*Math.PI*r;
  return '<svg class="anneau" viewBox="0 0 22 22"><circle class="fond" cx="11" cy="11" r="'+r+'"/>'+
   '<circle class="arc" cx="11" cy="11" r="'+r+'" stroke-dasharray="'+(c*pct/100)+' '+c+'" transform="rotate(-90 11 11)"/></svg>';
}
function majRail(){
  const ul=$("#liste");ul.innerHTML="";
  if(MODULES.some(m=>m.an)){
    const li=document.createElement("li");li.className="rail-annee";
    li.innerHTML='<div class="segm">'+[[1,"1ʳᵉ année"],[2,"2ᵉ année"],[0,"Tout"]].map(a=>
      '<button type="button" data-a="'+a[0]+'" aria-pressed="'+((etat.annee||0)===a[0])+'">'+a[1]+"</button>").join("")+"</div>";
    li.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      etat.annee=+b.dataset.a;sauver();majRail();majGlobal();}));
    ul.appendChild(li);
  }
  let bloc=null;
  MODULES.forEach((m,i)=>{
    if(!visible(m))return;
    if(m.bloc!==bloc){bloc=m.bloc;
      const li=document.createElement("li");li.innerHTML='<div class="groupe">'+bloc+"</div>";ul.appendChild(li);}
    const f=faitsDuModule(i),tot=m.steps.length,pct=Math.round(f/tot*100),nt=noteDe(i);
    const li=document.createElement("li");
    const b=document.createElement("button");b.className="lien";b.type="button";
    b.dataset.etat=f===tot?"fait":(i===etat.pos.m?"cours":"a-faire");
    if(i===etat.pos.m&&etat.vue==="module")b.setAttribute("aria-current","true");
    const verrou=estVerrouille(i);
    if(m.examen)b.classList.add("lien-examen");
    if(verrou)b.classList.add("lien-ferme");
    b.innerHTML='<span class="jeton">'+(verrou?"&#9679;":m.num)+'</span><span class="nom">'+m.titre+"</span>"+
      (verrou?'<span class="cadenas" title="Palier fermé">&#128274;</span>'
        :nt?'<span class="note-mini">'+nb(nt.note,0)+"</span>":anneau(pct));
    b.addEventListener("click",()=>{
      let p=m.steps.findIndex((_,k)=>!estFait(i,k));voir(i,p<0?0:p);
      if(innerWidth<=1040){etat.rail="off";poserRail(false);}});
    li.appendChild(b);ul.appendChild(li);
  });
}

/* =========================================================================
   LA CALCULATRICE, ET LA SÉQUENCE DE TOUCHES
   Se tromper de résultat n'est pas toujours se tromper de méthode : très
   souvent, c'est la calculatrice qui a été mal tapée. La correction montre
   donc AUSSI la suite de touches à enfoncer, et signale les pièges de
   frappe — parenthèses, racine, seconde fonction, mode degrés.
   ========================================================================= */
function sequenceTouches(op){
  if(!op)return null;
  let ligne=String(op).split("\n")[0];
  const parts=ligne.split("=");
  if(parts.length<2)return null;
  let expr=parts[0].trim();
  /* on recolle les espaces qui séparent les milliers : « 52 900 » → « 52900 » */
  expr=expr.replace(/(\d)[   ](\d)/g,"$1$2").replace(/(\d)[   ](\d)/g,"$1$2");
  if(!/\d/.test(expr))return null;
  const avert=[];
  if(/√/.test(expr))avert.push("La racine s'applique à TOUT ce qui suit : ferme la parenthèse avant d'appuyer sur √, ou calcule la parenthèse d'abord.");
  if(/arctan|arccos|arcsin/.test(expr))avert.push("Fonction inverse : touche tan⁻¹, cos⁻¹ ou sin⁻¹, souvent en seconde fonction. Et vérifie que la calculatrice est en mode DEG.");
  if(/(cos|sin|tan)\s*\(/.test(expr)&&!/arc/.test(expr))avert.push("Mode DEG obligatoire : cos 60 doit donner exactement 0,5.");
  if(/10[⁻\^]|e[-+]?\d/.test(expr))avert.push("Puissance de dix : touche EXP ou ×10ˣ, jamais « × 10 ^ ».");
  if(/\/\s*\(/.test(expr)||/\(\s*[^()]*[+−-][^()]*\)/.test(expr))
    avert.push("Il y a une parenthèse : tape-la vraiment. Sans elle, la calculatrice divise seulement par le premier terme.");
  /* ⚠️ ON NE DEVINE PAS. Une séquence de touches fausse enseigne un geste
     faux : mieux vaut n'en afficher aucune. On n'accepte donc que les
     expressions dont chaque caractère est reconnu — ni exposant, ni
     notation scientifique, ni symbole exotique. Les cas plus riches sont
     écrits à la main dans le générateur, via `tch`. */
  const propre=expr.replace(/\b(cos|sin|tan|arccos|arcsin|arctan)\b/g,"F");
  if(!/^[0-9F,.\s+\-−×·÷\/()√π]+$/.test(propre))return null;
  const ouv=(expr.match(/\(/g)||[]).length, fer=(expr.match(/\)/g)||[]).length;
  if(ouv!==fer)return null;
  const touches=[];
  const jeton=/(\d+(?:[.,]\d+)?)|(√)|(×|·)|(÷|\/)|(\+)|(−|-)|(\()|(\))|(π)|(arccos|arcsin|arctan|cos|sin|tan)/g;
  let m,garde=0;
  while((m=jeton.exec(expr))&&garde++<40){
    const t=m[0];
    if(m[3])touches.push("×");
    else if(m[4])touches.push("÷");
    else if(m[6])touches.push("−");
    else if(m[10])touches.push(/^arc/.test(t)?t.replace("arc","")+"⁻¹":t);
    else touches.push(t.replace(".",","));
  }
  if(touches.length<3)return null;
  touches.push("=");
  return {touches:touches,avert:avert,resultat:parts[parts.length-1].trim()};
}

/* --- Le calcul : tokenisation puis notation postfixée. Pas d'évaluation
   de chaîne : on maîtrise ainsi le mode degrés, la priorité des
   opérations et les messages d'erreur. --- */
function calculer(expr,deg){
  const s=String(expr).replace(/,/g,".");
  const FN={"sin":1,"cos":1,"tan":1,"asin":1,"acos":1,"atan":1,"ln":1,"log":1,"exp":1,"√":1,"neg":1};
  const PR={"+":2,"−":2,"×":3,"÷":3,"^":4};
  const jetons=[];let i=0,avant=null;
  while(i<s.length){
    const c=s[i];
    if(c===" "){i++;continue;}
    if(/[0-9.]/.test(c)){
      let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      let v=parseFloat(s.slice(i,j));
      if(s[j]==="E"){let k=j+1,neg=false;
        if(s[k]==="−"||s[k]==="-"){neg=true;k++;}
        let d=k;while(d<s.length&&/[0-9]/.test(s[d]))d++;
        if(d>k){v*=Math.pow(10,(neg?-1:1)*parseFloat(s.slice(k,d)));j=d;}}
      if(!isFinite(v))throw new Error("nombre incomplet");
      jetons.push({t:"n",v:v});avant="n";i=j;continue;}
    if(c==="π"){jetons.push({t:"n",v:Math.PI});avant="n";i++;continue;}
    if(c==="²"){jetons.push({t:"p",o:"²"});avant="n";i++;continue;}
    let f=null;
    for(const k in FN)if(s.startsWith(k,i)){f=k;break;}
    if(f&&f!=="neg"){jetons.push({t:"f",o:f});avant="f";i+=f.length;continue;}
    if(c==="("){jetons.push({t:"("});avant="(";i++;continue;}
    if(c===")"){jetons.push({t:")"});avant="n";i++;continue;}
    if("+−×÷^-".indexOf(c)>=0){
      const o=c==="-"?"−":c;
      if(o==="−"&&(avant===null||avant==="o"||avant==="(")){jetons.push({t:"f",o:"neg"});avant="f";i++;continue;}
      jetons.push({t:"o",o:o});avant="o";i++;continue;}
    throw new Error("caractère inattendu : "+c);
  }
  /* vers la notation postfixée */
  const sortie=[],pile=[];
  jetons.forEach(j=>{
    if(j.t==="n")sortie.push(j);
    else if(j.t==="p")sortie.push(j);
    else if(j.t==="f")pile.push(j);
    else if(j.t==="o"){
      while(pile.length){const h=pile[pile.length-1];
        if(h.t==="f"||(h.t==="o"&&(PR[h.o]>PR[j.o]||(PR[h.o]===PR[j.o]&&j.o!=="^"))))sortie.push(pile.pop());
        else break;}
      pile.push(j);}
    else if(j.t==="(")pile.push(j);
    else if(j.t===")"){
      while(pile.length&&pile[pile.length-1].t!=="(")sortie.push(pile.pop());
      if(!pile.length)throw new Error("parenthèse fermante en trop");
      pile.pop();
      if(pile.length&&pile[pile.length-1].t==="f")sortie.push(pile.pop());}
  });
  while(pile.length){const h=pile.pop();
    if(h.t==="(")throw new Error("parenthèse non fermée");sortie.push(h);}
  /* évaluation */
  const D=deg?Math.PI/180:1, iD=deg?180/Math.PI:1, p=[];
  sortie.forEach(j=>{
    if(j.t==="n"){p.push(j.v);return;}
    if(j.t==="p"){const a=p.pop();if(a===undefined)throw new Error("il manque un nombre");p.push(a*a);return;}
    if(j.t==="f"){const a=p.pop();if(a===undefined)throw new Error("il manque un nombre");
      switch(j.o){
        case "neg":p.push(-a);break;
        case "sin":p.push(Math.sin(a*D));break;
        case "cos":p.push(Math.cos(a*D));break;
        case "tan":p.push(Math.tan(a*D));break;
        case "asin":p.push(Math.asin(a)*iD);break;
        case "acos":p.push(Math.acos(a)*iD);break;
        case "atan":p.push(Math.atan(a)*iD);break;
        case "ln":p.push(Math.log(a));break;
        case "log":p.push(Math.log10(a));break;
        case "exp":p.push(Math.exp(a));break;
        case "√":p.push(Math.sqrt(a));break;}
      return;}
    const b=p.pop(),a=p.pop();
    if(a===undefined||b===undefined)throw new Error("il manque un nombre");
    p.push(j.o==="+"?a+b:j.o==="−"?a-b:j.o==="×"?a*b:j.o==="÷"?a/b:Math.pow(a,b));
  });
  if(p.length!==1)throw new Error("expression incomplète");
  return p[0];
}

/* --- La calculatrice scientifique --- */
function calculatrice(){
  const d=document.createElement("div");d.className="calcul";
  let expr="",deg=true,sec=false;
  const T=[
   [["2nd","2nd","fn"],["DEG","deg","fn"],["(","(",""],[")",")",""],["←","←","fn"],["C","C","fn"]],
   [["sin","sin(",""],["cos","cos(",""],["tan","tan(",""],["ln","ln(",""],["log","log(",""],["÷","÷","op"]],
   [["7","7",""],["8","8",""],["9","9",""],["x²","²",""],["√","√(",""],["×","×","op"]],
   [["4","4",""],["5","5",""],["6","6",""],["xʸ","^",""],["EXP","E",""],["−","−","op"]],
   [["1","1",""],["2","2",""],["3","3",""],["π","π",""],["±","±","fn"],["+","+","op"]],
   [["0","0",""],[",",",",""],["=","=","eg4"]]];
  const SEC={"sin(":["sin⁻¹","asin("],"cos(":["cos⁻¹","acos("],"tan(":["tan⁻¹","atan("],
             "ln(":["eˣ","exp("],"log(":["10ˣ","10^"],"²":["x³","^3"]};
  const dessine=()=>{
    d.innerHTML='<div class="calc-tete"><span class="calc-mode" data-a="'+(deg?"deg":"rad")+'">'+
      (deg?"DEG":"RAD")+'</span><span class="calc-2nd" data-a="'+(sec?"on":"off")+'">2nd</span></div>'+
      '<div class="calc-ecran"><span class="calc-expr">'+(expr||"&nbsp;")+"</span>"+
      '<span class="calc-res">'+resultat()+"</span></div>"+
      '<div class="calc-touches">'+T.map(l=>l.map(k=>{
        const lab=sec&&SEC[k[1]]?SEC[k[1]][0]:k[0];
        return '<button type="button" class="calc-t '+k[2]+'" data-k="'+k[1]+'">'+lab+"</button>";}).join("")).join("")+"</div>"+
      '<p class="calc-note">Mode <b>'+(deg?"degrés":"radians")+"</b> — pour les cos φ et les angles, reste en degrés.</p>";
    d.querySelectorAll(".calc-t").forEach(b=>b.addEventListener("click",()=>frappe(b.dataset.k)));
  };
  const resultat=()=>{
    if(!expr)return "0";
    try{const v=calculer(expr,deg);
      if(!isFinite(v))return "—";
      /* les très petits et les très grands passent en écriture scientifique :
         « 0,000005 » cachait un 4,7·10⁻⁶ */
      const a=Math.abs(v);
      if(v!==0&&(a<1e-4||a>=1e9)){
        const HAUT={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
        const [m,e]=v.toExponential(4).split("e");
        return m.replace(".",",")+"·10"+e.replace("+","").split("").map(c=>HAUT[c]||c).join("");}
      return nb(v,a<1?6:4);}
    catch(e){return '<span class="calc-err">'+e.message+"</span>";}
  };
  const frappe=k=>{
    if(k==="C"){expr="";}
    else if(k==="←"){expr=expr.replace(/(sin\(|cos\(|tan\(|asin\(|acos\(|atan\(|ln\(|log\(|exp\(|√\(|.)$/,"");}
    else if(k==="deg"){deg=!deg;}
    else if(k==="2nd"){sec=!sec;}
    else if(k==="±"){
      const m=expr.match(/E(−?)(\d*)$/);
      if(m)expr=expr.slice(0,expr.length-m[0].length)+"E"+(m[1]?"":"−")+m[2];
      else{const n=expr.match(/(\d[\d,]*)$/);
        if(n){const i=expr.length-n[0].length;
          expr=expr.slice(0,i).replace(/−$/,"")+(expr.slice(0,i).endsWith("−")?"":"−")+n[0];}
        else expr+="−";}}
    else{const vraie=sec&&SEC[k]?SEC[k][1]:k;expr+=vraie;if(sec)sec=false;}
    dessine();
  };
  dessine();
  return d;
}

function poserCalculatrice(outils,hote){
  let ouverte=false,el=null;
  const b=document.createElement("button");b.className="btn btn-secondaire btn-fin";
  b.textContent="Calculatrice";
  b.addEventListener("click",()=>{
    ouverte=!ouverte;
    if(ouverte){el=calculatrice();hote.appendChild(el);b.textContent="Fermer la calculatrice";}
    else{if(el)el.remove();b.textContent="Calculatrice";}});
  outils.appendChild(b);
}

/* ---- Séquences de touches écrites à la main, là où l'automatique renonce ----
   Elles disent exactement ce qu'il faut enfoncer, dans l'ordre, avec le
   piège de frappe propre à chaque calcul. */
const AV_EXP="Puissance de dix : touche EXP (ou ×10ˣ). Ne tape jamais « × 1 0 ^ », tu obtiendrais un facteur dix de trop.";
const AV_PAR="La parenthèse n'est pas décorative : sans elle la calculatrice ne divise que par le premier terme.";
const AV_RAC="Calcule d'abord tout l'intérieur, PUIS la racine. Sur beaucoup de modèles, √ se tape avant la parenthèse ouvrante.";
const AV_DEG="Vérifie le mode DEG : cos 60 doit donner exactement 0,5.";
const AV_INV="Fonction inverse : touche tan⁻¹ ou cos⁻¹, souvent en seconde fonction (SHIFT ou 2nd).";
const TCH={
 "prefixe":p=>{const f=p.c.f,v=F(p.v).replace(".",",");
   if(f>=1000)return {touches:[v,"×",String(f),"="],
     avert:["Multiplier par "+String(f)+" : tape les zéros à la main, c'est plus sûr que la touche EXP quand on débute."]};
   const e=Math.round(Math.log10(f));
   return {touches:[v,"EXP","−"+Math.abs(e),"="],
     avert:["La touche EXP veut dire « ×10 puissance ». Tape "+v+" EXP −"+Math.abs(e)+", et surtout PAS « × 1 0 ^ » : tu obtiendrais un zéro de trop."]};},
 "scientifique":p=>({touches:[F(p.a),"EXP",String(p.n),"×",F(p.m),"EXP",String(p.k),"="],avert:[AV_EXP]}),
 "pythagore":p=>({touches:["√","(",String(p.a),"x²","+",String(p.b),"x²",")","="],avert:[AV_RAC]}),
 "vecteur-somme":p=>({touches:["√","(",String(p.a),"x²","+",String(p.b),"x²",")","="],avert:[AV_RAC]}),
 "complexe-module":p=>(p.q==="mod"
   ?{touches:["√","(",String(p.r),"x²","+",String(p.x),"x²",")","="],avert:[AV_RAC]}
   :{touches:["tan⁻¹","(",String(p.x),"÷",String(p.r),")","="],avert:[AV_INV,AV_DEG]}),
 "trigo-angle":p=>({touches:["tan⁻¹","(",String(p.y),"÷",String(p.x),")","="],avert:[AV_INV,AV_DEG]}),
 "rc-tau":p=>({touches:[String(p.r),"×",String(p.c),"÷","1000","="],
   avert:["Astuce qui évite les puissances de dix : des kΩ × des nF donnent des microsecondes ; ici on divise par 1000 pour obtenir des millisecondes."]}),
 "periode":p=>(p.q==="T"?{touches:["1000","÷",String(p.f),"="],avert:[]}
   :{touches:["2","×","π","×",String(p.f),"="],avert:[]}),
 "energie-condo":p=>({touches:["0,5","×",String(p.c),"EXP","−6","×",String(p.u),"x²","="],avert:[AV_EXP]}),
 "reactance":p=>(p.t==="L"
   ?{touches:["2","×","π","×",String(p.f),"×",F(p.l/1000,4),"="],avert:["Convertis d'abord les mH en H, sinon le résultat est mille fois trop grand."]}
   :{touches:["1","÷","(","2","×","π","×",String(p.f),"×",String(p.c),"EXP","−6",")","="],avert:[AV_PAR,AV_EXP]}),
 "puis-mono":p=>({touches:["230","×",F(p.i),"×",F(p.k,2),"="],avert:[]}),
 "puis-tri":p=>({touches:["√","3","×","400","×",String(p.i),"×",F(p.k,2),"="],
   avert:["Le √3 se tape en premier : √ puis 3. L'oublier fait perdre 42 % du résultat."]}),
 "triangle-pqs":p=>(p.q==="S"?{touches:[String(p.p),"÷",F(p.k,2),"="],avert:[]}

function lireNombre(s){
  s=String(s).trim().replace(/\s/g,"").replace("×10^","e").replace(",",".");
  if(!s)return NaN;return parseFloat(s);
}
function juste(rep,att,tol){
  if(!isFinite(rep))return false;
  const t=Math.max(tol||0.015,0.002);
  if(Math.abs(att)<1e-12)return Math.abs(rep)<1e-9;
  return Math.abs(rep-att)/Math.abs(att)<=t;
}
/* ---- La correction pas à pas : des flèches, et une couleur par grandeur ----
   Chaque famille de grandeur garde la même teinte d'un exercice à l'autre :
   la tension est toujours bleue, le courant toujours ambre. L'œil finit par
   reconnaître la structure d'un calcul avant même de l'avoir lu. */
const FAMILLE={u:"Tension",i:"Courant",r:"Résistance, impédance, composant",
  p:"Puissance, énergie",t:"Temps, fréquence, vitesse",a:"Angle, rapport, rendement"};
const JETONS=[
 ["U_cc","u"],["U_max","u"],["U_eff","u"],["U_moy0","u"],["U_moy","u"],["U_L","u"],["U_c","u"],
 ["U₂₀","u"],["U20","u"],["ΔU","u"],["U₁","u"],["U₂","u"],["Ue","u"],["Us","u"],["U","u"],["V","u"],["E","u"],
 ["I_cc","i"],["I_Δn","i"],["I_n","i"],["I_N","i"],["I₁","i"],["I₂","i"],["I","i"],["ΔI","i"],
 ["X_L","r"],["X_C","r"],["X","r"],["Z","r"],["R₁","r"],["R₂","r"],["R_éq","r"],["R","r"],["ρ","r"],["C","r"],["L","r"],
 ["P_fer","p"],["P_cuivre","p"],["P_cc","p"],["P₀","p"],["P₂","p"],["P","p"],["Q_c","p"],["Qc","p"],["Q","p"],["S","p"],["W","p"],
 ["n_s","t"],["N₁","t"],["N₂","t"],["N","t"],["ns","t"],["n","t"],["T","t"],["f","t"],["ω","t"],["τ","t"],["Ω","t"],
 ["cos φ","a"],["tan φ","a"],["sin φ","a"],["φ","a"],["η","a"],["g","a"],["α","a"],["m","a"]];
const RE_JETON=new RegExp("(^|[^A-Za-zÀ-ÖØ-öø-ÿ0-9_])("+
  JETONS.map(j=>j[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+
  ")(?![A-Za-zÀ-ÖØ-öø-ÿ0-9_])","g");
const FAM_DE={};JETONS.forEach(j=>{FAM_DE[j[0]]=j[1];});
function colorise(txt,vues){
  return String(txt).split(/(<[^>]*>)/).map(seg=>{
    if(seg.charAt(0)==="<")return seg;
    seg=seg.replace(RE_JETON,(m,av,tk)=>{
      const f=FAM_DE[tk];if(vues)vues.add(f);
      return av+'<b class="q q-'+f+'">'+tk+"</b>";});
    return seg.replace(/(\d[\d  ]*(?:[.,]\d+)?)/g,'<i class="num">$1</i>');
  }).join("");
}
const UNITE_FAM=[[/\b(k?V|mV)\b/,"u"],[/\b(m?A|kA)\b/,"i"],[/(Ω|µF|nF|mH|H\b|F\b)/,"r"],
  [/\b(k?W|MW|kVA|VA|k?var|J|kWh|N·m)\b/,"p"],[/(Hz|ms|µs|\bs\b|tr\/min|rad)/,"t"]];
function famUnite(v){for(const[re,f]of UNITE_FAM)if(re.test(v))return f;return "a";}
/* Dire à l'élève ce qu'il cherche AVANT de lui montrer comment. L'unité
   attendue suffit à nommer la grandeur : c'est plus parlant que le titre
   de l'exercice. */
const CIBLES={"A":"un courant, en ampères (A)","kA":"un courant, en kiloampères (kA)",
 "V":"une tension, en volts (V)","W":"une puissance, en watts (W)",
 "kW":"une puissance, en kilowatts (kW)","kvar":"une puissance réactive, en kilovars",
 "Ω":"une résistance ou une impédance, en ohms (Ω)","µF":"une capacité, en microfarads (µF)",
 "J":"une énergie, en joules (J)","kWh":"une énergie, en kilowattheures (kWh)",
 "%":"un pourcentage","°":"un angle, en degrés","ms":"une durée, en millisecondes",
 "h":"une durée, en heures","tr/min":"une vitesse, en tours par minute","N·m":"un couple, en newtons-mètres"};
/* Le second chemin d'explication. Il s'ouvre tout seul si la notion a déjà
   résisté auparavant : à la deuxième erreur, redonner le même raisonnement
   n'a aucune chance de mieux marcher. */
function poserAutrement(hote,id){
  const a=AUTREMENT[id];if(!a||!hote)return;
  const e=etat.erreurs[id];const insiste=e&&e.f>=2;
  const d=document.createElement("div");d.className="autrement";
  d.innerHTML='<button type="button" class="btn btn-secondaire btn-fin">Explique-moi autrement</button>';
  const ouvrir=()=>{
    d.innerHTML='<div class="autre-corps"><span class="chapo">Une autre façon de le voir · '+a[0]+
      "</span><p>"+a[1]+"</p></div>";};
  d.querySelector("button").addEventListener("click",ouvrir);
  hote.appendChild(d);
  if(insiste)ouvrir();
}
function blocCorrection(g,p){
  const liste=g.pas(p),vues=new Set();
  const donnees=(g.enonce(p).match(/<span class='val'>([\s\S]*?)<\/span>/g)||[])
    .map(x=>x.replace(/<[^>]*>/g,"").trim());
  const rep=g.qcm?g.opts(p)[0]:nb(g.rep(p),Math.abs(g.rep(p))<1?4:2)+(g.u?" "+g.u:"");
  let h='<div class="corr">';
  const cible=CIBLES[g.u]||null;
  h+='<div class="corr-cible"><div class="corr-case corr-cherche"><span class="k">Ce que tu cherches</span>'+
     '<span class="v">'+(cible||g.t)+"</span>"+
     (cible?'<span class="sous">'+g.t+"</span>":"")+"</div>";
  if(donnees.length)h+='<div class="corr-case corr-donne"><span class="k">Ce que l\'énoncé te donne</span>'+
     '<span class="chips">'+donnees.map(d=>{const f=famUnite(d);vues.add(f);
       return '<em class="chip q-'+f+'">'+d+"</em>";}).join("")+"</span></div>";
  h+="</div>";
  h+='<ol class="corr-etapes">';
  liste.forEach((e,i)=>{
    h+='<li><span class="n">'+(i+1)+'</span><div class="c"><p>'+e.t+"</p>"+
       (e.op?'<div class="op'+(i===liste.length-1?" op-fin":"")+'">'+
        colorise(e.op,vues).replace(/\n/g,"<br>")+"</div>":"")+"</div></li>";
    if(i<liste.length-1)h+='<li class="fl" aria-hidden="true"><span class="tige"></span><span class="tete"></span></li>';
  });
  h+="</ol>";
  /* comment cela se tape réellement sur une calculatrice */
  let sq=null;
  for(const k in GEN)if(GEN[k]===g&&TCH[k]){try{sq=TCH[k](p);}catch(e){sq=null;}break;}
  for(let i=liste.length-1;i>=0&&!sq;i--)if(liste[i].op)sq=sequenceTouches(liste[i].op);
  if(sq)h+='<div class="touches"><span class="k">Sur ta calculatrice, tu tapes</span>'+
    '<div class="tt">'+sq.touches.map(t=>"<kbd>"+t+"</kbd>").join("")+"</div>"+
    (sq.avert.length?'<p class="av">'+sq.avert.join(" ")+"</p>":"")+"</div>";
  h+='<div class="corr-final"><span class="k">Réponse</span><b>'+colorise(rep)+"</b></div>";
  if(vues.size>=3){
    h+='<div class="corr-legende"><span>Code couleur :</span>'+
      [...vues].filter(f=>FAMILLE[f]).map(f=>'<em class="q-'+f+'">'+FAMILLE[f]+"</em>").join("")+"</div>";}
  return h+"</div>";
}
const blocPas=liste=>'<ol class="pas-calc">'+liste.map(e=>"<li>"+e.t+
  (e.op?'<span class="op">'+e.op.replace(/\n/g,"<br>")+"</span>":"")+"</li>").join("")+"</ol>";
function rendreAtelier(hote,mi,pi,pas){
  const but=pas.but||3;
  const box=document.createElement("div");box.className="verre atelier";hote.appendChild(box);
  let serie=0,total=0,justes=0,g=null,p=null,aide=false,idx=0,id=null,palier=1,rejouer=false;
  /* Les notions arrivent DANS L'ORDRE, pas en vrac : on en découvre une,
     puis la suivante. Et la première rencontre se fait avec des nombres
     ronds — le tirage de terrain vient après. */
  const dessine=()=>{
    /* Après une erreur on ne change PAS de notion : on la refait, avec de
       nouveaux nombres. Changer de sujet juste après un échec, c'est laisser
       le point faible derrière soi. */
    if(rejouer)rejouer=false;
    else{id=pas.gen[idx%pas.gen.length];idx++;}
    const niv=etat.acquis[id]||0;
    /* 0 → nombres ronds · 1 → valeurs de terrain · 2 et plus → exercice composé */
    const compose=niv>=2&&DUR[id]&&GEN[DUR[id]];
    palier=compose?3:(niv===0&&FACILE[id])?1:2;
    g=compose?GEN[DUR[id]]:GEN[id];
    p=palier===1?FACILE[id]():g.tirer();aide=false;
    box.innerHTML='<div class="at-tete"><span class="t">'+g.t+'</span>'+
      '<span class="palier" data-e="'+["","doux","normal","dur"][palier]+'">'+
        ["","pour commencer","valeurs de terrain","comme en examen"][palier]+'</span>'+
      '<span class="d">objectif : '+but+' bonnes réponses d\'affilée</span>'+
      '<span class="perles">'+Array.from({length:but},(_,i)=>'<i data-e="'+(i<serie?"ok":"")+'"></i>').join("")+"</span></div>"+
      '<div class="at-corps"><p class="enonce">'+g.enonce(p)+"</p></div>";
    const corps=box.querySelector(".at-corps");
    if(g.qcm){
      const opts=g.opts(p),ordre=opts.map((o,i)=>[o,i]).sort(()=>Math.random()-0.5);
      const d=document.createElement("div");d.className="choix";
      ordre.forEach(([o,i],k)=>{
        const b=document.createElement("button");b.type="button";
        b.innerHTML='<span class="lt">'+"ABCD"[k]+'</span><span>'+o+"</span>";
        b.addEventListener("click",()=>repondre(i===0,d,b,ordre));
        d.appendChild(b);});
      corps.appendChild(d);
    }else{
      const d=document.createElement("div");d.className="saisie";
      d.innerHTML='<div class="champ"><input type="text" inputmode="decimal" autocomplete="off" placeholder="ta réponse">'+
        (g.u?'<span class="unite">'+g.u+"</span>":"")+"</div>"+
        '<button class="btn btn-principal" data-a="ok">Vérifier</button>';
      corps.appendChild(d);
      const inp=d.querySelector("input");
      const val=()=>repondre(juste(lireNombre(inp.value),g.rep(p),g.tol),d,inp);
      d.querySelector('[data-a="ok"]').addEventListener("click",val);
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")val();});
      setTimeout(()=>inp.focus(),40);
    }
    const out=document.createElement("div");out.className="outils";
    const bi=document.createElement("button");bi.className="btn btn-secondaire btn-fin";bi.textContent="Indice";
    bi.addEventListener("click",()=>{
      if(aide)return;aide=true;
      const a=document.createElement("div");a.className="aide";
      a.innerHTML="<b>Formule à utiliser</b><span class='fx'>"+g.rappel+"</span>";
      corps.insertBefore(a,corps.querySelector(".saisie,.choix"));});
    const bn=document.createElement("button");bn.className="btn btn-secondaire btn-fin";bn.textContent="Je ne sais pas";
    bn.addEventListener("click",()=>repondre(false,null,null,null,true));
    out.appendChild(bi);out.appendChild(bn);poserCalculatrice(out,corps);corps.appendChild(out);
  };
  const repondre=(ok,cont,cible,ordre,abandon)=>{
    total++;if(ok)justes++;
    noter(id,ok);if(ok)etat.acquis[id]=Math.min(3,(etat.acquis[id]||0)+1);
    const corps=box.querySelector(".at-corps");
    corps.querySelectorAll("button,input").forEach(x=>{x.disabled=true;});
    if(ordre&&cont){[...cont.children].forEach((b,k)=>{
      if(ordre[k][1]===0)b.dataset.r="bon";else if(b===cible&&!ok)b.dataset.r="mauvais";});}
    if(cible&&cible.tagName==="INPUT")cible.dataset.e=ok?"ok":"ko";
    serie=ok?serie+1:0;rejouer=!ok;
    box.querySelectorAll(".perles i").forEach((e,i)=>{e.dataset.e=i<serie?"ok":(!ok&&i===0?"ko":"");});
    const r=document.createElement("div");r.className="retour";r.dataset.e=ok?"ok":"ko";
    const att=g.qcm?g.opts(p)[0]:nb(g.rep(p),g.rep(p)<1?4:2)+(g.u?" "+g.u:"");
    r.innerHTML='<div class="bandeau">'+(ok?"Juste.":abandon?"On regarde ensemble.":"Non — la réponse était "+att)+"</div>"+
      '<div class="detail">'+blocCorrection(g,p)+"</div>";
    corps.appendChild(r);
    if(!ok)poserAutrement(r.querySelector(".detail"),id);
    const pied=document.createElement("div");pied.className="outils";pied.style.marginTop="16px";
    if(serie>=but){
      const b=document.createElement("button");b.className="btn btn-positif";
      b.textContent="Notion acquise — continuer";
      b.addEventListener("click",()=>{if(mi>=0){marquer(mi,pi);avancer();}else carnet();});
      pied.appendChild(b);
      const s=document.createElement("span");s.style.color="var(--success)";s.style.fontWeight="500";
      s.textContent=but+" d'affilée. "+justes+" bonnes réponses sur "+total+".";
      pied.appendChild(s);
    }else{
      const b=document.createElement("button");b.className="btn btn-principal";
      b.textContent=ok?"Exercice suivant":"Refaire ce type d'exercice";
      b.addEventListener("click",dessine);pied.appendChild(b);
      const s=document.createElement("span");s.style.color="var(--muted)";s.style.fontSize="13px";
      s.textContent=ok?"encore "+(but-serie)+" pour valider":"même notion, nouveaux nombres — on ne passe pas à côté";
      pied.appendChild(s);
      if(mi>=0&&estFait(mi,pi)){const p2=document.createElement("button");p2.className="btn btn-secondaire btn-fin";
        p2.textContent="Passer";p2.addEventListener("click",avancer);pied.appendChild(p2);}
    }

    pied.querySelector("button").focus();
  };
  dessine();
}

/* ---- Le moteur du banc de câblage : dessin, gestes, vérification ---- */
function rendreCablage(hote,mi,pi,pas){
  const ex=CABLAGE[pas.cab];if(!ex)return;
  const attendus=ex.liens.map(l=>[l[0],l[1]].sort().join("|"));

    (ex.comps||[]).forEach(o=>{

        c.strokeStyle=sousTension?C2():CM();c.lineWidth=2.4;
        c.beginPath();c.arc(X(o.x),Y(o.y),Math.min(X(o.r),Y(o.r*1.55)),0,TAU);c.stroke();
        if(sousTension){c.fillStyle=C2();c.globalAlpha=.10;c.fill();c.globalAlpha=1;}

          for(let k=0;k<3;k++){const an=a+k*TAU/3,r=Math.min(X(o.r),Y(o.r*1.55))*0.55;
            c.strokeStyle=C2();c.lineWidth=2.4;c.beginPath();
            c.arc(X(o.x),Y(o.y),r,an,an+0.7);c.stroke();}
        }
      }else{
        const bx=X(o.x),by=Y(o.y),bw=X(o.w),bh=Y(o.h);
        c.strokeStyle=o.k==="bobine"&&sousTension?C2():CB();c.lineWidth=o.k==="bobine"?2.4:1.8;
        c.fillStyle=CS();c.beginPath();c.roundRect(bx,by,bw,bh,8);c.fill();c.stroke();
        if(o.k==="bobine"&&sousTension){c.fillStyle=C2();c.globalAlpha=.12;
          c.beginPath();c.roundRect(bx,by,bw,bh,8);c.fill();c.globalAlpha=1;}
        c.font='600 13px Rubik, sans-serif';c.textAlign="center";c.textBaseline="middle";
        c.fillStyle=CI();c.fillText(o.lab,bx+bw/2,by+bh/2-6);
        txt(c,o.sous,bx+bw/2,by+bh/2+9,10,CM(),"center");
      }
    });
    /* les fils posés */
    liens.forEach(l=>{
      const a=ex.bornes[l[0]],b=ex.bornes[l[1]];

/* =========================================================================
   EXPLIQUER AUTREMENT
   Une même notion ne rentre pas par le même chemin chez tout le monde. À
   chaque notion, un SECOND angle : une image, un ordre de grandeur, un
   raccourci mental. Il s'ouvre à la demande, et tout seul dès qu'on s'est
   déjà trompé sur cette notion.
   ========================================================================= */
const AUTREMENT={
 "prefixe":["L'image du zoom","Un préfixe, c'est un objectif d'appareil photo : la scène ne change pas, seul le cadrage change. 4700 µF et 0,0047 F, c'est le même condensateur vu de plus près ou de plus loin. Compte les crans : de µ à l'unité il y a 6 zéros, de m à l'unité il y en a 3."],
 "scientifique":["Le compteur de zéros","10⁶ veut juste dire « six zéros après le 1 ». Quand tu multiplies, tu empiles les zéros : trois zéros plus deux zéros font cinq zéros. C'est pour ça que les exposants s'additionnent — tu ne fais que compter."],
 "pourcent":["Le repère du dixième","10 % d'un nombre, c'est ce nombre avec la virgule décalée d'un cran : 10 % de 400 V = 40 V. À partir de là, 5 % c'est la moitié (20 V), 1 % c'est le dixième (4 V). Tu peux estimer n'importe quel pourcentage sans calculatrice, et vérifier ton résultat."],
 "transpose":["La balance","Une égalité est une balance à deux plateaux. Tout ce que tu fais d'un côté, tu le fais de l'autre, sinon elle penche. Pour retirer un facteur qui MULTIPLIE, tu divises des deux côtés. Il n'y a jamais d'autre geste que celui-là."],
 "ohm":["Le tuyau d'eau","La tension est la pression, le courant est le débit, la résistance est l'étranglement du tuyau. Plus tu serres le tuyau, moins il coule à pression égale. Si ton résultat dit l'inverse, tu as inversé la division."],
 "puissance-dc":["Pourquoi trois formules","Il n'y en a qu'une : P = U·I. Les deux autres sortent en remplaçant U par R·I, ou I par U/R. Tu ne mémorises donc qu'une ligne, et tu fabriques les autres au moment où tu en as besoin."],
 "carre":["L'image du carrelage","Un carré de 2 m de côté fait 4 m², un carré de 3 m en fait 9. Quand une grandeur est au carré, doubler l'entrée quadruple la sortie. C'est pour ça que 6 A dans un câble ne chauffe pas trois fois plus que 2 A, mais neuf fois plus."],
 "serie-par":["Le péage d'autoroute","En série, les voitures passent par tous les péages l'un après l'autre : les attentes s'ajoutent. En parallèle, on ouvre plusieurs guichets : ça passe mieux qu'avec le meilleur guichet seul. D'où la règle — l'équivalent parallèle est plus petit que la plus petite."],
 "diviseur":["Le partage au prorata","Le même courant traverse les deux résistances. Celle qui est deux fois plus grande prend donc deux fois plus de tension. Si les deux sont égales, chacune prend la moitié : ce cas te sert de contrôle."],
 "pythagore":["Le raccourci en diagonale","Marcher 3 rues à l'est puis 4 au nord fait 7 rues. À vol d'oiseau, seulement 5. La diagonale est toujours PLUS COURTE que la somme, et plus longue que chaque côté : ton résultat doit tomber entre les deux."],
 "vecteur-somme":["Deux personnes qui poussent","Deux forces dans le même sens s'ajoutent. À angle droit, elles ne s'ajoutent plus : la résultante est la diagonale. 60 et 80 ne font pas 140 mais 100 — c'est exactement Pythagore, et c'est ce qui se passe entre R et X."],
 "eff-max":["Ce que ressent le radiateur","La valeur efficace, ce n'est pas une moyenne : c'est « la tension continue qui chaufferait pareil ». La crête, elle, est ce que doit tenir l'isolant. Deux nombres, deux usages : 230 V pour le calcul, 325 V pour l'isolation."],
 "reactance":["Le portier qui trie","La bobine laisse passer le lent et bloque le rapide. Le condensateur fait l'inverse. Retiens juste que X_L monte avec la fréquence et X_C descend : le reste du calcul en découle."],
 "impedance-rl":["L'angle droit obligatoire","R et X ne se cumulent pas parce qu'ils n'agissent pas au même instant : la résistance travaille quand le courant est maximal, la réactance quand il change le plus vite. D'où l'angle droit, d'où Pythagore. Z est toujours entre le plus grand des deux et leur somme."],
 "triangle-pqs":["Le demi de bière","S est le verre entier, P est la bière, Q est la mousse. Tu paies le verre (le câble, le transfo) mais tu ne bois que la bière. Le cos φ dit quelle proportion du verre est buvable."],
 "compensation":["Rapprocher la source","Le réactif fait l'aller-retour entre le réseau et le moteur. La batterie de condensateurs le fabrique SUR PLACE : le moteur en reçoit autant, mais le câble ne le transporte plus. C'est pour ça que P ne bouge pas et que le courant baisse."],
 "tri-uv":["Pourquoi pas le double","Les deux phases ne montent pas en même temps : quand l'une est au maximum, l'autre est déjà redescendue. Leur écart n'atteint donc jamais le double, mais 1,73 fois. Le √3 n'est pas une convention, c'est le décalage de 120° mesuré."],
 "puis-tri":["Le test des 2 A par kW","En 400 V, un moteur tire environ 2 A par kilowatt. Un 15 kW ≈ 30 A. Fais toujours ce test de tête AVANT le calcul exact : s'il te sort 16 A pour un 15 kW, tu as oublié le √3."],
 "courant-moteur":["Le sens du rendement","La plaque donne ce qui SORT sur l'arbre. Le réseau doit fournir plus, jamais moins. Donc on DIVISE par le rendement. Si ton courant baisse quand le rendement baisse, tu as multiplié à l'envers."],
 "synchronisme":["Compter en tours de champ","À 50 Hz, le champ fait 50 tours par seconde s'il y a une seule paire de pôles, soit 3000 tours par minute. Deux paires de pôles : le champ met deux fois plus de temps à faire un tour complet, donc 1500. Tu peux retrouver la formule sans l'apprendre."],
 "glissement":["La course poursuite","Le rotor court derrière le champ sans jamais le rattraper. Le glissement mesure son retard, en pourcentage. S'il le rattrapait, il ne verrait plus rien bouger et n'aurait plus de couple : c'est le retard qui produit la force."],
 "couple":["Force ou endurance","La puissance, c'est le couple multiplié par la vitesse. À puissance égale, un moteur lent a beaucoup de couple, un moteur rapide en a peu — comme un vélo : petit braquet, ça pousse fort mais ça n'avance pas vite."],
 "chute-tension":["Le tuyau d'arrosage","Plus le tuyau est long et fin, moins il arrive d'eau au bout. Longueur et courant font monter la chute, la section la fait baisser. Doubler la section divise la chute par deux : c'est le seul levier vraiment efficace."],
 "cube":["Pourquoi c'est si rentable","Le ventilateur doit vaincre l'air, et l'air résiste d'autant plus qu'il va vite. Ralentir de 20 % ne fait pas gagner 20 % mais presque la moitié. Retiens l'ordre de grandeur : 0,8³ ≈ 0,5."],
 "ddr":["Le seuil de sécurité","Le courant de défaut passe dans la terre et y crée une tension. Cette tension ne doit jamais dépasser 50 V. Une terre mauvaise (grande résistance) oblige donc à un différentiel plus sensible : les deux varient en sens inverse."],
 "expo-tau":["Le café qui refroidit","Ça va vite au début, puis de plus en plus lentement. Après une constante de temps, les deux tiers du chemin sont faits ; après cinq, c'est terminé pour ce qu'on peut mesurer. Les quatre repères 63 / 86 / 95 / 99 remplacent le calcul."],
 "rc-tau":["Le raccourci des unités","Des kΩ multipliés par des µF donnent directement des millisecondes. 10 kΩ × 1 µF = 10 ms. Cette astuce évite de manipuler les puissances de dix, qui sont l'endroit exact où l'on se trompe."],
 "capacite-comp":["Pourquoi trois fois moins","En triangle, chaque condensateur voit la pleine tension composée, en étoile seulement U/√3. Comme le réactif produit varie avec le CARRÉ de la tension, le triangle en fournit trois fois plus à capacité égale. D'où trois fois moins de µF à acheter."],
 "hacheur":["L'interrupteur qui clignote","Si tu allumes une lampe la moitié du temps, elle éclaire comme si elle recevait la moitié de la tension. Le rapport cyclique est cette fraction de temps. C'est pour ça que la sortie ne peut jamais dépasser l'entrée."],
 "icc":["Ce que dit la U_cc","Une U_cc de 4 % signifie qu'il suffit de 4 % de la tension pour faire circuler le courant nominal dans un secondaire en court-circuit. Sous 100 % de la tension, il passe donc 25 fois plus. Petite U_cc, gros court-circuit."]
};

/* =========================================================================
   2. LES FIGURES ANIMÉES
   Une notion d'électrotechnique se comprend en la VOYANT bouger : le
   vecteur qui tourne et dessine la sinusoïde, le champ qui entraîne le
   rotor, le courant de défaut qui cherche la terre. Chaque figure
   s'insère dans une leçon par <figure data-anim="id">.
   ========================================================================= */
const T=(v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const C1=()=>T("--primary"), C2=()=>T("--success"), C3=()=>T("--danger"),
      CM=()=>T("--muted"), CI=()=>T("--text"), CB=()=>T("--border"), CS=()=>T("--surface");
const TAU=Math.PI*2;

/* --- petites primitives de dessin partagées par toutes les figures --- */
function fleche(c,x1,y1,x2,y2,col,ep){
  const a=Math.atan2(y2-y1,x2-x1),l=Math.hypot(x2-x1,y2-y1);if(l<1)return;
  const t=Math.min(9,l*0.32);
  c.strokeStyle=col;c.fillStyle=col;c.lineWidth=ep||2;c.lineCap="round";
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-Math.cos(a)*t*0.8,y2-Math.sin(a)*t*0.8);c.stroke();
  c.beginPath();c.moveTo(x2,y2);
  c.lineTo(x2-Math.cos(a-0.42)*t,y2-Math.sin(a-0.42)*t);
  c.lineTo(x2-Math.cos(a+0.42)*t,y2-Math.sin(a+0.42)*t);
  c.closePath();c.fill();
}
function txt(c,s,x,y,taille,col,al,gras){
  c.fillStyle=col||CM();c.font=(gras?"600 ":"")+(taille||11)+'px Rubik, sans-serif';
  c.textAlign=al||"left";c.textBaseline="middle";c.fillText(s,x,y);
}
function mono(c,s,x,y,taille,col,al){
  c.fillStyle=col||CI();c.font=(taille||11)+'px "IBM Plex Mono", monospace';
  c.textAlign=al||"left";c.textBaseline="middle";c.fillText(s,x,y);
}
function axes(c,x0,y0,w,h,legX,legY){
  c.strokeStyle=CB();c.lineWidth=1;
  c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+w,y0);c.moveTo(x0,y0-h/2);c.lineTo(x0,y0+h/2);c.stroke();
  if(legX)txt(c,legX,x0+w,y0+14,10,CM(),"right");
  if(legY)txt(c,legY,x0-4,y0-h/2+4,10,CM(),"right");
}
function grille(c,x0,y0,w,h,n){
  c.strokeStyle=CB();c.globalAlpha=.45;c.lineWidth=1;
  for(let i=1;i<n;i++){const x=x0+w*i/n;c.beginPath();c.moveTo(x,y0-h/2);c.lineTo(x,y0+h/2);c.stroke();}
  c.globalAlpha=1;
}
function bobineSVG(c,x,y,r,ang,col,ep){
  c.save();c.translate(x,y);c.rotate(ang);
  c.strokeStyle=col;c.lineWidth=ep||3;c.lineCap="round";
  c.beginPath();
  for(let i=0;i<3;i++){c.arc(-r*0.5+i*r*0.5,0,r*0.25,Math.PI,0,false);}
  c.stroke();c.restore();
}
function pastilleTexte(c,s,x,y,col){
  c.font='600 10.5px Rubik, sans-serif';const w=c.measureText(s).width+14;
  c.fillStyle=col;c.globalAlpha=.14;
  c.beginPath();c.roundRect(x-w/2,y-9,w,18,9);c.fill();c.globalAlpha=1;
  txt(c,s,x,y,10.5,col,"center",true);
}

const ANIM={

/* ---- LE fondamental : un vecteur tourne, sa projection EST la sinusoïde ---- */
"phaseur":{t:"Le vecteur tournant engendre la sinusoïde",ratio:2.25,
 note:"Le point rouge est la projection verticale du vecteur. C'est elle qu'on appelle « la tension ».",
 regl:[{id:"f",lib:"Fréquence",min:10,max:100,pas:5,val:50,u:"Hz"}],
 dessin(c,w,h,t,p){
  const rr=Math.min(h*0.38,w*0.16),cx=rr+22,cy=h/2,x0=cx+rr+26,lw=w-x0-14;
  const om=p.f/50*1.4, ang=t*om;
  /* cercle du vecteur */
  c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke();
  c.beginPath();c.moveTo(cx-rr-6,cy);c.lineTo(cx+rr+6,cy);c.moveTo(cx,cy-rr-6);c.lineTo(cx,cy+rr+6);c.stroke();
  const px=cx+rr*Math.cos(ang),py=cy-rr*Math.sin(ang);
  /* projection */
  c.setLineDash([3,3]);c.strokeStyle=C3();c.lineWidth=1.2;
  c.beginPath();c.moveTo(px,py);c.lineTo(cx,py);c.lineTo(x0,py);c.stroke();c.setLineDash([]);
  fleche(c,cx,cy,px,py,C1(),2.6);
  c.fillStyle=C3();c.beginPath();c.arc(cx,py,3.5,0,TAU);c.fill();
  txt(c,"U max",cx+rr*0.55*Math.cos(ang)-2,cy-rr*0.55*Math.sin(ang)-11,10,C1(),"center",true);
  /* onde : le vecteur laisse sa trace */
  axes(c,x0,cy,lw,h*0.82,"t","u");
  c.strokeStyle=C1();c.lineWidth=2.4;c.beginPath();
  const per=lw/2.2;
  for(let i=0;i<=260;i++){
    const dt=i/260*2.2, a=ang-dt*TAU;
    const x=x0+dt*per, y=cy-rr*Math.sin(a);
    i?c.lineTo(x,y):c.moveTo(x,y);
  }
  c.stroke();
  c.fillStyle=C3();c.beginPath();c.arc(x0,cy-rr*Math.sin(ang),4,0,TAU);c.fill();
  /* efficace */
  const ye=cy-rr/Math.SQRT2;
  c.setLineDash([5,4]);c.strokeStyle=C2();c.lineWidth=1.4;
  c.beginPath();c.moveTo(x0,ye);c.lineTo(x0+lw,ye);c.stroke();c.setLineDash([]);
  txt(c,"U eff = U max / √2",x0+lw-4,ye-10,10.5,C2(),"right",true);
  mono(c,"θ = "+((ang*180/Math.PI)%360).toFixed(0)+"°",cx,cy+rr+18,11,CM(),"center");
 }},

/* ---- Déphasage : R, L ou C, on VOIT le courant avancer ou retarder ---- */
"dephasage":{t:"Déphasage courant / tension",ratio:2.3,
 note:"Change le récepteur : la bobine met le courant en retard, le condensateur en avance.",
 regl:[{id:"k",lib:"Récepteur",choix:["Résistance (φ = 0°)","Bobine (φ = −90°)","Condensateur (φ = +90°)","Moteur (φ = −35°)"],val:0}],
 dessin(c,w,h,t,p){
  const phi=[0,-90,90,-35][p.k]*Math.PI/180;
  const rr=Math.min(h*0.36,w*0.15),cx=rr+20,cy=h/2,x0=cx+rr+26,lw=w-x0-16;
  const ang=t*1.4;
  c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke();
  fleche(c,cx,cy,cx+rr*Math.cos(ang),cy-rr*Math.sin(ang),C1(),2.6);
  fleche(c,cx,cy,cx+rr*0.72*Math.cos(ang+phi),cy-rr*0.72*Math.sin(ang+phi),C2(),2.6);
  axes(c,x0,cy,lw,h*0.8);
  const per=lw/2.2, A=h*0.30;
  const onde=(dph,col,amp,ep)=>{c.strokeStyle=col;c.lineWidth=ep;c.beginPath();
   for(let i=0;i<=260;i++){const dt=i/260*2.2,a=ang+dph-dt*TAU;
    const x=x0+dt*per,y=cy-amp*Math.sin(a);i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();};
  onde(0,C1(),A,2.4);onde(phi,C2(),A*0.72,2.4);
  txt(c,"u(t)",x0+8,cy-A-8,11,C1(),"left",true);
  txt(c,"i(t)",x0+8,cy+A*0.72+10,11,C2(),"left",true);
  const dec=-phi/TAU*per;
  if(Math.abs(phi)>0.01){
   c.strokeStyle=C3();c.lineWidth=1.4;c.setLineDash([3,3]);
   const xm=x0+per*0.25;
   c.beginPath();c.moveTo(xm,cy-A-14);c.lineTo(xm,cy+A+14);c.moveTo(xm+dec,cy-A-14);c.lineTo(xm+dec,cy+A+14);c.stroke();c.setLineDash([]);
   fleche(c,xm,cy+A+18,xm+dec,cy+A+18,C3(),1.8);
   pastilleTexte(c,"φ = "+([0,-90,90,-35][p.k])+"°",xm+dec/2,cy+A+32,C3());
  } else pastilleTexte(c,"en phase",x0+per*0.35,cy+A+30,C2());
 }},

/* ---- LE champ tournant : trois bobines, un vecteur qui tourne tout seul ---- */
"champ-tournant":{t:"Le champ tournant du triphasé",ratio:1.7,
 note:"Trois bobines fixes, trois courants décalés de 120° : le champ résultant TOURNE sans aucune pièce mobile. C'est tout le moteur asynchrone.",
 regl:[{id:"v",lib:"Vitesse",min:0.2,max:2.5,pas:0.1,val:1,u:"×"},
       {id:"r",lib:"Rotor",choix:["Masqué","Visible"],val:1}],
 dessin(c,w,h,t,p){
  const R0=Math.min(h*0.285,w*0.185),cx=Math.max(R0*1.85+8,w*0.24),cy=h*0.52;
  const ang=t*1.5*p.v;
  const cols=[C1(),C2(),C3()];
  /* stator */
  c.strokeStyle=CB();c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,R0*1.32,0,TAU);c.stroke();
  c.beginPath();c.arc(cx,cy,R0*1.05,0,TAU);c.stroke();
  let bx=0,by=0;
  for(let k=0;k<3;k++){
   const a=-Math.PI/2+k*TAU/3;
   const i=Math.sin(ang-k*TAU/3);
   const ex=cx+Math.cos(a)*R0*1.18, ey=cy+Math.sin(a)*R0*1.18;
   /* la bobine s'allume selon son courant */
   c.globalAlpha=.18+.55*Math.abs(i);
   c.fillStyle=cols[k];c.beginPath();c.arc(ex,ey,R0*0.19,0,TAU);c.fill();c.globalAlpha=1;
   bobineSVG(c,ex,ey,R0*0.30,a+Math.PI/2,cols[k],2.4);
   txt(c,"L"+(k+1),cx+Math.cos(a)*R0*1.55,cy+Math.sin(a)*R0*1.55,11,cols[k],"center",true);
   /* contribution vectorielle de cette bobine */
   bx+=i*Math.cos(a);by+=i*Math.sin(a);
   c.globalAlpha=.35;fleche(c,cx,cy,cx+i*Math.cos(a)*R0*0.72,cy+i*Math.sin(a)*R0*0.72,cols[k],1.6);c.globalAlpha=1;
  }
  /* champ résultant : amplitude constante, direction tournante */
  const m=Math.hypot(bx,by)||1;
  fleche(c,cx,cy,cx+bx/1.5*R0*0.92,cy+by/1.5*R0*0.92,CI(),3.4);
  if(p.r===1){
   const ra=ang-0.35;
   c.strokeStyle=CM();c.lineWidth=2;c.beginPath();c.arc(cx,cy,R0*0.46,0,TAU);c.stroke();
   c.fillStyle=CS();c.beginPath();c.arc(cx,cy,R0*0.46,0,TAU);c.fill();
   c.strokeStyle=CM();c.stroke();
   for(let k=0;k<8;k++){const a=ra+k*TAU/8;
    c.strokeStyle=CB();c.lineWidth=2.5;c.beginPath();
    c.moveTo(cx+Math.cos(a)*R0*0.24,cy+Math.sin(a)*R0*0.24);
    c.lineTo(cx+Math.cos(a)*R0*0.42,cy+Math.sin(a)*R0*0.42);c.stroke();}
   c.fillStyle=CM();c.beginPath();c.arc(cx,cy,3,0,TAU);c.fill();
   txt(c,"rotor",cx,cy+R0*0.66,10,CM(),"center");
  }
  pastilleTexte(c,"champ résultant",cx,14,CI());
  /* chronogramme des trois courants, à droite */
  const x0=cx+R0*1.9,lw=w-x0-14;
  if(lw>90){
   const my=cy,A=h*0.30;
   axes(c,x0,my,lw,h*0.78,"t");
   for(let k=0;k<3;k++){
    c.strokeStyle=cols[k];c.lineWidth=2;c.beginPath();
    for(let i=0;i<=200;i++){const dt=i/200*2,a=ang-k*TAU/3-dt*TAU;
     const x=x0+dt*(lw/2),y=my-A*Math.sin(a);i?c.lineTo(x,y):c.moveTo(x,y);}
    c.stroke();
    c.fillStyle=cols[k];c.beginPath();c.arc(x0,my-A*Math.sin(ang-k*TAU/3),3.5,0,TAU);c.fill();
   }
   txt(c,"les trois courants, décalés de 120°",x0+lw,my+A+16,10,CM(),"right");
  }
 }},

/* ---- Somme des trois courants : le neutre ---- */
"triphase-somme":{t:"Pourquoi le neutre ne transporte rien… sauf en déséquilibre",ratio:2.2,
 note:"Déplace un curseur : dès que les trois courants diffèrent, la somme cesse d'être nulle et le neutre se charge.",
 regl:[{id:"a",lib:"Courant L1",min:0,max:20,pas:1,val:12,u:"A"},
       {id:"b",lib:"Courant L2",min:0,max:20,pas:1,val:12,u:"A"},
       {id:"c",lib:"Courant L3",min:0,max:20,pas:1,val:12,u:"A"}],
 dessin(c,w,h,t,p){
  const I=[p.a,p.b,p.c],cols=[C1(),C2(),T("--primary-hover")];
  const x0=44,lw=w*0.62,cy=h/2,A=h*0.30,mx=Math.max(20,...I);
  axes(c,x0,cy,lw,h*0.86,"t","i");
  grille(c,x0,cy,lw,h*0.86,4);
  const ang=t*1.3;
  for(let k=0;k<3;k++){
   c.strokeStyle=cols[k];c.lineWidth=2;c.beginPath();
   for(let i=0;i<=220;i++){const dt=i/220*2,a=ang-k*TAU/3-dt*TAU;
    const x=x0+dt*(lw/2),y=cy-A*(I[k]/mx)*Math.sin(a);i?c.lineTo(x,y):c.moveTo(x,y);}
   c.stroke();
  }
  c.strokeStyle=C3();c.lineWidth=3;c.setLineDash([6,3]);c.beginPath();
  for(let i=0;i<=220;i++){const dt=i/220*2;let s=0;
   for(let k=0;k<3;k++)s+=I[k]*Math.sin(ang-k*TAU/3-dt*TAU);
   const x=x0+dt*(lw/2),y=cy-A*(s/mx);i?c.lineTo(x,y):c.moveTo(x,y);}
  c.stroke();c.setLineDash([]);
  txt(c,"L1",x0+6,cy-A-10,10.5,cols[0],"left",true);
  txt(c,"L2",x0+34,cy-A-10,10.5,cols[1],"left",true);
  txt(c,"L3",x0+62,cy-A-10,10.5,cols[2],"left",true);
  txt(c,"neutre",x0+92,cy-A-10,10.5,C3(),"left",true);
  /* diagramme vectoriel à droite */
  const vx=x0+lw+ (w-x0-lw)/2, vy=cy, rr=Math.min(h*0.34,(w-x0-lw)*0.40);
  c.strokeStyle=CB();c.beginPath();c.arc(vx,vy,rr,0,TAU);c.stroke();
  let sx=0,sy=0;
  for(let k=0;k<3;k++){const a=-k*TAU/3;
   const ex=vx+Math.cos(a)*rr*(I[k]/mx),ey=vy-Math.sin(a)*rr*(I[k]/mx);
   fleche(c,vx,vy,ex,ey,cols[k],2);
   sx+=Math.cos(a)*(I[k]/mx);sy-=Math.sin(a)*(I[k]/mx);}
  const In=Math.hypot(sx,sy)*mx;
  if(In>0.15)fleche(c,vx,vy,vx+sx*rr,vy+sy*rr,C3(),3);
  pastilleTexte(c,"I neutre = "+In.toFixed(1)+" A",vx,vy+rr+20,In<0.5?C2():C3());
 }},

/* ---- Étoile / triangle : le couplage se VOIT ---- */
"couplage":{t:"Étoile ou triangle : ce que voit l'enroulement",ratio:2.1,
 note:"Le même moteur, deux câblages. En étoile l'enroulement ne voit que U/√3.",
 regl:[{id:"k",lib:"Couplage",choix:["Étoile (Y)","Triangle (Δ)"],val:0},
       {id:"u",lib:"Réseau",choix:["400 V","230 V","690 V"],val:0}],
 dessin(c,w,h,t,p){
  const U=[400,230,690][p.u], etoile=p.k===0, Venr=etoile?U/SQ3:U;
  const cx=w*0.30,cy=h/2,R0=Math.min(h*0.34,w*0.14);
  const A=[-Math.PI/2,-Math.PI/2+TAU/3,-Math.PI/2+2*TAU/3];
  const pt=A.map(a=>[cx+Math.cos(a)*R0,cy+Math.sin(a)*R0]);
  const cols=[C1(),C2(),T("--primary-hover")];
  const flux=(t*1.6)%1;
  if(etoile){
   pt.forEach((q,k)=>{
    c.strokeStyle=cols[k];c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(q[0],q[1]);c.stroke();
    bobineSVG(c,(cx+q[0])/2,(cy+q[1])/2,R0*0.42,A[k],cols[k],3);
    const bx=cx+(q[0]-cx)*1.42,by=cy+(q[1]-cy)*1.42;
    c.strokeStyle=cols[k];c.lineWidth=2;c.beginPath();c.moveTo(q[0],q[1]);c.lineTo(bx,by);c.stroke();
    txt(c,"L"+(k+1),bx+(bx>cx?10:-10),by,11,cols[k],bx>cx?"left":"right",true);
    const fx=cx+(q[0]-cx)*flux,fy=cy+(q[1]-cy)*flux;
    c.fillStyle=cols[k];c.beginPath();c.arc(fx,fy,3,0,TAU);c.fill();});
   c.fillStyle=CI();c.beginPath();c.arc(cx,cy,4.5,0,TAU);c.fill();
   txt(c,"point neutre",cx,cy+18,10,CM(),"center");
  }else{
   for(let k=0;k<3;k++){
    const a=pt[k],b=pt[(k+1)%3];
    c.strokeStyle=cols[k];c.lineWidth=3;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
    bobineSVG(c,(a[0]+b[0])/2,(a[1]+b[1])/2,R0*0.46,Math.atan2(b[1]-a[1],b[0]-a[0]),cols[k],3);
    const fx=a[0]+(b[0]-a[0])*flux,fy=a[1]+(b[1]-a[1])*flux;
    c.fillStyle=cols[k];c.beginPath();c.arc(fx,fy,3,0,TAU);c.fill();
   }
   pt.forEach((q,k)=>{const bx=cx+(q[0]-cx)*1.55,by=cy+(q[1]-cy)*1.55;
    c.strokeStyle=cols[k];c.lineWidth=2;c.beginPath();c.moveTo(q[0],q[1]);c.lineTo(bx,by);c.stroke();
    txt(c,"L"+(k+1),bx+(bx>cx?10:-10),by,11,cols[k],bx>cx?"left":"right",true);});
  }
  /* panneau de lecture */
  const px=w*0.60,py=h*0.24,lh=Math.min(30,h*0.16);
  const lignes=[["Tension réseau U",U+" V",CI()],
   ["Vue par un enroulement",Math.round(Venr)+" V",etoile?C2():C3()],
   ["Courant de ligne",etoile?"= courant enroulement":"= √3 × courant enroulement",CM()],
   ["Règle",etoile?"U enroulement = U / √3":"U enroulement = U",C1()]];
  lignes.forEach((l,i)=>{
   txt(c,l[0],px,py+i*lh,11,CM());
   mono(c,l[1],px,py+i*lh+14,13,l[2]);});
 }},

/* ---- Loi d'Ohm : on voit passer le courant et chauffer ---- */
"ohm-flux":{t:"Ce que fait vraiment une résistance",ratio:2.6,
 note:"Augmente la tension : le débit grimpe. Augmente la résistance : ça bouchonne, et ça chauffe au carré.",
 regl:[{id:"u",lib:"Tension",min:6,max:240,pas:6,val:120,u:"V"},
       {id:"r",lib:"Résistance",min:5,max:120,pas:5,val:40,u:"Ω"}],
 dessin(c,w,h,t,p){
  const I=p.u/p.r, Pw=p.u*I;
  const y=h*0.42,x1=w*0.10,x2=w*0.90,rx=w*0.42,rw=w*0.16;
  c.strokeStyle=CM();c.lineWidth=2.5;
  c.beginPath();c.moveTo(x1,y);c.lineTo(rx,y);c.moveTo(rx+rw,y);c.lineTo(x2,y);c.stroke();
  /* symbole résistance, plus épais = plus résistant */
  const ep=2+p.r/24;
  c.strokeStyle=CI();c.lineWidth=ep;
  c.beginPath();c.rect(rx,y-h*0.09,rw,h*0.18);c.stroke();
  c.fillStyle=C3();c.globalAlpha=Math.min(.55,Pw/900);
  c.beginPath();c.rect(rx,y-h*0.09,rw,h*0.18);c.fill();c.globalAlpha=1;
  mono(c,p.r+" Ω",rx+rw/2,y,13,CI(),"center");
  /* porteurs de charge */
  const n=Math.max(3,Math.round(I*3.2)),v=(t*I*0.09)%1;
  for(let k=0;k<n;k++){
   const f=((k/n)+v)%1;let px,py=y;
   if(f<0.42){px=x1+(rx-x1)*(f/0.42);}
   else if(f<0.58){px=rx+rw*((f-0.42)/0.16);}
   else{px=rx+rw+(x2-rx-rw)*((f-0.58)/0.42);}
   c.fillStyle=C1();c.beginPath();c.arc(px,py,3.4,0,TAU);c.fill();}
  /* chaleur qui monte */
  if(Pw>60){for(let k=0;k<5;k++){
   const ph=((t*0.6+k*0.2)%1);
   c.globalAlpha=(1-ph)*Math.min(.7,Pw/700);
   c.strokeStyle=C3();c.lineWidth=2;c.beginPath();
   const bx=rx+rw*(0.18+k*0.16);
   c.moveTo(bx,y-h*0.10);
   c.quadraticCurveTo(bx+6,y-h*0.10-ph*h*0.16,bx,y-h*0.10-ph*h*0.30);
   c.stroke();c.globalAlpha=1;}}
  /* source */
  c.strokeStyle=CM();c.lineWidth=2.5;
  c.beginPath();c.moveTo(x1,y);c.lineTo(x1,y+h*0.26);c.lineTo(x2,y+h*0.26);c.lineTo(x2,y);c.stroke();
  c.beginPath();c.moveTo(w*0.46,y+h*0.26-9);c.lineTo(w*0.46,y+h*0.26+9);
  c.moveTo(w*0.50,y+h*0.26-5);c.lineTo(w*0.50,y+h*0.26+5);c.stroke();
  mono(c,p.u+" V",w*0.48,y+h*0.26+20,12,C1(),"center");
  /* lectures */
  mono(c,"I = "+F(I,2)+" A",w*0.12,h*0.10,14,C1());
  mono(c,"P = "+F(Pw,0)+" W",w*0.12,h*0.10+20,14,Pw>500?C3():C2());
  txt(c,"P = R·I² — double le courant, quadruple la chaleur",w*0.98,h*0.10,11,CM(),"right");
 }}
};

Object.assign(ANIM,{

/* ---- Le condensateur se remplit sous tes yeux ---- */
"rc-charge":{t:"Charge et décharge d'un condensateur",ratio:2.3,
 note:"Le condensateur se remplit vite au début, puis de plus en plus lentement : 63 % à 1τ, 99 % à 5τ.",
 regl:[{id:"tau",lib:"Constante de temps τ",min:0.2,max:3,pas:0.1,val:1,u:"s"},
       {id:"m",lib:"Mode",choix:["Charge","Décharge","Cycle"],val:2}],
 dessin(c,w,h,t,p){
  const per=p.tau*7, ph=(t%per)/per;
  let x=ph*5*p.tau, u, charge;
  if(p.m===0){charge=true;u=1-Math.exp(-x/p.tau);}
  else if(p.m===1){charge=false;u=Math.exp(-x/p.tau);}
  else{charge=(t%(per*2))<per;const xx=(t%(per))/per*5*p.tau;u=charge?1-Math.exp(-xx/p.tau):Math.exp(-xx/p.tau);x=xx;}
  /* schéma */
  const sx=w*0.06,sy=h*0.5,sw=w*0.30;
  c.strokeStyle=CM();c.lineWidth=2.2;
  c.beginPath();c.moveTo(sx,sy-h*0.26);c.lineTo(sx+sw*0.42,sy-h*0.26);c.stroke();
  c.beginPath();c.rect(sx+sw*0.42,sy-h*0.32,sw*0.22,h*0.12);c.stroke();
  txt(c,"R",sx+sw*0.53,sy-h*0.38,11,CM(),"center",true);
  c.beginPath();c.moveTo(sx+sw*0.64,sy-h*0.26);c.lineTo(sx+sw,sy-h*0.26);c.lineTo(sx+sw,sy-h*0.04);c.stroke();
  /* condensateur, rempli proportionnellement */
  const cw=sw*0.30,cy0=sy-h*0.04;
  c.strokeStyle=CI();c.lineWidth=3;
  c.beginPath();c.moveTo(sx+sw-cw/2,cy0);c.lineTo(sx+sw+cw/2,cy0);
  c.moveTo(sx+sw-cw/2,cy0+12);c.lineTo(sx+sw+cw/2,cy0+12);c.stroke();
  c.fillStyle=C1();c.globalAlpha=.22+u*0.6;
  c.fillRect(sx+sw-cw/2,cy0+2,cw,8);c.globalAlpha=1;
  c.strokeStyle=CM();c.lineWidth=2.2;
  c.beginPath();c.moveTo(sx+sw,cy0+12);c.lineTo(sx+sw,sy+h*0.26);c.lineTo(sx,sy+h*0.26);c.lineTo(sx,sy-h*0.26);c.stroke();
  mono(c,"u = "+(u*100).toFixed(0)+" %",sx+sw+16,cy0+6,13,C1());
  /* porteurs : le courant décroît quand la charge avance */
  const ic=charge?Math.exp(-x/p.tau):-Math.exp(-x/p.tau);
  const n=6,vv=(t*Math.abs(ic)*0.55)%1;
  for(let k=0;k<n;k++){const f=((k/n)+(ic>0?vv:1-vv))%1;
   c.globalAlpha=Math.min(1,Math.abs(ic)*1.6);
   c.fillStyle=C2();c.beginPath();c.arc(sx+f*sw,sy-h*0.26,3,0,TAU);c.fill();c.globalAlpha=1;}
  /* courbe */
  const gx=w*0.44,gw=w-gx-16,gy=h*0.5,A=h*0.34;
  axes(c,gx,gy,gw,h*0.86,"t","u");
  c.strokeStyle=CB();c.setLineDash([3,3]);
  [0.632,1].forEach(v=>{c.beginPath();c.moveTo(gx,gy+A-2*A*v);c.lineTo(gx+gw,gy+A-2*A*v);c.stroke();});
  c.setLineDash([]);
  txt(c,"63 %",gx-4,gy+A-2*A*0.632,10,CM(),"right");
  txt(c,"100 %",gx-4,gy-A,10,CM(),"right");
  for(let k=1;k<=5;k++){const xx=gx+gw*k/5.4;
   c.strokeStyle=CB();c.setLineDash([2,3]);c.beginPath();c.moveTo(xx,gy-A);c.lineTo(xx,gy+A);c.stroke();c.setLineDash([]);
   txt(c,k+"τ",xx,gy+A+12,9.5,CM(),"center");}
  c.strokeStyle=C1();c.lineWidth=2.6;c.beginPath();
  for(let i=0;i<=200;i++){const xx=i/200*5.4*p.tau;
   const v=charge?1-Math.exp(-xx/p.tau):Math.exp(-xx/p.tau);
   const X=gx+gw*(xx/(5.4*p.tau)),Y=gy+A-2*A*v;i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();
  const cxp=gx+gw*(Math.min(x,5.4*p.tau)/(5.4*p.tau));
  c.fillStyle=C3();c.beginPath();c.arc(cxp,gy+A-2*A*u,4.5,0,TAU);c.fill();
  pastilleTexte(c,charge?"charge":"décharge",gx+gw-40,gy-A+2,charge?C2():C3());
 }},

/* ---- La bobine coupée : la surtension et la roue libre ---- */
"roue-libre":{t:"Pourquoi une diode de roue libre",ratio:2.3,
 note:"À l'ouverture, le courant de la bobine ne peut pas s'annuler d'un coup. Sans chemin, il arrache un arc au contact.",
 regl:[{id:"d",lib:"Diode de roue libre",choix:["Absente","Présente"],val:0}],
 dessin(c,w,h,t,p){
  const cyc=3.2,ph=(t%cyc)/cyc, ferme=ph<0.55;
  const tOuv=(ph-0.55)/0.45;
  const sx=w*0.06,sy=h*0.5,sw=w*0.32;
  c.strokeStyle=CM();c.lineWidth=2.2;
  c.beginPath();c.moveTo(sx,sy-h*0.26);c.lineTo(sx+sw*0.34,sy-h*0.26);c.stroke();
  /* interrupteur */
  c.beginPath();c.arc(sx+sw*0.34,sy-h*0.26,2.6,0,TAU);c.fill();
  c.beginPath();c.moveTo(sx+sw*0.34,sy-h*0.26);
  if(ferme)c.lineTo(sx+sw*0.56,sy-h*0.26);else c.lineTo(sx+sw*0.53,sy-h*0.26-14);
  c.stroke();
  c.beginPath();c.arc(sx+sw*0.56,sy-h*0.26,2.6,0,TAU);c.fill();
  c.beginPath();c.moveTo(sx+sw*0.56,sy-h*0.26);c.lineTo(sx+sw,sy-h*0.26);c.lineTo(sx+sw,sy-h*0.10);c.stroke();
  bobineSVG(c,sx+sw,sy+h*0.02,h*0.18,Math.PI/2,C1(),3);
  txt(c,"bobine",sx+sw+30,sy+h*0.02,11,C1());
  c.beginPath();c.moveTo(sx+sw,sy+h*0.14);c.lineTo(sx+sw,sy+h*0.26);c.lineTo(sx,sy+h*0.26);c.lineTo(sx,sy-h*0.26);c.stroke();
  /* diode */
  if(p.d===1){
   const dx=sx+sw*0.74,dy1=sy-h*0.26,dy2=sy+h*0.26;
   c.strokeStyle=C2();c.lineWidth=2;
   c.beginPath();c.moveTo(dx,dy1);c.lineTo(dx,sy-h*0.06);c.moveTo(dx,sy+h*0.06);c.lineTo(dx,dy2);c.stroke();
   c.fillStyle=C2();c.beginPath();
   c.moveTo(dx-7,sy+h*0.06);c.lineTo(dx+7,sy+h*0.06);c.lineTo(dx,sy-h*0.06);c.closePath();c.fill();
   c.beginPath();c.moveTo(dx-7,sy-h*0.06);c.lineTo(dx+7,sy-h*0.06);c.stroke();
   txt(c,"roue libre",dx+11,sy,10.5,C2());
  }
  /* arc à l'ouverture, si pas de diode */
  if(!ferme&&p.d===0&&tOuv<0.30){
   const ax=sx+sw*0.45,ay=sy-h*0.26-7;
   c.strokeStyle=C3();c.lineWidth=1.6;c.globalAlpha=1-tOuv/0.30;
   for(let k=0;k<5;k++){c.beginPath();c.moveTo(ax-14,ay+4);
    for(let i=1;i<=4;i++)c.lineTo(ax-14+i*7,ay+(Math.random()-0.5)*13);c.stroke();}
   c.globalAlpha=1;
   pastilleTexte(c,"arc — contact détruit",ax+6,ay-24,C3());
  }
  /* chronogrammes */
  const gx=w*0.48,gw=w-gx-16,gy1=h*0.30,gy2=h*0.74,A=h*0.16;
  [["i(t) dans la bobine",gy1],["u aux bornes du contact",gy2]].forEach((l,idx)=>{
   const yy=l[1];
   c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.moveTo(gx,yy);c.lineTo(gx+gw,yy);c.stroke();
   txt(c,l[0],gx,yy-A-9,10.5,CM());
   c.strokeStyle=idx?C3():C1();c.lineWidth=2.4;c.beginPath();
   for(let i=0;i<=200;i++){
    const f=i/200, fe=f<0.55, to=(f-0.55)/0.45;
    let v;
    if(!idx){ v = fe? 1-Math.exp(-f/0.16) : (p.d===1? Math.exp(-to/0.30) : Math.exp(-to/0.03)); }
    else { v = fe? 0 : (p.d===1? 0.12*Math.exp(-to/0.30) : Math.exp(-to/0.018)); }
    const X=gx+gw*f, Y=yy-A*Math.min(v,1.15);
    i?c.lineTo(X,Y):c.moveTo(X,Y);}
   c.stroke();
   c.strokeStyle=CB();c.setLineDash([3,3]);c.beginPath();
   c.moveTo(gx+gw*0.55,yy-A-6);c.lineTo(gx+gw*0.55,yy+10);c.stroke();c.setLineDash([]);
   if(!idx)txt(c,"ouverture",gx+gw*0.55+4,yy+16,10,CM());
  });
  c.fillStyle=CI();c.beginPath();c.arc(gx+gw*ph,gy1,3.5,0,TAU);c.fill();
  pastilleTexte(c,p.d===1?"surtension maîtrisée":"surtension destructrice",gx+gw*0.78,gy2+A+16,p.d===1?C2():C3());
 }},

/* ---- Redressement : les diodes s'allument à tour de rôle ---- */
"redressement":{t:"Le redressement, diode par diode",ratio:2.2,
 note:"Chaque diode conduit quand sa phase est la plus haute. La sortie est la crête de l'ensemble.",
 regl:[{id:"m",lib:"Montage",choix:["Monophasé PD2","Triphasé PD3"],val:1},
       {id:"f",lib:"Filtrage",choix:["Sans","Avec condensateur"],val:0}],
 dessin(c,w,h,t,p){
  const tri=p.m===1, n=tri?3:2;
  const x0=44,lw=w-x0-16,cy=h*0.60,A=h*0.34;
  axes(c,x0,cy,lw,h*0.94,"t","u");
  const ang=t*1.1, per=lw/2;
  const cols=[C1(),C2(),T("--primary-hover")];
  /* les phases (ou la sinusoïde et son opposée) */
  for(let k=0;k<n;k++){
   c.strokeStyle=cols[k];c.globalAlpha=.55;c.lineWidth=1.6;c.beginPath();
   for(let i=0;i<=240;i++){const dt=i/240*2,a=ang-(tri?k*TAU/3:k*Math.PI)-dt*TAU;
    const X=x0+dt*per,Y=cy-A*Math.sin(a);i?c.lineTo(X,Y):c.moveTo(X,Y);}
   c.stroke();c.globalAlpha=1;}
  /* la tension redressée : max des valeurs absolues ou des différences */
  const val=dt=>{
   if(tri){let mx=-9,mn=9;for(let k=0;k<3;k++){const v=Math.sin(ang-k*TAU/3-dt*TAU);mx=Math.max(mx,v);mn=Math.min(mn,v);}return mx-mn;}
   return Math.abs(Math.sin(ang-dt*TAU));};
  const ech=tri?A/SQ3:A;
  c.strokeStyle=C3();c.lineWidth=3;c.beginPath();
  for(let i=0;i<=240;i++){const dt=i/240*2,X=x0+dt*per,Y=cy-ech*val(dt);i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();
  if(p.f===1){
   /* avec condensateur : la sortie suit la crête et décroît doucement */
   c.strokeStyle=C2();c.lineWidth=2.6;c.setLineDash([5,3]);c.beginPath();
   let u=0;
   for(let i=0;i<=240;i++){const dt=i/240*2,v=val(dt);u=Math.max(v,u-(tri?0.004:0.02));
    const X=x0+dt*per,Y=cy-ech*u;i?c.lineTo(X,Y):c.moveTo(X,Y);}
   c.stroke();c.setLineDash([]);
   txt(c,"avec condensateur : ondulation quasi nulle",x0+lw,cy-A-10,10.5,C2(),"right");
  }
  /* moyenne */
  let s=0;for(let i=0;i<300;i++)s+=val(i/300*2);s/=300;
  c.strokeStyle=CM();c.setLineDash([4,4]);c.lineWidth=1.4;
  c.beginPath();c.moveTo(x0,cy-ech*s);c.lineTo(x0+lw,cy-ech*s);c.stroke();c.setLineDash([]);
  txt(c,"valeur moyenne",x0+6,cy-ech*s-10,10.5,CM());
  /* diodes qui s'allument */
  const dy=h*0.13;
  for(let k=0;k<n;k++){
   const v=tri?Math.sin(ang-k*TAU/3):Math.sin(ang-k*Math.PI);
   let mx=-9;for(let j=0;j<n;j++)mx=Math.max(mx,tri?Math.sin(ang-j*TAU/3):Math.sin(ang-j*Math.PI));
   const on=Math.abs(v-mx)<1e-9;
   const px=x0+30+k*54;
   c.globalAlpha=on?1:.28;
   c.fillStyle=cols[k];c.beginPath();
   c.moveTo(px-8,dy+7);c.lineTo(px+8,dy+7);c.lineTo(px,dy-7);c.closePath();c.fill();
   c.strokeStyle=cols[k];c.lineWidth=2;c.beginPath();c.moveTo(px-8,dy-7);c.lineTo(px+8,dy-7);c.stroke();
   c.globalAlpha=1;
   txt(c,"D"+(k+1),px,dy+18,10,on?cols[k]:CM(),"center",on);}
  mono(c,tri?"U moy ≈ 1,35 · U":"U moy ≈ 0,90 · U eff",x0+lw,dy,12,C3(),"right");
 }},

/* ---- MLI : la largeur des impulsions dessine une sinusoïde ---- */
"mli":{t:"La modulation de largeur d'impulsion",ratio:2.2,
 note:"On compare une sinusoïde de référence à une porteuse triangulaire. La largeur des créneaux suit la sinusoïde, et le moteur ne voit que la moyenne.",
 regl:[{id:"fp",lib:"Fréquence de découpage",min:6,max:40,pas:2,val:16,u:"×"},
       {id:"m",lib:"Profondeur de modulation",min:0.2,max:1,pas:0.05,val:0.85,u:""}],
 dessin(c,w,h,t,p){
  const x0=40,lw=w-x0-14,y1=h*0.30,y2=h*0.76,A=h*0.20;
  const ang=t*0.9;
  axes(c,x0,y1,lw,h*0.5);
  /* porteuse */
  c.strokeStyle=CB();c.lineWidth=1.4;c.beginPath();
  for(let i=0;i<=600;i++){const f=i/600;const tri=2*Math.abs(((f*p.fp)%1)-0.5)*2-1;
   const X=x0+lw*f,Y=y1-A*tri;i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();
  /* référence */
  c.strokeStyle=C1();c.lineWidth=2.6;c.beginPath();
  for(let i=0;i<=300;i++){const f=i/300;const r=p.m*Math.sin(ang+f*TAU);
   const X=x0+lw*f,Y=y1-A*r;i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();
  txt(c,"référence sinusoïdale",x0+6,y1-A-10,10.5,C1(),"left",true);
  txt(c,"porteuse triangulaire",x0+lw,y1-A-10,10.5,CM(),"right");
  /* impulsions résultantes */
  c.strokeStyle=C3();c.lineWidth=2;c.beginPath();
  let prev=null;
  for(let i=0;i<=1200;i++){const f=i/1200;
   const tri=2*Math.abs(((f*p.fp)%1)-0.5)*2-1, r=p.m*Math.sin(ang+f*TAU);
   const on=r>tri?1:-1;
   const X=x0+lw*f,Y=y2-A*0.8*on;
   if(prev!==null&&prev!==on)c.lineTo(X,y2-A*0.8*prev);
   i?c.lineTo(X,Y):c.moveTo(X,Y);prev=on;}
  c.stroke();
  /* courant lissé par l'inductance du moteur */
  c.strokeStyle=C2();c.lineWidth=2.6;c.beginPath();
  for(let i=0;i<=300;i++){const f=i/300;const r=p.m*Math.sin(ang+f*TAU-0.35);
   const X=x0+lw*f,Y=y2-A*0.8*r;i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();
  txt(c,"tension découpée aux bornes du moteur",x0+6,y2-A*0.8-13,10.5,C3(),"left",true);
  txt(c,"courant réel : lissé par l'inductance",x0+lw,y2+A*0.8+14,10.5,C2(),"right",true);
 }},

/* ---- Le transformateur : un flux commun, deux enroulements ---- */
"transfo":{t:"Le transformateur : un flux, deux enroulements",ratio:2.1,
 note:"Ce qui est gagné en tension est perdu en courant. Aucune liaison électrique entre les deux côtés.",
 regl:[{id:"n1",lib:"Spires primaire",min:100,max:1000,pas:50,val:500,u:"sp"},
       {id:"n2",lib:"Spires secondaire",min:25,max:1000,pas:25,val:250,u:"sp"},
       {id:"u1",lib:"Tension primaire",min:100,max:600,pas:10,val:400,u:"V"}],
 dessin(c,w,h,t,p){
  const m=p.n2/p.n1,U2=m*p.u1;
  const cx=w*0.34,cy=h/2,cw=w*0.30,ch=h*0.58;
  /* noyau */
  c.strokeStyle=CM();c.lineWidth=Math.max(8,w*0.016);
  c.beginPath();c.rect(cx-cw/2,cy-ch/2,cw,ch);c.stroke();
  c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.rect(cx-cw/2,cy-ch/2,cw,ch);c.stroke();
  /* flux qui circule dans le noyau */
  const ph=(t*0.5)%1;
  for(let k=0;k<4;k++){
   const f=(ph+k/4)%1;
   const per=2*(cw+ch),d=f*per;let px,py;
   if(d<cw){px=cx-cw/2+d;py=cy-ch/2;}
   else if(d<cw+ch){px=cx+cw/2;py=cy-ch/2+(d-cw);}
   else if(d<2*cw+ch){px=cx+cw/2-(d-cw-ch);py=cy+ch/2;}
   else{px=cx-cw/2;py=cy+ch/2-(d-2*cw-ch);}
   c.fillStyle=C1();c.globalAlpha=.85;c.beginPath();c.arc(px,py,4,0,TAU);c.fill();c.globalAlpha=1;}
  txt(c,"flux magnétique Φ",cx,cy,11,C1(),"center",true);
  /* enroulements : le nombre de spires dessinées suit le rapport */
  const spires=(x,n,col,cote)=>{
   const k=Math.max(3,Math.min(9,Math.round(n/100)));
   c.strokeStyle=col;c.lineWidth=2.6;
   for(let i=0;i<k;i++){
    const y=cy-ch*0.34+i*(ch*0.68/(k-1||1));
    c.beginPath();c.arc(x,y,7,cote>0?-Math.PI/2:Math.PI/2,cote>0?Math.PI/2:3*Math.PI/2,false);c.stroke();}
  };
  spires(cx-cw/2,p.n1,C2(),-1);
  spires(cx+cw/2,p.n2,C3(),1);
  /* bornes et lectures */
  const gauche=cx-cw/2-w*0.16, droite=cx+cw/2+w*0.06;
  c.strokeStyle=C2();c.lineWidth=2;
  c.beginPath();c.moveTo(cx-cw/2-7,cy-ch*0.34);c.lineTo(gauche+14,cy-ch*0.34);
  c.moveTo(cx-cw/2-7,cy+ch*0.34);c.lineTo(gauche+14,cy+ch*0.34);c.stroke();
  c.strokeStyle=C3();
  c.beginPath();c.moveTo(cx+cw/2+7,cy-ch*0.34);c.lineTo(droite+w*0.10,cy-ch*0.34);
  c.moveTo(cx+cw/2+7,cy+ch*0.34);c.lineTo(droite+w*0.10,cy+ch*0.34);c.stroke();
  mono(c,p.u1+" V",gauche+10,cy-ch*0.34-14,13,C2());
  mono(c,p.n1+" sp",gauche+10,cy+ch*0.34+16,11,CM());
  mono(c,F(U2,0)+" V",droite+w*0.10,cy-ch*0.34-14,13,C3(),"right");
  mono(c,p.n2+" sp",droite+w*0.10,cy+ch*0.34+16,11,CM(),"right");
  pastilleTexte(c,"m = "+F(m,3),cx,cy-ch/2-18,C1());
  txt(c,m<1?"abaisseur":m>1?"élévateur":"isolement (m = 1)",cx,cy+ch/2+20,11,CM(),"center",true);
 }},

/* ---- Glissement : le rotor court après le champ sans jamais le rattraper ---- */
"glissement":{t:"Le glissement, en direct",ratio:1.9,
 note:"Le rotor tourne TOUJOURS moins vite que le champ. S'il le rattrapait, plus de variation de flux, plus de couple.",
 regl:[{id:"g",lib:"Glissement",min:0,max:20,pas:1,val:4,u:"%"},
       {id:"p",lib:"Pôles",choix:["2 pôles","4 pôles","6 pôles"],val:1}],
 dessin(c,w,h,t,p){
  const pp=p.p+1, ns=3000/pp, g=p.g/100, n=ns*(1-g);
  const R0=Math.min(h*0.30,w*0.18),cx=Math.max(R0*1.60+10,w*0.22),cy=h*0.53;
  const aC=t*1.6, aR=t*1.6*(1-g);
  c.strokeStyle=CB();c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,R0*1.22,0,TAU);c.stroke();
  for(let k=0;k<3;k++){const a=-Math.PI/2+k*TAU/3;
   bobineSVG(c,cx+Math.cos(a)*R0*1.10,cy+Math.sin(a)*R0*1.10,R0*0.26,a+Math.PI/2,CB(),2.2);}
  /* rotor */
  c.fillStyle=CS();c.strokeStyle=CM();c.lineWidth=2;
  c.beginPath();c.arc(cx,cy,R0*0.62,0,TAU);c.fill();c.stroke();
  for(let k=0;k<10;k++){const a=aR+k*TAU/10;
   c.strokeStyle=CB();c.lineWidth=3;c.beginPath();
   c.moveTo(cx+Math.cos(a)*R0*0.34,cy+Math.sin(a)*R0*0.34);
   c.lineTo(cx+Math.cos(a)*R0*0.58,cy+Math.sin(a)*R0*0.58);c.stroke();}
  /* repère sur le rotor pour VOIR le retard */
  c.fillStyle=C2();c.beginPath();c.arc(cx+Math.cos(aR)*R0*0.46,cy+Math.sin(aR)*R0*0.46,5,0,TAU);c.fill();
  fleche(c,cx,cy,cx+Math.cos(aC)*R0*1.0,cy+Math.sin(aC)*R0*1.0,C1(),3);
  txt(c,"champ",cx+Math.cos(aC)*R0*1.36,cy+Math.sin(aC)*R0*1.36,10.5,C1(),"center",true);
  /* l'angle de retard grandit : c'est le glissement */
  if(g>0.001){
   c.strokeStyle=C3();c.lineWidth=2;c.globalAlpha=.8;
   c.beginPath();c.arc(cx,cy,R0*0.78,aR,aC,false);c.stroke();c.globalAlpha=1;}
  /* lectures */
  const px=cx+R0*1.5;
  const li=[["Vitesse du champ n_s",F(ns,0)+" tr/min",C1()],
    ["Vitesse du rotor n",F(n,0)+" tr/min",C2()],
    ["Glissement g",F(g*100,1)+" %",g>0.001&&g<0.09?C2():C3()],
    ["Écart",F(ns-n,0)+" tr/min",CM()]];
  li.forEach((l,i)=>{txt(c,l[0],px,h*0.22+i*(h*0.17),11,CM());
   mono(c,l[1],px,h*0.22+i*(h*0.17)+15,14,l[2]);});
  if(g<0.001)pastilleTexte(c,"g = 0 : aucun couple possible",px+70,h*0.94,C3());
 }},

/* ---- Le triangle des puissances, et la compensation qui le referme ---- */
"triangle-puissances":{t:"Compenser, c'est refermer le triangle",ratio:2.2,
 note:"La batterie de condensateurs remonte le vecteur : même P, moins de S, donc moins de courant dans le câble.",
 regl:[{id:"p",lib:"Puissance active",min:20,max:300,pas:10,val:100,u:"kW"},
       {id:"c1",lib:"cos φ actuel",min:0.5,max:0.95,pas:0.01,val:0.7,u:""},
       {id:"c2",lib:"cos φ visé",min:0.8,max:1,pas:0.01,val:0.95,u:""}],
 dessin(c,w,h,t,p){
  const t1=Math.tan(Math.acos(p.c1)),t2=Math.tan(Math.acos(p.c2));
  const S1=p.p/p.c1,S2=p.p/p.c2,Q1=p.p*t1,Q2=p.p*t2,Qc=Q1-Q2;
  const ox=w*0.09,oy=h*0.86,dispo=Math.min((w*0.52)/p.p,(h*0.70)/Math.max(Q1,1));
  const ech=dispo;
  c.strokeStyle=CB();c.lineWidth=1;
  c.beginPath();c.moveTo(ox,oy);c.lineTo(ox+w*0.56,oy);c.moveTo(ox,oy);c.lineTo(ox,h*0.10);c.stroke();
  fleche(c,ox,oy,ox+p.p*ech,oy,CI(),3);
  txt(c,"P = "+p.p+" kW",ox+p.p*ech/2,oy+15,11,CI(),"center",true);
  /* réactif avant / après, avec la part compensée qui pulse doucement */
  c.strokeStyle=C3();c.lineWidth=2.5;
  c.beginPath();c.moveTo(ox+p.p*ech,oy);c.lineTo(ox+p.p*ech,oy-Q1*ech);c.stroke();
  const pulse=0.55+0.45*Math.abs(Math.sin(t*1.6));
  c.strokeStyle=C2();c.lineWidth=6;c.globalAlpha=pulse;
  c.beginPath();c.moveTo(ox+p.p*ech,oy-Q2*ech);c.lineTo(ox+p.p*ech,oy-Q1*ech);c.stroke();c.globalAlpha=1;
  txt(c,"Qc = "+F(Qc,0)+" kvar",ox+p.p*ech-8,oy-(Q1+Q2)/2*ech,11,C2(),"right",true);
  txt(c,"Q = "+F(Q2,0),ox+p.p*ech+8,oy-Q2*ech/2,10.5,C3());
  c.setLineDash([5,4]);c.strokeStyle=CM();c.lineWidth=1.6;
  c.beginPath();c.moveTo(ox,oy);c.lineTo(ox+p.p*ech,oy-Q1*ech);c.stroke();c.setLineDash([]);
  txt(c,"S avant "+F(S1,0)+" kVA",ox+p.p*ech*0.42,oy-Q1*ech*0.46-10,10.5,CM(),"center");
  fleche(c,ox,oy,ox+p.p*ech,oy-Q2*ech,C1(),3);
  txt(c,"S après "+F(S2,0)+" kVA",ox+p.p*ech*0.56,oy-Q2*ech*0.56+14,11,C1(),"center",true);
  /* courants comparés */
  const px=w*0.72,I1=S1*1000/(SQ3*400),I2=S2*1000/(SQ3*400);
  txt(c,"Courant de ligne en 400 V",px,h*0.20,11,CM());
  const bw=w*0.22,mxI=Math.max(I1,I2);
  [["avant",I1,C3()],["après",I2,C2()]].forEach((l,i)=>{
   const y=h*0.34+i*h*0.24;
   c.fillStyle=CB();c.beginPath();c.roundRect(px,y,bw,14,7);c.fill();
   c.fillStyle=l[2];c.beginPath();c.roundRect(px,y,bw*(l[1]/mxI),14,7);c.fill();
   mono(c,F(l[1],0)+" A",px,y-9,12,l[2]);
   txt(c,l[0],px+bw,y-9,10.5,CM(),"right");});
  pastilleTexte(c,"pertes en ligne ÷ "+F((I1/I2)*(I1/I2),2),px+bw/2,h*0.86,C2());
 }}
});

Object.assign(ANIM,{

/* ---- Le courant de défaut cherche son chemin : TT, TN, IT ---- */
"defaut-terre":{t:"Où passe le courant de défaut",ratio:2.0,
 note:"Change de régime de neutre : le chemin du courant change, et donc l'appareil qui doit couper.",
 regl:[{id:"r",lib:"Régime de neutre",choix:["TT","TN-S","IT (1ᵉʳ défaut)"],val:0},
       {id:"d",lib:"Défaut d'isolement",choix:["Non","Oui"],val:1}],
 dessin(c,w,h,t,p){
  const tt=p.r===0,tn=p.r===1,it=p.r===2;
  const yT=h*0.20,yM=h*0.52,yS=h*0.88;
  const xT=w*0.13,xR=w*0.55,xM=w*0.72;
  /* transformateur source */
  c.strokeStyle=CM();c.lineWidth=2.4;
  c.beginPath();c.arc(xT-12,yT,13,0,TAU);c.moveTo(xT+13,yT);c.arc(xT+2,yT,13,0,TAU);c.stroke();
  txt(c,"source",xT,yT-26,10.5,CM(),"center");
  /* départ des conducteurs */
  c.strokeStyle=C1();c.lineWidth=2.2;
  c.beginPath();c.moveTo(xT+16,yT);c.lineTo(xM,yT);c.lineTo(xM,yM-24);c.stroke();
  txt(c,"phase",xR,yT-11,10.5,C1(),"center");
  /* masse du récepteur */
  c.strokeStyle=CM();c.lineWidth=2;
  c.beginPath();c.rect(xM-32,yM-24,64,44);c.stroke();
  txt(c,"récepteur",xM,yM-2,10.5,CM(),"center");
  /* conducteur de protection */
  const colPE=T("--success");
  c.strokeStyle=colPE;c.lineWidth=2.2;
  c.beginPath();c.moveTo(xM,yM+20);c.lineTo(xM,yS-16);c.stroke();
  /* prises de terre */
  const terre=(x,y,lab,col)=>{c.strokeStyle=col;c.lineWidth=2.2;
   c.beginPath();c.moveTo(x,y-14);c.lineTo(x,y);c.stroke();
   [14,9,4].forEach((l,i)=>{c.beginPath();c.moveTo(x-l,y+i*5);c.lineTo(x+l,y+i*5);c.stroke();});
   txt(c,lab,x,y+26,10,col,"center");};
  terre(xM,yS-16,"terre des masses",colPE);
  if(tt||it)terre(xT,yS-16,"terre du neutre",CM());
  if(tt||it){c.strokeStyle=CM();c.lineWidth=2;c.beginPath();c.moveTo(xT,yT+14);c.lineTo(xT,yS-30);c.stroke();}
  if(tn){c.strokeStyle=colPE;c.lineWidth=2.2;
   c.beginPath();c.moveTo(xT+16,yT+18);c.lineTo(xT+16,yS-40);c.lineTo(xM,yS-40);c.stroke();
   txt(c,"PE ramené à la source",(xT+xM)/2,yS-50,10.5,colPE,"center");}
  /* dispositif de coupure */
  const dx=xM,dy=yT+h*0.10;
  c.strokeStyle=tt?C3():CM();c.lineWidth=2;
  c.beginPath();c.rect(dx-20,dy-11,40,22);c.stroke();
  txt(c,tt?"DDR":tn?"disj.":"CPI",dx,dy,10.5,tt?C3():CM(),"center",true);
  /* le défaut et le courant qui circule */
  if(p.d===1){
   c.strokeStyle=C3();c.lineWidth=2.4;c.setLineDash([4,3]);
   c.beginPath();c.moveTo(xM,yM-24);c.lineTo(xM-32,yM+8);c.stroke();c.setLineDash([]);
   pastilleTexte(c,"défaut d'isolement",xM-108,yM-46,C3());
   const boucle=[];
   boucle.push([xT+16,yT],[xM,yT],[xM,yM-24],[xM,yM+20]);
   if(tn){boucle.push([xM,yS-40],[xT+16,yS-40],[xT+16,yT]);}
   else{boucle.push([xM,yS-16],[xM,yS-2],[xT,yS-2],[xT,yT]);}
   const seg=[];let tot=0;
   for(let i=0;i<boucle.length-1;i++){const d=Math.hypot(boucle[i+1][0]-boucle[i][0],boucle[i+1][1]-boucle[i][1]);seg.push(d);tot+=d;}
   const vitesse=tn?1.6:it?0.12:0.45, nb=tn?9:it?3:6;
   for(let k=0;k<nb;k++){
    let d=(((t*vitesse+k/nb)%1))*tot,i=0;
    while(i<seg.length&&d>seg[i]){d-=seg[i];i++;}
    if(i>=seg.length)i=seg.length-1;
    const a=boucle[i],b=boucle[i+1],f=seg[i]?d/seg[i]:0;
    c.fillStyle=it?CM():C3();c.globalAlpha=it?.5:1;
    c.beginPath();c.arc(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,3.6,0,TAU);c.fill();c.globalAlpha=1;}
  }
  /* verdict */
  const vx=w*0.06,vy=h*0.62;
  const msg=p.d===0?["Pas de défaut","Rien ne circule vers la terre.",CM()]
    :tt?["Courant faible, quelques ampères","Deux prises de terre en série limitent le courant : seul le DDR le détecte. Coupure obligatoire au premier défaut.",C3()]
    :tn?["Court-circuit franc","La boucle est entièrement métallique : plusieurs centaines d'ampères. La protection magnétique coupe en quelques millisecondes.",C3()]
    :["Courant quasi nul","Le neutre est isolé : rien ne boucle. Le contrôleur permanent d'isolement signale, le service continue. C'est le SECOND défaut qui oblige à couper.",colPE];
  txt(c,msg[0],vx,vy,12.5,msg[2],"left",true);
  const mots=msg[1].split(" ");let ln="",yy=vy+18;
  mots.forEach(m=>{const test=ln+m+" ";
   c.font='11.5px Rubik, sans-serif';
   if(c.measureText(test).width>w*0.40){txt(c,ln,vx,yy,11.5,CM());ln=m+" ";yy+=15;}else ln=test;});
  txt(c,ln,vx,yy,11.5,CM());
 }},

/* ---- Le tore différentiel : la somme doit être nulle ---- */
"differentiel":{t:"Comment un différentiel voit la fuite",ratio:2.1,
 note:"Le tore mesure la SOMME des courants. Tant qu'ils reviennent tous, elle est nulle. Une fuite de 30 mA suffit à la rompre.",
 regl:[{id:"i",lib:"Courant du récepteur",min:2,max:20,pas:1,val:10,u:"A"},
       {id:"f",lib:"Courant de fuite",min:0,max:120,pas:5,val:0,u:"mA"}],
 dessin(c,w,h,t,p){
  const fuite=p.f/1000, decl=p.f>=30;
  const cx=w*0.30,cy=h*0.5,rr=Math.min(h*0.30,w*0.13);
  /* tore */
  c.strokeStyle=decl?C3():CM();c.lineWidth=Math.max(7,rr*0.30);
  c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke();
  c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke();
  txt(c,"tore",cx,cy-rr-16,10.5,CM(),"center");
  /* les deux conducteurs traversent le tore */
  const yA=cy-rr*0.38,yR=cy+rr*0.38;
  c.strokeStyle=C1();c.lineWidth=2.6;
  c.beginPath();c.moveTo(w*0.06,yA);c.lineTo(w*0.72,yA);c.stroke();
  c.strokeStyle=C2();c.lineWidth=2.6;
  c.beginPath();c.moveTo(w*0.06,yR);c.lineTo(w*0.72,yR);c.stroke();
  txt(c,"phase — aller",w*0.06,yA-13,10.5,C1());
  txt(c,"neutre — retour",w*0.06,yR+15,10.5,C2());
  /* récepteur */
  c.strokeStyle=CM();c.lineWidth=2;
  c.beginPath();c.rect(w*0.72,yA-6,w*0.14,(yR-yA)+12);c.stroke();
  txt(c,"récepteur",w*0.79,cy,10.5,CM(),"center");
  /* porteurs : aller à I, retour à I − fuite */
  const va=(t*p.i*0.05)%1;
  for(let k=0;k<9;k++){
   const f=((k/9)+va)%1;
   c.fillStyle=C1();c.beginPath();c.arc(w*0.06+f*(w*0.66),yA,3.4,0,TAU);c.fill();}
  const nr=Math.max(1,Math.round(9*(1-fuite/p.i*8)));
  for(let k=0;k<9;k++){
   if(k>=nr)continue;
   const f=((k/9)+1-va)%1;
   c.fillStyle=C2();c.beginPath();c.arc(w*0.06+(1-f)*(w*0.66),yR,3.4,0,TAU);c.fill();}
  /* la fuite s'échappe vers la terre */
  if(p.f>0){
   c.strokeStyle=C3();c.lineWidth=2;c.setLineDash([4,3]);
   c.beginPath();c.moveTo(w*0.79,yR+8);c.lineTo(w*0.79,h*0.90);c.stroke();c.setLineDash([]);
   [12,8,4].forEach((l,i)=>{c.beginPath();c.moveTo(w*0.79-l,h*0.90+i*4);c.lineTo(w*0.79+l,h*0.90+i*4);c.stroke();});
   const vf=(t*0.9)%1;
   c.fillStyle=C3();c.beginPath();c.arc(w*0.79,yR+8+vf*(h*0.90-yR-8),3.6,0,TAU);c.fill();
   txt(c,"fuite : "+p.f+" mA",w*0.82,h*0.80,11,C3(),"left",true);
  }
  /* lecture du tore */
  const bx=w*0.06,by=h*0.08;
  mono(c,"somme mesurée = "+F(p.f,0)+" mA",bx,by,13,decl?C3():C2());
  txt(c,decl?"≥ 30 mA : le différentiel DÉCLENCHE":"< 30 mA : le différentiel reste fermé",bx,by+18,11,decl?C3():CM());
  if(decl){c.globalAlpha=.35+.35*Math.abs(Math.sin(t*6));
   c.fillStyle=C3();c.beginPath();c.arc(cx,cy,rr*1.5,0,TAU);c.fill();c.globalAlpha=1;}
 }},

/* ---- Harmoniques : une onde propre devient une onde sale ---- */
"harmoniques":{t:"Ce que les harmoniques font à l'onde",ratio:2.2,
 note:"Ajoute du rang 5 et du rang 3 : l'onde se déforme. Le rang 3 est celui qui s'additionne dans le neutre.",
 regl:[{id:"h3",lib:"Harmonique de rang 3",min:0,max:50,pas:5,val:0,u:"%"},
       {id:"h5",lib:"Harmonique de rang 5",min:0,max:50,pas:5,val:0,u:"%"},
       {id:"h7",lib:"Harmonique de rang 7",min:0,max:40,pas:5,val:0,u:"%"}],
 dessin(c,w,h,t,p){
  const a3=p.h3/100,a5=p.h5/100,a7=p.h7/100;
  const x0=40,lw=w*0.62,cy=h/2,A=h*0.30,ang=t*0.9;
  axes(c,x0,cy,lw,h*0.9,"t","i");
  grille(c,x0,cy,lw,h*0.9,4);
  const f=dt=>{const a=ang-dt*TAU;
   return Math.sin(a)+a3*Math.sin(3*a)+a5*Math.sin(5*a)+a7*Math.sin(7*a);};
  /* composantes en filigrane */
  [[1,1,CM()],[3,a3,C2()],[5,a5,C3()],[7,a7,T("--primary-hover")]].forEach(([r,am,col])=>{
   if(am<0.01&&r>1)return;
   c.strokeStyle=col;c.globalAlpha=r===1?.45:.55;c.lineWidth=1.4;c.beginPath();
   for(let i=0;i<=240;i++){const dt=i/240*2,a=ang-dt*TAU;
    const X=x0+dt*(lw/2),Y=cy-A*am*Math.sin(r*a);i?c.lineTo(X,Y):c.moveTo(X,Y);}
   c.stroke();c.globalAlpha=1;});
  /* la résultante */
  c.strokeStyle=C1();c.lineWidth=3;c.beginPath();
  for(let i=0;i<=300;i++){const dt=i/300*2;
   const X=x0+dt*(lw/2),Y=cy-A*f(dt);i?c.lineTo(X,Y):c.moveTo(X,Y);}
  c.stroke();
  txt(c,"courant réellement appelé",x0+6,cy-A-12,11,C1(),"left",true);
  /* spectre et THD */
  const sx=x0+lw+w*0.05,sw=w-sx-16,bh=h*0.5,by=h*0.76;
  const raies=[[1,1],[3,a3],[5,a5],[7,a7]];
  const thd=Math.sqrt(a3*a3+a5*a5+a7*a7)*100;
  raies.forEach(([r,am],i)=>{
   const bx=sx+i*(sw/4.4)+6,bw=sw/7;
   c.fillStyle=i?[0,C2(),C3(),T("--primary-hover")][i]:CM();
   c.beginPath();c.roundRect(bx,by-bh*am,bw,Math.max(2,bh*am),[4,4,0,0]);c.fill();
   txt(c,"H"+r,bx+bw/2,by+12,10,CM(),"center");
   if(am>0.02)mono(c,Math.round(am*100)+"%",bx+bw/2,by-bh*am-9,10,CM(),"center");});
  c.strokeStyle=CB();c.beginPath();c.moveTo(sx,by);c.lineTo(sx+sw,by);c.stroke();
  pastilleTexte(c,"THD ≈ "+F(thd,0)+" %",sx+sw/2,h*0.13,thd<10?C2():thd<40?C1():C3());
  if(a3>0.05)txt(c,"le rang 3 s'additionne dans le neutre",sx+sw/2,h*0.26,10.5,C3(),"center",true);
 }},

/* ---- Le cercle trigonométrique, pour le bloc maths ---- */
"cercle-trigo":{t:"Le cercle trigonométrique",ratio:2.2,
 note:"Le cosinus est la projection horizontale, le sinus la projection verticale. Rien d'autre.",
 regl:[{id:"a",lib:"Angle",min:0,max:360,pas:5,val:35,u:"°"},
       {id:"auto",lib:"Défilement",choix:["Manuel","Automatique"],val:0}],
 dessin(c,w,h,t,p){
  const ang=(p.auto===1?(t*40)%360:p.a)*Math.PI/180;
  const rr=Math.min(h*0.40,w*0.19),cx=rr+46,cy=h/2;
  c.strokeStyle=CB();c.lineWidth=1.4;c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke();
  c.beginPath();c.moveTo(cx-rr-16,cy);c.lineTo(cx+rr+16,cy);c.moveTo(cx,cy-rr-16);c.lineTo(cx,cy+rr+16);c.stroke();
  const px=cx+rr*Math.cos(ang),py=cy-rr*Math.sin(ang);
  c.strokeStyle=C1();c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(px,py);c.stroke();
  c.fillStyle=C1();c.beginPath();c.arc(px,py,4.5,0,TAU);c.fill();
  c.strokeStyle=C2();c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(px,cy);c.stroke();
  c.strokeStyle=C3();c.lineWidth=3;c.beginPath();c.moveTo(px,cy);c.lineTo(px,py);c.stroke();
  c.strokeStyle=CB();c.setLineDash([3,3]);c.lineWidth=1;
  c.beginPath();c.moveTo(px,py);c.lineTo(cx,py);c.stroke();c.setLineDash([]);
  c.strokeStyle=C1();c.lineWidth=1.6;c.beginPath();c.arc(cx,cy,26,-ang,0,ang>0);c.stroke();
  txt(c,"cos",(cx+px)/2,cy+14,11,C2(),"center",true);
  txt(c,"sin",px+(px>cx?12:-12),(cy+py)/2,11,C3(),px>cx?"left":"right",true);
  const bx=cx+rr+56;
  [["angle",F(ang*180/Math.PI,0)+"°",C1()],["cos",F(Math.cos(ang),3),C2()],
   ["sin",F(Math.sin(ang),3),C3()],["tan",Math.abs(Math.cos(ang))<0.02?"∞":F(Math.tan(ang),3),CM()],
   ["en radians",F(ang,3)+" rad",CM()]].forEach((l,i)=>{
   txt(c,l[0],bx,h*0.16+i*(h*0.17),11,CM());
   mono(c,l[1],bx+96,h*0.16+i*(h*0.17),13.5,l[2],"right");});
 }},

/* ---- Les trois démarrages, comparés ---- */
"demarrage":{t:"Trois façons de démarrer un moteur",ratio:2.1,
 note:"Le direct arrache le réseau, l'étoile-triangle divise par trois courant ET couple, le variateur fait tout à 1,5 In.",
 regl:[{id:"m",lib:"Procédé",choix:["Direct","Étoile-triangle","Variateur"],val:0}],
 dessin(c,w,h,t,p){
  const cyc=4,ph=(t%cyc)/cyc;
  const x0=46,lw=w-x0-16,gy1=h*0.34,gy2=h*0.82,A=h*0.24;
  const cI=(f)=>{ /* courant, en multiples de In */
   if(p.m===0)return f<0.02?0:f<0.35?6.5*Math.exp(-(f-0.02)*1.2):1;
   if(p.m===1){if(f<0.02)return 0;if(f<0.30)return 2.3*Math.exp(-(f-0.02)*1.0);
    if(f<0.34)return 5.2;return 1;}
   return f<0.02?0:Math.min(1.5,f*4)*(f<0.4?1:0)+ (f>=0.4?1:0);};
  const cN=(f)=>{ /* vitesse, en fraction de la nominale */
   if(p.m===0)return Math.min(1,f<0.02?0:1-Math.exp(-(f-0.02)*8));
   if(p.m===1)return Math.min(1,f<0.02?0:(f<0.32?0.62*(1-Math.exp(-(f-0.02)*5)):0.62+0.38*(1-Math.exp(-(f-0.32)*11))));
   return Math.min(1,f<0.02?0:(f-0.02)/0.38);};
  [["Courant appelé (× In)",gy1,cI,7,C3()],["Vitesse (× nominale)",gy2,cN,1.15,C2()]].forEach(([lab,yy,fn,mx,col])=>{
   c.strokeStyle=CB();c.lineWidth=1;
   c.beginPath();c.moveTo(x0,yy);c.lineTo(x0+lw,yy);c.moveTo(x0,yy-A);c.lineTo(x0,yy+6);c.stroke();
   txt(c,lab,x0,yy-A-11,11,CM(),"left",true);
   c.strokeStyle=col;c.lineWidth=2.8;c.beginPath();
   for(let i=0;i<=260;i++){const f=i/260;const X=x0+lw*f,Y=yy-A*Math.min(fn(f)/mx,1);i?c.lineTo(X,Y):c.moveTo(X,Y);}
   c.stroke();
   c.fillStyle=col;c.beginPath();c.arc(x0+lw*ph,yy-A*Math.min(fn(ph)/mx,1),4.5,0,TAU);c.fill();
   if(mx>2){c.strokeStyle=CB();c.setLineDash([3,3]);
    c.beginPath();c.moveTo(x0,yy-A/mx);c.lineTo(x0+lw,yy-A/mx);c.stroke();c.setLineDash([]);
    txt(c,"In",x0-6,yy-A/mx,10,CM(),"right");}});
  if(p.m===1){c.strokeStyle=CM();c.setLineDash([4,3]);
   c.beginPath();c.moveTo(x0+lw*0.32,gy1-A-6);c.lineTo(x0+lw*0.32,gy2+8);c.stroke();c.setLineDash([]);
   txt(c,"bascule Y → Δ",x0+lw*0.32+5,gy1-A-14,10.5,CM());}
  const info=[["Direct","6 à 8 In · couple 1,5 à 2,5 Tn · le plus simple"],
    ["Étoile-triangle","2 à 2,6 In · couple divisé par 3 · démarrage à vide obligatoire"],
    ["Variateur","≈ 1,5 In · couple plein dès l'arrêt · vitesse réglable"]][p.m];
  pastilleTexte(c,info[0],x0+70,h*0.10,C1());
  txt(c,info[1],x0+150,h*0.10,11,CM());
 }},

/* ---- La chute de tension le long d'une ligne ---- */
"chute-ligne":{t:"La tension s'affaisse le long du câble",ratio:2.3,
 note:"Le récepteur ne reçoit pas la tension du tableau. Allonge la ligne ou réduis la section : regarde le récepteur faiblir.",
 regl:[{id:"l",lib:"Longueur",min:10,max:300,pas:10,val:80,u:"m"},
       {id:"s",lib:"Section",min:0,max:8,pas:1,val:2,u:""},
       {id:"i",lib:"Courant",min:5,max:120,pas:5,val:40,u:"A"}],
 dessin(c,w,h,t,p){
  const SEC=[1.5,2.5,4,6,10,16,25,35,50],S=SEC[p.s];
  const dU=SQ3*0.023*p.l*p.i*0.85/S, pc=dU/400*100, ok=pc<=5;
  const x0=w*0.10,x1=w*0.86,y=h*0.44;
  const ep=Math.max(3,Math.min(16,S*0.5));
  const g=c.createLinearGradient(x0,0,x1,0);
  g.addColorStop(0,C2());g.addColorStop(1,ok?C1():C3());
  c.strokeStyle=g;c.lineWidth=ep;c.lineCap="round";
  c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();
  const n=8,v=(t*0.5)%1;
  for(let k=0;k<n;k++){const f=((k/n)+v)%1;
   c.fillStyle=CS();c.globalAlpha=.75;
   c.beginPath();c.arc(x0+(x1-x0)*f,y,ep*0.28,0,TAU);c.fill();c.globalAlpha=1;}
  c.strokeStyle=CM();c.lineWidth=2;
  c.beginPath();c.rect(x0-34,y-30,32,60);c.stroke();
  txt(c,"tableau",x0-18,y+42,10.5,CM(),"center");
  c.beginPath();c.rect(x1+2,y-26,36,52);c.stroke();
  txt(c,"récepteur",x1+20,y+40,10.5,CM(),"center");
  mono(c,"400 V",x0-18,y-42,12,C2(),"center");
  mono(c,F(400-dU,1)+" V",x1+20,y-38,13,ok?C1():C3(),"center");
  /* profil de tension */
  const py=h*0.86,ph=h*0.26;
  c.strokeStyle=CB();c.lineWidth=1;c.beginPath();c.moveTo(x0,py);c.lineTo(x1,py);c.stroke();
  c.strokeStyle=ok?C1():C3();c.lineWidth=2.4;
  c.beginPath();c.moveTo(x0,py-ph);c.lineTo(x1,py-ph+ph*(dU/400)*8);c.stroke();
  c.setLineDash([3,3]);c.strokeStyle=CB();
  c.beginPath();c.moveTo(x0,py-ph);c.lineTo(x1,py-ph);c.stroke();c.setLineDash([]);
  txt(c,"profil de tension",x0,py-ph-12,10.5,CM());
  const li="ΔU = "+F(dU,2)+" V   soit "+F(pc,2)+" %";
  pastilleTexte(c,li,w*0.5,h*0.10,ok?C2():C3());
  txt(c,S+" mm² · "+p.l+" m · "+p.i+" A · cos φ 0,85",w*0.5,h*0.20,11,CM(),"center");
  if(!ok)txt(c,"au-delà de 5 % : il faut augmenter la section",w*0.5,py+16,11,C3(),"center",true);
 }},

/* ---- Le GRAFCET : le jeton descend ---- */
"grafcet":{t:"Un GRAFCET qui tourne",ratio:1.75,
 note:"L'étape active porte le jeton. Il ne descend que si la réceptivité est vraie — clique sur une condition pour la valider.",
 regl:[{id:"v",lib:"Vitesse",min:0.3,max:2,pas:0.1,val:0.8,u:"×"}],
 dessin(c,w,h,t,p){
  const et=[["0","Attente","départ · dcy"],["1","Descendre","vérin bas · b"],
            ["2","Serrer","pince fermée · c"],["3","Remonter","vérin haut · a"]];
  const n=et.length, act=Math.floor((t*p.v*0.55)%n);
  const cx=w*0.28,top=h*0.10,dy=(h*0.80)/n;
  et.forEach((e,i)=>{
   const y=top+i*dy, on=i===act, sz=Math.min(34,dy*0.42);
   c.strokeStyle=on?C1():CB();c.lineWidth=on?2.6:1.6;
   c.fillStyle=on?"transparent":"transparent";
   c.beginPath();c.rect(cx-sz/2,y-sz/2,sz,sz);c.stroke();
   if(i===0){c.beginPath();c.rect(cx-sz/2-4,y-sz/2-4,sz+8,sz+8);c.stroke();}
   mono(c,e[0],cx,y,13,on?C1():CM(),"center");
   if(on){c.fillStyle=C1();c.beginPath();c.arc(cx,y,5,0,TAU);c.fill();}
   /* action associée */
   c.strokeStyle=on?C1():CB();c.lineWidth=1.6;
   c.beginPath();c.moveTo(cx+sz/2,y);c.lineTo(cx+sz/2+22,y);c.stroke();
   c.beginPath();c.rect(cx+sz/2+22,y-13,Math.min(w*0.30,150),26);c.stroke();
   txt(c,e[1],cx+sz/2+32,y,12,on?CI():CM(),"left",on);
   /* transition vers la suivante */
   const ny=top+((i+1)%n)*dy;
   if(i<n-1){
    c.strokeStyle=CB();c.lineWidth=1.8;
    c.beginPath();c.moveTo(cx,y+sz/2);c.lineTo(cx,ny-sz/2);c.stroke();
    const my=(y+sz/2+ny-sz/2)/2;
    const pret=on;
    c.strokeStyle=pret?C2():CM();c.lineWidth=pret?2.6:1.8;
    c.beginPath();c.moveTo(cx-11,my);c.lineTo(cx+11,my);c.stroke();
    txt(c,e[2].split(" · ")[1],cx+16,my,11,pret?C2():CM(),"left",pret);
    txt(c,e[2].split(" · ")[0],cx-16,my,10.5,CM(),"right");
   }else{
    c.strokeStyle=CB();c.lineWidth=1.8;
    c.beginPath();c.moveTo(cx,y+sz/2);c.lineTo(cx,y+sz/2+16);c.lineTo(cx-w*0.16,y+sz/2+16);
    c.lineTo(cx-w*0.16,top);c.lineTo(cx-sz/2,top);c.stroke();
    const my=y+sz/2+8;
    c.strokeStyle=C2();c.lineWidth=2.2;c.beginPath();c.moveTo(cx-11,my);c.lineTo(cx+11,my);c.stroke();
    txt(c,"reprise du cycle",cx-w*0.16-6,(top+y)/2,10.5,CM(),"right");
   }
  });
  const bx=w*0.66;
  txt(c,"Règle 2",bx,h*0.24,11.5,C1(),"left",true);
  txt(c,"Une transition est franchie si",bx,h*0.24+18,11,CM());
  txt(c,"l'étape amont est active ET",bx,h*0.24+33,11,CM());
  txt(c,"la réceptivité est vraie.",bx,h*0.24+48,11,CM());
  txt(c,"Règle 3",bx,h*0.60,11.5,C1(),"left",true);
  txt(c,"Le franchissement désactive",bx,h*0.60+18,11,CM());
  txt(c,"l'amont et active l'aval, en",bx,h*0.60+33,11,CM());
  txt(c,"même temps.",bx,h*0.60+48,11,CM());
 }}
});

 {k:"a",t:"Atelier — lire une sinusoïde",gen:["eff-max","periode","radian","trigo-cote"],but:4,h:`<p>Ces conversions sont demandées dans presque tous les sujets d'examen, souvent en première question.</p>`},
 {k:"c",t:"Contrôle",gen:["eff-max","periode","radian","trigo-cote","pourcent"],n:8}
]},

{id:"m12",num:"12",bloc:"Régime alternatif",an:1,titre:"Impédances et déphasage",duree:"30 min",
 resume:"Résistance, bobine, condensateur en alternatif : trois comportements, un seul outil pour les combiner.",
 steps:[
 {k:"l",t:"Ce que chaque composant fait au courant",h:`
  <figure data-anim="dephasage"></figure>
  <p>Change de récepteur dans la figure. Trois comportements, et ils se déduisent du module 10.</p>
  <div class="tabl"><table>
   <tr><th>Composant</th><th>Déphasage du courant</th><th>Pourquoi</th></tr>
   <tr><td>Résistance</td><td class="mono">0° — en phase</td><td>elle ne stocke rien</td></tr>
   <tr><td>Bobine</td><td class="mono">−90° — en retard</td><td>elle s'oppose à la variation de courant : il traîne</td></tr>
   <tr><td>Condensateur</td><td class="mono">+90° — en avance</td><td>le courant y est maximal quand la tension varie le plus vite</td></tr>
   <tr><td>Moteur</td><td class="mono">−25° à −40°</td><td>mélange de résistance et d'inductance</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">Moyen mnémotechnique</span><p><strong>L</strong> comme <em>late</em> : dans une bobine (L), le courant est en retard. Le condensateur fait l'inverse.</p></div>`},
 {k:"l",t:"Les réactances dépendent de la fréquence",h:`
  <div class="formule">X<sub>L</sub> = L · ω = 2 · π · f · L
X<sub>C</sub> = 1 / (C · ω) = 1 / (2 · π · f · C)<span class="note">Toutes deux en ohms, comme une résistance — mais dépendantes de la fréquence.</span></div>
  <p>Cette dépendance est le levier de toute l'électronique de puissance et de la CEM :</p>
  <ul>
   <li>La bobine <strong>freine d'autant plus que la fréquence est haute</strong> : c'est le rôle d'une self de ligne devant un variateur, d'une self de lissage, d'un filtre CEM.</li>
   <li>Le condensateur <strong>laisse passer d'autant mieux que la fréquence est haute</strong> : c'est le rôle d'un condensateur de découplage, et la raison pour laquelle les batteries de compensation attirent les harmoniques.</li>
  </ul>
  <div class="resolu"><span class="chapo">Exemple résolu — la même bobine à deux fréquences</span>
   <p>Une bobine de 100 mH, à 50 Hz puis à 350 Hz (harmonique de rang 7).</p>
   <ol>
    <li>À 50 Hz.<span class="op">X_L = 2π × 50 × 0,1 = 31,4 Ω</span></li>
    <li>À 350 Hz.<span class="op">X_L = 2π × 350 × 0,1 = 220 Ω</span></li>
   </ol>
   <div class="final">Sept fois plus d'opposition à l'harmonique 7 qu'au fondamental : la bobine trie les fréquences toute seule.</div></div>`},
 {k:"l",t:"Composer R et X : l'impédance",h:`
  <p>R et X ne s'additionnent pas : ils sont perpendiculaires dans le plan de Fresnel — R sur l'axe horizontal, X sur l'axe vertical. On les compose donc comme au module 05.</p>
  <div class="formule">Z = √(R² + X²)          tan φ = X / R          cos φ = R / Z</div>
  <div class="resolu"><span class="chapo">Exemple résolu — un enroulement de moteur</span>
   <p>R = 12 Ω, L = 95 mH, sous 230 V à 50 Hz. Impédance, courant, déphasage ?</p>
   <ol>
    <li>Réactance.<span class="op">X_L = 2π × 50 × 0,095 = 29,8 Ω</span></li>
    <li>Impédance, par Pythagore.<span class="op">Z = √(12² + 29,8²) = √(144 + 888) = √1032 = 32,1 Ω</span></li>
    <li>Courant, par la loi d'Ohm généralisée.<span class="op">I = U / Z = 230 / 32,1 = 7,17 A</span></li>
    <li>Déphasage.<span class="op">φ = arctan(29,8 / 12) = 68,1°  ⟹  cos φ = 0,373</span></li>
   </ol>
   <div class="final">Z = 32,1 Ω, I = 7,17 A, cos φ = 0,37 — un cos φ très mauvais, typique d'un enroulement seul, sans charge mécanique.</div></div>
  <h3>Et quand X_L annule X_C : la résonance</h3>
  <figure data-anim="resonance"></figure>
  <p>À la fréquence où les deux réactances sont égales, elles s'annulent : le circuit devient purement résistif, le courant passe par un maximum, et la tension aux bornes de L et de C peut atteindre plusieurs fois la tension d'alimentation. C'est ce qui détruit les batteries de condensateurs mal accordées.</p>
  <div class="encart e-piege"><span class="chapo">L'addition interdite</span><p>Écrire <span class="mono">Z = R + X = 12 + 29,8 = 41,8 Ω</span> donne un courant de 5,5 A au lieu de 7,17 A : 23 % d'erreur, et une protection mal dimensionnée. La racine de la somme des carrés n'est pas une coquetterie de professeur.</p></div>`},
 {k:"z",t:"Mesurer un circuit R-L",defi:"rl",h:`
  <p>En alternatif cette fois. Le simulateur affiche aussi le déphasage φ : tu vas le voir apparaître dès que la bobine entre en jeu.</p>`},
 {k:"s",t:"Banc d'essai — Fresnel",sim:"impedance",h:`<p>Le triangle se redessine à chaque mouvement. Fais monter la fréquence : regarde le vecteur X grandir et l'angle φ se rapprocher de 90°.</p>`},
 {k:"a",t:"Atelier — impédances",gen:["reactance","impedance-rl","complexe-module","vecteur-somme"],but:4,h:`<p>Quatre d'affilée. Vérifie systématiquement que Z est plus grand que R et que X, mais plus petit que leur somme.</p>`},
 {k:"c",t:"Contrôle",gen:["reactance","impedance-rl","complexe-module","eff-max","periode"],n:9}
]},

{id:"m13",num:"13",bloc:"Régime alternatif",an:1,titre:"Puissances et facteur de puissance",duree:"30 min",
 resume:"P, Q, S : ce qui travaille, ce qui circule pour rien, et ce qu'il faut dimensionner.",
 steps:[
 {k:"l",t:"Trois puissances, un seul triangle",h:`
  <div class="tabl"><table>
   <tr><th></th><th>Nom</th><th>Unité</th><th>Ce que c'est</th></tr>
   <tr><td class="mono">P</td><td>Active</td><td class="mono">W</td><td>ce qui devient travail ou chaleur — ce qu'on paie au compteur</td></tr>
   <tr><td class="mono">Q</td><td>Réactive</td><td class="mono">var</td><td>ce qui fait l'aller-retour pour magnétiser — ni consommé, ni utile</td></tr>
   <tr><td class="mono">S</td><td>Apparente</td><td class="mono">VA</td><td>ce que doivent supporter câbles, transfo et protections</td></tr>
  </table></div>
  <div class="formule">S = U · I          P = S · cos φ          Q = S · sin φ
S² = P² + Q²          cos φ = P / S          tan φ = Q / P<span class="note">C'est le triangle rectangle du module 04, avec des unités électriques.</span></div>
  <figure data-anim="triangle-puissances"></figure>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Un atelier absorbe 80 kW avec un cos φ de 0,80. Quelles sont S et Q ?</p>
   <ol>
    <li>La puissance apparente vient du cos φ.<span class="op">S = P / cos φ = 80 / 0,80 = 100 kVA</span></li>
    <li>Le réactif par Pythagore.<span class="op">Q = √(100² − 80²) = √(10 000 − 6400) = √3600 = 60 kvar</span></li>
    <li>Vérification par la tangente.<span class="op">tan φ = 60 / 80 = 0,75 ✓ (φ = 36,9°)</span></li>
   </ol>
   <div class="final">S = 100 kVA et Q = 60 kvar. Le transformateur doit être dimensionné sur 100 kVA, pas sur 80 kW.</div></div>`},
 {k:"l",t:"Ce que coûte un mauvais cos φ",h:`
  <p>La puissance réactive ne fait pas tourner le compteur d'énergie active. Mais elle circule, et tout ce qu'elle traverse doit être dimensionné pour elle.</p>
  <div class="resolu"><span class="chapo">Exemple résolu — deux ateliers, le même travail</span>
   <p>Deux ateliers absorbent chacun 100 kW sous 400 V triphasé. L'un a un cos φ de 0,95, l'autre de 0,70.</p>
   <ol>
    <li>Atelier A.<span class="op">S = 100 / 0,95 = 105 kVA  ⟹  I = 105 000 / (√3 × 400) = 152 A</span></li>
    <li>Atelier B.<span class="op">S = 100 / 0,70 = 143 kVA  ⟹  I = 143 000 / (√3 × 400) = 206 A</span></li>
    <li>Les pertes en ligne suivent le carré du courant.<span class="op">(206 / 152)² = 1,84</span></li>
   </ol>
   <div class="final">Même travail produit, 36 % de courant en plus et 84 % de pertes en plus. Sans compter le transformateur et les câbles à surdimensionner.</div></div>
  <p>Le gestionnaire de réseau facture donc le réactif au-delà d'un seuil contractuel — historiquement une tan φ de référence de 0,4, soit cos φ ≈ 0,93, pendant les heures pleines d'hiver. Le seuil exact dépend du tarif d'acheminement en vigueur : c'est le contrat qu'il faut lire, pas une valeur apprise par cœur.</p>
  <div class="encart e-piege"><span class="chapo">Facteur de puissance ≠ cos φ</span><p>En présence d'harmoniques, les deux diffèrent. Le <strong>facteur de puissance</strong> vaut P/S toutes fréquences confondues ; le <strong>cos φ</strong> ne concerne que le fondamental. Un variateur peut afficher cos φ = 0,98 et un facteur de puissance réel de 0,7 : compenser avec des condensateurs n'y changerait rien, et aggraverait même la situation.</p></div>`},
 {k:"l",t:"Compenser : le calcul complet",h:`
  <p>Compenser, c'est produire le réactif sur place au lieu de le faire venir du réseau. Le condensateur fournit ce que le moteur consomme.</p>
  <div class="formule">Q<sub>c</sub> = P · (tan φ₁ − tan φ₂)<span class="note">φ₁ : avant compensation — φ₂ : objectif visé</span></div>
  <p>Puis on convertit ces vars en microfarads. Et là, le couplage change tout :</p>
  <div class="formule">étoile :   C = Q<sub>c</sub> / (U² · ω)
triangle : C = Q<sub>c</sub> / (3 · U² · ω)<span class="note">U : tension composée — ω = 2πf. Le triangle demande trois fois moins de capacité.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — de bout en bout</span>
   <p>150 kW à cos φ 0,75, à remonter à 0,95, en 400 V / 50 Hz, couplage triangle.</p>
   <ol>
    <li>Les deux tangentes.<span class="op">tan(arccos 0,75) = 0,882    tan(arccos 0,95) = 0,329</span></li>
    <li>Réactif à fournir.<span class="op">Qc = 150 × (0,882 − 0,329) = 150 × 0,553 = 83 kvar</span></li>
    <li>Capacité par phase en triangle.<span class="op">C = 83 000 / (3 × 400² × 314) = 83 000 / 150 720 000</span></li>
    <li>Résultat.<span class="op">C = 5,5 × 10⁻⁴ F = 550 µF par phase</span></li>
   </ol>
   <div class="final">83 kvar, soit 550 µF par phase en triangle — contre 1650 µF si on couplait en étoile.</div></div>
  <div class="encart e-terrain"><span class="chapo">Trois règles de mise en œuvre</span>
   <p><strong>Jamais en aval d'un variateur</strong> ou d'un démarreur électronique : les condensateurs voient le découpage et se détruisent.</p>
   <p><strong>Jamais de surcompensation</strong> : l'installation bascule en capacitif, la tension monte à vide, et le distributeur facture aussi.</p>
   <p><strong>Batterie anti-harmonique</strong> (selfs de désaccordage, ~189 Hz) dès que les charges non linéaires dépassent environ 20 % de S, sinon résonance et destruction.</p></div>`},
 {k:"s",t:"Banc d'essai — compensation",sim:"puissances",h:`<p>Le banc fait le calcul complet et trace le triangle avant/après. Compare les courants de ligne : c'est là que se voit le gain réel.</p>`},
 {k:"a",t:"Atelier — puissances",gen:["triangle-pqs","puis-mono","compensation","capacite-comp"],but:4,h:`<p>Le calcul de compensation tombe à presque tous les examens. Ici tu peux le refaire autant de fois qu'il faut, avec des chiffres différents à chaque tirage.</p>`},
 {k:"c",t:"Contrôle",gen:["triangle-pqs","puis-mono","compensation","capacite-comp","trigo-angle"],n:9}
]},

{id:"m14",num:"14",bloc:"Régime alternatif",an:1,titre:"Le triphasé",duree:"34 min",
 resume:"Trois tensions à 120°, le champ tournant, les couplages, et le rôle du neutre.",
 steps:[
 {k:"l",t:"Pourquoi trois phases",h:`
  <p>Trois tensions de même valeur, décalées d'un tiers de tour. De ce simple décalage découlent trois propriétés qui ont façonné tout le réseau mondial.</p>
  <figure data-anim="champ-tournant"></figure>
  <ul>
   <li><strong>Un champ tournant apparaît sans aucune pièce mobile.</strong> Trois bobines fixes, trois courants décalés : le champ résultant tourne. C'est le moteur asynchrone, et c'est ce que montre la figure ci-dessus.</li>
   <li><strong>La puissance instantanée est constante</strong>, alors qu'en monophasé elle pulse à 100 Hz. Un moteur triphasé ne vibre pas au rythme du réseau.</li>
   <li><strong>La somme des trois courants est nulle</strong> en régime équilibré : le neutre ne transporte rien et peut être réduit.</li>
  </ul>
  <div class="formule">v₁ = V√2·sin(ωt)     v₂ = V√2·sin(ωt − 120°)     v₃ = V√2·sin(ωt + 120°)</div>`},
 {k:"l",t:"V et U : les deux tensions",h:`
  <div class="tabl"><table>
   <tr><th>Nom</th><th>Entre quoi</th><th>Symbole</th><th>En France</th></tr>
   <tr><td>Tension simple</td><td>une phase et le neutre</td><td class="mono">V</td><td class="mono">230 V</td></tr>
   <tr><td>Tension composée</td><td>deux phases</td><td class="mono">U</td><td class="mono">400 V</td></tr>
  </table></div>
  <div class="formule">U = √3 · V<span class="note">400 = 1,732 × 230. Ce n'est pas le double : c'est une différence VECTORIELLE de deux tensions à 120°.</span></div>
  <h3>Les deux couplages</h3>
  <figure data-anim="couplage"></figure>
  <div class="tabl"><table>
   <tr><th>Couplage</th><th>Tension vue par l'enroulement</th><th>Courant de ligne</th></tr>
   <tr><td>Étoile (Y)</td><td class="mono">V = U / √3</td><td class="mono">= courant d'enroulement</td></tr>
   <tr><td>Triangle (Δ)</td><td class="mono">U (pleine tension composée)</td><td class="mono">= √3 × courant d'enroulement</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">La règle qui décide du couplage d'un moteur</span>
   <p>La plaque indique par exemple <strong>230 V / 400 V</strong>. Le PREMIER nombre est la tension que doit voir <strong>un enroulement</strong>.</p>
   <p>Sur un réseau 400 V : l'enroulement doit voir 230 V, donc <strong>étoile</strong>.<br>Sur un réseau 230 V : il doit voir 230 V directement, donc <strong>triangle</strong>.</p>
   <p>Coupler en triangle sur 400 V, c'est appliquer √3 fois trop de tension. Le moteur brûle en quelques secondes.</p></div>`},
 {k:"l",t:"Les puissances en triphasé",h:`
  <div class="formule">P = √3 · U · I · cos φ
Q = √3 · U · I · sin φ
S = √3 · U · I<span class="note">U : tension COMPOSÉE — I : courant de LIGNE. Valable quel que soit le couplage.</span></div>
  <p>La forme la plus utilisée du métier est la forme inverse, celle qui sert à dimensionner :</p>
  <div class="formule">I = P / (√3 · U · cos φ · η)<span class="note">η : rendement, si P est la puissance utile sur l'arbre.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu — dimensionner un départ moteur</span>
   <p>Moteur 15 kW utiles, 400 V, cos φ 0,85, rendement 0,90.</p>
   <ol>
    <li>Puissance réellement absorbée au réseau.<span class="op">P absorbée = 15 / 0,90 = 16,67 kW</span></li>
    <li>Courant de ligne.<span class="op">I = 16 670 / (1,732 × 400 × 0,85) = 16 670 / 588,9</span></li>
    <li>Résultat.<span class="op">I = 28,3 A</span></li>
   </ol>
   <div class="final">28,3 A. Repère de tête : en 400 V, un moteur consomme environ 2 A par kW — un 15 kW, environ 30 A. Ça permet de vérifier n'importe quel calcul.</div></div>
  <div class="encart e-piege"><span class="chapo">Le √3 oublié</span><p>Sans lui, ce moteur donnerait 16,3 A au lieu de 28,3 A : on choisirait un câble et une protection deux tailles trop petits. C'est l'erreur la plus coûteuse du métier.</p></div>`},
 {k:"l",t:"Déséquilibre, neutre et rang 3",h:`
  <figure data-anim="triphase-somme"></figure>
  <p>Déplace les trois curseurs. Tant que les courants sont égaux, la somme reste plate : le neutre ne transporte rien. Dès qu'ils diffèrent, un courant apparaît.</p>
  <div class="encart e-piege"><span class="chapo">Danger — la coupure du neutre</span><p>Sur une distribution étoile déséquilibrée, si le neutre se coupe, le point neutre dérive et les phases les moins chargées voient leur tension monter vers 400 V. C'est le scénario qui grille tout un étage d'appareils. On ne coupe jamais le neutre seul, et on ne le sectionne pas sans couper les phases.</p></div>
  <div class="encart e-terrain"><span class="chapo">Les harmoniques de rang 3</span><p>Les charges monophasées non linéaires (LED, informatique, chargeurs) créent un harmonique à 150 Hz qui, dans les trois phases, est <strong>en phase avec lui-même</strong> : au lieu de s'annuler dans le neutre, il s'y <strong>additionne</strong>. Dans un immeuble de bureaux, on mesure couramment un courant de neutre supérieur au courant de phase. Un neutre chaud sans phase chaude est la signature du problème.</p></div>`},
 {k:"s",t:"Banc d'essai — réseau triphasé",sim:"triphase",h:`<p>Le banc calcule le courant de neutre par composition vectorielle et affiche le taux de déséquilibre.</p>`},
 {k:"a",t:"Atelier — triphasé",gen:["tri-uv","puis-tri","courant-moteur","couplage","neutre"],but:5,h:`<p>Cinq bonnes réponses d'affilée pour ce module : c'est le plus important du parcours, et le plus présent en examen.</p>`},
 {k:"c",t:"Contrôle du bloc alternatif",gen:["tri-uv","puis-tri","courant-moteur","couplage","triangle-pqs","compensation","impedance-rl","eff-max","neutre","capacite-comp"],n:10}
]},

/* ═══════════════ BLOC 4 — LES MACHINES ═══════════════ */
{id:"m15",num:"15",bloc:"Machines",an:2,titre:"Le transformateur",duree:"28 min",
 resume:"Rapport, essais à vide et en court-circuit, rendement, couplages et courant de court-circuit.",
 steps:[
 {k:"l",t:"Le principe, en image",h:`
  <figure data-anim="transfo"></figure>
  <p>Deux enroulements sur un circuit magnétique commun. Le primaire crée un flux alternatif, le secondaire le voit et une tension y apparaît. Aucune liaison électrique entre les deux : le transformateur assure aussi une <strong>séparation galvanique</strong>.</p>
  <div class="formule">m = N₂ / N₁ = U₂₀ / U₁ ≈ I₁ / I₂<span class="note">m : rapport de transformation — U₂₀ : tension secondaire à vide</span></div>
  <p>Il ne crée pas d'énergie : ce qu'il gagne en tension, il le perd en courant. Un transfo 20 kV / 400 V qui débite 1000 A au secondaire n'appelle que 20 A au primaire.</p>
  <div class="encart e-piege"><span class="chapo">Uniquement en alternatif</span><p>Alimenté en continu, il n'y a plus de variation de flux, donc plus de tension induite. Le primaire ne présente alors que sa résistance ohmique — quelques ohms — et il fume.</p></div>`},
 {k:"l",t:"Les deux essais qui caractérisent tout",h:`
  <h3>Essai à vide — secondaire ouvert, primaire sous tension nominale</h3>
  <ul>
   <li>Aucune puissance n'est transmise, le courant appelé est faible.</li>
   <li>La puissance mesurée <span class="mono">P₀</span> représente donc les <strong>pertes fer</strong> (hystérésis + courants de Foucault).</li>
   <li>Elles ne dépendent que de la tension et de la fréquence : elles sont <strong>constantes</strong>, quelle que soit la charge.</li>
  </ul>
  <h3>Essai en court-circuit — secondaire en court-circuit, primaire sous tension réduite</h3>
  <ul>
   <li>On monte la tension primaire jusqu'au courant nominal au secondaire. Cette tension, en pourcentage, est la <strong>tension de court-circuit U<sub>cc</sub></strong> — 4 à 6 % en distribution.</li>
   <li>La tension étant faible, les pertes fer sont négligeables : la puissance mesurée <span class="mono">P<sub>cc</sub></span> représente les <strong>pertes cuivre</strong> à pleine charge.</li>
   <li>Elles varient en <span class="mono">I²</span> : elles dépendent de la charge.</li>
  </ul>
  <div class="formule">η = P₂ / (P₂ + P<sub>fer</sub> + P<sub>cuivre</sub>)<span class="note">Rendement maximal quand les deux pertes s'égalent : vers 50 à 70 % de charge, pas à pleine charge.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Transformateur 100 kVA : P₀ = 350 W, P_cc = 1750 W. Rendement à pleine charge sous cos φ 0,9 ?</p>
   <ol>
    <li>Puissance utile.<span class="op">P₂ = 100 000 × 0,9 = 90 000 W</span></li>
    <li>Pertes totales à pleine charge.<span class="op">350 + 1750 = 2100 W</span></li>
    <li>Rendement.<span class="op">η = 90 000 / 92 100 = 0,977</span></li>
   </ol>
   <div class="final">97,7 %. À mi-charge, les pertes cuivre tombent à 1750/4 = 438 W et le rendement monte à 98,2 %.</div></div>`},
 {k:"l",t:"U_cc, courant de court-circuit et couplages",h:`
  <div class="formule">I<sub>cc</sub> ≈ I<sub>n</sub> × 100 / U<sub>cc</sub>(%)<span class="note">Un transfo à Ucc = 4 % délivre 25 fois son courant nominal en court-circuit.</span></div>
  <p>C'est cette valeur qui fixe le <strong>pouvoir de coupure</strong> exigé des disjoncteurs du TGBT. Un appareil de pouvoir insuffisant n'ouvre pas : il explose.</p>
  <div class="encart e-terrain"><span class="chapo">Le compromis de la U_cc</span><p>Une U_cc <strong>faible</strong> donne une bonne tenue en tension mais un Icc énorme. Une U_cc <strong>élevée</strong> limite l'Icc mais fait chuter la tension en charge. Et deux transformateurs mis en parallèle exigent des U_cc voisines, sinon l'un prend toute la charge.</p></div>
  <h3>Couplages et indice horaire</h3>
  <div class="tabl"><table>
   <tr><th>Notation</th><th>Primaire</th><th>Secondaire</th><th>Emploi</th></tr>
   <tr><td class="mono">Dyn11</td><td>Triangle</td><td>Étoile + neutre</td><td>distribution publique HTA/BT — le standard</td></tr>
   <tr><td class="mono">Yzn11</td><td>Étoile</td><td>Zigzag + neutre</td><td>charges très déséquilibrées</td></tr>
   <tr><td class="mono">Dyn5</td><td>Triangle</td><td>Étoile + neutre</td><td>même dessin, 180° d'écart avec le Dyn11</td></tr>
  </table></div>
  <p>L'indice horaire donne le déphasage primaire/secondaire par multiples de 30°, lus comme une aiguille d'horloge. Deux transformateurs en parallèle doivent avoir <strong>le même indice</strong> : un Dyn11 avec un Dyn5, c'est un court-circuit franc entre secondaires.</p>
  <p>Le triangle au primaire des Dyn11 a un rôle discret mais essentiel : il <strong>piège les harmoniques de rang 3</strong>, qui circulent dans la boucle du triangle au lieu de remonter sur le réseau HTA.</p>`},
 {k:"s",t:"Banc d'essai — transformateur",sim:"transfo",h:`<p>Fais varier le taux de charge : observe le rendement passer par un maximum avant la pleine charge, et la répartition des pertes basculer.</p>`},
 {k:"a",t:"Atelier — transformateur",gen:["transfo-rapport","transfo-rendement","icc","proportion"],but:4,h:`<p>Le calcul d'Icc est systématiquement demandé dès qu'un sujet parle d'un poste de livraison.</p>`},
 {k:"c",t:"Contrôle",gen:["transfo-rapport","transfo-rendement","icc","tri-uv","puis-tri"],n:9}
]},

{id:"m16",num:"16",bloc:"Machines",an:2,titre:"La machine asynchrone",duree:"36 min",
 resume:"La machine la plus répandue du monde industriel : glissement, plaque, couple, démarrages, protections.",
 steps:[
 {k:"l",t:"Le glissement, vu de l'intérieur",h:`
  <figure data-anim="glissement"></figure>
  <p>Mets le glissement à zéro dans la figure : le rotor rattrape le champ, et le repère vert cesse de reculer. À cet instant précis, le rotor ne voit plus aucune variation de flux, aucun courant n'est induit, et <strong>il n'y a plus de couple</strong>. Le moteur doit donc obligatoirement glisser.</p>
  <div class="formule">n<sub>s</sub> = 60 · f / p          g = (n<sub>s</sub> − n) / n<sub>s</sub><span class="note">p = nombre de PAIRES de pôles — g entre 2 et 8 % à charge nominale</span></div>
  <div class="tabl"><table>
   <tr><th>Pôles</th><th>Paires</th><th>n_s à 50 Hz</th><th>Vitesse nominale typique</th></tr>
   <tr><td class="mono">2</td><td class="mono">1</td><td class="mono">3000</td><td class="mono">2890 tr/min</td></tr>
   <tr><td class="mono">4</td><td class="mono">2</td><td class="mono">1500</td><td class="mono">1450 tr/min</td></tr>
   <tr><td class="mono">6</td><td class="mono">3</td><td class="mono">1000</td><td class="mono">960 tr/min</td></tr>
   <tr><td class="mono">8</td><td class="mono">4</td><td class="mono">750</td><td class="mono">720 tr/min</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">Le mécanisme d'ajustement automatique</span><p>Quand la charge augmente, le rotor ralentit, le glissement augmente, les courants rotoriques augmentent, et le couple suit. Le moteur s'adapte tout seul — c'est ce qui en fait une machine si robuste.</p></div>`},
 {k:"l",t:"Lire une plaque signalétique",h:`
  <figure data-anim="plaque-moteur"></figure>
  <div class="tabl"><table>
   <tr><th>Inscription</th><th>Ce que ça veut dire</th><th>Ce que tu en fais</th></tr>
   <tr><td class="mono">230/400 V</td><td>tension par enroulement en Δ / en Y</td><td>décide du couplage</td></tr>
   <tr><td class="mono">10,5/6,1 A</td><td>courants de ligne correspondants</td><td>règle le relais thermique</td></tr>
   <tr><td class="mono">3 kW</td><td>puissance UTILE sur l'arbre</td><td>jamais la puissance absorbée</td></tr>
   <tr><td class="mono">1430 tr/min</td><td>vitesse nominale</td><td>⟹ n_s = 1500, donc 4 pôles, g = 4,7 %</td></tr>
   <tr><td class="mono">cos φ 0,82</td><td>facteur de puissance à charge nominale</td><td>calcul du courant, compensation</td></tr>
   <tr><td class="mono">IP55</td><td>étanchéité poussière / eau</td><td>choix du local</td></tr>
   <tr><td class="mono">IE3</td><td>classe de rendement (IEC 60034-30-1)</td><td>minimum réglementaire de 0,75 à 1000 kW — <strong>IE4 exigé de 75 à 200 kW</strong></td></tr>
   <tr><td class="mono">S1</td><td>service continu</td><td>S4 = démarrages fréquents, déclassement</td></tr>
  </table></div>
  <div class="resolu"><span class="chapo">Exemple résolu — tout tirer d'une plaque</span>
   <p>Plaque : 400 V, 7,5 kW, 1455 tr/min, cos φ 0,84, η 0,89.</p>
   <ol>
    <li>Vitesse de synchronisme immédiatement au-dessus.<span class="op">1500 tr/min ⟹ 4 pôles</span></li>
    <li>Glissement.<span class="op">g = (1500 − 1455)/1500 = 3,0 %</span></li>
    <li>Couple nominal.<span class="op">Ω = 2π × 1455/60 = 152,4 rad/s   ⟹   T = 7500 / 152,4 = 49,2 N·m</span></li>
    <li>Courant de ligne.<span class="op">I = 7500 / (0,89 × 1,732 × 400 × 0,84) = 14,5 A</span></li>
   </ol>
   <div class="final">4 pôles, g = 3 %, T = 49,2 N·m, I = 14,5 A — et le relais thermique se règle sur 14,5 A.</div></div>`},
 {k:"l",t:"Le couple et les démarrages",h:`
  <figure data-anim="demarrage"></figure>
  <p>Compare les trois procédés dans la figure : la courbe du haut est le courant appelé, celle du bas la montée en vitesse.</p>
  <div class="tabl"><table>
   <tr><th>Procédé</th><th>Courant</th><th>Couple</th><th>Quand</th></tr>
   <tr><td>Direct</td><td class="mono">5 à 8 In</td><td class="mono">1,5 à 2,5 Tn</td><td>petites puissances, le plus simple</td></tr>
   <tr><td>Étoile-triangle</td><td class="mono">1,8 à 2,6 In</td><td class="mono">0,5 Tn</td><td>démarrage à vide obligatoire</td></tr>
   <tr><td>Démarreur électronique</td><td class="mono">2 à 4 In réglable</td><td class="mono">réglable</td><td>rampe en tension, pas de variation en marche</td></tr>
   <tr><td>Variateur</td><td class="mono">≈ 1,5 In</td><td class="mono">jusqu'à 1,5 Tn</td><td>couple plein dès 0 tr/min</td></tr>
  </table></div>
  <div class="formule">T = P / Ω     avec     Ω = 2 · π · n / 60<span class="note">T en N·m, P en W, n en tr/min. Raccourci à 1500 tr/min : T ≈ 6,5 × P(kW).</span></div>
  <div class="encart e-cle"><span class="chapo">Pourquoi l'étoile-triangle divise le couple par 3</span><p>En étoile, l'enroulement ne voit que U/√3. Or le couple varie avec le <strong>carré</strong> de la tension : (1/√3)² = 1/3. Le courant est divisé par 3 aussi — c'est le but — mais le couple avec, d'où l'obligation de démarrer à vide.</p></div>
  <div class="encart e-piege"><span class="chapo">Le temps mort de la bascule</span><p>Pendant la commutation Y → Δ, le moteur est déconnecté et garde une tension rémanente. Une reconnexion trop rapide peut produire une pointe supérieure à celle d'un démarrage direct. Il faut 30 à 50 ms de temps mort, et un verrouillage mécanique <strong>et</strong> électrique entre les deux contacteurs.</p></div>`},
 {k:"l",t:"Protéger un moteur",h:`
  <p>Trois fonctions distinctes, souvent confondues :</p>
  <ol>
   <li><strong>Sectionnement</strong> — couper et condamner pour intervenir. Un contacteur ne sectionne pas.</li>
   <li><strong>Protection court-circuit</strong> — fusibles aM ou disjoncteur magnétique. Les aM laissent volontairement passer la pointe de démarrage ; des gG au même calibre fondraient au premier démarrage.</li>
   <li><strong>Protection surcharge</strong> — relais thermique réglé sur le courant de plaque, au couplage utilisé.</li>
  </ol>
  <div class="tabl"><table>
   <tr><th>Classe</th><th>Déclenchement à 7,2 In</th><th>Usage</th></tr>
   <tr><td class="mono">10 A</td><td class="mono">&lt; 2 s</td><td>démarrage très court</td></tr>
   <tr><td class="mono">10</td><td class="mono">4 à 10 s</td><td>standard — pompes, ventilateurs</td></tr>
   <tr><td class="mono">20</td><td class="mono">6 à 20 s</td><td>forte inertie</td></tr>
   <tr><td class="mono">30</td><td class="mono">9 à 30 s</td><td>centrifugeuses, broyeurs</td></tr>
  </table></div>
  <div class="encart e-terrain"><span class="chapo">Un thermique qui déclenche : la bonne démarche</span><p>Avant de changer quoi que ce soit, mesure les <strong>trois</strong> courants de ligne. Un déséquilibre supérieur à 5 % signale une phase faible, un contact de contacteur piqué ou un enroulement en défaut. Perdre une phase double presque le courant dans les deux autres — c'est précisément ce que détecte un relais différentiel.</p></div>`},
 {k:"w",t:"Câbler le circuit de puissance",cab:"puissance-moteur",h:`
  <p>Assez lu. Relie les bornes toi-même : clique une borne, puis une seconde, et le fil se pose. Un fil se retire en cliquant dessus.</p>`},
 {k:"w",t:"Câbler une inversion de sens",cab:"inversion-sens",h:`
  <p>Deux contacteurs, et une seule question : lesquelles des trois phases faut-il croiser ?</p>`},
 {k:"s",t:"Banc d'essai — plaque moteur",sim:"moteur",h:`<p>Entre les valeurs d'une plaque : le banc déduit le nombre de pôles, le glissement, le couple, le courant et la plage de réglage du thermique.</p>`},
 {k:"a",t:"Atelier — machine asynchrone",gen:["synchronisme","glissement","couple","courant-moteur","couplage"],but:5,h:`<p>Cinq d'affilée. Ce sont les cinq calculs qu'on te demandera devant n'importe quelle machine.</p>`},
 {k:"c",t:"Contrôle",gen:["synchronisme","glissement","couple","courant-moteur","couplage","puis-tri"],n:10}
]},

{id:"m17",num:"17",bloc:"Machines",an:2,titre:"Machines à courant continu et synchrones",duree:"22 min",
 resume:"La MCC pour comprendre le pilotage du couple, la synchrone pour produire, le brushless pour l'avenir.",
 steps:[
 {k:"l",t:"La machine à courant continu",h:`
  <div class="formule">E = k · Φ · Ω          T = k · Φ · I<sub>induit</sub>          U = E + R · I</div>
  <p>Deux réglages indépendants, ce qui en fait une machine limpide : le <strong>courant d'induit fixe le couple</strong>, la <strong>tension d'induit fixe la vitesse</strong>. Au-delà de la tension nominale, on réduit le flux d'excitation pour monter en vitesse : c'est le <strong>défluxage</strong>, à couple décroissant.</p>
  <div class="tabl"><table>
   <tr><th>Excitation</th><th>Comportement</th><th>Usage</th></tr>
   <tr><td>Indépendante / shunt</td><td>vitesse quasi constante en charge</td><td>machines-outils, entraînements réglés</td></tr>
   <tr><td>Série</td><td>couple énorme au démarrage, s'emballe à vide</td><td>traction, démarreurs</td></tr>
   <tr><td>Aimants permanents</td><td>flux fixe, compacte</td><td>servomoteurs, petites puissances</td></tr>
  </table></div>
  <div class="encart e-piege"><span class="chapo">Deux emballements mortels pour la machine</span><p>Un moteur <strong>série</strong> ne doit jamais tourner à vide : sans couple résistant, le courant chute, le flux avec, et la vitesse s'emballe. Sur une machine à excitation séparée, la <strong>coupure de l'excitation en marche</strong> produit exactement le même effet.</p></div>`},
 {k:"l",t:"La machine synchrone",h:`
  <p>Le rotor est un électro-aimant, ou des aimants. Il se cale sur le champ tournant et tourne <strong>exactement</strong> à la vitesse de synchronisme, quel que soit le couple — jusqu'au décrochage.</p>
  <div class="formule">n = 60 · f / p<span class="note">Rigoureusement, sans glissement. Contrairement à l'asynchrone.</span></div>
  <h3>En alternateur : deux réglages, deux effets</h3>
  <ul>
   <li>La <strong>puissance active</strong> se règle par le couple de la turbine.</li>
   <li>La <strong>puissance réactive</strong> se règle par le courant d'excitation : surexcité, l'alternateur fournit du réactif au réseau ; sous-excité, il en absorbe.</li>
  </ul>
  <div class="encart e-terrain"><span class="chapo">Coupler un alternateur sur le réseau</span><p>Quatre conditions, dans cet ordre : même <strong>ordre des phases</strong>, même <strong>fréquence</strong>, même <strong>tension</strong>, même <strong>phase</strong> (au synchronoscope ou aux lampes). Se tromper, c'est un court-circuit sur une machine tournante — dégâts mécaniques immédiats sur l'accouplement.</p></div>`},
 {k:"l",t:"Brushless et aimants permanents",h:`
  <p>Le moteur synchrone à aimants piloté électroniquement remplace aujourd'hui la MCC partout : robotique, véhicule électrique, ventilation performante, servo-axes.</p>
  <div class="tabl"><table>
   <tr><th>Critère</th><th>Asynchrone</th><th>Synchrone à aimants</th></tr>
   <tr><td>Prix</td><td>bas</td><td>élevé (terres rares)</td></tr>
   <tr><td>Rendement</td><td>IE3, IE4 au-delà de 75 kW</td><td>IE4 / IE5 atteints plus facilement</td></tr>
   <tr><td>Robustesse</td><td>excellente</td><td>sensible à la température (démagnétisation)</td></tr>
   <tr><td>Pilotage</td><td>possible sans variateur</td><td>variateur obligatoire</td></tr>
  </table></div>
  <div class="encart e-piege"><span class="chapo">Un danger propre aux aimants</span><p>Un moteur à aimants permanents entraîné mécaniquement <strong>génère de la tension à ses bornes</strong>, variateur hors tension. Sur un axe vertical ou une charge lancée, les bornes sont sous tension sans aucune alimentation. Le blocage mécanique fait partie de la consignation.</p></div>`},
 {k:"a",t:"Atelier — machines",gen:["couple","synchronisme","puissance-dc","transpose"],but:4,h:`<p>Le couple et la vitesse de synchronisme reviennent quelle que soit la machine.</p>`},
 {k:"c",t:"Contrôle",gen:["couple","synchronisme","glissement","courant-moteur","transfo-rapport"],n:8}
]},

/* ═══════════════ BLOC 5 — LA CONVERSION D'ÉNERGIE ═══════════════ */
{id:"m18",num:"18",bloc:"Conversion",an:2,titre:"Électronique de puissance",duree:"30 min",
 resume:"Redresser, hacher, onduler : les quatre conversions et les composants qui les réalisent.",
 steps:[
 {k:"l",t:"Les quatre conversions",h:`
  <div class="tabl"><table>
   <tr><th>De → vers</th><th>Nom</th><th>Où</th></tr>
   <tr><td class="mono">AC → DC</td><td>Redresseur</td><td>chargeur, entrée de variateur, alimentation</td></tr>
   <tr><td class="mono">DC → DC</td><td>Hacheur</td><td>traction, LED, alimentation à découpage, MPPT solaire</td></tr>
   <tr><td class="mono">DC → AC</td><td>Onduleur</td><td>variateur, onduleur photovoltaïque, ASI</td></tr>
   <tr><td class="mono">AC → AC</td><td>Gradateur</td><td>variation de lumière, chauffage, démarreur progressif</td></tr>
  </table></div>
  <h3>Les composants, par ordre de contrôlabilité</h3>
  <ul>
   <li><strong>Diode</strong> — passe dans un seul sens, non commandée. Base du redressement.</li>
   <li><strong>Thyristor</strong> — amorçage commandé par la gâchette, blocage seulement au passage par zéro du courant.</li>
   <li><strong>IGBT</strong> — amorçage <em>et</em> blocage commandés, jusqu'à ~20 kHz. Le composant du variateur moderne.</li>
   <li><strong>MOSFET</strong> — très rapide, basse tension, alimentations à découpage.</li>
   <li><strong>SiC / GaN</strong> — nouvelle génération : moins de pertes, fréquences plus hautes, convertisseurs plus compacts.</li>
  </ul>`},
 {k:"l",t:"Le redressement, diode par diode",h:`
  <figure data-anim="redressement"></figure>
  <p>Bascule entre PD2 et PD3 dans la figure, puis ajoute le condensateur. Tu vois la diode conductrice s'allumer, et la tension de sortie se construire comme l'enveloppe des phases.</p>
  <div class="formule">PD2 monophasé : U<sub>moy</sub> = 2·U<sub>max</sub>/π ≈ 0,90 · U<sub>eff</sub>
PD3 triphasé : U<sub>moy</sub> = 3·√2·U/π ≈ 1,35 · U<sub>composée</sub><span class="note">Un PD3 sur 400 V donne environ 540 V continus : c'est le bus continu de tous les variateurs.</span></div>
  <p>Le PD3 présente une ondulation à 300 Hz, six fois la fréquence réseau : bien plus facile à filtrer que les 100 Hz d'un PD2.</p>
  <h3>Redressement commandé</h3>
  <div class="formule">U<sub>moy</sub> = U<sub>moy0</sub> · cos α<span class="note">α : angle de retard à l'amorçage des thyristors.</span></div>
  <p>Au-delà de α = 90°, la tension moyenne devient négative : le convertisseur renvoie l'énergie vers le réseau. C'est le fonctionnement en <strong>onduleur assisté</strong>, base du freinage par récupération.</p>
  <div class="encart e-piege"><span class="chapo">Ce que ça fait au réseau</span><p>Un redresseur à diodes appelle un courant en créneaux étroits, riche en harmoniques de rangs 5, 7, 11, 13. Sans rien, le THD de courant d'un variateur nu dépasse facilement 80 %. La parade la plus simple et la plus rentable : une <strong>self de ligne de 3 à 4 %</strong>, qui divise le THD par deux pour un coût dérisoire.</p></div>`},
 {k:"l",t:"Le hacheur",h:`
  <div class="formule">α = t<sub>ON</sub> / T          ⟨U<sub>s</sub>⟩ = α · U<sub>e</sub><span class="note">Hacheur série (buck) : toujours ABAISSEUR, α est entre 0 et 1.</span></div>
  <p>Il faut aussi une <strong>inductance de lissage</strong> et une <strong>diode de roue libre</strong> : quand l'interrupteur s'ouvre, le courant de l'inductance doit continuer à circuler — exactement le phénomène du module 10.</p>
  <div class="formule">ΔI = α · (1 − α) · U<sub>e</sub> / (L · f)<span class="note">Ondulation maximale à α = 0,5. Elle diminue si L ou f augmentent.</span></div>
  <p>C'est le compromis fondamental du découpage : monter en fréquence réduit la taille des composants passifs, mais augmente les pertes de commutation et les perturbations CEM.</p>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Hacheur alimenté sous 540 V, α = 0,35, f = 10 kHz, L = 4 mH. Tension moyenne et ondulation de courant ?</p>
   <ol>
    <li>Tension moyenne.<span class="op">⟨Us⟩ = 0,35 × 540 = 189 V</span></li>
    <li>Ondulation.<span class="op">ΔI = 0,35 × 0,65 × 540 / (0,004 × 10 000)</span></li>
    <li>Calcul.<span class="op">ΔI = 122,9 / 40 = 3,07 A</span></li>
   </ol>
   <div class="final">189 V moyens avec 3,07 A d'ondulation crête à crête.</div></div>`},
 {k:"s",t:"Banc d'essai — hacheur",sim:"hacheur",h:`<p>Fais varier α, la fréquence et l'inductance : observe le chronogramme et l'ondulation. Le maximum d'ondulation tombe bien à α = 0,5.</p>`},
 {k:"a",t:"Atelier — conversion",gen:["hacheur","pd3","eff-max","puissance-dc"],but:4,h:`<p>Ces deux formules — α·Ue et 1,35·U — sont à connaître par cœur : elles ouvrent presque tous les sujets d'électronique de puissance.</p>`},
 {k:"c",t:"Contrôle",gen:["hacheur","pd3","eff-max","periode","rc-tau"],n:8}
]},

{id:"m19",num:"19",bloc:"Conversion",an:2,titre:"La variation de vitesse",duree:"28 min",
 resume:"MLI, loi U/f, structure d'un variateur, et le gisement d'économie le plus rentable du métier.",
 steps:[
 {k:"l",t:"La MLI : fabriquer une sinusoïde avec un interrupteur",h:`
  <figure data-anim="mli"></figure>
  <p>Le principe est dans la figure : on compare une sinusoïde de référence à une porteuse triangulaire. Quand la référence est au-dessus, on ferme ; sinon, on ouvre. La <strong>largeur</strong> des impulsions suit donc la sinusoïde, et l'inductance du moteur lisse le courant, qui redevient quasi sinusoïdal.</p>
  <p>La fréquence de découpage se situe entre 2 et 16 kHz. Plus haut : moins de bruit acoustique, mais plus de pertes de commutation et plus de perturbations CEM.</p>`},
 {k:"l",t:"La loi U/f",h:`
  <p>Le flux dans un moteur est proportionnel au rapport tension sur fréquence. Pour garder le couple disponible quand on change la vitesse, le variateur maintient ce rapport constant.</p>
  <div class="formule">U / f = constante<span class="note">400 V / 50 Hz = 8. À 25 Hz, le variateur sort 200 V.</span></div>
  <div class="tabl"><table>
   <tr><th>Plage</th><th>Comportement</th><th>Couple disponible</th></tr>
   <tr><td class="mono">0 à 50 Hz</td><td>U/f constant, flux nominal</td><td>couple nominal disponible</td></tr>
   <tr><td class="mono">au-delà de 50 Hz</td><td>la tension plafonne : défluxage</td><td>puissance constante, couple décroissant</td></tr>
  </table></div>
  <h3>La structure d'un variateur</h3>
  <div class="tabl"><table>
   <tr><th>Étage</th><th>Rôle</th></tr>
   <tr><td class="mono">Redresseur PD3</td><td>réseau 400 V → bus continu ≈ 540 V</td></tr>
   <tr><td class="mono">Bus continu + condensateurs</td><td>réservoir d'énergie, lissage</td></tr>
   <tr><td class="mono">Résistance de freinage</td><td>dissipe l'énergie renvoyée par la charge en décélération</td></tr>
   <tr><td class="mono">Onduleur MLI à IGBT</td><td>bus continu → triphasé à fréquence et tension variables</td></tr>
  </table></div>
  <div class="encart e-terrain"><span class="chapo">Trois pièges de mise en œuvre</span>
   <p><strong>Câble moteur blindé</strong>, blindage repris à 360° aux deux extrémités : les fronts raides d'IGBT rayonnent et perturbent les capteurs voisins.</p>
   <p><strong>Longueur limitée</strong> (souvent 50 à 100 m) : au-delà, les réflexions d'onde peuvent doubler la tension aux bornes du moteur et percer l'isolant des premières spires.</p>
   <p><strong>Courants de palier</strong> : la tension de mode commun traverse les roulements. Sur les grosses machines, roulements isolés ou bague de mise à la terre d'arbre.</p></div>`},
 {k:"l",t:"Pourquoi c'est si rentable",h:`
  <p>Sur une pompe ou un ventilateur centrifuge, trois lois de similitude s'appliquent — et la troisième change tout.</p>
  <div class="formule">débit Q ∝ N          hauteur H ∝ N²          puissance P ∝ N³</div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Ventilateur de 30 kW tournant en permanence. 80 % du débit suffit. Bridé par un registre, il consomme presque autant. Avec un variateur ?</p>
   <ol>
    <li>La puissance suit le cube de la vitesse.<span class="op">P = 30 × 0,8³</span></li>
    <li>Calcul du cube.<span class="op">0,8³ = 0,512</span></li>
    <li>Puissance absorbée.<span class="op">P = 30 × 0,512 = 15,4 kW</span></li>
    <li>Sur 6000 heures par an.<span class="op">(30 − 15,4) × 6000 = 87 600 kWh/an</span></li>
   </ol>
   <div class="final">Réduire la vitesse de 20 % économise près de la moitié de l'énergie. C'est le meilleur retour sur investissement de toute l'électrotechnique industrielle.</div></div>
  <h3>Ce que la réglementation impose aujourd'hui</h3>
  <p>Le règlement européen d'écoconception <span class="mono">UE 2019/1781</span> ne se contente plus de recommander : il interdit la mise sur le marché en dessous d'un seuil, et ce seuil a monté.</p>
  <div class="tabl"><table>
   <tr><th>Moteurs concernés</th><th>Classe minimale</th><th>Depuis</th></tr>
   <tr><td>Triphasés 0,12 à 0,75 kW</td><td class="mono">IE2</td><td class="mono">1er juillet 2021</td></tr>
   <tr><td>Triphasés 0,75 à 1000 kW, 2 à 8 pôles</td><td class="mono">IE3</td><td class="mono">1er juillet 2021</td></tr>
   <tr><td>Triphasés <strong>75 à 200 kW</strong>, 2 / 4 / 6 pôles</td><td class="mono">IE4</td><td class="mono">1er juillet 2023</td></tr>
   <tr><td>Monophasés 0,12 à 1000 kW · ATEX Ex eb</td><td class="mono">IE2</td><td class="mono">1er juillet 2023</td></tr>
   <tr><td>Variateurs de vitesse</td><td class="mono">IE2 (classe variateur)</td><td class="mono">1er juillet 2021</td></tr>
  </table></div>
  <div class="encart e-piege"><span class="chapo">L'erreur de cours qui traîne</span><p>Beaucoup de supports disent encore « IE3 est le minimum ». C'est vrai en général, mais <strong>faux entre 75 et 200 kW</strong>, où IE4 est exigé depuis juillet 2023. Sur un dossier de remplacement de moteur dans cette plage, proposer un IE3 est une non-conformité.</p></div>
  <div class="encart e-cle"><span class="chapo">Les autres gisements, par rentabilité décroissante</span><p>Variation de vitesse sur machines centrifuges · correction du facteur de puissance · arrêt des marches à vide · passage en moteurs IE4 · éclairage LED avec détection de présence · récupération de chaleur. Et avant tout : le <strong>comptage divisionnaire</strong>, sans lequel on optimise à l'aveugle.</p></div>`},
 {k:"a",t:"Atelier — variation de vitesse",gen:["cube","hacheur","couple","courant-moteur"],but:4,h:`<p>La loi cubique est contre-intuitive : c'est justement pour ça qu'elle tombe si souvent en examen.</p>`},
 {k:"c",t:"Contrôle",gen:["cube","hacheur","pd3","couple","synchronisme"],n:8}
]},

/* ═══════════════ BLOC 6 — L'INSTALLATION ═══════════════ */
{id:"m20",num:"20",bloc:"Installation",an:2,titre:"Régimes de neutre et protections",duree:"34 min",
 resume:"TT, TN, IT : où passe le courant de défaut, et quel appareil doit couper.",
 steps:[
 {k:"l",t:"Voir le courant de défaut",h:`
  <figure data-anim="defaut-terre"></figure>
  <p>Change de régime dans la figure et regarde le chemin du courant. C'est la clé de tout ce module : le régime de neutre ne change pas le danger, il change <strong>le chemin</strong> — donc l'appareil capable de le détecter.</p>
  <div class="tabl"><table>
   <tr><th>Régime</th><th>Neutre</th><th>Masses</th><th>Au 1ᵉʳ défaut</th><th>Terrain</th></tr>
   <tr><td class="mono">TT</td><td>à la terre</td><td>terre séparée</td><td>coupure par DDR obligatoire</td><td>domestique, tertiaire</td></tr>
   <tr><td class="mono">TN-S</td><td>à la terre</td><td>reliées au neutre, PE distinct</td><td>court-circuit franc, coupure par protection de surintensité</td><td>industrie</td></tr>
   <tr><td class="mono">IT</td><td>isolé ou impédant</td><td>à la terre</td><td>alarme du CPI, pas de coupure</td><td>hôpitaux, process continus</td></tr>
  </table></div>
  <ul>
   <li><strong>TT</strong> — le courant traverse deux prises de terre : il est faible, quelques ampères. Seul un différentiel le détecte. C'est le régime imposé au particulier, parce qu'il ne dépend pas de la qualité de l'installation en aval.</li>
   <li><strong>TN</strong> — la boucle est entièrement métallique : le courant est énorme, la protection magnétique coupe en quelques millisecondes. Mais il faut <strong>calculer la longueur maximale</strong> de chaque circuit, sinon l'impédance de boucle limite trop le courant et rien ne déclenche.</li>
   <li><strong>IT</strong> — rien ne boucle au premier défaut : le service continue, le contrôleur permanent d'isolement signale, on cherche le défaut en marche. Le <strong>second</strong> défaut, lui, est un court-circuit et oblige à couper.</li>
  </ul>
  <div class="formule">en TT :  U<sub>c</sub> = R<sub>A</sub> · I<sub>Δn</sub> ≤ U<sub>L</sub><span class="note">U_L = 50 V en milieu sec, 25 V en milieu humide.</span></div>
  <div class="resolu"><span class="chapo">Exemple résolu</span>
   <p>Prise de terre mesurée à 120 Ω, local sec. Quelle sensibilité maximale de différentiel ?</p>
   <ol>
    <li>On isole la sensibilité.<span class="op">I_Δn ≤ U_L / R_A = 50 / 120</span></li>
    <li>Calcul.<span class="op">I_Δn ≤ 0,416 A = 416 mA</span></li>
    <li>On retient le calibre normalisé immédiatement inférieur.<span class="op">300 mA</span></li>
   </ol>
   <div class="final">300 mA suffit pour les contacts indirects — mais 30 mA reste exigé sur les circuits prises et les locaux humides, au titre de la protection des personnes.</div></div>`},
 {k:"l",t:"Le différentiel, en détail",h:`
  <figure data-anim="differentiel"></figure>
  <p>Monte le curseur de fuite dans la figure : tant que tout ce qui part revient, la somme mesurée par le tore est nulle. Une fuite rompt cet équilibre, et c'est elle — pas le courant de charge — que l'appareil mesure.</p>
  <div class="tabl"><table>
   <tr><th>Type</th><th>Détecte</th><th>Obligatoire pour</th></tr>
   <tr><td class="mono">AC</td><td>alternatif sinusoïdal seul</td><td>usages simples</td></tr>
   <tr><td class="mono">A</td><td>+ composantes continues pulsées</td><td>lave-linge, plaques induction, bornes de recharge</td></tr>
   <tr><td class="mono">F</td><td>+ hautes fréquences</td><td>machines à variateur</td></tr>
   <tr><td class="mono">B</td><td>+ continu lisse</td><td>certaines bornes de recharge, onduleurs PV sans transfo</td></tr>
  </table></div>
  <div class="encart e-piege"><span class="chapo">Deux erreurs classiques</span>
   <p><strong>Mettre un type AC là où il faut un type A</strong> : le différentiel ne verra jamais le défaut. Il est présent, il teste bon au bouton, et il ne protège pas.</p>
   <p><strong>Deux DDR 30 mA en cascade</strong> ne sont pas sélectifs : le premier qui voit le défaut coupe, souvent celui de tête. Il faut un <strong>type S temporisé</strong> en amont et des instantanés en aval, avec un rapport de sensibilité d'au moins 3.</p></div>`},
 {k:"l",t:"Courbes, pouvoir de coupure et sélectivité",h:`
  <p>Un disjoncteur a deux déclencheurs : un <strong>thermique</strong> (bilame, temporisé, contre les surcharges) et un <strong>magnétique</strong> (instantané, contre les courts-circuits). La courbe désigne le seuil magnétique.</p>
  <div class="tabl"><table>
   <tr><th>Courbe</th><th>Seuil magnétique</th><th>Emploi</th></tr>
   <tr><td class="mono">B</td><td class="mono">3 à 5 In</td><td>lignes longues, générateurs, charges résistives</td></tr>
   <tr><td class="mono">C</td><td class="mono">5 à 10 In</td><td>usage général — éclairage, prises, distribution</td></tr>
   <tr><td class="mono">D</td><td class="mono">10 à 20 In</td><td>fort appel : moteurs, transformateurs BT/BT</td></tr>
   <tr><td class="mono">MA</td><td class="mono">12 In, sans thermique</td><td>départs moteurs avec relais thermique séparé</td></tr>
  </table></div>
  <p>Le <strong>pouvoir de coupure</strong> (en kA) doit dépasser le courant de court-circuit présumé au point d'installation — calculé au module 15 à partir de la U_cc du transformateur.</p>
  <h3>Trois sélectivités</h3>
  <ul>
   <li><strong>Ampèremétrique</strong> — les calibres décroissent vers l'aval. Insuffisante seule au-delà des faibles courants.</li>
   <li><strong>Chronométrique</strong> — l'appareil amont est temporisé, laissant l'aval éliminer le défaut d'abord.</li>
   <li><strong>Logique</strong> — l'aval envoie un ordre d'attente à l'amont. La plus rapide, réservée aux disjoncteurs électroniques.</li>
  </ul>`},
 {k:"w",t:"Câbler un tableau divisionnaire",cab:"tableau",h:`
  <p>Le tableau d'un logement, en plus petit : une arrivée, un différentiel, trois départs. Chaque appareil a son rôle, et il ne protège pas la même chose que son voisin.</p>`},
 {k:"a",t:"Atelier — protections",gen:["ddr","icc","courant-moteur","pourcent"],but:4,h:`<p>Le calcul du différentiel maximal et celui de l'Icc reviennent dans tous les dossiers d'installation.</p>`},
 {k:"c",t:"Contrôle",gen:["ddr","icc","courant-moteur","puis-tri","transfo-rapport"],n:9}
]},

{id:"m21",num:"21",bloc:"Installation",an:2,titre:"Câbles, chute de tension et schémas",duree:"30 min",
 resume:"Dimensionner une ligne selon trois contraintes, et lire les quatre types de schémas du métier.",
 steps:[
 {k:"l",t:"Trois contraintes, la plus exigeante l'emporte",h:`
  <ol>
   <li><strong>Courant admissible</strong> — la section doit supporter le courant d'emploi après coefficients de correction (mode de pose, température, groupement).</li>
   <li><strong>Chute de tension</strong> — limitée par la norme pour que les récepteurs reçoivent une tension correcte.</li>
   <li><strong>Contrainte thermique en court-circuit</strong> et, en TN/IT, longueur maximale compatible avec le déclenchement de la protection.</li>
  </ol>
  <figure data-anim="chute-ligne"></figure>
  <div class="formule">monophasé : ΔU = 2 · ρ · L · I · cos φ / S
triphasé :  ΔU = √3 · ρ · L · I · cos φ / S<span class="note">ρ = 0,023 (cuivre) ou 0,037 (aluminium) Ω·mm²/m</span></div>
  <div class="tabl"><table>
   <tr><th>Type d'installation</th><th>Éclairage</th><th>Autres usages</th></tr>
   <tr><td>Alimentée par branchement basse tension</td><td class="mono">3 %</td><td class="mono">5 %</td></tr>
   <tr><td>Alimentée par poste HTA privé</td><td class="mono">6 %</td><td class="mono">8 %</td></tr>
  </table></div>
  <div class="resolu"><span class="chapo">Exemple résolu — et la remontée à la section</span>
   <p>Ligne triphasée 400 V, 150 m, 63 A, cos φ 0,85, cuivre. Section pour rester sous 5 % ?</p>
   <ol>
    <li>Chute maximale admissible.<span class="op">5 % × 400 = 20 V</span></li>
    <li>On part de la formule et on isole S.<span class="op">S = √3 · ρ · L · I · cos φ / ΔU</span></li>
    <li>On remplace.<span class="op">S = 1,732 × 0,023 × 150 × 63 × 0,85 / 20</span></li>
    <li>Calcul.<span class="op">S = 320 / 20 = 16 mm²</span></li>
   </ol>
   <div class="final">16 mm² au titre de la chute de tension. Reste à vérifier le courant admissible : 63 A en 16 mm² est juste, selon le mode de pose il faudra peut-être 25 mm².</div></div>`},
 {k:"l",t:"Lire un schéma",h:`
  <div class="tabl"><table>
   <tr><th>Schéma</th><th>Répond à la question</th></tr>
   <tr><td>Unifilaire</td><td>comment l'énergie est distribuée, quelles protections, quelles sections</td></tr>
   <tr><td>Développé (puissance + commande)</td><td>comment le circuit fonctionne, dans l'ordre logique</td></tr>
   <tr><td>De raccordement / bornier</td><td>quel fil sur quelle borne — le schéma de l'atelier</td></tr>
   <tr><td>Implantation</td><td>où sont physiquement les appareils dans l'armoire</td></tr>
  </table></div>
  <h3>Le repérage normalisé</h3>
  <div class="tabl"><table>
   <tr><th>Repère</th><th>Appareil</th><th>Repère</th><th>Appareil</th></tr>
   <tr><td class="mono">Q</td><td>sectionneur, disjoncteur</td><td class="mono">KM</td><td>contacteur de puissance</td></tr>
   <tr><td class="mono">F</td><td>fusible, relais thermique</td><td class="mono">KA</td><td>relais auxiliaire</td></tr>
   <tr><td class="mono">S</td><td>bouton, capteur de position</td><td class="mono">H</td><td>voyant, avertisseur</td></tr>
   <tr><td class="mono">M</td><td>moteur</td><td class="mono">T</td><td>transformateur</td></tr>
  </table></div>
  <p>Les bornes suivent aussi une règle : <span class="mono">1-2</span> et <span class="mono">3-4</span> pour les contacts à fermeture, <span class="mono">A1-A2</span> pour la bobine d'un contacteur, <span class="mono">13-14</span> pour son contact d'auto-maintien, <span class="mono">95-96</span> pour le contact à ouverture d'un relais thermique — celui qu'on insère dans le circuit de commande.</p>`},
 {k:"a",t:"Atelier — dimensionnement",gen:["chute-tension","resistivite","courant-moteur","pourcent"],but:4,h:`<p>Attention au coefficient : 2 en monophasé, √3 en triphasé. C'est la première chose à identifier dans l'énoncé.</p>`},
 {k:"s",t:"Banc d'essai — section de câble",sim:"cable",h:`<p>Le banc rend le verdict de conformité et, en cas de dépassement, propose la section minimale à retenir.</p>`},
 {k:"c",t:"Contrôle",gen:["chute-tension","resistivite","courant-moteur","ddr","joule"],n:9}
]},

{id:"m22",num:"22",bloc:"Installation",an:1,titre:"Sécurité électrique et habilitation",duree:"26 min",
 resume:"Ce que le courant fait au corps, décoder un titre d'habilitation, et la consignation dans le bon ordre.",
 steps:[
 {k:"l",t:"Ce que fait le courant au corps",h:`
  <p>Ce n'est pas la tension qui tue, c'est le courant — et surtout sa durée.</p>
  <div class="tabl"><table>
   <tr><th>Courant (50 Hz)</th><th>Effet</th></tr>
   <tr><td class="mono">0,5 mA</td><td>seuil de perception</td></tr>
   <tr><td class="mono">10 mA</td><td>tétanisation : impossible de lâcher prise</td></tr>
   <tr><td class="mono">30 mA</td><td>tétanisation respiratoire — seuil du différentiel</td></tr>
   <tr><td class="mono">75 mA pendant 5 s</td><td>fibrillation ventriculaire probable</td></tr>
   <tr><td class="mono">1 A et plus</td><td>arrêt cardiaque, brûlures profondes</td></tr>
  </table></div>
  <p>La résistance du corps va de 5000 Ω (peau sèche) à moins de 1000 Ω (peau humide, contact large). Sous 230 V, cela donne de 46 mA à 230 mA : la seconde valeur est mortelle.</p>
  <div class="formule">U<sub>L</sub> = 50 V en alternatif · 120 V en continu<span class="note">Tension limite conventionnelle en milieu sec — 25 V en milieu humide.</span></div>
  <div class="tabl"><table>
   <tr><th>Type de contact</th><th>Ce que c'est</th><th>Prévention</th></tr>
   <tr><td>Direct</td><td>toucher une pièce normalement sous tension</td><td>isolation, barrières, enveloppes, éloignement, TBTS</td></tr>
   <tr><td>Indirect</td><td>toucher une masse mise sous tension par un défaut</td><td>mise à la terre + coupure automatique, double isolation, séparation</td></tr>
  </table></div>
  <div class="encart e-piege"><span class="chapo">Le risque qu'on sous-estime : l'arc</span><p>Un court-circuit dans une armoire projette un plasma à plusieurs milliers de degrés et une onde de pression. Les brûlures d'arc sont plus fréquentes que les électrisations dans les accidents graves. D'où les vêtements non fondants, la visière anti-UV et l'écran facial pour toute manœuvre à risque.</p></div>`},
 {k:"l",t:"Décoder un titre d'habilitation",h:`
  <div class="tabl"><table>
   <tr><th>Position</th><th>Symbole</th><th>Sens</th></tr>
   <tr><td>1ʳᵉ lettre</td><td class="mono">B</td><td>basse tension (≤ 1000 V AC)</td></tr>
   <tr><td></td><td class="mono">H</td><td>haute tension</td></tr>
   <tr><td>Chiffre</td><td class="mono">0</td><td>travaux non électriques en zone</td></tr>
   <tr><td></td><td class="mono">1</td><td>exécutant de travaux électriques</td></tr>
   <tr><td></td><td class="mono">2</td><td>chargé de travaux — dirige l'équipe</td></tr>
   <tr><td>2ᵉ lettre</td><td class="mono">V</td><td>travail au voisinage de pièces nues sous tension</td></tr>
   <tr><td></td><td class="mono">R</td><td>chargé d'intervention générale BT — dépannage, ≤ 400 V et 32 A</td></tr>
   <tr><td></td><td class="mono">C</td><td>chargé de consignation</td></tr>
   <tr><td></td><td class="mono">E</td><td>opérations spécifiques : essais, vérifications, mesurages, manœuvres</td></tr>
  </table></div>
  <p><span class="mono">B1V</span> = exécutant BT autorisé au voisinage · <span class="mono">BR</span> = le dépanneur typique · <span class="mono">BC</span> = celui qui a le droit de consigner.</p>
  <div class="encart e-cle"><span class="chapo">Ce qu'un titre ne fait pas</span><p>Il autorise, il n'oblige pas. Il ne dispense jamais de l'analyse du risque avant l'opération, ni du droit de retrait si les conditions ne sont pas réunies.</p></div>`},
 {k:"l",t:"La consignation, dans le bon ordre",h:`
  <figure data-anim="consignation"></figure>
  <ol>
   <li><strong>Séparer</strong> — ouvrir de façon pleinement apparente ou certifiée tous les conducteurs actifs, neutre compris. Un contacteur ne sépare pas.</li>
   <li><strong>Condamner</strong> — bloquer l'organe ouvert par cadenas personnel, avec pancarte. Une clé, un intervenant.</li>
   <li><strong>Identifier</strong> — s'assurer, plans à l'appui, que l'ouvrage consigné est bien celui sur lequel on va travailler.</li>
   <li><strong>Vérifier l'absence de tension</strong> et mettre à la terre et en court-circuit si nécessaire.</li>
  </ol>
  <h3>La VAT, en trois temps immuables</h3>
  <ol>
   <li>Vérifier le <strong>bon fonctionnement</strong> du VAT sur une source connue sous tension.</li>
   <li>Vérifier l'<strong>absence de tension</strong> sur l'ouvrage : entre tous les conducteurs, et entre chacun et la terre.</li>
   <li>Vérifier <strong>à nouveau</strong> le bon fonctionnement du VAT sur la source connue.</li>
  </ol>
  <div class="encart e-piege"><span class="chapo">Pourquoi le troisième temps</span><p>Sans lui, un VAT tombé en panne entre-temps donne une absence de tension parfaitement rassurante et parfaitement fausse. C'est l'étape la plus souvent sautée par habitude, et celle qui coûte des vies. Un multimètre n'est d'ailleurs pas un VAT : le VAT est un appareil dédié, sans sélecteur à tourner, donc sans risque d'être resté en position ohmmètre.</p></div>
  <div class="encart e-terrain"><span class="chapo">EPI d'une intervention BT</span><p>Gants isolants classe 0 vérifiés à l'air avant chaque usage, écran facial anti-UV, vêtements non fondants et couvrants, chaussures isolantes, outils isolés 1000 V marqués du double triangle, tapis ou tabouret isolant. Et jamais seul sur une intervention sous tension.</p></div>`},
 {k:"a",t:"Atelier — sécurité",gen:["securite","ddr","pourcent"],but:5,h:`<p>Cinq bonnes réponses d'affilée sur ce module. C'est le seul du parcours où une approximation n'a aucune excuse.</p>`},
 {k:"c",t:"Contrôle",gen:["securite","ddr","ohm","resistivite"],n:8}
]},

/* ═══════════════ BLOC 7 — AUTOMATISMES ET TERRAIN ═══════════════ */
{id:"m23",num:"23",bloc:"Automatismes et terrain",an:2,titre:"Logique, schémas de commande et GRAFCET",duree:"30 min",
 resume:"L'auto-maintien, l'automate, et le langage qui décrit le cycle d'une machine.",
 steps:[
 {k:"l",t:"Logique combinatoire et sécurité positive",h:`
  <div class="tabl"><table>
   <tr><th>Fonction</th><th>Écriture</th><th>Câblage équivalent</th></tr>
   <tr><td>ET</td><td class="mono">S = a · b</td><td>contacts en série</td></tr>
   <tr><td>OU</td><td class="mono">S = a + b</td><td>contacts en parallèle</td></tr>
   <tr><td>NON</td><td class="mono">S = ā</td><td>contact à ouverture (NF)</td></tr>
   <tr><td>OU exclusif</td><td class="mono">S = a ⊕ b</td><td>va-et-vient d'éclairage</td></tr>
  </table></div>
  <div class="formule">De Morgan :  a·b ‾ = ā + b̄        a+b ‾ = ā · b̄<span class="note">Sert à transformer un câblage en son équivalent, souvent plus simple.</span></div>
  <div class="encart e-cle"><span class="chapo">La règle de câblage qui sauve</span><p>Un arrêt d'urgence et un contact de sécurité se câblent <strong>toujours en NF</strong>. Si le fil casse ou si la borne se desserre, le circuit s'ouvre et la machine s'arrête. Câblé en NO, un fil coupé rendrait l'arrêt d'urgence inopérant sans le moindre signe extérieur. C'est le principe de <strong>sécurité positive</strong>.</p></div>`},
 {k:"l",t:"L'auto-maintien, le circuit à connaître par cœur",h:`
  <figure data-anim="auto-maintien"></figure>
  <div class="formule">KM = (S<sub>marche</sub> + KM) · S̄<sub>arrêt</sub> · F̄<sub>thermique</sub><span class="note">Le terme « + KM » est l'auto-maintien : la sortie se réalimente elle-même par son propre contact.</span></div>
  <p>La chaîne se lit dans cet ordre, et on la retrouve à l'identique dans neuf armoires sur dix :</p>
  <div class="formule">Ph → Q → arrêt d'urgence (NF) → F 95-96 (thermique) → S1 arrêt (NF)
→ [ S2 marche (NO) // KM 13-14 auto-maintien ] → bobine KM A1-A2 → N</div>
  <div class="tabl"><table>
   <tr><th>Variante</th><th>Si marche et arrêt sont actionnés ensemble</th><th>Quand l'utiliser</th></tr>
   <tr><td>Priorité à l'arrêt</td><td>la machine s'arrête</td><td>le cas général — c'est celui ci-dessus</td></tr>
   <tr><td>Priorité à la marche</td><td>la machine démarre</td><td>process où l'arrêt intempestif est plus dangereux</td></tr>
  </table></div>
  <h3>Les temporisations</h3>
  <ul>
   <li><strong>Travail (TON)</strong> — la sortie s'active après un délai. Le cas de l'étoile-triangle.</li>
   <li><strong>Repos (TOFF)</strong> — la sortie retombe après un délai. Extraction, ventilation post-arrêt.</li>
  </ul>`},
 {k:"l",t:"L'automate programmable",h:`
  <p>Un API exécute en boucle un cycle immuable. Le comprendre explique la quasi-totalité des comportements « bizarres » d'un programme.</p>
  <ol>
   <li><strong>Lecture des entrées</strong> — l'état physique est recopié dans une image mémoire.</li>
   <li><strong>Traitement du programme</strong> — exécuté sur cette image, pas sur les entrées réelles.</li>
   <li><strong>Écriture des sorties</strong> — l'image des sorties est reportée sur les bornes.</li>
   <li><strong>Tâches système</strong> — communication, autodiagnostic, chien de garde.</li>
  </ol>
  <p>Le temps de cycle va de quelques centaines de microsecondes à quelques dizaines de millisecondes. Conséquence directe : une impulsion plus courte que le cycle peut passer inaperçue — d'où les entrées à comptage rapide pour un codeur.</p>
  <div class="tabl"><table>
   <tr><th>Langage (IEC 61131-3)</th><th>Nature</th><th>Bon pour</th></tr>
   <tr><td class="mono">LD — Ladder</td><td>graphique, contacts</td><td>reprendre un schéma à contacts, maintenance</td></tr>
   <tr><td class="mono">FBD</td><td>blocs fonctionnels</td><td>régulation, traitement analogique</td></tr>
   <tr><td class="mono">SFC / Grafcet</td><td>séquentiel</td><td>le cycle d'une machine</td></tr>
   <tr><td class="mono">ST</td><td>texte structuré</td><td>calculs, boucles, traitements complexes</td></tr>
  </table></div>
  <div class="encart e-piege"><span class="chapo">L'arrêt d'urgence ne passe pas par le programme</span><p>Il coupe la puissance par une chaîne <strong>câblée</strong> — relais de sécurité ou automate de sécurité certifié. Un API standard n'a pas le niveau de fiabilité requis : un plantage du processeur ne doit pas pouvoir laisser la machine en marche.</p></div>`},
 {k:"f",t:"Ranger la chaîne fonctionnelle",chaine:"portail",h:`
  <p>Avant le GRAFCET, il faut savoir de quoi une machine est faite. Deux chaînes se répondent : l'une décide, l'autre agit.</p>`},
 {k:"l",t:"Le GRAFCET",h:`
  <figure data-anim="grafcet"></figure>
  <p>Le GRAFCET (NF EN 60848) décrit un fonctionnement séquentiel par des <strong>étapes</strong>, des <strong>transitions</strong> et des <strong>réceptivités</strong>. C'est le langage commun entre l'automaticien, l'électricien et le mécanicien.</p>
  <h3>Les cinq règles d'évolution</h3>
  <ol>
   <li>La situation initiale est celle des étapes actives au début.</li>
   <li>Une transition est <strong>franchissable</strong> si toutes les étapes immédiatement précédentes sont actives <strong>et</strong> si sa réceptivité est vraie.</li>
   <li>Le franchissement <strong>désactive</strong> les étapes amont et <strong>active</strong> les étapes aval, simultanément.</li>
   <li>Toutes les transitions franchissables sont franchies <strong>en même temps</strong>.</li>
   <li>Si une étape doit être à la fois activée et désactivée, elle <strong>reste active</strong>.</li>
  </ol>
  <div class="tabl"><table>
   <tr><th>Structure</th><th>Comment la reconnaître</th><th>Ce qu'elle veut dire</th></tr>
   <tr><td>Séquence linéaire</td><td>une étape après l'autre</td><td>cycle simple</td></tr>
   <tr><td>Divergence en OU</td><td>trait simple qui se sépare</td><td>choix — un seul chemin est suivi</td></tr>
   <tr><td>Divergence en ET</td><td>double trait</td><td>séquences parallèles, toutes actives</td></tr>
   <tr><td>Saut / reprise</td><td>flèche de retour</td><td>sauter des étapes ou boucler</td></tr>
  </table></div>
  <div class="encart e-cle"><span class="chapo">Le réflexe de lecture</span><p>Sur une divergence en <strong>OU</strong>, les réceptivités doivent être <strong>exclusives</strong>. Sur une divergence en <strong>ET</strong>, la convergence attend toutes les branches. Un GRAFCET bloqué, c'est presque toujours une réceptivité jamais vraie, ou une convergence ET dont une branche n'aboutit pas.</p></div>`},
 {k:"w",t:"Câbler le circuit de commande",cab:"commande-moteur",h:`
  <p>C'est LE circuit à savoir dessiner de mémoire. Tu vas le poser fil par fil, puis le mettre sous tension.</p>`},
 {k:"g",t:"Faire tourner un cycle",auto:"percage",quiz:true,h:`
  <p>Un GRAFCET n'est pas un dessin, c'est un programme. Celui-ci pilote une vraie machine, et les capteurs de fin de course lui répondent. À toi de compléter les réceptivités : tant qu'une seule est fausse, le cycle ne part pas.</p>`},
 {k:"l",t:"Traduire un GRAFCET en ladder",h:`
  <p>Un automate ne comprend pas les carrés du GRAFCET. Il faut lui donner des équations — et il n'y en a qu'une, répétée une fois par étape.</p>
  <div class="formule">X<sub>i</sub> = ( X<sub>i−1</sub> · réceptivité<sub>i−1</sub>  +  X<sub>i</sub> ) · X̄<sub>i+1</sub><span class="note">activation par l'amont · maintien par soi-même · désactivation par l'aval</span></div>
  <p>Tu as déjà écrit exactement ça : c'est <strong>l'auto-maintien</strong> du circuit de commande, avec un bit mémoire à la place de la bobine du contacteur.</p>
  <div class="tabl"><table>
   <tr><th>Dans le GRAFCET</th><th>Dans le ladder</th></tr>
   <tr><td>Étape active</td><td>bit mémoire <span class="mono">X<sub>i</sub></span> à 1</td></tr>
   <tr><td>Réceptivité</td><td>contacts en série sur le barreau</td></tr>
   <tr><td>Franchissement</td><td>X<sub>i</sub> monte, X<sub>i−1</sub> retombe</td></tr>
   <tr><td>Action associée</td><td>barreau de sortie piloté par X<sub>i</sub></td></tr>
  </table></div>
  <p>Les <strong>sorties</strong> se traitent après, séparément : une sortie active à plusieurs étapes s'écrit avec un OU — <span class="mono">broche = X2 + X3</span>.</p>
  <div class="encart e-piege"><span class="chapo">Pourquoi séparer étapes et sorties</span><p>Si tu pilotes le contacteur directement depuis la réceptivité, tu perds la mémoire du cycle : au moindre défaut, la machine ne sait plus où elle en était. Les bits d'étape SONT la mémoire. Les sorties n'en sont que le reflet.</p></div>`},
 {k:"h",t:"Écrire le ladder du cycle",auto:"percage",quiz:true,h:`
  <p>Le même poste de perçage, cette fois en langage à contacts. Choisis la condition d'activation de chaque étape, puis lance le cycle : les barreaux passants s'allument en vert, en direct.</p>`},
 {k:"a",t:"Atelier — automatismes",gen:["grafcet","securite","transpose"],but:4,h:`<p>Les règles du GRAFCET sont normatives : elles ne se devinent pas, elles se connaissent.</p>`},
 {k:"c",t:"Contrôle",gen:["grafcet","securite","transpose","equation1"],n:8}
]},

{id:"m24",num:"24",bloc:"Automatismes et terrain",an:2,titre:"Qualité de l'énergie, mesure et diagnostic",duree:"32 min",
 resume:"Harmoniques, CEM, appareils de mesure et méthode de dépannage. Le module qui fait la différence sur le terrain.",
 steps:[
 {k:"l",t:"Les harmoniques, vues sur l'onde",h:`
  <figure data-anim="harmoniques"></figure>
  <p>Ajoute du rang 5 puis du rang 3 dans la figure : l'onde propre devient une onde sale, et le spectre s'enrichit. C'est exactement ce que produit une charge non linéaire.</p>
  <div class="formule">THD<sub>i</sub> = √(Σ I<sub>n</sub>²) / I₁<span class="note">Taux de distorsion harmonique en courant, pour n ≥ 2.</span></div>
  <div class="tabl"><table>
   <tr><th>Rang</th><th>Fréquence</th><th>Origine typique</th><th>Effet</th></tr>
   <tr><td class="mono">3, 9, 15</td><td class="mono">150, 450 Hz</td><td>charges monophasées : LED, PC, chargeurs</td><td>s'additionnent dans le neutre</td></tr>
   <tr><td class="mono">5, 7</td><td class="mono">250, 350 Hz</td><td>ponts triphasés, variateurs</td><td>couples pulsatoires, échauffement moteur</td></tr>
   <tr><td class="mono">11, 13</td><td class="mono">550, 650 Hz</td><td>ponts à 12 impulsions</td><td>pertes fer, résonances</td></tr>
  </table></div>
  <h3>Les remèdes, du moins cher au plus cher</h3>
  <ol>
   <li><strong>Self de ligne</strong> 3 à 4 % en entrée de variateur — divise le THD par deux pour un coût dérisoire.</li>
   <li><strong>Séparation</strong> des charges sensibles et polluantes sur des départs distincts.</li>
   <li><strong>Filtre passif accordé</strong> sur un rang dominant.</li>
   <li><strong>Filtre actif</strong> — injecte le courant en opposition de phase, s'adapte en temps réel.</li>
   <li><strong>Redresseur actif (AFE)</strong> intégré au variateur : THD &lt; 5 % et freinage par récupération.</li>
  </ol>
  <div class="encart e-terrain"><span class="chapo">CEM en armoire</span><p>Séparer physiquement puissance et signaux, croiser à 90° si nécessaire. Blindage repris à <strong>360°</strong> par collier aux deux extrémités : une queue de cochon perd l'essentiel de son efficacité au-delà de quelques MHz. Platine de fond nue aux points de contact, liaisons courtes et larges — en haute fréquence, c'est l'inductance du conducteur qui compte, pas sa section. Signaux analogiques en paires torsadées blindées, blindage à la terre d'un seul côté.</p></div>`},
 {k:"l",t:"Les appareils et leurs pièges",h:`
  <div class="tabl"><table>
   <tr><th>Appareil</th><th>Branchement</th><th>Piège</th></tr>
   <tr><td>Voltmètre</td><td>en parallèle</td><td>peut lire une tension « fantôme » par couplage capacitif sur un câble non chargé</td></tr>
   <tr><td>Ampèremètre</td><td>en série</td><td>le brancher en parallèle = court-circuit franc</td></tr>
   <tr><td>Pince ampèremétrique</td><td>autour d'UN conducteur</td><td>un câble multiconducteur enserré en entier donne 0 A</td></tr>
   <tr><td>Ohmmètre</td><td>hors tension uniquement</td><td>destruction de l'appareil et danger si sous tension</td></tr>
   <tr><td>Mégohmmètre</td><td>hors tension, récepteurs déconnectés</td><td>injecte 500 ou 1000 V : détruit l'électronique raccordée</td></tr>
   <tr><td>Pince de fuite</td><td>autour de TOUS les actifs</td><td>ce qu'elle mesure est le courant de fuite à la terre</td></tr>
  </table></div>
  <h3>La catégorie de mesure — le point non négociable</h3>
  <div class="tabl"><table>
   <tr><th>Catégorie</th><th>Où l'utiliser</th></tr>
   <tr><td class="mono">CAT II</td><td>prises et circuits terminaux</td></tr>
   <tr><td class="mono">CAT III</td><td>tableaux de distribution, jeux de barres, départs fixes</td></tr>
   <tr><td class="mono">CAT IV</td><td>origine de l'installation, comptage, extérieur</td></tr>
  </table></div>
  <h3>Mesure d'isolement</h3>
  <div class="tabl"><table>
   <tr><th>Tension nominale du circuit</th><th>Tension d'essai</th><th>Valeur minimale</th></tr>
   <tr><td class="mono">TBTS / TBTP</td><td class="mono">250 V</td><td class="mono">0,5 MΩ</td></tr>
   <tr><td class="mono">≤ 500 V</td><td class="mono">500 V</td><td class="mono">1 MΩ</td></tr>
   <tr><td class="mono">&gt; 500 V</td><td class="mono">1000 V</td><td class="mono">1 MΩ</td></tr>
  </table></div>
  <p>Sur un moteur, on complète par l'<strong>indice de polarisation</strong> : rapport de la résistance à 10 min sur celle à 1 min. Supérieur à 2, l'isolant est sain ; proche de 1, il est humide ou dégradé.</p>`},
 {k:"l",t:"Une méthode de dépannage",h:`
  <p>Le dépannage n'est pas une intuition, c'est un protocole.</p>
  <ol>
   <li><strong>Recueillir</strong> — que faisait la machine, depuis quand, qu'est-ce qui a changé récemment ? Une modification récente est en cause dans la majorité des pannes.</li>
   <li><strong>Observer sans démonter</strong> — voyants, afficheur du variateur, position des protections, odeurs, traces de chauffe, bruit.</li>
   <li><strong>Délimiter par dichotomie</strong> — couper le système en deux, déterminer de quel côté est la panne, recommencer.</li>
   <li><strong>Mesurer plutôt que supposer</strong> — les trois tensions, les trois courants, la continuité du PE, la tension de commande.</li>
   <li><strong>Traiter la cause</strong> — un thermique qui déclenche est un symptôme, pas la panne.</li>
   <li><strong>Consigner</strong> — noter ce qui a été trouvé et fait. C'est ce qui rend le prochain dépannage plus rapide.</li>
  </ol>
  <div class="tabl"><table>
   <tr><th>Symptôme</th><th>Pistes par ordre de probabilité</th></tr>
   <tr><td>Moteur qui ronfle sans tourner</td><td>perte d'une phase · condensateur HS (mono) · rotor bloqué mécaniquement</td></tr>
   <tr><td>Thermique qui déclenche à chaud seulement</td><td>ventilation obstruée · ambiance trop chaude · sous-dimensionnement</td></tr>
   <tr><td>Différentiel qui déclenche au matin</td><td>humidité sur un circuit extérieur · cumul de fuites capacitives des filtres</td></tr>
   <tr><td>Variateur en défaut de surtension au freinage</td><td>rampe trop courte · résistance de freinage absente ou coupée</td></tr>
   <tr><td>Contacteur qui vibre</td><td>tension de commande faible · bague de déphasage cassée · bobine mauvais calibre</td></tr>
   <tr><td>Entrée analogique qui dérive au démarrage d'un variateur</td><td>blindage non repris à 360° · câble de commande le long du câble moteur</td></tr>
  </table></div>`},
 {k:"f",t:"La chaîne d'un convoyeur",chaine:"convoyeur",h:`
  <p>Même exercice sur une machine de production. Le piège reste le même : distinguer le préactionneur de l'actionneur.</p>`},
 {k:"z",t:"Banc libre",h:`
  <p>Pas de consigne ici : monte ce que tu veux, en continu ou en alternatif, et mesure. C'est l'outil pour vérifier une intuition ou refaire un exercice de cours en vrai.</p>`},
 {k:"a",t:"Atelier — terrain",gen:["cube","chute-tension","courant-moteur","neutre","securite"],but:5,h:`<p>Dernier atelier du parcours. Cinq bonnes réponses d'affilée, tous domaines mélangés.</p>`},
 {k:"c",t:"Contrôle final du parcours",gen:["ohm","puis-tri","courant-moteur","compensation","chute-tension","glissement","icc","cube","transfo-rendement","eff-max","ddr","impedance-rl"],n:12}
]},
